entrevoir le souci de l'éternité qu'il y a dans le cœur de l'homme ici il veut connaître la demeure de Dieu, une demeure non terrestre mais celle qui est perpétuelle. Et le Seigneur dit : \"venez et voyez\" donc il faut être témoin, il faut voir par soi-même... C'est pourquoi André pourra dire à Simon qu'il l'avait rencontré et Simon à son tour et dans cette rencontre son nom sera changé. Quand on a seulement entendu parler du Seigneur sans faire sa propre expérience avec le Seigneur la foi est moins solide.|Luc 5: 1-11|Après avoir prêché la parole, Jésus parle au cœur de Pierre et lui demande de lancer les filets... et ce dernier va agir sur la parole ça c'est l'expérience de la foi lorsqu'on met à côté les connaissance qu'on a reçu pour faire confiance au Seigneur et Pierre verra la puissance du Dieu qui a fait les poissons... et la conséquence c'est que le cœur de Pierre a été touchée, c'est pourquoi lorsqu'on a écouté la parole et qu'on se s'est pas retrouvé en face de son péché alors il ne peut pas avoir une réelle rencontre avec le Seigneur. Quand Pierre ratait la pêche toute la nuit le Seigneur observait, c'est pourquoi souvent certains font face à des blocages dans leur vie Dieu le voit jusqu'au jour où Dieu décide de faire quelque chose et on voit un renversement de sa vie, on se voit face à un miroir et c'est ainsi qu'on se rapproche de Dieu lorsqu'on a de la contorsion dans le cœur. C'est ce qui s'est passé dans la vie de Pierre mais aussi de Jean qui était avec lui. Et ils ont tout laissé pour le suivre, c'est ainsi lorsqu'on rencontre vraiment le Seigneur le temps les événements ne comptent plus on veut seulement passer du temps avec lui, comme dit le David un jour dans tes parvis vaut mieux que mille ailleurs, j'habiterai dans la maison de l'Éternel tous les jours de ma vie. Lorsqu'on le rencontre c'est cette demeure là qu'on cherche et rien n'importe plus juste cette demeure-là. Lorsque Philippe fait le témoignage à Nathanaël, la réaction de ce dernier montre que l'homme juge à l'apparence. Il n'y a que Dieu qui est le Roi d'Israël c'est pourquoi tout juifs ne pouvait pas affirmer cela n'importe comment et donc les paroles de Nathanaël sont la preuve de ce qu'il a reçu la révélation de ce que Dieu l'a visité car Le Fils de Dieu c'est Dieu fait chair.|Esaïe 43:15|Ceci est une preuve de plus que Jésus-Christ est l'Éternel qui a parlé à Esaïe. Rencontrer le Seigneur personnellement renouvelle il est donc nécessaire de faire chacun sa rencontre avec le Seigneur.",
             en:"John 1.|The Word is Christ. The darkness did not receive Him and the world did not know Him — these passages show the necessity of receiving the Word, which was the light, in order to know Him. But those who receive the light receive through her the power to become children of God. It is therefore not a human being who decides who becomes a child of God, for if someone's salvation comes from man, that salvation is not real. This salvation does not depend on the will of the flesh — it is not prayers or supplications, but the will of God: He decides who becomes His child. The law was given through Moses, but grace and truth came through Jesus Christ. When John came, people were confused about him, thinking he was the Messiah; and in the life of Jesus they saw prophecies fulfilled, yet they did not believe. John the Baptist came to prepare the way for Christ — that is, he came preaching repentance.|Why the preaching of repentance before the coming of the Lord?|It shows that for an effective encounter with the Lord, the heart must be prepared. It is by bringing a man face to face with his life, face to face with his sin, that he realises he needs a Saviour. To truly meet the Lord, true repentance is required. The good news is not 'good news items': the good news is that Jesus Christ is Lord and gave His life for salvation, and whatever your state of sin, He is there for you. The 'good news items' — preaching of the kind 'you will prosper, you will marry' — do not prepare the heart to meet the Lord; that is not what God came for. John says that he saw Him and that God bore witness. When the disciples met Jesus Christ of Nazareth, He asked them what they were seeking; they said they wanted to know where Jesus dwelt. That question reveals the longing for eternity in the heart of man: he wants to know the dwelling of God — not an earthly dwelling, but the everlasting one. And the Lord said: 'Come and see.' One must be a witness; one must see for oneself. That is why Andrew could tell Simon that he had found Him, and Simon in his turn — and in that encounter his name was changed. When we have only heard about the Lord without making our own experience with Him, faith is less solid.|Luke 5:1-11.|After preaching the word, Jesus speaks to Peter's heart and asks him to let down the nets; Peter acts on the word — that is the experience of faith, when we set aside our acquired knowledge to trust the Lord. Peter then saw the power of the God who made the fish, and the consequence was that his heart was touched. When someone has heard the word without coming face to face with his sin, there can be no real encounter with the Lord. While Peter toiled all night and caught nothing, the Lord was watching; likewise many face blockages in their lives which God sees, until the day God decides to act and their life is overturned — one stands before a mirror, and it is thus, with contrition in the heart, that one draws near to God. That is what happened in the life of Peter, and also of John who was with him. And they left everything to follow Him. So it is when we truly meet the Lord: time and events no longer count; we only want to spend time with Him. As David says, one day in Your courts is better than a thousand elsewhere; I will dwell in the house of the LORD all the days of my life. When we meet Him, it is that dwelling we seek, and nothing matters any more but that dwelling. When Philip bore witness to Nathanael, Nathanael's reaction shows that man judges by appearance. Only God is the King of Israel — no Jew could make that declaration lightly — so Nathanael's words are proof that he had received the revelation that God had visited him, for the Son of God is God made flesh.|Isaiah 43:15.|This is one more proof that Jesus Christ is the LORD who spoke to Isaiah. Meeting the Lord personally renews us; it is therefore necessary for each one to have his own encounter with the Lord.",
             it:"Giovanni 1.|La Parola è Cristo. Le tenebre non l'hanno ricevuta e il mondo non l'ha conosciuta — questi passi mostrano la necessità di ricevere la parola, che era la luce, per conoscerlo. Ma quelli che ricevono la luce ricevono per mezzo di essa il potere di diventare figli di Dio; non è dunque un essere umano a decidere chi diventa figlio di Dio, perché se la salvezza di qualcuno viene dall'uomo, quella salvezza non è vera. Questa salvezza non dipende dalla volontà della carne — non sono le preghiere né le suppliche, ma la volontà di Dio: è lui che decide chi diventa suo figlio. La legge è stata data per mezzo di Mosè, ma la grazia e la verità sono venute per mezzo di Gesù Cristo. Quando venne Giovanni, la gente era confusa sul suo conto, pensando che fosse lui il Messia; e nella vita di Gesù videro compiersi delle profezie, ma non credettero. Giovanni Battista è venuto per preparare la via a Cristo, cioè è venuto a predicare il ravvedimento.|Perché la predicazione del ravvedimento prima della venuta del Signore?|Questo dimostra che per un incontro efficace con il Signore il cuore dev'essere preparato: è mettendo l'uomo di fronte alla sua vita, di fronte al suo peccato, che egli si rende conto di aver bisogno di un Salvatore. Per incontrare veramente il Signore occorre un vero ravvedimento. La buona notizia non sono le 'belle notizie': la buona notizia è che Gesù Cristo è il Signore e ha dato la sua vita per la salvezza, e qualunque sia il tuo stato di peccato, lui è lì per te. Le 'belle notizie' — le predicazioni del tipo 'prospererai, ti sposerai' — non preparano il cuore a incontrare il Signore; non è per questo che Dio è venuto. Giovanni dice di averlo visto e che Dio ha reso testimonianza. E quando i discepoli incontrarono Gesù Cristo di Nazaret, egli chiese loro che cosa cercassero; risposero che volevano sapere dove Gesù dimorava. In quella domanda traspare il desiderio di eternità che è nel cuore dell'uomo: vuole conoscere la dimora di Dio — una dimora non terrena, ma quella perpetua. E il Signore disse: 'Venite e vedrete.' Bisogna essere testimoni, bisogna vedere di persona. Per questo Andrea poté dire a Simone di averlo trovato, e Simone a sua volta — e in quell'incontro il suo nome fu cambiato. Quando si è soltanto sentito parlare del Signore senza fare la propria esperienza con lui, la fede è meno solida.|Luca 5:1-11.|Dopo aver predicato la parola, Gesù parla al cuore di Pietro e gli chiede di gettare le reti; Pietro agisce sulla parola — questa è l'esperienza della fede, quando mettiamo da parte le conoscenze acquisite per fidarci del Signore. Pietro vide allora la potenza del Dio che ha fatto i pesci, e la conseguenza fu che il suo cuore fu toccato. Quando si è ascoltata la parola senza trovarsi faccia a faccia con il proprio peccato, non ci può essere un vero incontro con il Signore. Mentre Pietro falliva la pesca per tutta la notte, il Signore osservava; allo stesso modo molti affrontano blocchi nella loro vita che Dio vede, fino al giorno in cui Dio decide di agire e la loro vita è capovolta — ci si trova davanti a uno specchio, ed è così, con la contrizione nel cuore, che ci si avvicina a Dio. È ciò che è avvenuto nella vita di Pietro, e anche di Giovanni che era con lui. E lasciarono tutto per seguirlo. Così è quando si incontra davvero il Signore: il tempo e gli avvenimenti non contano più, si vuole solo passare del tempo con lui. Come dice Davide, un giorno nei tuoi cortili vale più di mille altrove; abiterò nella casa dell'Eterno tutti i giorni della mia vita. Quando lo si incontra, è quella dimora che si cerca, e nient'altro conta più. Quando Filippo rese testimonianza a Natanaele, la reazione di quest'ultimo mostra che l'uomo giudica dall'apparenza. Solo Dio è il Re d'Israele — nessun giudeo poteva affermarlo alla leggera — perciò le parole di Natanaele sono la prova che aveva ricevuto la rivelazione che Dio lo aveva visitato, perché il Figlio di Dio è Dio fatto carne.|Isaia 43:15.|Questa è una prova in più che Gesù Cristo è l'Eterno che ha parlato a Isaia. Incontrare personalmente il Signore rinnova; è dunque necessario che ciascuno faccia il proprio incontro con il Signore." }
  },
  {
    id:"la-paque-veritable-partie-1", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-24", auteur:"Gaël, le frère",
    titre:{ fr:"LA PÂQUE VÉRITABLE (Partie 1)",
           en:"The true Passover (Part 1)",
           it:"La vera Pasqua (Parte 1)" },
    verset:{ fr:"" },
    extrait:{ fr:"Hébreux 11 :24-29, Comme le déclare le verset 28, l'ordre que Dieu avait donné à Moise de faire la Pâque et l'aspersion du sang avait pour but EPARGNER LES PREMIERS NÉS D'ISRAËL. L'agneau n'a pas…",
             en:"The lamb was not only slain: its blood was also sprinkled. Whoever does not take part in the sprinkling of the blood of Christ is not spared. When Christ died on the cross, it was so that a new Passover might be celebrated.",
             it:"L'agnello non fu soltanto immolato: il suo sangue fu anche asperso. Chi non prende parte all'aspersione del sangue di Cristo non è risparmiato. Quando Cristo è morto sulla croce, era perché fosse celebrata una nuova Pasqua." },
    contenu:{ fr:"Hébreux 11 :24-29, Comme le déclare le verset 28, l'ordre que Dieu avait donné à Moise de faire la Pâque et l'aspersion du sang avait pour but EPARGNER LES PREMIERS NÉS D'ISRAËL. L'agneau n'a pas seulement été immolé mais son sang a aussi été aspergé ; comme le déclare 1pierre 1:1-2 quiconque est en Christ à été choisi depuis selon la prédestination et le but de cette élection est non seulement l'obéissance et participer à l'aspersion du sang... ce sang est la marque du linteau des portes que nous sommes; ceci dit, si qqn ne prend pas part à l'aspersion du sang de Christ Il n'est pas épargné par l'exterminateur(la colère de Dieu ). Lorsque Jésus-Christ est mort à la croix c'était pour qu'une nouvelle Pâque soit célébrée.  Exode 12 l'animal choisi était sans défaut, le but de mettre à part l'animal à partir du 10ème jour était pour l'observer afin d'être sûr de ne pas sacrifier un animal avec défaut au Seigneur.|9-21 pour la Pâque on devait manger du pain sans levain, le levain c'est l'iniquité et la Pâque doit être fêtée dans la sainteté. C'est la fête de l'examen par excellence le Seigneur dit que si le levain est trouvé chez qqn il devait être retranché du peuple donc, on doit trembler et se remettre en question, d'examiner en pensant au sacrifice de Christ car la Pâque ne doit pas être célébrée n'importe comment... or aujourd'hui plusieurs la célèbrent étant dans le péché et ne faisant aucun souci de leur état.  En ce qui concerne les soirs et les matins, la parole de Dieu déclare que lorsque Dieu n’a créé le monde Il est dit \"Il y eu un soir et un matin\" donc pour le Seigneur le soir est le début d'une journée, sa journée ne commence pas comme nous nous comptons comme il est écrit. Lorsque Dieu dit d'immoler la Pâque entre les deux soirs ça veut dire qu'on va d'un début de soir à un autre.|Pâque ou Pâques ?? Dans la parole Pâques n'existe pas car en réalité il n'y a pas plusieurs sacrifice le sacrifice de Christ est unique.|Lorsque Dieu va frapper dans le camp de pharaon c'est ce même pharaon qui faisait des fausses promesses qui chassera les juifs d'Égypte ce qui va les empêcher de mieux se préparer. Il y'a des conditions pour participer à la Pâque car y prendre part voulait dire être lié au peuple de Dieu par la chair et par l'esprit et la marque sur le corps était la circoncision et le repas est une communion d'esprit.  Il ne fallait pas briser d'os (v46) ceci était une prophétie de ce que aucun os du Seigneur Jésus-Christ ne devait être brisé.",
             en:"Hebrews 11:24-29. As verse 28 declares, the order God gave Moses to keep the Passover and the sprinkling of blood had one purpose: TO SPARE THE FIRSTBORN OF ISRAEL. The lamb was not only slain; its blood was also sprinkled. As 1 Peter 1:1-2 declares, whoever is in Christ was chosen according to foreknowledge, and the goal of this election is not only obedience but also participation in the sprinkling of the blood. This blood is the mark on the doorposts that we are; therefore, if someone does not take part in the sprinkling of the blood of Christ, he is not spared from the destroyer (the wrath of God). When Jesus Christ died on the cross, it was so that a new Passover might be celebrated. In Exodus 12 the chosen animal was without blemish; the purpose of setting it apart from the tenth day was to observe it, to be sure that no defective animal was sacrificed to the Lord.|Verses 9-21: for the Passover, unleavened bread was to be eaten. Leaven is iniquity, and the Passover must be kept in holiness. It is the feast of self-examination par excellence; the Lord said that if leaven was found in anyone's house he was to be cut off from the people. We must therefore tremble, question ourselves, and examine ourselves in view of the sacrifice of Christ, for the Passover is not to be celebrated carelessly — yet today many celebrate it while living in sin, with no concern for their state. Concerning the evenings and mornings: the word of God declares of the creation, 'there was evening and there was morning'; for the Lord, then, the evening is the beginning of a day — His day does not begin as we count. When God says to slay the Passover 'between the two evenings', it means from the beginning of one evening to the next.|Passover or 'Easters'? In the word, a plural Passover does not exist, for in reality there are not several sacrifices: the sacrifice of Christ is unique.|When God struck in Pharaoh's camp, that same Pharaoh who had made false promises drove the Jews out of Egypt, preventing them from preparing properly. There were conditions for taking part in the Passover, for partaking meant being joined to the people of God in flesh and in spirit: the mark on the body was circumcision, and the meal was a communion of spirit. No bone was to be broken (v. 46) — a prophecy that not one bone of the Lord Jesus Christ would be broken.",
             it:"Ebrei 11:24-29. Come dichiara il versetto 28, l'ordine che Dio aveva dato a Mosè di fare la Pasqua e l'aspersione del sangue aveva per scopo RISPARMIARE I PRIMOGENITI D'ISRAELE. L'agnello non fu soltanto immolato, ma il suo sangue fu anche asperso; come dichiara 1 Pietro 1:1-2, chiunque è in Cristo è stato scelto secondo la preconoscenza, e lo scopo di questa elezione non è soltanto l'ubbidienza ma anche la partecipazione all'aspersione del sangue. Questo sangue è il segno sugli stipiti delle porte che noi siamo; ciò detto, se qualcuno non prende parte all'aspersione del sangue di Cristo, non è risparmiato dallo sterminatore (l'ira di Dio). Quando Gesù Cristo è morto sulla croce, era perché fosse celebrata una nuova Pasqua. In Esodo 12 l'animale scelto era senza difetto; lo scopo di metterlo da parte dal decimo giorno era di osservarlo, per essere certi di non sacrificare al Signore un animale difettoso.|Versetti 9-21: per la Pasqua si doveva mangiare pane senza lievito. Il lievito è l'iniquità, e la Pasqua dev'essere celebrata nella santità. È la festa dell'esame per eccellenza: il Signore disse che se il lievito fosse stato trovato presso qualcuno, questi doveva essere reciso dal popolo. Dobbiamo dunque tremare, metterci in discussione ed esaminarci pensando al sacrificio di Cristo, perché la Pasqua non va celebrata alla leggera — eppure oggi molti la celebrano vivendo nel peccato, senza alcuna preoccupazione per il loro stato. Riguardo alle sere e ai mattini: la parola di Dio dichiara della creazione 'fu sera e fu mattina'; per il Signore, dunque, la sera è l'inizio di una giornata — la sua giornata non comincia come contiamo noi. Quando Dio dice di immolare la Pasqua 'tra le due sere', significa che si va dall'inizio di una sera all'altra.|Pasqua o 'Pasque'? Nella parola il plurale non esiste, perché in realtà non ci sono più sacrifici: il sacrificio di Cristo è unico.|Quando Dio colpì nel campo del faraone, fu quello stesso faraone dalle false promesse a cacciare i giudei dall'Egitto, impedendo loro di prepararsi meglio. C'erano condizioni per partecipare alla Pasqua, perché prendervi parte significava essere legati al popolo di Dio nella carne e nello spirito: il segno sul corpo era la circoncisione, e il pasto era una comunione di spirito. Non si doveva spezzare alcun osso (v. 46) — una profezia del fatto che nessun osso del Signore Gesù Cristo sarebbe stato spezzato." }
  },
  {
    id:"la-paque-veritable-partie-2", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-23", auteur:"Gaël, le frère",
    titre:{ fr:"LA PÂQUE VÉRITABLE (Partie 2)",
           en:"The true Passover (Part 2)",
           it:"La vera Pasqua (Parte 2)" },
    verset:{ fr:"" },
    extrait:{ fr:"Nombres 9:1-14",
             en:"The Passover is the remembrance of Christ dead on the cross. What constitutes the feast for Christians is the Lord's Supper — and today the dwelling of God's Name is in us: the Passover begins in the heart.",
             it:"La Pasqua è il ricordo di Cristo morto sulla croce. Ciò che costituisce la festa per i cristiani è la cena del Signore — e oggi la dimora del Nome di Dio è in noi: la Pasqua comincia nel cuore." },
    contenu:{ fr:"Nombres 9:1-14|Ici il est posé le problème de prendre part à la Pâque à cause des impuretés, ce qui est remarquable c'est que Moise et Aaron n'ont pas donné leur pensée à ces hommes mais ils se sont tournés vers le Seigneur ainsi dévons nous agir pour toutes les situations qui pourrait porter à confusion, il faut aller devant le Seigneur. Et la réponse du Seigneur montre qu'il y'a la possibilité de fêter la Pâque un autre jour que celui dun14em jour de Nissan mais ce pour des raisons bien précises comme évoque dans le texte.|La Pâque c'est le souvenir de Christ mort sur la croix c'est pourquoi le Seigneur est tranchant sur celui qui est pur et qui ne célèbre pas la Pâque au temps fixé. Et pour l'étranger il doit se conformer à la loi de Seigneur donc personne ne pouvait le faire à sa façon.|Ce qui constitue la fête pour les chrétiens c'est le repas du Seigneur et il est accroché à la Pâque juive car ce repas a été institué à l'occasion de la Pâque c'est pourquoi nous ne fêtons pas la Pâque juive car cette dernière avait été institué pour monter que c'est un agneau innocent sui devait mourir pour l'expiation du péché et Jésus-Christ m'a accompli dans son corps c'est pourquoi nous n'avons pas besoin|Deut 16 :1-7 le 1er mois c'est le mois de épis le mois de Nissan, la Pâque devait être célébrée dans un lieu précis choisis par l'Éternel c'est pourquoi les chrétiens qui fêtent la Pâque juive devraient aller à Jérusalem le faire car c'est le lieu que le Seigneur avait choisi. Or aujourd'hui l'habitation du Nom de Dieu est en nous et dans l'église donc la Pâque commence dans le cœur (c'est totalement erroné pour un chrétien de considérer Jérusalem comme un lieu saint car toute la terre est vouée à la destruction il n'y a donc aucun endroit saint sur cette terr)|2corinthiens 5:16 les lieux physiques n'ont aucune valeurs car aujourd'hui le Seigneur Jésus que nous connaissons, même s'il l'a existé dans la chair, nous le connaissons en Esprit, le voile a été déchiré donc chaque personne a accès au Père là où il se trouve.|2chroniques 30: 15-27 nous voyons ici le peuple qui n'avait pas pu fêter en date normale la fête et ils se retentirent et se purifièrent et on fait la fête au 2em mois mais après cette fois ci ce n'était plus possible de faire la fête. Nous avons dans le monde plusieurs types de calendrier et chaque peuple selon l'obédience religieuse a son calendrier , ce qu'ils ont en commun c'est qu'ils sont basés sur les astres (cycle de la lune /cycle du soleil) Israël a son calendrier qui est le calendrier juif et celui-ci est mixte il suit les cycles de la lune et du soleil c'est pourquoi souvent la bible fait référence aux nouvelles lunes etc, le 1er mois de ce calendrier correspond généralement au mois de mars et avril du calendrier grégorien, c'est la raison pour laquelle la Pâques instituée par la religion tombe dans cette période car elle est instituée en fonction du calendrier juif;(La résurrection n'est pas la Pâque comme la religion l'enseigne mais plutôt la mort de l'agneau que ce soit dans la nouvelle ou l'ancienne alliance.) Et sur notre calendrier si on compte à partir de mars on va se rendre compte que septembre à partir de sa Racine devient en effet le septième octobre etc. Et aussi par rapport au calendrier juif nous avons 10 jours de plus c'est pourquoi le leur semble avoir 13 mois plutôt que 12.",
             en:"Numbers 9:1-14.|Here the problem is raised of taking part in the Passover while ceremonially unclean. What is remarkable is that Moses and Aaron did not give those men their own opinion, but turned to the Lord. So must we act in every situation that could lead to confusion: we must go before the Lord. The Lord's answer shows that it was possible to keep the Passover on another day than the 14th of Nisan, but for precise reasons, as set out in the text.|The Passover is the remembrance of Christ dead on the cross; that is why the Lord is severe towards the one who is clean and yet does not celebrate the Passover at the appointed time. As for the stranger, he had to conform to the law of the Lord — no one could do it his own way.|What constitutes the feast for Christians is the Lord's Supper, and it is linked to the Jewish Passover because this meal was instituted on the occasion of the Passover. We do not keep the Jewish Passover, for it had been instituted to show that an innocent lamb had to die for the atonement of sin, and Jesus Christ fulfilled it in His body.|Deuteronomy 16:1-7 — the first month is the month of ears of grain, the month of Nisan. The Passover was to be celebrated in a precise place chosen by the LORD; therefore Christians who keep the Jewish Passover ought to go to Jerusalem to do so, for that is the place the Lord had chosen. But today the dwelling of the Name of God is in us and in the church: the Passover begins in the heart. (It is entirely mistaken for a Christian to regard Jerusalem as a holy place, for the whole earth is destined for destruction — there is no holy place on this earth.)|2 Corinthians 5:16 — physical places have no value, for the Lord Jesus whom we know, even though He existed in the flesh, we now know in the Spirit. The veil has been torn, so every person has access to the Father wherever he is.|2 Chronicles 30:15-27 — here we see the people who had been unable to keep the feast at the normal date: they repented, purified themselves and kept the feast in the second month; but after that it was no longer possible. There are many calendars in the world, each people having its own according to its religious tradition; what they have in common is that they are based on the heavenly bodies (cycles of the moon or of the sun). Israel has its own calendar, the Jewish calendar, which is mixed — it follows both the cycles of the moon and of the sun; that is why the Bible often refers to new moons. The first month of this calendar generally corresponds to March–April of the Gregorian calendar, which is why the 'Easter' instituted by religion falls in that period, being set according to the Jewish calendar. (The resurrection is not the Passover, as religion teaches, but rather the death of the lamb — in the new covenant as in the old.) On our calendar, counting from March, September proves from its very root to be the seventh month, October the eighth, and so on; and compared with the Jewish calendar we have about ten extra days, which is why theirs seems to have thirteen months rather than twelve.",
             it:"Numeri 9:1-14.|Qui si pone il problema di prendere parte alla Pasqua a causa delle impurità. Ciò che è notevole è che Mosè e Aaronne non diedero il proprio parere a quegli uomini, ma si rivolsero al Signore. Così dobbiamo agire in tutte le situazioni che potrebbero generare confusione: bisogna andare davanti al Signore. E la risposta del Signore mostra che era possibile celebrare la Pasqua in un giorno diverso dal 14 di Nisan, ma per ragioni ben precise, come indicato nel testo.|La Pasqua è il ricordo di Cristo morto sulla croce; per questo il Signore è severo verso chi è puro e non celebra la Pasqua al tempo fissato. Quanto allo straniero, doveva conformarsi alla legge del Signore: nessuno poteva farla a modo suo.|Ciò che costituisce la festa per i cristiani è la cena del Signore, ed essa è legata alla Pasqua ebraica perché questo pasto fu istituito in occasione della Pasqua. Noi non celebriamo la Pasqua ebraica, perché essa era stata istituita per mostrare che un agnello innocente doveva morire per l'espiazione del peccato, e Gesù Cristo l'ha adempiuta nel suo corpo.|Deuteronomio 16:1-7 — il primo mese è il mese delle spighe, il mese di Nisan. La Pasqua doveva essere celebrata in un luogo preciso scelto dall'Eterno; perciò i cristiani che celebrano la Pasqua ebraica dovrebbero andare a Gerusalemme per farlo, perché quello è il luogo che il Signore aveva scelto. Ma oggi la dimora del Nome di Dio è in noi e nella chiesa: la Pasqua comincia nel cuore. (È del tutto errato per un cristiano considerare Gerusalemme un luogo santo, perché tutta la terra è destinata alla distruzione — non c'è alcun luogo santo su questa terra.)|2 Corinzi 5:16 — i luoghi fisici non hanno alcun valore, perché il Signore Gesù che conosciamo, anche se è esistito nella carne, ora lo conosciamo nello Spirito. Il velo è stato squarciato, quindi ogni persona ha accesso al Padre là dove si trova.|2 Cronache 30:15-27 — vediamo qui il popolo che non aveva potuto celebrare la festa alla data normale: si ravvidero, si purificarono e fecero la festa nel secondo mese; ma dopo quella volta non fu più possibile. Nel mondo esistono molti calendari, e ogni popolo ha il suo secondo la propria tradizione religiosa; ciò che hanno in comune è che si basano sugli astri (ciclo della luna o del sole). Israele ha il suo calendario, quello ebraico, che è misto: segue i cicli della luna e del sole — per questo la Bibbia fa spesso riferimento ai noviluni. Il primo mese di questo calendario corrisponde generalmente a marzo–aprile del calendario gregoriano; è per questo che la 'Pasqua' istituita dalla religione cade in quel periodo, essendo fissata in funzione del calendario ebraico. (La risurrezione non è la Pasqua, come insegna la religione, ma piuttosto la morte dell'agnello — nella nuova come nell'antica alleanza.) E sul nostro calendario, se si conta a partire da marzo, ci si accorge che settembre, dalla sua radice, è in effetti il settimo mese, ottobre l'ottavo e così via; e rispetto al calendario ebraico abbiamo circa dieci giorni in più, per questo il loro sembra avere tredici mesi anziché dodici." }
  },
  {
    id:"le-pasteur-doit-il-travailler-ou-il-doit-totalement-etre-a-l", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-22", auteur:"Gaël, le frère",
    titre:{ fr:"Le pasteur doit-il travailler ou il doit totalement être à la charge de la communauté ?",
           en:"Should the pastor work, or be entirely supported by the community?",
           it:"Il pastore deve lavorare o essere totalmente a carico della comunità?" },
    verset:{ fr:"" },
    extrait:{ fr:"L'une des fois où le Seigneur Luc 10:1-11, Le Seigneur envoie ses disciples et leur demande de ne pas se soucier , le Seigneur lorsqu'il envoie qqn il lui donne aussi l'instruction pour sa vie et…",
             en:"The servants of God are people called and sent by God. Paul preached by example: doing the work without demanding anything from anyone, letting each one give as love moves him.",
             it:"I servitori di Dio sono persone chiamate e mandate da Dio. Paolo ha predicato con l'esempio: fare l'opera senza esigere nulla da nessuno, lasciando che ciascuno doni come l'amore lo spinge." },
    contenu:{ fr:"L'une des fois où le Seigneur Luc 10:1-11, Le Seigneur envoie ses disciples et leur demande de ne pas se soucier , le Seigneur lorsqu'il envoie qqn il lui donne aussi l'instruction pour sa vie et sa mission comme il est écrit en Luc 22: 35-37 donc que le Seigneur envoie Il dit de quelle façon il faut marcher. Les serviteurs de Dieu sont des personnes appelées et envoyées de Dieu le problème de nos jours est donc celui que plusieurs personnes se lèvent d'elles-mêmes et vont sans avoir été envoyés et c'est pourquoi on assiste à une sorte de commerce dans les communautés. Le Seigneur dit que \"l'ouvrier mérite son salaire \" or on voit que le salaire de l'ouvrier c'est la nourriture et le logement et ce dernier n'en manquera jamais si c'est le Seigneur qui l'envoie. Pourquoi certains pensent donc que c'est obligé de subvenir aux besoins du pasteur ?|2 corinthiens 8 , 9la collecte était faite pour les saints elle était volontaire et sans aucune contrainte et surtout il y avait la transparence dans la gestion des offrandes de façon à ce que les bien-aimés savaient clairement ce qui était fait avec leurs offrandes. Il est important de mettre l'accent sur la LIBÉRALITÉ vient de ce que l'offrande est une manifestation de la charité, et aussi elle répond au principe du don joyeux personne ne devrait être forcé à faire un don sous prétexte que \"celui qui donne peu moissonne peu\" car l'offrande ne doit pas être pour nourrir l'avarice mais doit être volontaire et ce pour les saints en générale car de ces dons Dieu tire la gloire.|1 corinthiens 9 le pasteur a le droit que le peuple de Dieu prenne soin de lui et les chrétiens ont le devoir mais ce droit ne doit nullement être réclamé et le devoir ne doit pas être une imposition. Car se retrouver en train de réclamer ce droit pourrait amener le serviteur à compromettre le message pour éviter de blesser ceux qui subviennent à ses besoins or c'est un sujet de gloire pour un serviteur de se dire libre de tous. Galates 6:6 n'a jamais dit que les fidèles doivent donner la totalité de leur revenus à leur berger, malheureusement la malice du cœur de l'homme a fait qu'on exige aux fidèles de se dépouiller pour le pasteur or il est bien précisé de donner UNE PART de ce qu'on a et ceci doit se faire avec toujours avec amour sans aucune obligation. Actes 20: 31-38, 1 corinthiens 4: 10-14 Paul a prêché par l'exemple montrant comment les serviteurs de Dieu doivent agir c'est-à-dire faire son œuvre sans rien exiger de qui que ce soit mais laisser chacun agir selon que l'amour l'y pousse. 1 Thessaloniciens 2: 7-12, 2 Thessaloniciens 3: 7-12, c'était une habitude pour Paul d'agir ainsi , il travaillait bien qu'ayant droit à être pris en charge par les saints car il voulait donner par-là l'exemple à suivre en tant que serviteur. 2 Timothée 2: 1-7 que le Seigneur nous donne l'intelligence en toute chose Paul dit qu'aucun soldat ne peut faire la guerre s'il s'embarrasse des choses de vie, être pasteur est une guerre spirituelle si ce dernier se met à réfléchir sur ce qu'il aimerait avoir comment gain matériel ne peut véritablement faire l'œuvre à laquelle il est appelé. Il y a donc nécessité de se repentir car l'œuvre et la volonté de Dieu est tout autre que ce qui est monnaie courante dans ce siècle. Que le Seigneur ouvre notre intelligence afin que nous soyons affermis par la vérité et non le mensonge. Un serviteur peut ne pas travailler à la seule condition que le Seigneur le lui ai demandé et dans ce cas il ne doit rien exiger des frères car nous voyons les apôtres avaient un métier, pasteur, apôtre évangéliste prophète n'est pas un métier mais un appel un service qu'on doit rendre avec joie pour le Seigneur sans exiger quoique ce soit des bien-aimés et ces derniers selon l'élan de leur amour doivent librement faire les offrandes.",
             en:"Luke 10:1-11 — the Lord sends His disciples and tells them not to worry. When the Lord sends someone, He also gives him the instruction for his life and his mission, as it is written in Luke 22:35-37: when the Lord sends, He says how one must walk. The servants of God are people called and sent by God; the problem of our day is that many rise up of themselves and go without having been sent — hence the kind of commerce we witness in the communities. The Lord says 'the labourer is worthy of his wages'; but we see that the labourer's wages are food and lodging, and he will never lack them if it is the Lord who sends him. Why then do some think it obligatory to provide for the pastor's needs?|2 Corinthians 8 and 9 — the collection was made for the saints; it was voluntary, without any compulsion, and above all there was transparency in the handling of the offerings, so that the beloved knew clearly what was done with their gifts. It is important to stress LIBERALITY: the offering is a manifestation of love, and it obeys the principle of the cheerful giver. No one should be forced to give under the pretext that 'he who gives little reaps little', for the offering must not feed greed but be voluntary, and for the saints in general — from such gifts God draws glory.|1 Corinthians 9 — the pastor has the right to be cared for by the people of God, and Christians have the duty; but this right must never be demanded, and the duty must never be imposed. For a servant who demands this right could end up compromising the message so as not to offend those who provide for him — whereas it is a subject of glory for a servant to be free of all. Galatians 6:6 never said that the faithful must give the whole of their income to their shepherd; sadly the malice of the human heart has led to demanding that the faithful strip themselves for the pastor, whereas it is clearly stated to give A SHARE of what one has, and always with love, without any compulsion. Acts 20:31-38; 1 Corinthians 4:10-14 — Paul preached by example, showing how the servants of God must act: doing the work without demanding anything from anyone, letting each one act as love moves him. 1 Thessalonians 2:7-12; 2 Thessalonians 3:7-12 — it was Paul's habit to act this way; he worked although he was entitled to be supported by the saints, because he wanted to give the example to follow as a servant. 2 Timothy 2:1-7 — may the Lord give us understanding in all things. Paul says no soldier can wage war while entangling himself in the affairs of this life; being a pastor is a spiritual war, and if he starts calculating what material gain he would like, he cannot truly do the work to which he is called. There is therefore a need for repentance, for the work and will of God are quite different from what is common practice in this age. May the Lord open our understanding so that we may be established by the truth and not by the lie. A servant may refrain from working only on one condition: that the Lord has asked it of him — and in that case he must demand nothing from the brethren. We see that the apostles had a trade; pastor, apostle, evangelist, prophet is not a profession but a calling, a service to be rendered with joy for the Lord, demanding nothing from the beloved — who, according to the impulse of their love, freely bring their offerings.",
             it:"Luca 10:1-11 — il Signore manda i suoi discepoli e chiede loro di non preoccuparsi. Quando il Signore manda qualcuno, gli dà anche l'istruzione per la sua vita e la sua missione, come è scritto in Luca 22:35-37: quando il Signore manda, dice in che modo bisogna camminare. I servitori di Dio sono persone chiamate e mandate da Dio; il problema dei nostri giorni è che molti si alzano da sé e vanno senza essere stati mandati — ecco perché si assiste a una sorta di commercio nelle comunità. Il Signore dice che 'l'operaio è degno del suo salario'; ma vediamo che il salario dell'operaio è il cibo e l'alloggio, e non gliene mancherà mai se è il Signore a mandarlo. Perché dunque alcuni pensano che sia obbligatorio provvedere ai bisogni del pastore?|2 Corinzi 8 e 9 — la colletta era fatta per i santi; era volontaria, senza alcuna costrizione, e soprattutto c'era trasparenza nella gestione delle offerte, così che i fratelli sapevano chiaramente che cosa se ne faceva. È importante sottolineare la LIBERALITÀ: l'offerta è una manifestazione dell'amore e risponde al principio del dono gioioso. Nessuno dovrebbe essere costretto a donare con il pretesto che 'chi dona poco raccoglie poco', perché l'offerta non deve nutrire l'avidità ma essere volontaria, e per i santi in generale — da questi doni Dio trae gloria.|1 Corinzi 9 — il pastore ha il diritto che il popolo di Dio si prenda cura di lui, e i cristiani ne hanno il dovere; ma questo diritto non dev'essere mai reclamato, e il dovere non dev'essere un'imposizione. Un servitore che reclamasse questo diritto potrebbe arrivare a compromettere il messaggio per non ferire coloro che provvedono ai suoi bisogni — mentre è un motivo di gloria per un servitore sapersi libero da tutti. Galati 6:6 non ha mai detto che i fedeli devono dare la totalità dei loro redditi al loro pastore; purtroppo la malizia del cuore umano ha portato a esigere che i fedeli si spoglino per il pastore, mentre è ben precisato di dare UNA PARTE di ciò che si ha, e sempre con amore, senza alcun obbligo. Atti 20:31-38; 1 Corinzi 4:10-14 — Paolo ha predicato con l'esempio, mostrando come devono agire i servitori di Dio: fare la propria opera senza esigere nulla da chicchessia, lasciando che ciascuno agisca come l'amore lo spinge. 1 Tessalonicesi 2:7-12; 2 Tessalonicesi 3:7-12 — era un'abitudine per Paolo agire così: lavorava pur avendo diritto a essere mantenuto dai santi, perché voleva dare l'esempio da seguire come servitore. 2 Timoteo 2:1-7 — che il Signore ci dia intelligenza in ogni cosa. Paolo dice che nessun soldato può fare la guerra impigliandosi nelle faccende della vita; essere pastore è una guerra spirituale, e se questi si mette a pensare a ciò che vorrebbe ottenere come guadagno materiale, non può veramente compiere l'opera a cui è chiamato. C'è dunque necessità di ravvedimento, perché l'opera e la volontà di Dio sono ben altra cosa rispetto a ciò che è moneta corrente in questo secolo. Che il Signore apra la nostra intelligenza affinché siamo edificati dalla verità e non dalla menzogna. Un servitore può non lavorare a una sola condizione: che il Signore glielo abbia chiesto — e in quel caso non deve esigere nulla dai fratelli. Vediamo che gli apostoli avevano un mestiere; pastore, apostolo, evangelista, profeta non è un mestiere ma una chiamata, un servizio da rendere con gioia per il Signore senza esigere nulla dai fratelli — i quali, secondo lo slancio del loro amore, fanno liberamente le loro offerte." }
  },
  {
    id:"le-temoignage-en-milieu-chretien", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-21", auteur:"Gaël, le frère",
    titre:{ fr:"Le témoignage en milieu chrétien",
           en:"Testimony among Christians",
           it:"La testimonianza in ambiente cristiano" },
    verset:{ fr:"" },
    extrait:{ fr:"Le témoignage est ce qui fait de nous des enfants de Dieu, soit en acte, soit en parole. En Marc 8:38 , démontre l'importance du témoignage en cette génération.",
             en:"Our testimony comes from within before it is expressed outwardly: we should speak less and act more. And whoever claims to be a Christian gives other Christians leave to weigh his life.",
             it:"La nostra testimonianza viene dall'interno prima di esprimersi all'esterno: dovremmo parlare meno e agire di più. E chi dice di essere cristiano autorizza gli altri cristiani a esaminare la sua vita." },
    contenu:{ fr:"Le témoignage est ce qui fait de nous des enfants de Dieu, soit en acte, soit en parole. En Marc 8:38 , démontre l'importance du témoignage en cette génération.|Dans le témoignage nous devons être soi-même le témoignage, c'est-à-dire poser des actes qui disent qui nous sommes en d'autres mots on devrait parler moins et agir plus. Dans cette generation il y'a trop de personne qui parlent mais peu agissent comme il le faut 2Tim 3:1-5. Le verset 5 de ce passage dit de s'éloigner des personnes qui ont le langage chrétiens mais dont la vie ne reflète en rien Christ. Notre témoignage vient de l'intérieur pour s'extérioriser, le tout ce ne sont pas les parles, ça va d,abord de notre vie avant de parler.ce dont on devrait se préoccuper ce n'est pas du fait de ne pas pouvoir parler mais plutôt de savoir si notre témoignage reflète la vie de Christ.|Marc 10:28-31... que ceux qui auront un véritable témoignage recevront non seulement une famille mais aussi des persécutions, parfois notre peur de témoigner vient de la peur des persécutions. Er souvent noq vies sont des jugements pour ceux qui ne peuvent appliquer ce bon exemple car la vie en Christ c'est le bon exemple, c'est pourquoi lorsque nous refusons de faire certaines choses certaines personnes réagiront comme si on les jugeait . Si on est appelé à parler, on le fera comme Etienne, car c'est la vie de chrétien. En dehors de notre vie, nous devons parler quand c'est nécessaire, quand il le faut il ne faut pas se taire.|Mathieu 5:8-16. Il y'a une grande joie lorsqu'on souffre injustement, lorsqu'on est persécuté alors qu'on marche comme le Seigneur le veut, on doit s'en réjouir car alors notre récompense sera grande car les prophètes d'autres fois ont souffert ainsi car leur ministère était celui du jugement. Le Seigneur dira à Ezechiel que si il voit le péché de qqn et qu'il ne le dit pas alors ce péché tombera sur lui, ceci dit on ne devrait pas regarder un frère dans le péché et ne rien dire. La fin dit que notre lumière doit luire, en d'autres mots on ne doit pas avoir honte de donner notre témoignage. Avec le paiens on prêche d'abord par nos actes ensuite quand la brèche pour parler s'ouvre il faut parler . Avec les enfants de Dieu , si je vois mon frère qui fait mal j'ai l'obligation de lui dire qu'il est dans l'erreur et de ce n'est pas le jugement. Car le paien a besoin de Christ et celui qui est déjà en Christ a besoin du caractère.|Mathieu 18:11-18 Cztte recommandantion du Seigneur concerne aussi la vie quotidienne des enfants de Dieu. Rom 1:8-21 une autre façon de retenir la vérité est de savoir que une chose est mauvaise et rester là à regarder sans rien dire, car certains sont dans l'ignorance de leur égarement et ont des questions dont la réponse se trouve peut-être sur notre langue il ne faut donc pas se priver de parler quand l'occasion se présente dans ce cas. 1 cor 5:1-15 Paul dit avoir déjà jugé le péché commis par un frère car de tels actes ne devraient pas se retrouver au milieu des frères. Et il ajoute qu'il ne demande pas de ne pas avoir de relation avoir de relation avec les pecheurs du monde dans ce cas il faudrait sortir du monde mais au milieu des frères si ces choses se retrouvent, il ne faut frapper dur, il faut les lui dire et veiller sur la façon de le dire. Si on parle et que dans ce cas et que le frère décide de s'y complaire alors il faut couper les contacts car ce n'est pas à nous de juger ceux du dehors car Dieu les juge. Mais si qqn dit qu'il est chrétien il donne l'autorisation à d'autres chrétiens de juger sa vie. Les enfants de la maison reconnaissent dans la reproche une preuve d'amour c'est pourquoi il rentre interrogernsa vie, de la même façon celui qu'on reproche et qui peut qu'on le juge et refuse de s'y arrimer affirme qu'il n'est pas de la maison (l'exemple de plusieurs enfants dans la maison l'un adoptif et l'autre naturel, l'enfant de la maison reconnaît dans le châtiment un geste d'amour et l'autre voit comme un acte de maltraitance).|Ainsi si nous avons décidé marcher avec Christ nous devons prendre et accepter avec amour la réprimande et examiner nos vies car rejeter la voie d'un bien-aimé c'est aussi rejeter la voix du Seigneur. Et dire chaque fois qu'on nous juge en refusant de se soumettre est une façon de dire qu'on n'est pas de la maison. Et ne nous privons pas de parler lorsque l'occasion se présente et demandons la sagesse au Seigneur pour utiliser les mots juste et la façon adéquate de parler. Que le Seigneur nous fasse grace d'accepter sa parole et s'y conformer sans y voir un quelconque acte de rejet ou de jugement.",
             en:"Testimony is what marks us out as children of God, whether in deed or in word. Mark 8:38 shows the importance of testimony in this generation.|In testimony we must ourselves be the testimony — that is, do deeds that declare who we are; in other words, we should speak less and act more. In this generation there are too many who speak, but few who act as they should (2 Timothy 3:1-5). Verse 5 of that passage says to turn away from people who have Christian language but whose life reflects nothing of Christ. Our testimony comes from within before it is expressed outwardly; it is not primarily words — it begins with our life before our speech. What should concern us is not whether we are able to speak, but whether our testimony reflects the life of Christ.|Mark 10:28-31 — those who have a true testimony will receive not only a family but also persecutions; sometimes our fear of testifying comes from the fear of persecution. Often our lives are a judgment on those who will not follow that good example, for life in Christ is the good example; that is why, when we refuse to do certain things, some people react as though we were judging them. If we are called to speak, we will do so like Stephen, for such is the Christian life. Beyond our life, we must speak when necessary; when it is needed, we must not keep silent.|Matthew 5:8-16. There is great joy in suffering unjustly — when we are persecuted while walking as the Lord wills, we should rejoice, for our reward will be great: the prophets of old suffered likewise, for their ministry was one of judgment. The Lord told Ezekiel that if he saw someone's sin and did not speak, that sin would fall on him; we should therefore not watch a brother in sin and say nothing. The passage ends by saying our light must shine — in other words, we must not be ashamed to give our testimony. With the pagans we preach first by our deeds, then, when an opening to speak appears, we must speak. With the children of God, if I see my brother doing wrong, I have the obligation to tell him he is in error — and that is not judging. For the pagan needs Christ, and the one already in Christ needs character.|Matthew 18:11-18 — this instruction of the Lord also concerns the daily life of the children of God. Romans 1:18-21 — another way of suppressing the truth is to know that something is evil and stand by watching without a word; some are ignorant of their straying and carry questions whose answer may lie on our tongue — so we must not refrain from speaking when the occasion arises. 1 Corinthians 5:1-13 — Paul says he has already judged the sin committed by a brother, for such deeds should not be found among the brethren. He adds that he is not asking us to avoid all contact with the sinners of this world — for that we would have to leave the world — but if these things are found among the brethren, we must not strike hard: we must tell him, watching how we say it. If we speak and the brother chooses to persist, then we must break off contact; it is not for us to judge those outside, for God judges them. But whoever says he is a Christian gives other Christians leave to weigh his life. The children of the house recognise in the rebuke a proof of love, and it leads them to examine their lives; likewise, the one who is rebuked and cries 'judgment', refusing to submit, declares that he is not of the house (as with several children in a home: the child of the house sees in discipline a gesture of love, while another sees ill-treatment).|Thus, if we have decided to walk with Christ, we must receive correction with love and examine our lives, for to reject the voice of a beloved brother is also to reject the voice of the Lord. To cry 'you are judging me' each time, refusing to submit, is a way of saying one is not of the house. Let us not refrain from speaking when the occasion arises, and let us ask the Lord for wisdom to use the right words and the fitting manner. May the Lord grant us grace to accept His word and conform to it, without seeing in it any act of rejection or judgment.",
             it:"La testimonianza è ciò che fa di noi dei figli di Dio, sia in atti che in parole. Marco 8:38 dimostra l'importanza della testimonianza in questa generazione.|Nella testimonianza dobbiamo essere noi stessi la testimonianza, cioè compiere atti che dicano chi siamo; in altre parole, dovremmo parlare meno e agire di più. In questa generazione ci sono troppe persone che parlano, ma pochi agiscono come si deve (2 Timoteo 3:1-5). Il versetto 5 di quel passo dice di allontanarsi dalle persone che hanno il linguaggio cristiano ma la cui vita non riflette in nulla Cristo. La nostra testimonianza viene dall'interno per esteriorizzarsi; non sono prima di tutto le parole — comincia dalla nostra vita, prima di parlare. Ciò di cui dovremmo preoccuparci non è di non saper parlare, ma di sapere se la nostra testimonianza riflette la vita di Cristo.|Marco 10:28-31 — coloro che avranno una vera testimonianza riceveranno non solo una famiglia ma anche persecuzioni; a volte la nostra paura di testimoniare viene dalla paura delle persecuzioni. Spesso le nostre vite sono un giudizio per coloro che non vogliono seguire quel buon esempio, perché la vita in Cristo è il buon esempio; per questo, quando rifiutiamo di fare certe cose, alcune persone reagiscono come se le giudicassimo. Se siamo chiamati a parlare, lo faremo come Stefano, perché questa è la vita del cristiano. Oltre alla nostra vita, dobbiamo parlare quando è necessario; quando occorre, non bisogna tacere.|Matteo 5:8-16. C'è una grande gioia nel soffrire ingiustamente: quando siamo perseguitati mentre camminiamo come il Signore vuole, dobbiamo rallegrarcene, perché la nostra ricompensa sarà grande — i profeti di un tempo hanno sofferto così, perché il loro ministero era quello del giudizio. Il Signore disse a Ezechiele che se avesse visto il peccato di qualcuno senza dirglielo, quel peccato sarebbe ricaduto su di lui; non dovremmo dunque guardare un fratello nel peccato e non dire nulla. La fine del passo dice che la nostra luce deve risplendere: in altre parole, non dobbiamo vergognarci di dare la nostra testimonianza. Con i pagani si predica prima con gli atti; poi, quando si apre la breccia per parlare, bisogna parlare. Con i figli di Dio, se vedo mio fratello che fa il male, ho l'obbligo di dirgli che è nell'errore — e questo non è giudicare. Perché il pagano ha bisogno di Cristo, e chi è già in Cristo ha bisogno del carattere.|Matteo 18:11-18 — questa raccomandazione del Signore riguarda anche la vita quotidiana dei figli di Dio. Romani 1:18-21 — un altro modo di soffocare la verità è sapere che una cosa è cattiva e restare a guardare senza dire nulla; alcuni sono nell'ignoranza del loro smarrimento e hanno domande la cui risposta si trova forse sulla nostra lingua — non priviamoci dunque di parlare quando l'occasione si presenta. 1 Corinzi 5:1-13 — Paolo dice di aver già giudicato il peccato commesso da un fratello, perché simili atti non dovrebbero trovarsi in mezzo ai fratelli. E aggiunge che non chiede di non avere alcun rapporto con i peccatori del mondo — in tal caso bisognerebbe uscire dal mondo — ma se queste cose si trovano tra i fratelli, non bisogna colpire duro: bisogna dirglielo, badando al modo di dirlo. Se parliamo e il fratello decide di compiacersene, allora bisogna troncare i contatti, perché non spetta a noi giudicare quelli di fuori: Dio li giudica. Ma chi dice di essere cristiano autorizza gli altri cristiani a esaminare la sua vita. I figli della casa riconoscono nel rimprovero una prova d'amore, ed esso li porta a interrogare la propria vita; allo stesso modo, colui che viene ripreso e grida al giudizio, rifiutando di sottomettersi, afferma di non essere della casa (come con più figli in una casa: il figlio della casa riconosce nella correzione un gesto d'amore, l'altro vi vede un maltrattamento).|Così, se abbiamo deciso di camminare con Cristo, dobbiamo accogliere con amore il rimprovero ed esaminare le nostre vite, perché rigettare la voce di un fratello amato è anche rigettare la voce del Signore. Dire ogni volta che ci si sente giudicati, rifiutando di sottomettersi, è un modo di dire che non si è della casa. Non priviamoci di parlare quando l'occasione si presenta, e chiediamo al Signore la sapienza per usare le parole giuste e il modo adeguato. Che il Signore ci faccia grazia di accettare la sua parola e di conformarci ad essa, senza vedervi alcun atto di rifiuto o di giudizio." }
  },
  {
    id:"le-repas-du-seigneur-tel-que-institue-par-le-christ-et-prati", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-20", auteur:"Gaël, le frère",
    titre:{ fr:"Le repas du Seigneur tel que institué par le Christ et pratiqué par les premier disciples",
           en:"The Lord's Supper as instituted by Christ and practised by the first disciples",
           it:"La cena del Signore come istituita da Cristo e praticata dai primi discepoli" },
    verset:{ fr:"" },
    extrait:{ fr:"Matthieu 26: 20-32, Jean 13, 1 corinthiens 11 :20-34",
             en:"The Lord's Supper is a shared meal: one bread, one cup, one covenant. Where there is no sharing, it is not the Lord's Supper.",
             it:"La cena del Signore è un pasto condiviso: un solo pane, un solo calice, una sola alleanza. Dove non c'è condivisione, non è la cena del Signore." },
    contenu:{ fr:"Matthieu 26: 20-32, Jean 13, 1 corinthiens 11 :20-34|À la lecture de ces textes on se rend compte que les corinthiens n'avaient pas respecté la façon de pratiqué|Le repas du Seigneur est un partage et Paul reprenait les chrétiens de Corinthe qu’il n’y avait pas ce partage là car chacun venait avec son repas et le mangeait tandis que d'autres avaient faim et ceci fait que lorsqu'il y a absence de partage CE N'EST PAS LE REPAS DU SEIGNEUR car le repas du Seigneur est un repas communautaire les uns et les autres doivent être présents pour le partage (on ne peut pas faire de repas du Seigneur à distance)|Par ricochet le pain et le vin n'étant pas un repas, n'est pas le repas du Seigneur.|La cène = soupé = diner est le repas du soir, et comme le dit Mathieu 26: 20 les disciples se sont mis à table le soir, et du coup c'est une erreur contradictoire de l'appeler repas du soir et le prendre le matin.|1Cor10 :15-17, actes 2: 42-47 démontre que les chrétiens se retrouvaient dans la cours du temple et ils n'ont jamais construit de temple ils s'y réunissaient là-bas parce qu'ils venaient de partout t il fallait former le peuple afin que plutard fussent suscités les enseignants du peuple et ils rompaient le pain dans les maisons en suivant la doctrine du Seigneur. L'apôtre Paul précise qu'on a part à UN SEUL PAIN ceci est le symbole de ce qu'il y a un seul corps de Christ c'est pourquoi nous participons à un seul pain, ensuite il parle de LA COUPE DE BÉNÉDICTION qui représente le sang de l'alliance avec Christ donc une seule coupe et une seule alliance. Le fait d'avoir part à plusieurs petits pains et plusieurs petits verres est le symbole de la division du corps et que chacun a son alliance.|1corinthiens 5:6-8 l'autre caractéristique du pain de la cène est qu'il DOIT ÊTRE SANS LEVAIN car représente le corps du Christ parce que le Seigneur n'a pas de péché en lui donc la communion à son corps doit se faire sans levain car le levain est symbole du faux, de la corruption. Le repas du Seigneur est donc un repas où chacun a apporté chacun un repas qu'on met ensemble et qu'on le partage et pendant le repas, un frère prend le pain qui ne contient pas de levain le béni et on le partage. Le repas du Seigneur est différent de la Pâque en ce que a une date fixe de célébration, mais le repas du Seigneur peut-être fait des jours différents de celui du jour de Pâque comme le voit dans actes 20: 1-8 il y est précisé qu'ils ont rompu le pain un jour différent de celui du jour de Pâque car l'expression \"rompre le pain \"est le synonyme du repas du Seigneur car prendre le repas du Seigneur seulement à la Pâque serait comme une prolongation du judaïsme et soutenir ce point de vue voudrait qu'on enseigne aux chrétiens le calendrier juifs or nous ne sommes pas attachés aux dates et aux signes des temps. Galates 4: 9-14 si on commence à s'attacher au calendrier juif il va falloir suivre tout ce qui va avec les prescriptions juives c'est-à-dire respecter le sabbat et autres ce serait malheureusement s'approcher de Dieu avec la chair. Lorsque nous sommes en Jésus-Christ les calendriers sont rompus cela n'existe plus car le Seigneur a proclamé une année de grâce et c'est dans cette année-là que nous sommes, le repas peut être commémoré quand on le veut.|Pour ce qui est du repas, on ne doit pas forcément tout manger ce qui est mis à table mais ce qui doit finir c'est le pain et la boisson. En ce qui concerne la boisson car le Seigneur parle en Matthieu 26:29 du fruit de la vigne or le fruit de la vigne c'est le raisin donc le Seigneur ne fait pas référence à une boisson alcoolisée mais plutôt à du raison pressé donc du jus de raisin. Et il est nécessaire de préciser que lorsque la parole parle de vin ce n'est pas toujours d'une boisson alcoolisée comme nous pouvons le lire dans le livre de Deuteronome 32:14 on voit que le sang du raisin c'est ça qui est le vin. Donc le repas du Seigneur se fait avec du vin sans alcool. L'autre partie concerne le lavage des pieds, il doit précéder le repas du Seigneur et nous devons nous laver les pieds les uns des autres ceci en acte d'amour, un acte de purification et de services les uns des autres ceci doit être par amour et personne ne devrait pas être fait avec contrainte. Ce lavage des pieds faisait partie des conditions qu'une veuve devait remplir pour être inscrite sous le rôle comme on le dit dans Timothée 5.",
             en:"Matthew 26:20-32; John 13; 1 Corinthians 11:20-34.|Reading these texts, we realise that the Corinthians had not respected the way the Supper was to be practised.|The Lord's Supper is a sharing, and Paul rebuked the Christians of Corinth because that sharing was missing: each one brought his own meal and ate it while others went hungry. Where there is no sharing, IT IS NOT THE LORD'S SUPPER, for the Lord's Supper is a communal meal — all must be present together for the sharing (one cannot hold the Lord's Supper at a distance).|By the same token, bread and wine alone, not being a meal, are not the Lord's Supper.|The 'cène' — supper — is the evening meal; as Matthew 26:20 says, the disciples sat down to eat in the evening. It is therefore a contradiction to call it the evening meal and take it in the morning.|1 Corinthians 10:15-17 and Acts 2:42-47 show that the Christians gathered in the temple courts — they never built a temple; they met there because people came from everywhere and the people had to be taught, so that teachers of the people might later be raised up — and they broke bread in the houses, following the doctrine of the Lord. The apostle Paul specifies that we partake of ONE BREAD, the symbol that there is one body of Christ; then he speaks of THE CUP OF BLESSING, which represents the blood of the covenant with Christ — one cup, therefore, and one covenant. Partaking of many small loaves and many little cups symbolises a divided body, each with his own covenant.|1 Corinthians 5:6-8 — the other characteristic of the bread of the Supper is that it MUST BE WITHOUT LEAVEN, for it represents the body of Christ, and the Lord has no sin in Him; communion with His body must therefore be without leaven, leaven being the symbol of falsehood and corruption. The Lord's Supper is thus a meal to which each one has brought something; it is put together and shared, and during the meal a brother takes the unleavened bread, blesses it and it is shared. The Lord's Supper differs from the Passover in that the Passover had a fixed date of celebration, whereas the Lord's Supper may be held on other days than the day of the Passover, as we see in Acts 20:1-8, where they broke bread on a different day — 'breaking bread' being synonymous with the Lord's Supper. To take the Lord's Supper only at Passover would amount to prolonging Judaism, and to defend that view one would have to teach Christians the Jewish calendar; but we are not bound to dates and to the signs of times. Galatians 4:9-14 — if we begin to bind ourselves to the Jewish calendar, we shall have to follow everything that goes with the Jewish prescriptions, keeping the sabbath and the rest; that would sadly be approaching God by the flesh. When we are in Jesus Christ the calendars are broken — they no longer exist, for the Lord has proclaimed a year of grace, and it is in that year that we live; the Supper may be commemorated whenever we wish.|As for the meal itself, everything set on the table need not be finished, but the bread and the drink must be. Concerning the drink: the Lord speaks in Matthew 26:29 of the fruit of the vine, and the fruit of the vine is the grape; the Lord is therefore not referring to an alcoholic drink but to pressed grapes — grape juice. It should be noted that when the word speaks of wine, it is not always an alcoholic drink, as we read in Deuteronomy 32:14: the blood of the grape — that is the wine. So the Lord's Supper is held with wine without alcohol. The other part concerns the washing of feet: it must precede the Lord's Supper, and we must wash one another's feet as an act of love, an act of purification and of mutual service; it must be done out of love, and no one should be compelled. This foot-washing was among the conditions a widow had to fulfil to be enrolled, as 1 Timothy 5 says.",
             it:"Matteo 26:20-32; Giovanni 13; 1 Corinzi 11:20-34.|Alla lettura di questi testi ci si rende conto che i Corinzi non avevano rispettato il modo di praticare la cena.|La cena del Signore è una condivisione, e Paolo riprendeva i cristiani di Corinto perché quella condivisione mancava: ciascuno veniva con il proprio pasto e lo mangiava mentre altri avevano fame. Quando manca la condivisione, NON È LA CENA DEL SIGNORE, perché la cena del Signore è un pasto comunitario: gli uni e gli altri devono essere presenti per la condivisione (non si può fare la cena del Signore a distanza).|Di riflesso, il pane e il vino da soli, non essendo un pasto, non sono la cena del Signore.|La cena è il pasto della sera; come dice Matteo 26:20, i discepoli si misero a tavola la sera. È dunque un errore contraddittorio chiamarla pasto della sera e prenderla al mattino.|1 Corinzi 10:15-17 e Atti 2:42-47 dimostrano che i cristiani si ritrovavano nel cortile del tempio — non hanno mai costruito un tempio; vi si riunivano perché venivano da ogni parte e bisognava formare il popolo, affinché più tardi fossero suscitati gli insegnanti del popolo — e rompevano il pane nelle case, seguendo la dottrina del Signore. L'apostolo Paolo precisa che partecipiamo a UN SOLO PANE, simbolo del fatto che c'è un solo corpo di Cristo; poi parla del CALICE DELLA BENEDIZIONE, che rappresenta il sangue dell'alleanza con Cristo — dunque un solo calice e una sola alleanza. Partecipare a molti piccoli pani e a molti bicchierini è il simbolo della divisione del corpo, come se ciascuno avesse la propria alleanza.|1 Corinzi 5:6-8 — l'altra caratteristica del pane della cena è che DEV'ESSERE SENZA LIEVITO, perché rappresenta il corpo di Cristo, e il Signore non ha peccato in sé; la comunione con il suo corpo deve dunque farsi senza lievito, essendo il lievito simbolo del falso e della corruzione. La cena del Signore è dunque un pasto in cui ciascuno ha portato qualcosa, lo si mette insieme e lo si condivide; durante il pasto un fratello prende il pane senza lievito, lo benedice e lo si condivide. La cena del Signore è diversa dalla Pasqua in quanto la Pasqua aveva una data fissa di celebrazione, mentre la cena del Signore può essere fatta in giorni diversi da quello della Pasqua, come si vede in Atti 20:1-8, dove è precisato che ruppero il pane in un giorno diverso — l'espressione 'rompere il pane' è sinonimo della cena del Signore. Prendere la cena del Signore solo a Pasqua sarebbe come un prolungamento del giudaismo, e per sostenere questo punto di vista bisognerebbe insegnare ai cristiani il calendario ebraico; ma noi non siamo legati alle date e ai segni dei tempi. Galati 4:9-14 — se cominciamo a legarci al calendario ebraico, bisognerà seguire tutto ciò che accompagna le prescrizioni giudaiche, cioè rispettare il sabato e il resto: sarebbe purtroppo avvicinarsi a Dio con la carne. Quando siamo in Gesù Cristo i calendari sono infranti, non esistono più, perché il Signore ha proclamato un anno di grazia, ed è in quell'anno che viviamo; la cena può essere commemorata quando si vuole.|Quanto al pasto, non si è obbligati a finire tutto ciò che è messo in tavola, ma ciò che deve finire è il pane e la bevanda. Riguardo alla bevanda: il Signore parla in Matteo 26:29 del frutto della vite, e il frutto della vite è l'uva; il Signore non fa dunque riferimento a una bevanda alcolica ma all'uva spremuta, cioè al succo d'uva. Ed è necessario precisare che quando la parola parla di vino non si tratta sempre di una bevanda alcolica, come leggiamo in Deuteronomio 32:14: il sangue dell'uva — ecco il vino. Dunque la cena del Signore si fa con vino senza alcol. L'altra parte riguarda la lavanda dei piedi: deve precedere la cena del Signore, e dobbiamo lavarci i piedi gli uni gli altri come atto d'amore, atto di purificazione e di servizio reciproco; dev'essere fatto per amore, e nessuno dev'essere costretto. Questa lavanda dei piedi faceva parte delle condizioni che una vedova doveva soddisfare per essere iscritta nel registro, come si dice in 1 Timoteo 5." }

  {
    id:"la-relation-avec-le-voisinage-les-aspects-bibliques", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-19", auteur:"Gaël, le frère",
    titre:{ fr:"La relation avec le voisinage : les aspects bibliques",
           en:"Our relationship with the neighbourhood: the biblical perspective",
           it:"La relazione con il vicinato: gli aspetti biblici" },
    verset:{ fr:"" },
    extrait:{ fr:"Si quelqu’un n'est pas en santé il est clair qu'il ne peut pas prier de façon convenable. Lorsque les personnes qui sont dans l'occultisme attaquent pour détruire la vie des enfants du Seigneur,…",
             en:"How should a child of God behave with his neighbours? What attitude should we adopt when the neighbourhood is difficult? Simplicity, prudence and love must walk together.",
             it:"Come deve comportarsi un figlio di Dio con il suo vicinato? Quale atteggiamento adottare quando il vicinato è difficile? Semplicità, prudenza e amore devono camminare insieme." },
    contenu:{ fr:"Si quelqu’un n'est pas en santé il est clair qu'il ne peut pas prier de façon convenable. Lorsque les personnes qui sont dans l'occultisme attaquent pour détruire la vie des enfants du Seigneur, Satan sait que même s'il ne te détruit pas complètement cela va te déconcentrer de ce qui est important et pour lui ça a de la valeur. Et les relations avec le voisinage ont déjà détruit familles, couples... Il en arrive que certaines personnes subissent des châtiments dans leur vie à cause du voisinage et ce parfois sans le savoir.|*En tant qu'enfant de Dieu comment donc se comporter avec notre voisinage ? Quelles attitudes adopter lorsque nous avons un voisinage difficile ?*|Genèse 13 ; Josué 9 ; Nombres 25.|Le 1er texte est l'exemple de 2 frères qui vivent proches et les deux autres l'exemple d'un enfant de Dieu voisin d'un non croyant. La première observation que nous faisons de ces textes est que la personne non chrétienne peut subtilement devenir ton ami avec un but précis. Les enfants de Dieu sont censés être éclairés et prier contre les ténèbres. Un enfant ne peut donc être intime avec les païens ; ceci ne veut pas dire qu'on ne doit pas les saluer mais on ne doit pas avoir une relation d'intimité proche avec eux comme le Seigneur l'avait commandé en Lévitique 18 :1-5. Ceci dit, dans la vie d'un homme converti, il y a le piège d'être tenté à retourner vers le passé car le passé vient constamment pour tenter. Le présent et l'avenir aussi car dans la nouvelle vie Satan utilise de nouvelles personnes... Et nous voyons dans le passage vers Canaan que chaque fois qu'Israël avait une raison de se plaindre, ils faisaient appels à l’Égypte ; c'est l'image du chrétien pour lequel la vie de sanctification est un fardeau lourd à porter. De même que lorsqu'ils vont arriver à Canaan le contact avec le voisinage va les conduire à se détourner du Seigneur. Ceci montre à suffisance que le voisinage peut être un gros obstacle à notre épanouissement|2 Samuel 21 :|Nous connaissons des personnes qui vivent des situations inexplicables à cause des alliances que leurs parents ont fait et c'est pourquoi il est important lorsque nous venons au Seigneur de prendre du temps pour nous déconnecter de tous les liens contractés par nos parents ; sinon on devra en subir les conséquentes car ce n'est pas parce qu’on n'était pas là que ça veut dire qu'on n'est pas concerné (Saul a frappé Gabaon alors qu'il n'était pas là lorsque Josué a fait le serment et David en a vécu les conséquences).|Lorsque nous arrivons dans un quartier, si les personnes viennent vers nous avec tout le sourire, nous devons faire attention et ne pas embrasser tout le monde car quelqu’un qui veut nous faire du mal ne viendra pas directement vers nous avec les attaques mais il va venir comme un ami pour créer un lien de proximité. Il faut éviter de prendre des engagements sans consulter le Seigneur comme l'ont fait les chefs d'Israël dans Josué 9. Ce n'est pas parce que quelqu’un sourit/rit avec nous qu'il est forcément un ami : ça peut être la ruse. En effet, Satan est ruse et c'est toujours comme ça qu'il procède.|Une relation de mauvais voisinage qui nous semble une relation de bon voisinage peut coûter extrêmement cher. Faire une confiance aveugle à une personne qu'on ne connaît pas parce qu'elle a été gentille avec nous, nous expose. Nous devons donc prendre des précautions justes et qui s'imposent veillant constamment avec la prière. Lorsque nous avons des relations difficiles avec les membres de la famille tant celle charnelle que spirituelle et que c'est dû au fait qu'on est voisin géographiquement, nous devons adopter l'attitude d'Abraham dans Genèse 13 c'est-à-dire qu’il faut se séparer, prendre des distances afin de préserver la paix ; Paul et Barnabas ont dû se séparer. Souvent la distance permet à chacun de reconsidérer sa position. La distance entre Ésaü et Jacob a fait que les cœurs s'apaisent alors que lorsqu'ils étaient ensemble, Ésaü était déterminé à tuer son frère.|Hébreux 12v14 :|L'apôtre dit de rechercher la paix avec tous, il n'est pas dit qu'on obtiendra forcément la paix avec tous mais on doit marcher dans la recherche de la paix. Ça ne veut pas non plus dire de les embrasser aveuglement mais plutôt ça veut dire ne pas se mettre en conflit avec eux comme des ennemis mais nous devons être PRUDENT.|1 Jean 2|Le frère nous fait comprendre que le COMMANDEMENT D'EXCELLENCE DU CHRÉTIEN C'EST L'AMOUR, donc la prudence et l'amour marchent ensemble et le Seigneur lui-même a enseigné sur la prudence.|Matthieu 10 :16-17|Souvent, certains chrétiens vivent non dans la simplicité mais dans l'orgueil et le mépris de façon à attirer vers eux le mauvais regard de l'ennemi attirant ainsi des ennuis qu'ils auraient pu éviter s'ils avaient vécu dans la simplicité. Il faut donc tenir en compte ce commandement d'être simple comme des colombes. Si on est orgueilleux, hautain, médisant en étant chrétien alors cela ne nous épargne pas des attaques. Or Jean dit que celui qui demeure en Christ doit marcher comme Lui-même il a marché, or Christ a marché dans la simplicité. L'amour des choses du monde est une porte ouverte pour l'ennemi ; en s'attachant au monde, on court le risque que cela impacte notre vie et même celle de nos enfants.|Un chrétien doit examiner et avoir du discernement dans tout ce qu'il fait. La haine n'est pas un sentiment qu'un enfant de Dieu doit avoir. Même si on est entouré des sorciers nous devons prier et travailler notre cœur de façon à ne pas les détester. Et aussi nous devons prendre des mesures sérieuses avec eux, genre éviter les fréquentations mais il faut éviter de haïr car ce serait là une brisure dans notre relation avec le Seigneur car on ne peut s'approcher du Seigneur avec de la haine sur le cœur.|Proverbes 25 :21-22, Matthieu 5 : 42-48|La prudence ne doit pas être une source de manque d'amour ; ça ne doit pas être une source de méfiance extrême au point où nous ne devons pas aider. Si nous sommes simples, si nous prions, nous ne porterons pas le châtiment et on ne va pas écoper de quelque chose parce que nous avons manifesté de l'amour. Le Seigneur peut nous révéler les choses cachées et s'il ne le fait pas, il nous épargne et il nous préserve. Mais si nous vivons une vie de méfiance, de peur, de suspicion, il y a la possibilité que nous ne manifestions pas l'amour que le Seigneur attend de nous et Satan se glorifiera. Nous devons donc avoir du discernement dans toute choses, chercher la face de Dieu avant de s'engager dans quoi que ce soit avec le voisinage. Car si nous commençons à méditer les mauvaises pensées, la haine, le manque de pardon nous deviendrons comme eux.|L'amour doit précéder n'importe laquelle de nos actions car il est capable de faire des choses extraordinaires. Nous devons rester équilibrés, le monde entier est sous la puissance du mal mais que la connaissance de ces choses ne nous fasse pas devenir comme les gens de ce monde dans notre attitude. Étienne a subi la persécution ultime et pourtant, il a prié pour que le Seigneur pardonne ses bourreaux. Nous devons chercher la face du Seigneur et Il peut nous demander de quitter cet endroit pour être épanoui mais dans tout, nous devons être attentif à Sa Voix. Si nous agissons avec simplicité, Prudence et amour malgré les persécutions, même si nos voisins sorciers réussissent certains de leurs coups, ils ne pourront pas dépasser le seuil permis par le Seigneur. Nous ne devons pas agir comme si notre combat était charnel mais nous devons agir en sachant que notre combat est spirituel. Il y aura des cas où on sera appelés à dire aux sorciers qu'on sait qu'ils le sont mais en tout, il faut le discernement.|*Que faire des dons aux personnes qui sont assises au bord de la route et demandent l'aumône ??*|Nous devons agir par amour et par conviction, on n'est pas obligé de donner l'aumône non. Certaines personnes ont été liées par les esprits à cause de l'aumône qu'ils ont fait, nous devons tout faire étant poussé par le Saint-Esprit.",
             en:"If someone is not in good health, clearly he cannot pray as he ought. When people involved in occultism attack to destroy the life of the Lord's children, Satan knows that even if he does not destroy you completely, it will distract you from what matters — and to him that has value. Neighbourhood relations have already destroyed families and couples; some people undergo afflictions in their lives because of the neighbourhood, sometimes without knowing it.|As a child of God, how then should we behave with our neighbours? What attitude should we adopt when we have a difficult neighbourhood?|Genesis 13; Joshua 9; Numbers 25.|The first text is the example of two brothers living close together; the other two are the example of a child of God neighbouring an unbeliever. The first observation is that a non-Christian can subtly become your friend with a precise aim. The children of God are meant to be enlightened and to pray against the darkness. A child of God cannot be intimate with the pagans; this does not mean we should not greet them, but we must not have a close, intimate relationship with them, as the Lord commanded in Leviticus 18:1-5. Moreover, in the life of a converted man there is the trap of being tempted to return to the past, for the past constantly comes back to tempt — and the present and future also, for in the new life Satan uses new people. We see that on the way to Canaan, every time Israel had a reason to complain, they appealed to Egypt: the image of the Christian for whom the life of sanctification is a heavy burden. Likewise, when they arrived in Canaan, contact with the neighbouring peoples led them to turn away from the Lord. This shows sufficiently that the neighbourhood can be a great obstacle to our flourishing.|2 Samuel 21.|We know people who live through inexplicable situations because of covenants their parents made; that is why it is important, when we come to the Lord, to take time to break with all the bonds contracted b
