est séductrice, à des fins mauvaises, et chaque fois pour avoir quelque chose en retour. Dans les cas de délivrance par les démons, il n'y a donc ni réelle délivrance ni libération.|PEUT-ON SANCTIFIER UNE CHOSE APPARTENANT À SATAN POUR L'UTILISER ? SI OUI, COMMENT ?|Retenons qu'il y a des choses qui, dès leur conception, ont été consacrées et appartiennent à Satan, de sorte qu'il s'identifie en elles et a donc le droit de les réclamer. Jude v. 9 : le corps de Moïse est allé à l'ange du Seigneur parce qu'il appartenait à Dieu ; donc si nous possédons quelque chose qui appartient aux démons, c'est normal qu'ils viennent à nous — la chose de Satan ne peut être cachée en Dieu. Quand Israël se sanctifiait, il se dépouillait : il ne priait pas pour les idoles, il s'en dépouillait. On ne peut donc pas prier pour une chose de Satan afin qu'elle devienne de Dieu. 2 Corinthiens 6:14-18 : séparons-nous de ce qui est impur ; tout ce qui n'est pas de Dieu doit tout simplement être jeté. Nous devons nous débarrasser de tout afin d'être accueillis. Que le Seigneur nous fasse la grâce de nous débarrasser des ténèbres. Que le Seigneur nous bénisse en abondance dans le nom de Jésus-Christ !",
             en:"One important thing to grasp before entering this verse is that we do not 'go' to worship: in reality, the worship we render to God is our life, according to Romans 12:1-2 — the worship God accepts is the sacrifice of our hearts, walking in holiness, godliness, and so on. The apostle Paul adds in 1 Thessalonians 4:3 that what the Lord wants is our sanctification. So when we speak of 'going to the service', we make ourselves spectators, as if going to the cinema; but the Lord has no need of that. The LORD's plan is that all take part actively in the assembly meetings, not merely come and follow what has been carved out in advance by a group of people. Every Christian may sing, pray, give an exhortation, share a vision or a dream — all with one aim: the edification of all (what does not edify is of no use to the assembly); it is enough to let oneself be used by the Holy Spirit.|It must be stressed that no denomination, no institutional church keeps the standard established by the apostles. Examples: these churches have names, yet a name is already a symbol of division (1 Corinthians 3:1-7) — a Christian who claims to belong to a denomination is simply carnal. Other examples are the construction of buildings, hierarchy, the mode of baptism, the Lord's Supper, and so on. So a child of the Lord in these situations should ask the Lord and obey. If the Lord asks him to come out, he should do so, for that is how He will receive us; let us not be afraid, beloved, to take firm decisions with the Lord, nor of the reaction of others — sometimes we lose ourselves because of that.|A Christian community is made of cohesion and love, not of activism.|Leviticus 10:1-2; 2 Samuel 6:1-7; Numbers 7:9.|Strange fire is the symbol of teaching that does not come from the Lord, that is not inspired by the Holy Spirit. Whatever our good intentions, when we are not called to do the Lord's work, if we touch it, we die — not necessarily a physical death. Let us remember that the Lord's instructions must be carried out as given; however good our intentions, the Lord sees the disobedience. It is better for the Christian to do right and stand alone than to follow the crowd and go astray with it, for as the word says, the way is narrow and few pass through it. If the Lord shows us a way to follow, it is the way of our salvation, for He is love and cannot lie to us; it is better for us to obey, for obedience is better than sacrifice. May the Lord give us the grace to be obedient men, and servants after His heart.|QUESTION (sharing of 2 June 2018): In Matthew 12 the Pharisees accuse Jesus of casting out demons by demons, and Jesus answers that demons are not cast out by demons. How is it, then, that today people with occult powers cast out demons?|Reading Matthew 12:22-33, the first thing we notice is that the Jews recognise in Jesus the son of David — that is, the Messiah who was to come; yet it is the Pharisees, who were supposed to know Him best, who say He has demons. The Pharisees' reasoning makes us understand that in reality it is possible to cast out one demon by another demon. Because the demon in someone's body represents the strong man of the house, to cast him out requires either the Holy Spirit or another, stronger demon (the strong man is thus bound and thrown out). Those who cast out demons by demonic powers go to the high authorities of darkness, either to have the demon replaced or to put it to sleep. 2 Thessalonians 2:9-12 and Exodus 8:1-19 show that Satan also has power (far inferior to the Lord's), except that his power is seductive, serves evil ends, and always demands something in return. In cases of deliverance by demons there is therefore no real deliverance and no liberation.|CAN ONE SANCTIFY A THING BELONGING TO SATAN IN ORDER TO USE IT? IF SO, HOW?|Let us remember that there are things which, from their very conception, were consecrated and belong to Satan, so that he identifies himself in them and therefore has the right to claim them. Jude v. 9: the body of Moses went to the angel of the Lord because it belonged to God; so if we possess something that belongs to the demons, it is normal that they come to us — what belongs to Satan cannot be hidden in God. When Israel sanctified itself, it stripped itself: it did not pray over the idols, it got rid of them. One cannot, therefore, pray over a thing of Satan so that it becomes God's. 2 Corinthians 6:14-18: let us separate ourselves from what is impure; whatever is not of God must simply be thrown away. We must rid ourselves of everything in order to be received. May the Lord grant us the grace to rid ourselves of darkness. May the Lord bless us abundantly in the name of Jesus Christ!",
             it:"Una cosa importante da ritenere prima di entrare in questo versetto è che non si 'va' al culto: in realtà, il culto che rendiamo a Dio è la nostra vita, secondo Romani 12:1-2 — il culto che Dio gradisce è il sacrificio dei nostri cuori, camminare nella santità, nella pietà, ecc. L'apostolo Paolo aggiunge in 1 Tessalonicesi 4:3 che ciò che il Signore vuole è la nostra santificazione. Dunque, quando dichiariamo di 'andare al culto', ci rendiamo spettatori della cosa, come se andassimo al cinema; ma il Signore non ha bisogno di questo. Il piano dell'Eterno è che tutti prendano parte in modo partecipativo alle riunioni dell'assemblea, non soltanto venire a seguire ciò che è stato scolpito in anticipo da un gruppo di persone. Ogni cristiano può cantare, pregare, dire un'esortazione, condividere una visione o un sogno, tutto con uno scopo: l'edificazione di tutti (ciò che non edifica non è utile all'assemblea); basta lasciarsi usare dallo Spirito Santo.|Bisogna sottolineare che nessuna denominazione, nessuna chiesa-istituzione rispetta lo standard stabilito dagli apostoli. Alcuni esempi: queste chiese hanno dei nomi, ma il nome è già simbolo di divisione (1 Corinzi 3:1-7) — un cristiano che si dichiara appartenente a una denominazione è semplicemente carnale. Altri esempi sono la costruzione degli edifici, la gerarchizzazione, il modo di battezzare, la cena del Signore, ecc. Dunque un figlio del Signore in queste situazioni dovrebbe interrogare il Signore e ubbidire. Se il Signore chiede di uscirne, bisognerebbe farlo, perché è così che ci riceverà; non abbiamo paura, amati, di prendere decisioni ferme con il Signore, né della reazione degli altri — a volte ci perdiamo proprio per questo.|Una comunità cristiana è fatta di coesione e di amore, non di attivismo.|Levitico 10:1-2; 2 Samuele 6:1-7; Numeri 7:9.|Il fuoco estraneo è simbolo dell'insegnamento che non viene dal Signore, che non è ispirato dallo Spirito Santo. Non importano le nostre buone intenzioni: quando non si è chiamati a fare l'opera del Signore, se la si tocca, si muore — non necessariamente di una morte fisica. Ricordiamo che le istruzioni del Signore devono essere eseguite così come sono state date; per quanto buone siano le nostre intenzioni, il Signore vede la disubbidienza. È meglio per il cristiano fare il bene e restare solo che seguire la folla e sbagliare con essa, perché come dice la parola, la via è stretta e pochi vi passano. Se il Signore ci mostra una via da seguire, è quella della nostra salvezza, perché egli è amore e non può mentirci; sarebbe meglio per noi ubbidire, perché l'ubbidienza vale più del sacrificio. Che il Signore ci dia la grazia di essere uomini ubbidienti e servitori secondo il suo cuore.|DOMANDA (condivisione del 2 giugno 2018): In Matteo 12 i farisei accusano Gesù di scacciare i demòni con i demòni, e Gesù risponde che non si scacciano i demòni con i demòni. Come mai, allora, oggi delle persone con poteri occulti scacciano i demòni?|Leggendo Matteo 12:22-33, la prima osservazione è che i giudei riconoscono in Gesù il figlio di Davide, cioè il Messia che doveva venire; ma sono i farisei, che avrebbero dovuto conoscerlo meglio, a dire che ha dei demòni. Il ragionamento dei farisei fa capire che in realtà è possibile scacciare un demone con un altro demone. Poiché il demone nel corpo di qualcuno rappresenta l'uomo forte della casa, per scacciarlo occorre o lo Spirito Santo, o un altro demone più forte (l'uomo forte sarà così legato e messo fuori). Coloro che scacciano i demòni con forze demoniache vanno dalle alte autorità delle tenebre, o per farlo sostituire o per addormentarlo. 2 Tessalonicesi 2:9-12 ed Esodo 8:1-19 mostrano che anche Satana ha una potenza (di gran lunga inferiore a quella del Signore), solo che essa è seduttrice, a fini malvagi, e ogni volta per avere qualcosa in cambio. Nei casi di liberazione per mezzo dei demòni non c'è dunque né vera liberazione né affrancamento.|SI PUÒ SANTIFICARE UNA COSA APPARTENENTE A SATANA PER USARLA? SE SÌ, COME?|Ricordiamo che ci sono cose che, fin dalla loro concezione, sono state consacrate e appartengono a Satana, in modo che egli si identifica in esse e ha dunque il diritto di reclamarle. Giuda v. 9: il corpo di Mosè andò all'angelo del Signore perché apparteneva a Dio; dunque, se possediamo qualcosa che appartiene ai demòni, è normale che essi vengano a noi — la cosa di Satana non può essere nascosta in Dio. Quando Israele si santificava, si spogliava: non pregava per gli idoli, se ne spogliava. Non si può dunque pregare per una cosa di Satana affinché diventi di Dio. 2 Corinzi 6:14-18: separiamoci da ciò che è impuro; tutto ciò che non è di Dio dev'essere semplicemente gettato via. Dobbiamo sbarazzarci di tutto per essere accolti. Che il Signore ci faccia la grazia di sbarazzarci delle tenebre. Che il Signore ci benedica in abbondanza nel nome di Gesù Cristo!" }

    id:"etude-biblique-2-thessaloniciens", rubrique:"enseignements", sousRubrique:"doctrine",

    titre:{ fr:"Etude biblique : 2 Thessaloniciens",
           en:"Bible study: 2 Thessalonians",
           it:"Studio biblico: 2 Tessalonicesi" },
    verset:{ fr:"" },
    extrait:{ fr:"CHAPITRE 1",
             en:"Faith and love, the pillars of the Church; the man of sin who must come before the day of Christ; and the believer's hope: living in expectation of the Lord's return.",
             it:"La fede e l'amore, pilastri della Chiesa; l'uomo del peccato che deve venire prima del giorno di Cristo; e la speranza del credente: vivere nell'attesa del ritorno del Signore." },
    contenu:{ fr:"CHAPITRE 1|Cette lettre est de Paul Timothée et Silas a à l’Eglise de Thessalonique. La première chose importante à noter et valable dans la marche avec le Seigneur pour tous est que on devient pas adulte dans la foi d’un coup c’est en fonction du niveau de croissance de chacun qu’on saura quoi lui enseigneur ; c’est pourquoi Paul fait des éloges aux chrétiens de la Thessalonique parce que malgré leur jeunesse on puisse déjà autant remarquer les deux choses importantes dans la marche avec le Seigneur :|-la FOI : sans laquelle personne ne peut être agréable à Dieu.  C’est elle qui nous pousse à l’action qui se manifeste en l’autre chose importante,|-L’AMOUR : qui représente le caractère véritable du Seigneur.|Ces choses sont le pilier de l’Eglise qui nous poussent à faire quoique ce soit pour le Seigneur et pour les bien-aimés, l’amour est le sens même de la marche avec le Seigneur, et le véritable amour se trouve en Christ, sans Christ on ne peut pas réellement aimer. La différence entre un philanthrope et celui qui a réellement l’amour est que le 1er aime ou agit pour recevoir une satisfaction psychologique, pour se faire voir des autres.|Or l’amour de la même façon que la vérité n’est qu’en Christ, il n’y a que Lui pour manifester ces choses. Il est donc important de se demander est ce que j’ai cet amour ??? cette foi nécessaire ?? ce qu’on eut les Thessaloniciens au point d’en faire écho, malgré les souffrances et les jugements par lesquels ils passaient, ils n’ont pas failli, ils ont continué à se soutenir à se soutenir dans la foi. C’est un challenge, un défi pour nous aujourd’hui car on est tellement faible devant les tribulations, on se plaint tellement de tout et de rien qu’on arrive même plus à rendre grâce.|Que répondre à la question tu dis que tu es quel genre de chrétien ?? n’est-ce pas tel aussi est chrétien nooon mais il fait ci ou ça ??? chacun reçoit sa conviction, et la relation avec le Seigneur est personnelle, il n’y a pas l’effet de groupe dans la marche avec le Seigneur, chacun rendra compte pour lui-même.|Peu importe nos souffrances en tant qu’enfant de Dieu nous avons la certitude que les injustes auront leur souffrance ; c’est un encouragement pour nous.|CHAPITRE 2|L’antichrist, l’adversaire c’est l’homme de péché ce n’est pas un esprit mais un être charnel, il s’élèvera en se proclamant Christ et plusieurs l’adoreront en croyant qu’il l’est vraiment, le prophète Daniel a parlé de lui Daniel 11 :36-38 ; il faut qu’il vienne avant le jour de Christ qui est aussi l’avènement du Seigneur. La puissance avec laquelle le Seigneur Jésus viendra, va enlever Son Eglise et la colère du Seigneur va s’abattre et ce sera quand Il viendra (Ésaïe 13, Joël, Matthieu 24 prophétisent que c’est u jour de douleur). L’impie doit prospérer, il arrivera avec tous les signes et les miracles qui sont des signes de perdition et séduction. Et même ceux qui se trouvent souvent dans l’erreur et en être convaincus au point de discuter ce n’est pas parce qu’ils le veulent mais c’est l’esprit qui les anime qui les pousse à prendre de telles positions.|CHAPITRE 3|Notre motivation en tant que chrétien c’est le retour du Seigneur 1corinthiens 15 :31-32 ; si un chrétien ne crois pas à la résurrection des morts c’est qu’il y’a un problème. C’est l’espérance que nous avons dans le Seigneur qui nous encourage sur notre voie, notre vie doit être une vie d’attente, l’attente du retour du Seigneur ; les plaisirs dont on se prive c’est à cause de cette espérance qui nous est donné en Christ. Si nous vivons dans la certitude de notre lendemain ça veut tout simplement dire que nous n’attendons pas le Seigneur, ça ne veut pas dire que le chrétien ne fait pas de projets mais tout simplement dire que nous devons vivre comme des gardiens, même si le Seigneur arrive à n’importe quel moment que nous soyons parmi ceux qui seront enlevés ; qqn qui mène un type de vie sans sacrifice n’attend pas le Seigneur. Mais pour nous notre bonheur d’être enfant de Dieu c’est notre espérance en Jésus Christ de laquelle le Saint Esprit est le garant.|Les enfants de Dieu doivent travailler, avec ardeur pour ne dépendre de personne, pour ne pas avoir à devoir dissoudre l’évangile à cause de ce que nous recevons d’un tel ou d’un tel autre. Le chrétien paresseux ne doit être chassé de la communauté mais mis à l’écart pour lui donner une leçon, afin qu’il comprenne ce qu’il devrait travailler, ça ne veut pas dire qu’on devrait l’appliquer à d’autres fautes, parce qu’il y a des péchés qui méritent que celui qui le commet soit sache mais pour un cas de paresse non.|16Que le Seigneur de paix vous donne lui-même la paix en tout temps et en toutes manières ! Le Seigneur soit avec vous tous !|17 La salutation est de ma propre main, à moi, Paul ; c'est là ma signature dans toutes mes épîtres ; j'écris ainsi.|18 La grâce de notre Seigneur Jésus-Christ soit avec vous tous ! Amen.",
             en:"CHAPTER 1.|This letter is from Paul, Timothy and Silas to the church of Thessalonica. The first important point, valid for everyone's walk with the Lord, is that one does not become an adult in the faith all at once; it is according to each one's level of growth that we know what to teach him. That is why Paul praises the Christians of Thessalonica: despite their youth in the faith, two important things in the walk with the Lord could already be seen in them:|— FAITH, without which no one can please God. It is faith that moves us to action, which is expressed in the other important thing:|— LOVE, which represents the true character of the Lord.|These things are the pillar of the Church, moving us to do anything for the Lord and for the beloved. Love is the very meaning of the walk with the Lord, and true love is found in Christ; without Christ one cannot really love. The difference between a philanthropist and one who truly has love is that the former loves or acts to receive psychological satisfaction, to be seen by others.|Love, like truth, is found only in Christ; He alone can manifest these things. It is therefore important to ask ourselves: do I have this love? this necessary faith? The Thessalonians had them to the point that it echoed abroad; despite the sufferings and trials they were passing through, they did not fail — they kept supporting one another in the faith. It is a challenge for us today, for we are so weak before tribulations; we complain so much about everything and nothing that we can no longer even give thanks.|What shall we answer to the question, 'What kind of Christian are you?' — 'Is not so-and-so also a Christian? No, but he does this or that...' Each one receives his own conviction, and the relationship with the Lord is personal; there is no group effect in the walk with the Lord — each will give account for himself.|Whatever our sufferings, as children of God we have the certainty that the unjust will have their suffering; that is an encouragement for us.|CHAPTER 2.|The antichrist, the adversary, is the man of sin — not a spirit but a fleshly being. He will exalt himself, proclaiming himself Christ, and many will worship him believing that he truly is; the prophet Daniel spoke of him (Daniel 11:36-38). He must come before the day of Christ, which is also the coming of the Lord. The power with which the Lord Jesus will come will take up His Church, and the wrath of the Lord will fall — and that will be when He comes (Isaiah 13, Joel, Matthew 24 prophesy that it is a day of anguish). The lawless one must prosper; he will come with all the signs and wonders which are signs of perdition and seduction. And even those who are often found in error, convinced of it to the point of arguing — it is not because they wish it, but the spirit that animates them drives them to take such positions.|CHAPTER 3.|Our motivation as Christians is the return of the Lord (1 Corinthians 15:31-32); if a Christian does not believe in the resurrection of the dead, something is wrong. It is the hope we have in the Lord that encourages us on our way; our life must be a life of waiting — waiting for the Lord's return. The pleasures we deny ourselves, we deny because of this hope given us in Christ. If we live in certainty about our tomorrow, it simply means we are not waiting for the Lord; this does not mean the Christian makes no plans, but simply that we must live as watchmen, so that even if the Lord comes at any moment, we may be among those who will be taken up. Someone who leads a life without sacrifice is not waiting for the Lord. But for us, our happiness as children of God is our hope in Jesus Christ, of which the Holy Spirit is the guarantor.|The children of God must work, and work hard, so as to depend on no one — so as not to have to water down the gospel because of what we receive from this person or that. The lazy Christian is not to be driven out of the community, but set apart to teach him a lesson, so that he understands that he ought to work. This does not mean the same treatment applies to other faults, for there are sins that require the one who commits them to be dealt with differently; but for a case of laziness, no.|16 'Now may the Lord of peace Himself give you peace at all times and in every way. The Lord be with you all!'|17 'The salutation is in my own hand — Paul's; this is the sign in every epistle; so I write.'|18 'The grace of our Lord Jesus Christ be with you all! Amen.'",
             it:"CAPITOLO 1.|Questa lettera è di Paolo, Timoteo e Sila alla chiesa di Tessalonica. La prima cosa importante da notare, valida per il cammino di tutti con il Signore, è che non si diventa adulti nella fede tutto d'un colpo; è in funzione del livello di crescita di ciascuno che si saprà che cosa insegnargli. Per questo Paolo elogia i cristiani di Tessalonica: malgrado la loro giovinezza nella fede, si potevano già notare in loro le due cose importanti nel cammino con il Signore:|— la FEDE, senza la quale nessuno può essere gradito a Dio. È lei che ci spinge all'azione, che si manifesta nell'altra cosa importante:|— l'AMORE, che rappresenta il vero carattere del Signore.|Queste cose sono il pilastro della Chiesa, che ci spingono a fare qualsiasi cosa per il Signore e per i fratelli amati. L'amore è il senso stesso del cammino con il Signore, e il vero amore si trova in Cristo; senza Cristo non si può amare realmente. La differenza tra un filantropo e chi ha realmente l'amore è che il primo ama o agisce per ricevere una soddisfazione psicologica, per farsi vedere dagli altri.|Ora, l'amore, come la verità, si trova solo in Cristo; solo lui può manifestare queste cose. È dunque importante chiedersi: ho io questo amore? questa fede necessaria? I Tessalonicesi le ebbero al punto da farne eco; malgrado le sofferenze e le prove che attraversavano, non vennero meno — continuarono a sostenersi nella fede. È una sfida per noi oggi, perché siamo così deboli davanti alle tribolazioni; ci lamentiamo talmente di tutto e di niente che non riusciamo nemmeno più a rendere grazie.|Che rispondere alla domanda: che genere di cristiano sei? 'Ma anche il tale non è forse cristiano? No, ma lui fa questo o quello...' Ciascuno riceve la propria convinzione, e la relazione con il Signore è personale; non c'è effetto di gruppo nel cammino con il Signore — ognuno renderà conto per se stesso.|Qualunque siano le nostre sofferenze, come figli di Dio abbiamo la certezza che gli ingiusti avranno la loro sofferenza; è un incoraggiamento per noi.|CAPITOLO 2.|L'anticristo, l'avversario, è l'uomo del peccato: non uno spirito ma un essere carnale. Si innalzerà proclamandosi Cristo e molti lo adoreranno credendo che lo sia davvero; il profeta Daniele ha parlato di lui (Daniele 11:36-38). Deve venire prima del giorno di Cristo, che è anche la venuta del Signore. La potenza con cui il Signore Gesù verrà rapirà la sua Chiesa, e l'ira del Signore si abbatterà — e sarà quando egli verrà (Isaia 13, Gioele, Matteo 24 profetizzano che è un giorno di angoscia). L'empio deve prosperare; arriverà con tutti i segni e i prodigi che sono segni di perdizione e di seduzione. E anche coloro che si trovano spesso nell'errore, convinti al punto di discuterne — non è perché lo vogliano, ma è lo spirito che li anima a spingerli a prendere simili posizioni.|CAPITOLO 3.|La nostra motivazione come cristiani è il ritorno del Signore (1 Corinzi 15:31-32); se un cristiano non crede alla risurrezione dei morti, c'è un problema. È la speranza che abbiamo nel Signore che ci incoraggia sul nostro cammino; la nostra vita dev'essere una vita di attesa, l'attesa del ritorno del Signore. I piaceri di cui ci priviamo, ce ne priviamo a causa di questa speranza che ci è donata in Cristo. Se viviamo nella certezza del nostro domani, vuol dire semplicemente che non aspettiamo il Signore; questo non significa che il cristiano non faccia progetti, ma semplicemente che dobbiamo vivere come sentinelle, affinché, anche se il Signore arriva in qualsiasi momento, siamo tra coloro che saranno rapiti. Chi conduce una vita senza sacrificio non aspetta il Signore. Ma per noi, la nostra felicità di figli di Dio è la nostra speranza in Gesù Cristo, di cui lo Spirito Santo è il garante.|I figli di Dio devono lavorare, e con ardore, per non dipendere da nessuno — per non dover annacquare il vangelo a causa di ciò che riceviamo dall'uno o dall'altro. Il cristiano pigro non dev'essere cacciato dalla comunità, ma messo da parte per dargli una lezione, affinché capisca che dovrebbe lavorare. Questo non significa che si debba applicare lo stesso trattamento ad altre colpe, perché ci sono peccati che richiedono un trattamento diverso; ma per un caso di pigrizia, no.|16 'Il Signore della pace vi dia egli stesso la pace in ogni tempo e in ogni maniera! Il Signore sia con tutti voi!'|17 'Il saluto è di mia propria mano, di me, Paolo; questo è il segno in ogni mia epistola; scrivo così.'|18 'La grazia del nostro Signore Gesù Cristo sia con tutti voi! Amen.'" }
  },
  {
    id:"l-apparence-du-chretien-les-parures", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-09", auteur:"Gaël, le frère",
    titre:{ fr:"L’apparence du chrétien : les parures",
           en:"The Christian's appearance: adornments",
           it:"L'apparenza del cristiano: gli ornamenti" },
    verset:{ fr:"" },
    extrait:{ fr:"Genèse35",
             en:"Rings, necklaces and jewellery through the Scriptures — symbols of foreign gods, of authority, of covenant. The real issue is not the jewel but what it represents in our hearts: the true adornment is the hidden person of the heart.",
             it:"Anelli, collane e gioielli attraverso le Scritture — simboli di dèi stranieri, di autorità, di alleanza. Il vero problema non è il gioiello ma ciò che rappresenta nel nostro cuore: il vero ornamento è l'uomo nascosto del cuore." },
    contenu:{ fr:"Genèse35|Jacob doit purifier sa famille avant d’aller à Bethel, c’est pourquoi le peuple d’Israël se débarrasse de tout ce qu’ils portaient y compris les anneaux sur leurs oreilles.|Pouvons-nous conclure de ce verset que les anneaux sont des dieux étrangers ?? il faudrait d’autres qui le soutiennent pour conclure|Dans genèse 24 :21-31, 45-47 l’anneau est mis au nez de Rebecca comme signe d’alliance (retenons déjà que la famille de Rebecca est une famille païenne, donc Abraham ordonna cela à son serviteur pour se faire à la culture de ce peuple-là)|Exode 2 :1-2 c’est grâce aux anneaux que les israélites portaient qu’ils ont pu se fabriquer le veau d’or, les anneaux dans ce cas sont donc symbole de faux dieu et aussi un piège, une séduction pour tomber dans l’idolâtrie|Genèse 41 :39-42 le collier est symbole du statut social et l’anneau symbole de l’autorité tout comme dans Esther 3 :10-12, 8 :1-2 et Daniel 6 :17-18|D’où viennent ces parures en réalité ??|Ezéchiel 16 :1-19 c’est le Seigneur Lui-même qui a fait ces choses afin de distinguer Israël, elle qui était abandonnée à elle-même la risée de tous ; or elle les a utilisées pour se prostituer ;|La bague au doigt du fils prodige dans Luc 15 :20-22 est symbole d’alliance.|Nous voyons donc l’anneau dans l’ancienne alliance comme symbole des dieux étrangers, d’autorité et d’alliance aussi ; maintenant qu’en est-il de nous dans la nouvelle alliance ??|Jacques 2 :1-5 Bien que les statuts sociaux soient différents dans l’Eglise primitive ce n’étaient pas remarquable parce que chacun essayait d’être le plus modeste possible pour que les frères ne se sentent pas mal à l’aise.|Si l’on est convaincu de la sainteté d’un bijou, d’un anneau on peut le mettre sans que ce ne soit un problème devant le Seigneur, il faudrait que ce soit à un certain niveau de sainteté. Le problème en réalité n’est pas le bijou mais ce qu’il symbolise dans nos esprits, le piège profond est ce que ça représente dans nos cœurs. Le réel problème n’est point d’ordre physique  c’est pourquoi les apôtres Pierre et Paul par le Saint-Esprit disent que la parure n’est point ce qu’on le voit mais ce qui est caché à l’intérieur de soi ; ce que l’on devrait regarder dans le miroir ce n’est pas si le rouge à lèvre est bien mis , si le fond de teint correspond, s’il n’est pas trop dosé ou encore si les boucles sont bien assorties( déjà que les boucles d’oreilles symbolisent l’esclave, et les piercings sont considérés comme des incisions de la peau interdites par le Seigneur) ce qu’on devrait regarder c’est si dans nos cœur y’a de la jalousie, l’envie, la colère , le manque de tolérance…|1 Thimothée 2 :9-10, 1 Pierre3 :3-6|L’habillement de la femme chrétienne c’est un vêtement décent non selon le dictionnaire mais selon la parole de Dieu, elle doit se vêtir avec pudeur et modeste. Sa parure doit être sa douceur, son manque de jalousie, de haine de colère etc.|Ce qui lui plait et ce à quoi elle tient c’est plaire au Seigneur, elle veille sur son caractère afin de paraitre plus belle aux yeux du Seigneur ; lorsqu’une femme regarde plus à son apparence alors il y’a un problème à son cœur, non pour dire que la femme chrétienne doit se négliger mais qu’il est plus important de prendre soin de l’intérieur que de l’extérieur car La grâce trompe, et la beauté s’évanouit ; [mais] la femme qui craint l'Eternel, sera celle qui sera louée.|Pour résumer les chrétiens PEUVENT porter les anneaux mais ne DOIVENT pas forcément le faire, ils doivent décider délibérément de le faire ou non. Un chrétien PEUT mettre un collier mais il n’est pas Obligé de le faire, c’est un choix libre et les instructions viennent du Seigneur.|Si donc nous sommes des enfants de Dieu nous devons être en même de se détacher de toutes choses, de se séparer de toutes choses qui ne plaise au Seigneur.|1Pierre1 : 15-21 ; Galates5 :13|Que le Seigneur nous bénisse !",
             en:"Genesis 35.|Jacob must purify his family before going up to Bethel; that is why the people of Israel got rid of everything they wore, including the rings in their ears.|Can we conclude from this verse that rings are foreign gods? Other passages would be needed to support such a conclusion.|In Genesis 24:21-31, 45-47, the ring is put on Rebekah's nose as a sign of covenant. (Note that Rebekah's family was a pagan family, so Abraham instructed his servant in this way to conform to the culture of that people.)|Exodus 32:1-2 — it was thanks to the rings the Israelites wore that they were able to make the golden calf; in this case the rings are therefore a symbol of a false god, and also a trap, a seduction leading into idolatry.|Genesis 41:39-42 — the necklace is a symbol of social status and the ring a symbol of authority, as also in Esther 3:10-12; 8:1-2 and Daniel 6:17-18.|Where do these adornments really come from?|Ezekiel 16:1-19 — it was the Lord Himself who made these things in order to distinguish Israel, she who had been abandoned to herself, the laughing-stock of all; yet she used them to prostitute herself.|The ring on the finger of the prodigal son in Luke 15:20-22 is a symbol of covenant.|So in the old covenant we see the ring as a symbol of foreign gods, of authority, and also of covenant; now what about us in the new covenant?|James 2:1-5 — although social statuses differed in the early Church, it was not noticeable, because each one tried to be as modest as possible so that the brethren would not feel uncomfortable.|If one is convinced of the holiness of a piece of jewellery, of a ring, one may wear it without it being a problem before the Lord — provided one is at a certain level of holiness. The real problem is not the jewel but what it symbolises in our minds; the deep trap is what it represents in our hearts. The real problem is not of a physical order; that is why the apostles Peter and Paul, by the Holy Spirit, say that adornment is not what is seen but what is hidden within. What we should look at in the mirror is not whether the lipstick is well applied, whether the foundation matches, whether it is overdone, or whether the earrings are well matched (earrings, moreover, symbolise the slave, and piercings are regarded as incisions of the skin forbidden by the Lord); what we should look at is whether in our hearts there is jealousy, envy, anger, lack of forbearance...|1 Timothy 2:9-10; 1 Peter 3:3-6.|The clothing of the Christian woman is decent dress — not according to the dictionary, but according to the word of God: she must dress with modesty and restraint. Her adornment must be her gentleness, her freedom from jealousy, hatred, anger, and so on.|What pleases her and what she holds to is pleasing the Lord; she watches over her character so as to appear more beautiful in the Lord's eyes. When a woman looks more to her appearance, there is a problem in her heart — not to say that the Christian woman should neglect herself, but that it is more important to care for the inside than the outside, for 'charm is deceitful and beauty is vain; but the woman who fears the LORD, she shall be praised.'|To sum up: Christians MAY wear rings, but they are not OBLIGED to; they must deliberately decide to do so or not. A Christian MAY wear a necklace, but is not obliged to; it is a free choice, and the instructions come from the Lord.|If then we are children of God, we must be able to detach ourselves from all things, to separate ourselves from everything that does not please the Lord.|1 Peter 1:15-21; Galatians 5:13.|May the Lord bless us!",
             it:"Genesi 35.|Giacobbe deve purificare la sua famiglia prima di salire a Betel; per questo il popolo d'Israele si sbarazza di tutto ciò che portava, compresi gli anelli alle orecchie.|Possiamo concludere da questo versetto che gli anelli sono dèi stranieri? Occorrerebbero altri passi a sostegno per concluderlo.|In Genesi 24:21-31, 45-47 l'anello è messo al naso di Rebecca come segno di alleanza. (Ricordiamo che la famiglia di Rebecca è una famiglia pagana; Abramo ordinò dunque così al suo servo per adattarsi alla cultura di quel popolo.)|Esodo 32:1-2 — è grazie agli anelli che gli israeliti portavano che poterono fabbricarsi il vitello d'oro; gli anelli in questo caso sono dunque simbolo di un falso dio e anche una trappola, una seduzione per cadere nell'idolatria.|Genesi 41:39-42 — la collana è simbolo dello stato sociale e l'anello simbolo dell'autorità, come anche in Ester 3:10-12; 8:1-2 e Daniele 6:17-18.|Da dove vengono in realtà questi ornamenti?|Ezechiele 16:1-19 — è il Signore stesso che ha fatto queste cose per distinguere Israele, lei che era abbandonata a se stessa, lo zimbello di tutti; ma lei le ha usate per prostituirsi.|L'anello al dito del figlio prodigo in Luca 15:20-22 è simbolo di alleanza.|Vediamo dunque l'anello nell'antica alleanza come simbolo di dèi stranieri, di autorità e anche di alleanza; e ora, che ne è di noi nella nuova alleanza?|Giacomo 2:1-5 — benché gli stati sociali fossero diversi nella Chiesa primitiva, ciò non si notava, perché ciascuno cercava di essere il più modesto possibile affinché i fratelli non si sentissero a disagio.|Se si è convinti della santità di un gioiello, di un anello, lo si può mettere senza che sia un problema davanti al Signore — purché si sia a un certo livello di santità. Il problema in realtà non è il gioiello ma ciò che simboleggia nella nostra mente; la trappola profonda è ciò che rappresenta nel nostro cuore. Il vero problema non è di ordine fisico; per questo gli apostoli Pietro e Paolo, per lo Spirito Santo, dicono che l'ornamento non è ciò che si vede ma ciò che è nascosto dentro di noi. Ciò che dovremmo guardare allo specchio non è se il rossetto è messo bene, se il fondotinta corrisponde, se non è troppo carico o se gli orecchini sono ben abbinati (gli orecchini, peraltro, simboleggiano lo schiavo, e i piercing sono considerati incisioni della pelle proibite dal Signore); ciò che dovremmo guardare è se nel nostro cuore c'è gelosia, invidia, collera, mancanza di tolleranza...|1 Timoteo 2:9-10; 1 Pietro 3:3-6.|L'abbigliamento della donna cristiana è un vestito decente — non secondo il dizionario, ma secondo la parola di Dio: deve vestirsi con pudore e modestia. Il suo ornamento dev'essere la sua dolcezza, la sua assenza di gelosia, di odio, di collera, ecc.|Ciò che le piace e a cui tiene è piacere al Signore; veglia sul proprio carattere per apparire più bella agli occhi del Signore. Quando una donna guarda più alla propria apparenza, c'è un problema nel suo cuore — non per dire che la donna cristiana debba trascurarsi, ma che è più importante curare l'interno che l'esterno, perché 'la grazia è ingannevole e la bellezza svanisce, ma la donna che teme l'Eterno è quella che sarà lodata.'|Per riassumere: i cristiani POSSONO portare anelli, ma non DEVONO necessariamente farlo; devono decidere deliberatamente di farlo o no. Un cristiano PUÒ mettere una collana, ma non è obbligato: è una scelta libera, e le istruzioni vengono dal Signore.|Se dunque siamo figli di Dio, dobbiamo essere in grado di distaccarci da ogni cosa, di separarci da tutto ciò che non piace al Signore.|1 Pietro 1:15-21; Galati 5:13.|Che il Signore ci benedica!" }
  },
  {
    id:"etude-biblique-jonas-1", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-08", auteur:"Gaël, le frère",
    titre:{ fr:"Etude biblique Jonas 1",
           en:"Bible study: Jonah 1",
           it:"Studio biblico: Giona 1" },
    verset:{ fr:"" },
    extrait:{ fr:"Jonas est un serviteur, un prophète de Dieu. La première question qu'on se poserait c'est pourquoi Dieu s'adresserait-Il à un peuple païen ?  Ce sont là les prémices de ce qu'avaient annoncé les…",
             en:"One cannot flee, one cannot hide from God. At every storm it is necessary to examine ourselves: are we dealing with a Jonah to be thrown out of our boat, or with Jesus to whom we must turn?",
             it:"Non si può fuggire, non ci si può nascondere da Dio. A ogni tempesta è necessario esaminarsi: abbiamo a che fare con un Giona di cui liberare la nostra barca, o con Gesù verso cui volgerci?" },
    contenu:{ fr:"Jonas est un serviteur, un prophète de Dieu. La première question qu'on se poserait c'est pourquoi Dieu s'adresserait-Il à un peuple païen ?  Ce sont là les prémices de ce qu'avaient annoncé les prophètes que Dieu se tournerait vers ceux qui le ne connaissent pas. Des exemples sont Ruth et la veuve de Sarepta, elles ne connaissaient pas le Seigneur et pourtant elles ont eu part à la grâce.|1 rois 17 :8-10 les méthodes du Seigneur sont différentes des nôtres, il nous revient d'être sensible à Sa voie. Cette visite du Seigneur au moment où on tend vers la fin, la mort c'est la grâce.|Une chose importante à savoir qu'on ne peut fuir, on ne peut se cacher de Dieu jeremie23 :22-24 ; parfois les choses vont mal dans nos vies parce que nous essayons d'échapper à Dieu ; nous avons reçu des instructions claires mais nous cherchons des voies de contournement. Tenons-nous tranquille tout ce qu'on fait c'est nous perdre du temps à nous même parce qu'importe le moment il faudra obéir pour que la tempête cesse. Il est nécessaire de s'auto évaluer à chaque tempête pour voir si nous avons à faire à un Jonas dont il faut se débarrasser dans notre barque ou à Jésus vers qui il faut se tourner.|Parfois on élimine certaines choses qui ne sont pas en réalité la cause de notre tempête, et la vraie raison sommeille tranquillement au fond de nous parce que nous ne voulons pas regarder à lui.  Comme Jonas l'a fait, il est important de s'affirmer aux premiers contacts, de dire exactement qui somme et que c'est une position qui ne changera point. La vraie repentance comme celle je Jonas amène les autres à louer Dieu.",
             en:"Jonah is a servant, a prophet of God. The first question we might ask is: why would God address a pagan people? These are the first fruits of what the prophets had announced — that God would turn to those who did not know Him. Examples are Ruth and the widow of Zarephath: they did not know the Lord, and yet they had a share in grace.|1 Kings 17:8-10 — the Lord's methods are different from ours; it is for us to be sensitive to His way. This visit of the Lord at the moment when one is nearing the end, nearing death — that is grace.|One important thing to know: one cannot flee, one cannot hide from God (Jeremiah 23:22-24). Sometimes things go wrong in our lives because we are trying to escape from God; we have received clear instructions, but we look for ways around them. Let us keep still — all we are doing is wasting our own time, because sooner or later we will have to obey for the storm to cease. It is necessary to examine ourselves at every storm, to see whether we are dealing with a Jonah we must get rid of in our boat, or with Jesus to whom we must turn.|Sometimes we eliminate certain things that are not in reality the cause of our storm, while the true reason lies quietly deep within us, because we do not want to look at it. As Jonah did, it is important to declare ourselves from the first contact — to say exactly who we are, and that this position will not change. True repentance, like Jonah's, leads others to praise God.",
             it:"Giona è un servitore, un profeta di Dio. La prima domanda che ci si porrebbe è: perché Dio si rivolgerebbe a un popolo pagano? Sono le primizie di ciò che i profeti avevano annunciato: che Dio si sarebbe rivolto a coloro che non lo conoscono. Esempi ne sono Rut e la vedova di Sarepta: non conoscevano il Signore, eppure hanno avuto parte alla grazia.|1 Re 17:8-10 — i metodi del Signore sono diversi dai nostri; sta a noi essere sensibili alla sua via. Questa visita del Signore nel momento in cui si va verso la fine, verso la morte — questa è la grazia.|Una cosa importante da sapere: non si può fuggire, non ci si può nascondere da Dio (Geremia 23:22-24). A volte le cose vanno male nelle nostre vite perché cerchiamo di sfuggire a Dio; abbiamo ricevuto istruzioni chiare, ma cerchiamo vie di aggiramento. Stiamo tranquilli: tutto ciò che facciamo è far perdere tempo a noi stessi, perché in qualunque momento bisognerà ubbidire perché la tempesta cessi. È necessario autoesaminarsi a ogni tempesta, per vedere se abbiamo a che fare con un Giona di cui sbarazzarci nella nostra barca o con Gesù verso cui volgerci.|A volte eliminiamo certe cose che in realtà non sono la causa della nostra tempesta, mentre la vera ragione dorme tranquilla nel fondo di noi, perché non vogliamo guardarla. Come ha fatto Giona, è importante affermarsi fin dai primi contatti, dire esattamente chi siamo e che è una posizione che non cambierà. Il vero ravvedimento, come quello di Giona, porta gli altri a lodare Dio." }
  },
  {
    id:"exhortation-sur-le-saf-292", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-07", auteur:"Gaël, le frère",
    titre:{ fr:"Exhortation sur le SAF 292",
           en:"Exhortation on hymn 292 (SAF)",
           it:"Esortazione sul cantico 292 (SAF)" },
    verset:{ fr:"" },
    extrait:{ fr:"La plupart du temps nous exécutons des cantiques, sans toutefois le vivre réellement, sans comprendre la profondeur de celui-ci. Maintenant quand nous disons au Seigneur de tout prendre Lui…",
             en:"When we tell the Lord to take everything, have we really given Him everything? Every time we worry and doubt, we show that we have not truly believed.",
             it:"Quando diciamo al Signore di prendere tutto, gli abbiamo davvero dato tutto? Ogni volta che ci inquietiamo e dubitiamo, dimostriamo di non aver creduto veramente." },
    contenu:{ fr:"La plupart du temps nous exécutons des cantiques, sans toutefois le vivre réellement, sans comprendre la profondeur de celui-ci. Maintenant quand nous disons au Seigneur de tout prendre Lui avons-nous vraiment tout donné ?? Nous disons de notre bouche que notre être lui appartient mais nous avons les mêmes inquiétudes que ceux du monde. Sachons bien aimés que chaque fois que nous nous inquiétons, que nous doutons nous démontrons que nous n'avons pas réellement cru, que nous ne savons pas vraiment en qui nous avons cru. Rapprochons-nous encore le Seigneur pour tout Lui mais vraiment tout car ces choses pour lesquelles nous nous inquiétons Il les donne aux animaux et aux plantes à combien plus forte raison nous ses enfants ? Puissions-nous être ce Paul qui malgré ls prières non exaucées et les difficultés s'est contenté de la grâce du Seigneur et pouvait dire de son expérience \" je puis tout par celui qui me fortifie\" (Philippiens 3) ; puissions-nous être comme Daniel et ses compagnons et croire non parce que nous avons vu le Seigneur agir mais parce que nous savons qu'il va agir parce que nous avons un Dieu Puissant. Soyons Job qui malgré toute la difficulté pouvait dire \"Je sais que mon Rédempteur est vivant et qu'il se lèvera le dernier sur la terre\".  Puissions-nous réellement tout donner au Seigneur.",
             en:"Most of the time we perform hymns without really living them, without grasping their depth. Now, when we tell the Lord to take everything — have we really given Him everything? We say with our mouths that our whole being belongs to Him, yet we carry the same anxieties as the people of the world. Let us know, beloved, that every time we worry, every time we doubt, we show that we have not truly believed, that we do not really know in whom we have believed. Let us draw near to the Lord again, to give Him everything — truly everything — for the things we worry about, He gives even to the animals and the plants; how much more to us, His children? May we be like Paul who, despite unanswered prayers and difficulties, was content with the grace of the Lord and could say from experience, 'I can do all things through Him who strengthens me' (Philippians). May we be like Daniel and his companions, and believe not because we have seen the Lord act, but because we know He will act — because we have a mighty God. Let us be like Job who, in the midst of all his trouble, could say: 'I know that my Redeemer lives, and that He shall stand at last on the earth.' May we truly give everything to the Lord.",
             it:"La maggior parte del tempo eseguiamo dei cantici senza però viverli realmente, senza comprenderne la profondità. Ora, quando diciamo al Signore di prendere tutto — gli abbiamo davvero dato tutto? Diciamo con la bocca che il nostro essere gli appartiene, ma abbiamo le stesse inquietudini di quelli del mondo. Sappiamo, amati, che ogni volta che ci inquietiamo, che dubitiamo, dimostriamo di non aver creduto realmente, di non sapere veramente in chi abbiamo creduto. Avviciniamoci di nuovo al Signore per dargli tutto — ma veramente tutto — perché le cose per cui ci preoccupiamo egli le dona agli animali e alle piante: quanto più a noi, suoi figli? Possiamo essere come Paolo che, malgrado le preghiere non esaudite e le difficoltà, si è accontentato della grazia del Signore e poteva dire per esperienza: 'Io posso ogni cosa in colui che mi fortifica' (Filippesi); possiamo essere come Daniele e i suoi compagni, e credere non perché abbiamo visto il Signore agire, ma perché sappiamo che agirà — perché abbiamo un Dio potente. Siamo come Giobbe che, in mezzo a tutta la difficoltà, poteva dire: 'Io so che il mio Redentore vive e che si leverà per ultimo sulla terra.' Possiamo davvero dare tutto al Signore." }
  },
  {
    id:"etude-biblique-jonas-3", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-06", auteur:"Gaël, le frère",
    titre:{ fr:"Etude biblique : Jonas 3",
           en:"Bible study: Jonah 3",
           it:"Studio biblico: Giona 3" },
    verset:{ fr:"" },
    extrait:{ fr:"Chaque serviteur du Seigneur traine avec lui un fardeau selon la parole que le Seigneur lui a adressée, et ce message influence sur sa vie et sa façon de se comporter au quotidien. Le roi de…",
             en:"The king of Nineveh hears the message, strips himself, and humbles himself. Every time we receive a message of repentance we must examine our throne and our robe — what we hide behind so that the gospel cannot reach us.",
             it:"Il re di Ninive ascolta il messaggio, si spoglia e si umilia. Ogni volta che riceviamo un messaggio di ravvedimento dobbiamo esaminare il nostro trono e il nostro mantello — ciò dietro cui ci nascondiamo perché il vangelo non ci raggiunga." },
    contenu:{ fr:"Chaque serviteur du Seigneur traine avec lui un fardeau selon la parole que le Seigneur lui a adressée, et ce message influence sur sa vie et sa façon de se comporter au quotidien. Le roi de Ninive écoute le message de l'évangile se dépouille, se rabaisse, et s'humilie à l'image du Seigneur Jésus qui abandonné sa grandeur, sa divinité et encore plus il est venu dans une famille pauvre.|Les aspects de notre vie sur lesquels nous sommes assis sont notre trône et notre manteau. Chaque fois que nous recevons un message de repentance nous devons examiner notre trône et notre manteau c’est-à-dire ce derrière quoi nous nous cachons pour que l'évangile n'ait pas accès à nous pour qui nous empêche d'écouter le message. Quand ont revêtu de manteau et bien assis sur le trône on considère le message de repentance comme étant dirigé aux autres pas à nous.|Le roi montre l'exemple avant de faire publier… le roi de Ninive est ce que le sage appelle un Roi sage ecclésiaste4 :13-14 parce qu’il sait écouter les avis. Non pas une sagesse selon le monde mais selon Dieu à savoir Christ ; proverbes 8 la sagesse est une personne et elle s'appelle Jésus Christ. Le roi de Ninive invite son peuple à la repentance et compte sur la grâce du Seigneur : \"qui sait si Dieu ne reviendra pas, et ne se repentira pas ; …\". Parfois certains s'en moquent. C’est pourquoi celui qui est conscient du sacrifice du Seigneur est doublement coupable de ses fautes parce que là il méprise la grâce du Seigneur. \"|\"si vous savez ces choses, vous êtes heureux pourvu que vous les pratiquiez\". Nous devons être prêts à descendre de notre trône car la grâce du Seigneur n'est pas une chose avec laquelle il faut plaisanter.|Tite 2 :11-13 : c'est la grâce elle-même qui nous sauve c'est pourquoi cet esprit de la grâce n’est pas répandu pour rien, elle est un jugement pour ceux qui la méprisent. Il faudrait interroger la grâce pour savoir ce qu'elle nous enseigne. Si on la considère on comme un fardeau alors là il faut s'interroger. Certains de nos problèmes nous les cherchons de nous-même pour la seule raison que nous avons encore trop le monde dans nos vies, on n'est pas pleinement avec le Seigneur. On verra certains dont la vie spirituelle se résume en combat le Seigneur ne leur parle ni de leur vie ni de celle des autres. Pourquoi ?? Nous devons mener une vie raisonnable juste et fidèle dans l'attente du Seigneur.|Nous pouvons nous présenter devant le Seigneur en étant pure même avec nos fautes comment ? En ne cachant rien au Seigneur, si nous venons au Seigneur comme le peuple de Ninive nous recevrons le pardon.|Prions afin que la grâce du seigneur dans nos vies ne se limite pas seulement à nos lèvres, pour que nous puissions descendre de nos trônes et retirer nos manteaux, que nous puissions vraiment tout déposer aux pieds du Seigneur car rien ne Lui est caché. Quand nous pensons nous cacher du Seigneur nous nous trompons nous même.|Soyons bénis en Jésus Christ.",
             en:"Every servant of the Lord carries with him a burden according to the word the Lord has addressed to him, and that message influences his life and his daily conduct. The king of Nineveh hears the message of the gospel, strips himself, lowers himself and humbles himself — in the image of the Lord Jesus, who abandoned His greatness, His divinity, and more still, came into a poor family.|The aspects of our life on which we sit are our throne and our robe. Every time we receive a message of repentance, we must examine our throne and our robe — that is, what we hide behind so that the gospel cannot reach us, what prevents us from hearing the message. When we are clothed in our robe and well seated on our throne, we regard the message of repentance as addressed to others, not to us.|The king sets the example before making the proclamation... The king of Nineveh is what the wise man calls a wise king (Ecclesiastes 4:13-14), because he knows how to listen to counsel — not a wisdom according to the world, but according to God, namely Christ; in Proverbs 8, wisdom is a person, and His name is Jesus Christ. The king of Nineveh calls his people to repentance and counts on the Lord's grace: 'Who knows whether God will not turn and relent...' Some mock at this. That is why the one who is aware of the Lord's sacrifice is doubly guilty of his faults, for he is despising the Lord's grace.|'If you know these things, blessed are you if you do them.' We must be ready to come down from our throne, for the grace of the Lord is not something to be trifled with.|Titus 2:11-13: it is grace itself that saves us; that is why this spirit of grace is not poured out for nothing — it is a judgment for those who despise it. We should question grace, to know what it teaches us. If we regard it as a burden, then we must question ourselves. Some of our problems we bring on ourselves, for the sole reason that we still have too much of the world in our lives — we are not fully with the Lord. You will see some whose spiritual life is reduced to fighting; the Lord speaks to them neither about their life nor about that of others. Why? We must lead a sensible, righteous and faithful life while waiting for the Lord.|We can present ourselves before the Lord pure, even with our faults. How? By hiding nothing from the Lord; if we come to the Lord like the people of Nineveh, we shall receive forgiveness.|Let us pray that the grace of the Lord in our lives may not be limited to our lips — that we may come down from our thrones and take off our robes, that we may truly lay everything at the Lord's feet, for nothing is hidden from Him. When we think we are hiding from the Lord, we are deceiving ourselves.|Be blessed in Jesus Christ.",
             it:"Ogni servitore del Signore porta con sé un fardello secondo la parola che il Signore gli ha rivolto, e quel messaggio influenza la sua vita e il suo comportamento quotidiano. Il re di Ninive ascolta il messaggio del vangelo, si spoglia, si abbassa e si umilia — a immagine del Signore Gesù, che ha abbandonato la sua grandezza, la sua divinità, e ancor più è venuto in una famiglia povera.|Gli aspetti della nostra vita su cui sediamo sono il nostro trono e il nostro mantello. Ogni volta che riceviamo un messaggio di ravvedimento dobbiamo esaminare il nostro trono e il nostro mantello, cioè ciò dietro cui ci nascondiamo perché il vangelo non abbia accesso a noi, ciò che ci impedisce di ascoltare il messaggio. Quando siamo rivestiti del mantello e ben seduti sul trono, consideriamo il messaggio di ravvedimento come rivolto agli altri, non a noi.|Il re dà l'esempio prima di far proclamare... Il re di Ninive è ciò che il saggio chiama un re saggio (Ecclesiaste 4:13-14), perché sa ascoltare i consigli — non una sapienza secondo il mondo, ma secondo Dio, cioè Cristo; in Proverbi 8 la sapienza è una persona e si chiama Gesù Cristo. Il re di Ninive invita il suo popolo al ravvedimento e conta sulla grazia del Signore: 'Chi sa che Dio non si volga e non si penta...' A volte alcuni se ne fanno beffe. Per questo chi è consapevole del sacrificio del Signore è doppiamente colpevole delle sue colpe, perché disprezza la grazia del Signore.|'Se sapete queste cose, siete beati se le fate.' Dobbiamo essere pronti a scendere dal nostro trono, perché la grazia del Signore non è una cosa con cui scherzare.|Tito 2:11-13: è la grazia stessa che ci salva; per questo questo spirito di grazia non è sparso per nulla — è un giudizio per coloro che la disprezzano. Bisognerebbe interrogare la grazia per sapere che cosa ci insegna. Se la consideriamo un fardello, allora dobbiamo interrogarci. Alcuni dei nostri problemi ce li cerchiamo da soli, per la sola ragione che abbiamo ancora troppo mondo nelle nostre vite — non siamo pienamente con il Signore. Si vedranno alcuni la cui vita spirituale si riduce al combattimento; il Signore non parla loro né della loro vita né di quella degli altri. Perché? Dobbiamo condurre una vita saggia, giusta e fedele nell'attesa del Signore.|Possiamo presentarci davanti al Signore puri anche con le nostre colpe. Come? Non nascondendo nulla al Signore; se veniamo al Signore come il popolo di Ninive, riceveremo il perdono.|Preghiamo affinché la grazia del Signore nelle nostre vite non si limiti alle nostre labbra — affinché possiamo scendere dai nostri troni e togliere i nostri mantelli, e possiamo davvero deporre tutto ai piedi del Signore, perché nulla gli è nascosto. Quando pensiamo di nasconderci dal Signore, inganniamo noi stessi.|Siate benedetti in Gesù Cristo." }
  },
  {
    id:"question-le-role-de-simon-de-cyrene-sur-le-chemin-du-calvair", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-05", auteur:"Gaël, le frère",
    titre:{ fr:"Question : le rôle de Simon de Cyrène sur le chemin du calvaire.pourquoi demande-t-on a un homme qui plus est inconnu de porter la croix du Seigneur. !? le Seigneur avait-il besoin qu'on l'aide a porter nos fautes !?ou alors c'etait une prophetie pour quiconque suivrait le Seigneur devrait souffrir aussi !?",
           en:"Question: the role of Simon of Cyrene on the way to Calvary — why was an unknown man asked to carry the Lord's cross? Did the Lord need help carrying our faults, or was it a prophecy that whoever follows the Lord must also suffer?",
           it:"Domanda: il ruolo di Simone di Cirene sulla via del Calvario — perché si chiede a un uomo sconosciuto di portare la croce del Signore? Il Signore aveva bisogno di aiuto per portare le nostre colpe, o era una profezia che chiunque segue il Signore dovrà anche soffrire?" },
    verset:{ fr:"" },
    extrait:{ fr:"Marc 15 :22-24, Luc23 :26 ; Matthieu27 :32, ce qui faut déjà remarquer et qui est très important c'est que Simon n'a pas volontairement aidé Jésus à porter la croix on l'y a forcé. Le Seigneur…",
             en:"Simon did not help voluntarily: he was compelled. The Christian does not suffer under compulsion; like Christ, he gives himself willingly, and this consecration bears the fruit of sanctification.",
             it:"Simone non ha aiutato volontariamente: vi è stato costretto. Il cristiano non soffre per costrizione; come Cristo, dona se stesso volentieri, e questa consacrazione porta come frutto la santificazione." },
    contenu:{ fr:"Marc 15 :22-24, Luc23 :26 ; Matthieu27 :32, ce qui faut déjà remarquer et qui est très important c'est que Simon n'a pas volontairement aidé Jésus à porter la croix on l'y a forcé. Le Seigneur n'avait pas besoin|d'aide en fait parce qu'il a tout accompli en sa souffrance ; donc s'il faut même parler de prophétie on verrait là à l'intérieur ces faux pasteurs et prophètes qui chargent les gens de croix qu'ils n'ont jamais demandé c'est pourquoi ils souffrent avec contrainte, ils portent la croix mais malgré eux ; or le chrétien souffre avec joie , il sait qu'il ne peut y échapper dès qu'il a accepté Christ c'est la voie à suivre mais il se réjouit de ses souffrances  parce qu'il le fait avec amour, le chrétien ne souffre pas par contrainte au contraire comme Christ il fait un don volontiers de soi, et cette consécration a pour fruit la sanctification.  Ceux qui amènent poussent les gens à les contraintes sont des taches pour le corps de Christ comme c'est décrit en Jude v 11-13.|Notre souffrance est celle guidée par l'amour.|Colossiens 1 :19-28 ; 1 corinthiens3 :5-9 nous ne pouvons aider Christ pour le salut néanmoins il est nécessaire que certaines personnes accomplissent les souffrances de Christ pour la croissance et la maturité du corps de Christ.",
             en:"Mark 15:22-24; Luke 23:26; Matthew 27:32. The first thing to notice, and it is very important, is that Simon did not voluntarily help Jesus carry the cross — he was compelled to. In fact the Lord did not need help, for He accomplished everything in His suffering. So if we must speak of prophecy, we would rather see in it those false pastors and prophets who load people with crosses they never asked for — which is why those people suffer under compulsion: they carry the cross, but in spite of themselves. The Christian, on the contrary, suffers with joy; he knows he cannot escape it once he has accepted Christ — it is the way to follow — but he rejoices in his sufferings because he does it with love. The Christian does not suffer under compulsion; on the contrary, like Christ, he makes a willing gift of himself, and this consecration bears the fruit of sanctification. Those who drive people by compulsion are blemishes on the body of Christ, as described in Jude vv. 11-13.|Our suffering is suffering guided by love.|Colossians 1:19-28; 1 Corinthians 3:5-9 — we cannot help Christ with regard to salvation; nevertheless it is necessary that some fill up the sufferings of Christ for the growth and maturity of the body of Christ.",
             it:"Marco 15:22-24; Luca 23:26; Matteo 27:32. La prima cosa da notare, ed è molto importante, è che Simone non ha aiutato volontariamente Gesù a portare la croce: vi è stato costretto. In realtà il Signore non aveva bisogno di aiuto, perché ha compiuto tutto nella sua sofferenza. Se dunque si deve parlare di profezia, vi si vedrebbero piuttosto quei falsi pastori e profeti che caricano le persone di croci che non hanno mai chiesto — ecco perché quelle persone soffrono per costrizione: portano la croce, ma loro malgrado. Il cristiano, al contrario, soffre con gioia; sa di non potervi sfuggire dal momento che ha accettato Cristo — è la via da seguire — ma si rallegra delle sue sofferenze perché lo fa con amore. Il cristiano non soffre per costrizione; al contrario, come Cristo, fa un dono volontario di sé, e questa consacrazione ha per frutto la santificazione. Coloro che spingono le persone con la costrizione sono macchie per il corpo di Cristo, come è descritto in Giuda vv. 11-13.|La nostra sofferenza è quella guidata dall'amore.|Colossesi 1:19-28; 1 Corinzi 3:5-9 — non possiamo aiutare Cristo per la salvezza; tuttavia è necessario che alcune persone compiano le sofferenze di Cristo per la crescita e la maturità del corpo di Cristo." }
  },
  {
    id:"etude-biblique-jonas-2", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-04", auteur:"Gaël, le frère",
    titre:{ fr:"Etude biblique : Jonas 2",
           en:"Bible study: Jonah 2",
           it:"Studio biblico: Giona 2" },
    verset:{ fr:"" },
    extrait:{ fr:"Comme dans le jardin d'Eden il n'est pas donné la nature du poisson comme l'arbre de la connaissance du bien et du mal ; c'est à tort de penser qu'il s'agissait d'une baleine ou d'un dauphin, on…",
             en:"From the depths Jonah recognises that salvation is of the LORD. Jesus is salvation — and whatever wonders someone performs, if his spirit does not confess that Jesus came in the flesh, that spirit is not of God.",
             it:"Dagli abissi Giona riconosce che la salvezza appartiene all'Eterno. Gesù è la salvezza — e qualunque prodigio uno compia, se il suo spirito non riconosce che Gesù è venuto in carne, quello spirito non è da Dio." },
    contenu:{ fr:"Comme dans le jardin d'Eden il n'est pas donné la nature du poisson comme l'arbre de la connaissance du bien et du mal ; c'est à tort de penser qu'il s'agissait d'une baleine ou d'un dauphin, on sait juste que c'était un gros poisson.|Le mot abime est utilisé dans ce contexte comme dans plusieurs autres textes pour symboliser la fosse, et aussi le séjour des morts : Job26 :6 ; romains10 :6-7 ; Job33:14-18 sont des exemples. Lorsque Dieu parle c'est parce qu'Il veut sauver Son peuple du séjour des morts car ce qui y a ne lui appartient pas. Jonas reconnait de par la mort d'où il a été tiré que le salut est de l'Eternel en d'autres mots c'est le Seigneur qui sauve.|2 corinthiens3 : 11-18, Jésus est le salut ; lorsqu’en Romains l'apôtre Paul déclare que le salut vient des juifs c'est tout simplement parce que Jésus est juif.|Si je ne crois pas que Christ est le salut alors nous n'avons pas le salut tout simplement. Si je reconnais Jésus est le Seigneur et que je dise qu'il n'est pas Dieu, le Père ça veut dire que je reconnaîtrais que j'ai deux seigneurs et dans ce cas je suis totalement dans l'erreur.|Jean8 : 21-24 ; Jean17 :1-3 nous avons besoin pour saisir les mystères du Seigneur ; c'est la révélation qui donne la vie et c'est Dieu qui la donne Psaumes119 :130. Tant qu'on n'a pas de révélation on reste dans les ténèbres.|1 JEAN 4 :1-3|Peu importe ce que l'on est en même de réaliser, peu importe les prodiges qu'on fait, si notre esprit ne reconnait pas que Jésus s'est fait homme alors cet esprit n'est pas de Dieu.  Deuteronome13 :1-5 ; 1 Pierre 2 :6-8. Le peuple de Dieu est choisi prédestiné tout comme ceux qui se perdent. C’est pourquoi il est important bien aimés de ne pas se fier directement à qqn parce qu'il fait des prodiges il faut sonder pour savoir par quel esprit il agit. Nous devons faire confiance à ceux qui prêchent la vérité ; le Seigneur nous avertis afin que soient sauvées nos âmes, il nous revient d'être prudents.",
             en:"As in the garden of Eden, where the nature of the tree of the knowledge of good and evil is not given, the nature of the fish is not given either; it is wrong to assume it was a whale or a dolphin — we only know it was a great fish.|The word 'abyss' is used in this context, as in several other texts, to symbolise the pit, and also the abode of the dead: Job 26:6, Romans 10:6-7 and Job 33:14-18 are examples. When God speaks, it is because He wants to save His people from the abode of the dead, for what is there does not belong to it. Jonah recognises, from the death out of which he was drawn, that salvation is of the LORD — in other words, it is the Lord who saves.|2 Corinthians 3:11-18 — Jesus is salvation; when in Romans the apostle Paul declares that salvation comes from the Jews, it is simply because Jesus is a Jew.|If I do not believe that Christ is salvation, then quite simply we do not have salvation. If I acknowledge Jesus as Lord and yet say He is not God, the Father, it means I would be acknowledging that I have two lords — and in that case I am completely in error.|John 8:21-24; John 17:1-3 — we need revelation to grasp the mysteries of the Lord; it is revelation that gives life, and it is God who gives it (Psalm 119:130). As long as we have no revelation, we remain in darkness.|1 JOHN 4:1-3.|Whatever someone is able to accomplish, whatever wonders he performs, if his spirit does not confess that Jesus became man, then that spirit is not of God (Deuteronomy 13:1-5; 1 Peter 2:6-8). The people of God are chosen and predestined, as are those who perish. That is why it is important, beloved, not to trust someone straightaway because he performs wonders; we must test, to know by what spirit he acts. We must trust those who preach the truth; the Lord warns us so that our souls may be saved — it is for us to be prudent.",
             it:"Come nel giardino di Eden non è indicata la natura dell'albero della conoscenza del bene e del male, così non è indicata la natura del pesce; è sbagliato pensare che si trattasse di una balena o di un delfino — sappiamo solo che era un grande pesce.|La parola 'abisso' è usata in questo contesto, come in molti altri testi, per simboleggiare la fossa, e anche il soggiorno dei morti: Giobbe 26:6, Romani 10:6-7 e Giobbe 33:14-18 ne sono esempi. Quando Dio parla, è perché vuole salvare il suo popolo dal soggiorno dei morti, perché ciò che vi si trova non gli appartiene. Giona riconosce, dalla morte da cui è stato tratto, che la salvezza appartiene all'Eterno — in altre parole, è il Signore che salva.|2 Corinzi 3:11-18 — Gesù è la salvezza; quando in Romani l'apostolo Paolo dichiara che la salvezza viene dai giudei, è semplicemente perché Gesù è giudeo.|Se non credo che Cristo è la salvezza, allora semplicemente non abbiamo la salvezza. Se riconosco che Gesù è il Signore e dico che non è Dio, il Padre, vuol dire che riconoscerei di avere due signori — e in quel caso sono totalmente nell'errore.|Giovanni 8:21-24; Giovanni 17:1-3 — abbiamo bisogno della rivelazione per afferrare i misteri del Signore; è la rivelazione che dà la vita, ed è Dio che la dona (Salmo 119:130). Finché non abbiamo la rivelazione, restiamo nelle tenebre.|1 GIOVANNI 4:1-3.|Qualunque cosa uno sia in grado di realizzare, qualunque prodigio compia, se il suo spirito non riconosce che Gesù si è fatto uomo, allora quello spirito non è da Dio (Deuteronomio 13:1-5; 1 Pietro 2:6-8). Il popolo di Dio è scelto e predestinato, come pure coloro che si perdono. Per questo è importante, amati, non fidarsi subito di qualcuno perché compie prodigi: bisogna esaminare per sapere per quale spirito agisce. Dobbiamo fidarci di coloro che predicano la verità; il Signore ci avverte affinché siano salvate le nostre anime — sta a noi essere prudenti." }
  },
  {
    id:"q-le-lien-entre-les-vendeurs-chasses-du-temple-avec-l-eglise", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-03", auteur:"Gaël, le frère",
    titre:{ fr:"Q : le lien entre les vendeurs chasses du temple avec l'Église",
           en:"Question: the link between the merchants driven out of the temple and the Church",
           it:"Domanda: il legame tra i venditori cacciati dal tempio e la Chiesa" },
    verset:{ fr:"" },
    extrait:{ fr:"Esaie56 :1-6 ; Matthieu21 : 10-13. pour ce qui est de l'Eglise , c'est à dire le corps de Christ qui se réunit en communauté, elle a été transformée aujourd'hui en un lieu de trafique nous y…",
             en:"As in the temple of Jerusalem, the Lord will come and drive the traffickers out of His Church, and the Church of the Lord will become again what it was: a community where praise and holiness reign.",
             it:"Come nel tempio di Gerusalemme, il Signore verrà a cacciare i trafficanti dalla sua Chiesa, e la Chiesa del Signore tornerà a essere ciò che era: una comunità in cui regnano lode e santità." },
    contenu:{ fr:"Esaie56 :1-6 ; Matthieu21 : 10-13. pour ce qui est de l'Eglise , c'est à dire le corps de Christ qui se réunit en communauté, elle a été transformée aujourd'hui en un lieu de trafique nous y trouvons voleurs , prostituées , les pasteurs sont devenus de grands détourneurs de fonds; les gens remplissent les communautés pour y blanchir leur argent, et ça n'émeut personne, le scandale est à son comble dans l'Eglise, alors comme dans le temple de Jérusalem le Seigneur viendra chasser ces trafiquants de son Eglise, ils seront mis dehors tous ces faux et l'Eglise du  Seigneur redeviendra ce qu'elle était et qu'elle a cessé d'être. Une communauté au sein de laquelle règne louange et sainteté.|Que le Seigneur nous bénisse|LE FAUX :|On assiste aujourd'hui à une telle expansion du faux qu'on se demande même ce qui est vrai et le plus triste c'est que même les enfants du Seigneur s'y sont mis. Faux cheveux, faux cils, faux seins etc. les gens ne sont pas contents de la façon dont le Seigneur les a créées du coup on passe le temps à modifier, aujourd'hui l'ennemi nous a eu avec les téléphones et puis toutes sortes de filtres les oreilles de lapin, la langue de chiens etc. tout pour modifier notre réelle nature et à qui fait-on plaisir avec ça ? Satan. Et puis on se demande pourquoi ces choses, plaisent ? Pourquoi elles attirent ? Pourquoi une qui est naturelle et simple est moins convoitées de regards que celle qui s'est make-up… en italien le verbe utiliser est \"truccarsi\" c'est-à-dire se truquer, ou encore se fausser, se transformer en menteur mais c'est ce qui plait et pourquoi ? Parce qu'il y'a un esprit ou des esprits derrière et ce sont eux qui attirent en fait et une fois qu'ils vous ont eu on peut se débarrasser facilement, d'où la nécessité d'éviter cela quand on est enfant du Seigneur. Le père du mensonge c'est Satan pas Jésus, car aussi innocentes qu'elles semblent elles impactent sur notre relation avec le Seigneur.",
             en:"Isaiah 56:1-6; Matthew 21:10-13. As for the Church — that is, the body of Christ gathering in community — it has today been turned into a place of trafficking: we find in it thieves and prostitutes; pastors have become great embezzlers of funds; people fill the communities to launder their money there, and it moves no one. Scandal is at its height in the Church. So, as in the temple of Jerusalem, the Lord will come and drive these traffickers out of His Church; all these false ones will be thrown out, and the Church of the Lord will become again what it was and has ceased to be: a community in which praise and holiness reign.|May the Lord bless us.|THE FALSE:|We are witnessing today such an expansion of the false that we even wonder what is true — and the saddest thing is that even the children of the Lord have joined in. False hair, false eyelashes, false breasts, and so on: people are not content with the way the Lord created them, so they spend their time altering themselves. Today the enemy has caught us with telephones and all kinds of filters — rabbit ears, dog tongues and the rest — everything to alter our real nature. And whom do we please with all this? Satan. Then we wonder: why do these things please? Why do they attract? Why is a natural, simple woman less courted by glances than one who is made up? In Italian the verb used is 'truccarsi' — literally to fake oneself, to falsify oneself, to turn oneself into a lie. Yet that is what pleases — and why? Because there is a spirit, or spirits, behind it, and it is they who attract in fact; and once they have caught you, one is not so easily rid of them — hence the necessity of avoiding this when one is a child of the Lord. The father of lies is Satan, not Jesus; for however innocent these things may seem, they affect our relationship with the Lord.",
             it:"Isaia 56:1-6; Matteo 21:10-13. Quanto alla Chiesa — cioè il corpo di Cristo che si riunisce in comunità — essa è stata oggi trasformata in un luogo di traffici: vi troviamo ladri e prostitute; i pastori sono diventati grandi sottrattori di fondi; la gente riempie le comunità per riciclarvi il proprio denaro, e nessuno se ne commuove. Lo scandalo è al culmine nella Chiesa. Allora, come nel tempio di Gerusalemme, il Signore verrà a cacciare questi trafficanti dalla sua Chiesa; saranno messi fuori tutti questi falsi, e la Chiesa del Signore tornerà a essere ciò che era e che ha cessato di essere: una comunità in cui regnano lode e santità.|Che il Signore ci benedica.|IL FALSO:|Assistiamo oggi a una tale espansione del falso che ci si chiede perfino che cosa sia vero — e la cosa più triste è che anche i figli del Signore vi si sono messi. Capelli finti, ciglia finte, seni finti, ecc.: le persone non sono contente del modo in cui il Signore le ha create, e così passano il tempo a modificarsi. Oggi il nemico ci ha presi con i telefoni e ogni sorta di filtri — le orecchie da coniglio, la lingua da cane e il resto — tutto per modificare la nostra vera natura. E a chi si fa piacere con questo? A Satana. Poi ci si chiede: perché queste cose piacciono? Perché attirano? Perché una donna naturale e semplice è meno corteggiata dagli sguardi di quella che si è truccata? In italiano il verbo usato è 'truccarsi', cioè falsificarsi, trasformarsi in menzogna. Eppure è ciò che piace — e perché? Perché c'è uno spirito, o degli spiriti, dietro, e sono loro che in realtà attirano; e una volta che vi hanno preso, non ci si libera facilmente — da qui la necessità di evitare tutto questo quando si è figli del Signore. Il padre della menzogna è Satana, non Gesù; perché per quanto innocenti sembrino, queste cose incidono sulla nostra relazione con il Signore." }
  },
  {
    id:"etude-biblique-jonas-4", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-02", auteur:"Gaël, le frère",
    titre:{ fr:"Etude biblique : Jonas 4",
           en:"Bible study: Jonah 4",
           it:"Studio biblico: Giona 4" },
    verset:{ fr:"" },
    extrait:{ fr:"Prophétiser veut dire parler au nom de Dieu, par conséquent ce qui est dit dans la prophétie ne dois pas forcément s'accomplir.  La prophétie a plusieurs qui sont étayé dans 1 corinthiens14 parmi…",
             en:"A prophet is not recognised by the fulfilment of what he says, but by the fact that he confronts us with sin. And Jonah, an antitype of Christ, teaches us why Christ died: because men are precious in the Lord's eyes.",
             it:"Il profeta non si riconosce dal compimento di ciò che dice, ma dal fatto che ci mette di fronte al peccato. E Giona, antitipo di Cristo, ci insegna perché Cristo è morto: perché gli uomini hanno valore agli occhi del Signore." },
    contenu:{ fr:"Prophétiser veut dire parler au nom de Dieu, par conséquent ce qui est dit dans la prophétie ne dois pas forcément s'accomplir.  La prophétie a plusieurs qui sont étayé dans 1 corinthiens14 parmi lesquels exposer ce qui est caché dans le cœur des hommes. Ce chapitre pose un problème celui de l'accomplissement de la prophétie, et parfois confrontés à ça les prophètes ne réalisent pas que la prière peut impacter sur l'accomplissement de la prophétie et donc des fois ils disent une chose et se comportent en Jonas c'est-à-dire se tenir quelque part et attendre que ce qu'on a dit se réalise en oubliant l'effet de la prière.|Le point saillant de la prophétie est la dénonciation du péché : le prophète a le ministère de la dénonciation du péché. Jérémie 23 :9-26. On ne reconnait pas un prophète par le fait que ce qu'il dit s'accomplit mais par le fait qu'il nous met fasse au péché, si qqn se dit prophète et qu'il ne met pas ceux qui le suivent face à leurs péchés alors il faut se questionner.|Jonas annonce l'Évangile à un peuple qui ne connaissait pas Dieu après sa \"résurrection\" (la mort dans le ventre du poisson cf. cantique de Jonas chap2) ça c'est une préparation à ce qui va se passer plus tard avec le Christ à savoir l'annonce de l'évangile aux gentils après la résurrection du seigneur : le salut par la grâce. ¨et on comprend donc le fait que Pierre ait reçu la clef de la part du Seigneur parce que c'est pierre qui va ouvrir la porte des églises à Jérusalem en actes, en Samarie en actes 5 et enfin chez les gentils à travers Corneille en actes 8.|Jonas se présente comme un antitype de Christ dans le sens où il se préoccupe plus d'une plante pour laquelle il n'a même pas souffert que des hommes et le Seigneur enseigne donc par cela qu’IL a de la peine pour les humais parce qu'Il a souffert pour eux c’est pourquoi Il tient à eux. Il démontre par-là l'œuvre du salut ce pourquoi Christ est parce que les hommes ont de la valeur aux yeux du Seigneur. Christ est mort parce que nous sommes chers à ses yeux.",
