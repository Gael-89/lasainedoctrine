  {
    id:"c-est-quoi-le-bapteme-de-feu-et-qui-en-sera-baptise", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-27", auteur:"Gaël, le frère",
    titre:{ fr:"C'est quoi le baptême de feu et qui en sera baptise ???",
           en:"What is the baptism of fire, and who will be baptised with it?",
           it:"Che cos'è il battesimo di fuoco, e chi ne sarà battezzato?" },
    verset:{ fr:"" },
    extrait:{ fr:"Matthieu3 : 4-12 le baptême est pour ceux qui ne feront pas partie de la récolte c’est-à-dire la paille qui sera brûlée",
             en:"The baptism of fire is in no way a promise for the children of the Lord: it is for the chaff that will be burned — all those who will not be part of the Lord's people.",
             it:"Il battesimo di fuoco non è affatto una promessa per i figli del Signore: è per la pula che sarà bruciata — tutti coloro che non faranno parte del popolo del Signore." },
    contenu:{ fr:"Matthieu3 : 4-12 le baptême est pour ceux qui ne feront pas partie de la récolte c’est-à-dire la paille qui sera brûlée|Marc 1 :7-8, Luc3 :15-17 on voit très bien que le baptême de feu n'est nullement une promesse pour les enfants du Seigneur, c'est le Saint-Esprit qui fait de nous des témoins de Christ, il est totalement erroné de penser qu’après le baptême dans l'Esprit il y ait un autre baptême. Nous avons été scellés par l'Esprit Saint pour le jour de la rédemption, le Saint-Esprit est le gage de notre salut en Jésus-Christ. Et doc seront baptisés de feu que tous ceux qui n'auront pas ce gage-là, tous ceux qui ne feront pas partie du peuple du Seigneur.",
             en:"Matthew 3:4-12 — this baptism is for those who will not be part of the harvest, that is, the chaff that will be burned.|Mark 1:7-8; Luke 3:15-17 — we see very clearly that the baptism of fire is in no way a promise for the children of the Lord; it is the Holy Spirit who makes us witnesses of Christ, and it is completely mistaken to think that after the baptism in the Spirit there is another baptism. We have been sealed by the Holy Spirit for the day of redemption; the Holy Spirit is the pledge of our salvation in Jesus Christ. Those who will be baptised with fire are therefore all those who will not have that pledge — all those who will not be part of the Lord's people.",
             it:"Matteo 3:4-12 — questo battesimo è per coloro che non faranno parte del raccolto, cioè la pula che sarà bruciata.|Marco 1:7-8; Luca 3:15-17 — si vede molto bene che il battesimo di fuoco non è affatto una promessa per i figli del Signore; è lo Spirito Santo che fa di noi dei testimoni di Cristo, ed è totalmente errato pensare che dopo il battesimo nello Spirito ci sia un altro battesimo. Siamo stati sigillati dallo Spirito Santo per il giorno della redenzione; lo Spirito Santo è la caparra della nostra salvezza in Gesù Cristo. Saranno dunque battezzati di fuoco tutti coloro che non avranno quella caparra — tutti coloro che non faranno parte del popolo del Signore." }
  },
  {
    id:"pourquoi-jehovah-n-est-pas-le-nom-de-dieu", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-26", auteur:"Gaël, le frère",
    titre:{ fr:"Pourquoi Jéhovah n'est pas le nom de Dieu ??",
           en:"Why 'Jehovah' is not the name of God",
           it:"Perché «Geova» non è il nome di Dio" },
    verset:{ fr:"" },
    extrait:{ fr:"Quand Dieu se présente à Moise il lui donne le tétragramme YHWH \"je suis celui qui suis\".",
             en:"From the tetragrammaton YHWH to Yahweh, then Yehowah and finally Jehovah: the history of a transformation — and why God has made us witnesses of Jesus Christ.",
             it:"Dal tetragramma YHWH a Yahweh, poi Yehowah e infine Geova: la storia di una trasformazione — e perché Dio ci ha resi testimoni di Gesù Cristo." },
    contenu:{ fr:"Quand Dieu se présente à Moise il lui donne le tétragramme YHWH \"je suis celui qui suis\".|Et lorsque la loi est donnée au peule le Seigneur dit \" tu ne prononceras point le nom de l'Eternel ton Dieu en vain.\"  Et donc pour éviter d'être sous le jugement de ce commandement les juifs vont multiplier les noms de Dieu, et d'autres pour faire malin vont y introduire des voyelles pour que prononcer le nom modifié fasse moins grave. La transformation à la base était pour que les noms juifs puissent facilement prononcer et nous avons le YAHWEH, ensuite au fil des traductions il s'est transformé en YEHOWAH et enfin JEHOVAH.|Or le JEHOVAH des témoins est carrément une imposture car ils rejettent la Seigneurie de Jésus et ils renient le Seigneur Jésus. La preuve est que le tétragramme YHWH n'est pas utilisé dans le nouveau testament il est par Seigneur or ils utilisent Jéhovah dans leur NT, leur Dieu n'est donc pas YAHWEH ils le démontrent même au travers de leurs pratiques doctrinales, en ne prenant par exemple pas la cène rejetant ainsi la chair et le sang.|Esaïe 43 :1-11|Dieu nous a fait témoin de Jésus-Christ non de Jehova ni de YAHWEH|Et dans ce livre d'Esaïe 43 il est question du peuple d'Israël non pas des actuels \"témoins de Jéhovah\".",
             en:"When God presents Himself to Moses, He gives him the tetragrammaton YHWH: 'I AM WHO I AM.'|And when the law is given to the people, the Lord says: 'You shall not take the name of the LORD your God in vain.' So, to avoid falling under the judgment of that commandment, the Jews multiplied the names of God; and others, thinking themselves clever, inserted vowels so that pronouncing the modified name would seem less serious. The transformation was originally so that the name could be pronounced easily, and we got YAHWEH; then, over the course of translations, it became YEHOWAH and finally JEHOVAH.|Now the 'Jehovah' of the Witnesses is an outright imposture, for they reject the Lordship of Jesus and deny the Lord Jesus. The proof is that the tetragrammaton YHWH is not used in the New Testament — it is rendered by 'Lord' — yet they use 'Jehovah' in their New Testament. Their God is therefore not YAHWEH, and they show it even through their doctrinal practices, for example by not taking the Lord's Supper, thereby rejecting the flesh and the blood.|Isaiah 43:1-11.|God has made us witnesses of Jesus Christ — not of Jehovah, nor of YAHWEH.|And in this chapter, Isaiah 43, it is the people of Israel who are in view, not today's 'Jehovah's Witnesses'.",
             it:"Quando Dio si presenta a Mosè, gli dà il tetragramma YHWH: 'Io sono colui che sono.'|E quando la legge è data al popolo, il Signore dice: 'Non pronuncerai invano il nome dell'Eterno, il tuo Dio.' Così, per evitare di cadere sotto il giudizio di quel comandamento, i giudei moltiplicarono i nomi di Dio; e altri, per fare i furbi, vi introdussero delle vocali affinché pronunciare il nome modificato sembrasse meno grave. La trasformazione in origine serviva a rendere il nome facilmente pronunciabile, e abbiamo avuto YAHWEH; poi, nel corso delle traduzioni, si è trasformato in YEHOWAH e infine in GEOVA.|Ora, il 'Geova' dei Testimoni è una vera e propria impostura, perché essi rifiutano la Signoria di Gesù e rinnegano il Signore Gesù. La prova è che il tetragramma YHWH non è usato nel Nuovo Testamento — è reso con 'Signore' — mentre loro usano 'Geova' nel loro Nuovo Testamento. Il loro Dio non è dunque YAHWEH, e lo dimostrano anche attraverso le loro pratiche dottrinali, per esempio non prendendo la cena, rigettando così la carne e il sangue.|Isaia 43:1-11.|Dio ci ha resi testimoni di Gesù Cristo — non di Geova né di YAHWEH.|E in questo capitolo di Isaia 43 si parla del popolo d'Israele, non degli attuali 'testimoni di Geova'." }
  },
  {
    id:"quelle-est-l-attitude-a-adopter-aux-faux-enseignants-rejeter", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-25", auteur:"Gaël, le frère",
    titre:{ fr:"Quelle est l'attitude à adopter aux faux enseignants : rejeter completement tout ou alors ecouter et faire le tri ??",
           en:"What attitude should we adopt towards false teachers: reject everything completely, or listen and sort?",
           it:"Quale atteggiamento adottare verso i falsi insegnanti: rigettare completamente tutto, o ascoltare e vagliare?" },
    verset:{ fr:"" },
    extrait:{ fr:"Disons de prime abord qu'un vrai serviteur ne peut jamais devenir faux et vice versa pour la simple raison que le blé bien que grandissant avec l'ivraie ne peut se transformer en ivraie et…",
             en:"A true servant can never become false, and vice versa — but a true servant can be mistaken. Test everything; hold fast what is good. Our capacity to judge depends on our maturity in the faith.",
             it:"Un vero servitore non può mai diventare falso, e viceversa — ma un vero servitore può sbagliarsi. Esaminate ogni cosa; ritenete il bene. La nostra capacità di giudicare dipende dalla nostra maturità nella fede." },
    contenu:{ fr:"Disons de prime abord qu'un vrai serviteur ne peut jamais devenir faux et vice versa pour la simple raison que le blé bien que grandissant avec l'ivraie ne peut se transformer en ivraie et inversement. Cependant il peut arriver qu'un vrai serviteur du Seigneur se trompe. On n'identifie donc pas un serviteur de Dieu par le péché mais par le discernement par l'esprit.|1rois11 : 1-8 Salomon a fait exactement ce qu’avait interdit en deut7 :1-4 mais cela n'a pas empêché qu'il soit un vrai serviteur du Seigneur et qu'il soit avec ses pères.|Dans les assemblées il y'a des vrais et des faux ; un exemple dans la parole est dans Marc 6 :7-9, Judas a été envoyé avec les autres pour prêcher la parole mais cela n'a pas enlever le fait qu'il était un fils de la perdition car il était destiné à cela, i.e. à se perdre. Si qqn n'est pas mort avec Christ à la croix peu importe ce qu'il dit ou fait il n'est pas de l'Eglise, tout comme dans le livre de genèse, lorsque le Seigneur a voulu former Eve, il a endormi Adam et donc une partie d'Eve ne dérive pas d'Adam dans son sommeil (Christ à la croix) alors cette partie n'est pas d’Eve (L'Eglise). Être présent dans une assemblée ne fait pas de nous des membres de l'Eglise de Jésus-Christ.|Ceci pour arriver au fait qu'il faudrait être doté de discernement pour dire que qqn est un faux ou un vrai parce que beaucoup se déguisent, et donc pour ne pas se tromper il faut éviter de se prononcer spontanément, faire un jugement sur qqn en se basant sur ses erreurs.|Pour ce qui est l'enseignement on devrait juste l'écouter avec les yeux fermés et passer au peigne fin chaque chose afin de retenir ce qui bon. 1 Thessaloniciens5 :21.|Notre capacité à juger dépend de notre niveau de maturité dans la foi, il faudrait qu'on soit devenu des hommes spirituels pour pouvoir juger de quoique ce soit. Il faudrait avoir atteint une certaine maturité sur le plan spirituelle Hébreux 5 :8-14, 6 :1-2 et donc il ne se suffit pas de se dire mature dans la foi il faudrait avoir la maitrise des fondements dans la vie en Christ cités dans ces textes et si on ne les maitrise pas encore alors on reste des bébés peu importe le nombre d'années ou encore la fonction que tu exerces, c'est la maitrise de ces bases qui évitent de se perdre de se faire confondre entre vérité et mensonge.  Colossiens3 :1-4, Nous ne pouvons pas nous dire mature dans la foi et être encore attachés aux choses de la terre, avoir du mal à mourir à renoncer à nous-même ; c'est un impératif s'affectionner aux choses du ciel parce que le reste est déjà notre en Christ par qui nous avons toutes sortes de bénédictions et des bénédictions spirituelles qui sont plus importantes que toutes. Éphésiens1 :3-6|Que le seigneur nous bénisse abondamment !",
             en:"Let us say first of all that a true servant can never become false, and vice versa, for the simple reason that wheat, though growing with the tares, cannot turn into tares, nor the reverse. However, it can happen that a true servant of the Lord is mistaken. A servant of God is therefore not identified by sin, but by discernment through the Spirit.|1 Kings 11:1-8 — Solomon did exactly what had been forbidden in Deuteronomy 7:1-4, but that did not prevent him from being a true servant of the Lord and resting with his fathers.|In the assemblies there are true and false. An example in the word is Mark 6:7-9: Judas was sent with the others to preach the word, but that did not change the fact that he was a son of perdition, for he was destined for that — to be lost. If someone did not die with Christ at the cross, whatever he says or does, he is not of the Church — just as in the book of Genesis, when the Lord wished to form Eve, He put Adam to sleep: whatever does not derive from Adam in his sleep (Christ at the cross) is not of Eve (the Church). Being present in an assembly does not make us members of the Church of Jesus Christ.|All this to say that discernment is required to declare someone true or false, because many disguise themselves; so, in order not to be mistaken, we must avoid pronouncing spontaneously, or judging someone on the basis of his errors.|As for teaching, we should simply listen to it 'with our eyes closed' and comb through everything carefully, in order to retain what is good (1 Thessalonians 5:21).|Our capacity to judge depends on our level of maturity in the faith: we must have become spiritual men to be able to judge anything. A certain spiritual maturity is required (Hebrews 5:8-14; 6:1-2); it is not enough to call oneself mature in the faith — one must have mastered the foundations of the life in Christ listed in these texts. If we have not yet mastered them, we remain babes, whatever the number of our years or the function we hold; it is the mastery of these foundations that keeps us from being lost, from confusing truth and lie. Colossians 3:1-4 — we cannot call ourselves mature in the faith while still attached to the things of the earth, struggling to die and to renounce ourselves; it is imperative to set our affection on the things above, for the rest is already ours in Christ, through whom we have every kind of blessing — and spiritual blessings, which matter more than all (Ephesians 1:3-6).|May the Lord bless us abundantly!",
             it:"Diciamo anzitutto che un vero servitore non può mai diventare falso, e viceversa, per la semplice ragione che il grano, pur crescendo con la zizzania, non può trasformarsi in zizzania, né il contrario. Tuttavia può accadere che un vero servitore del Signore si sbagli. Un servitore di Dio non si identifica dunque dal peccato, ma dal discernimento per mezzo dello Spirito.|1 Re 11:1-8 — Salomone fece esattamente ciò che era stato proibito in Deuteronomio 7:1-4, ma ciò non gli ha impedito di essere un vero servitore del Signore e di riposare con i suoi padri.|Nelle assemblee ci sono veri e falsi. Un esempio nella parola è Marco 6:7-9: Giuda fu mandato con gli altri a predicare la parola, ma ciò non ha tolto il fatto che fosse un figlio della perdizione, perché a questo era destinato — a perdersi. Se qualcuno non è morto con Cristo alla croce, qualunque cosa dica o faccia, non è della Chiesa — come nel libro della Genesi: quando il Signore volle formare Eva, addormentò Adamo; ciò che non deriva da Adamo nel suo sonno (Cristo alla croce) non è di Eva (la Chiesa). Essere presenti in un'assemblea non fa di noi membri della Chiesa di Gesù Cristo.|Tutto questo per arrivare al fatto che occorre essere dotati di discernimento per dire che qualcuno è falso o vero, perché molti si travestono; dunque, per non sbagliarsi, bisogna evitare di pronunciarsi spontaneamente, di giudicare qualcuno basandosi sui suoi errori.|Quanto all'insegnamento, dovremmo semplicemente ascoltarlo 'a occhi chiusi' e passare al setaccio ogni cosa, per ritenere ciò che è buono (1 Tessalonicesi 5:21).|La nostra capacità di giudicare dipende dal nostro livello di maturità nella fede: bisogna essere diventati uomini spirituali per poter giudicare qualsiasi cosa. Occorre aver raggiunto una certa maturità sul piano spirituale (Ebrei 5:8-14; 6:1-2); non basta dirsi maturi nella fede — bisogna padroneggiare i fondamenti della vita in Cristo citati in questi testi. Se non li padroneggiamo ancora, restiamo dei bambini, qualunque sia il numero degli anni o la funzione che esercitiamo; è la padronanza di queste basi che evita di perdersi, di confondere verità e menzogna. Colossesi 3:1-4 — non possiamo dirci maturi nella fede ed essere ancora attaccati alle cose della terra, fare fatica a morire e a rinunciare a noi stessi; è un imperativo affezionarsi alle cose del cielo, perché il resto è già nostro in Cristo, per mezzo del quale abbiamo ogni sorta di benedizioni — e le benedizioni spirituali, che sono più importanti di tutte (Efesini 1:3-6).|Che il Signore ci benedica abbondantemente!" }
  },
  {
    id:"la-divinite-de-jesus-christ", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-24", auteur:"Gaël, le frère",
    titre:{ fr:"La divinite de jesus-Christ",
           en:"The deity of Jesus Christ",
           it:"La divinità di Gesù Cristo" },
    verset:{ fr:"" },
    extrait:{ fr:"Esaïe 9 :5-6, Zacharie11 :9-13 l’Eternel qui a parlé à Esaïe et à Zacharie est Jésus-Christ. Nous voyons en Math27 :1-8 l’accomplissement de la prophétie de Zacharie.",
             en:"The LORD who spoke to Isaiah and Zechariah is Jesus Christ; understanding that Christ is God is a mystery. And an appendix: what it means to seek God with all one's heart.",
             it:"L'Eterno che ha parlato a Isaia e a Zaccaria è Gesù Cristo; comprendere che Cristo è Dio è un mistero. E in appendice: che cosa significa cercare Dio con tutto il cuore." },
    contenu:{ fr:"Esaïe 9 :5-6, Zacharie11 :9-13 l’Eternel qui a parlé à Esaïe et à Zacharie est Jésus-Christ. Nous voyons en Math27 :1-8 l’accomplissement de la prophétie de Zacharie.|Esaïe 35 :4-10 c'est l'Eternel Lui-même qui accorde la rançon.|Esaïe44 :6 ; Apocalypse1 :16-17. C’est de la séduction que de croire que les différentes révélations de Dieu sont des personnes différentes.|Comprendre que Christ est Dieu est un mystère 1 Timothée 3 :16|CHERCHER DIEU|Jérémie 29 :13-14. Il faut souligner qu'il y'a une différence entre chercher Dieu et chercher Dieu de tout son cœur et c'est en cherchant Dieu de tout son cœur qu'on en arrive à le trouver et ça ne se limite pas à une simple routine quotidienne de se lever le matin et consacrer 5 minutes de prière ou de méditation ça va bien au-delà.|1samuel 22 :1-3 il faut donc savoir que :|On ne cherche pas Dieu à la légère, c'est une lutte dont on connait juste le début mais pas la fin.  Dans ce contexte David est à la fuite de Saül et on voit et il est déterminé à chercher la face du Seigneur jusqu'à ce qu'il ait compris ce que Dieu attend de lui, ceci comportant une séparation de sa famille. Chercher Dieu est un chemin de non-retour, et si on s'arrête en chemin on ne pourra pas manger les fruits de notre travail|Luc 9 : 59-61 il faut chercher Dieu sans regrets ni peur. Si on est trop attaché à son apparence, son passé, ses parents, au pouvoir etc. il serait mieux de ne pas dire qu'on cherche Dieu. Chercher Dieu c’et s'engager à marcher dans le désert en sachant qu'on peut manquer eau et nourriture mais Dieu est là. Peur et regrets sont les points de départ de l'échec.|La recherche du Seigneur se fait dans le RETRAIT. David est allé dans la caverne loin des hommes, le Seigneur Jésus lui-même s'écartait pour prier, Moise s'est retiré dans la montagne pour recevoir les lois du Seigneur. Il faut se séparer, se retirer, s'écarter de toutes distractions pour mieux écouter Dieu.|Il faut se débarrasser de tout ce qui est de l'ennemi, en genèse 35 Jacob sanctifie sa famille parce qu'ils doivent rencontrer le Seigneur. On ne peut chercher la face du Seigneur sans sanctification car le péché est ce qui crée la séparation d'avec le Seigneur.|On cherche le Seigneur dans la prière (accompagnée de méditation), le jeûne et la manifestation de l'amour de Dieu. Sans amour il est impossible de chercher le Seigneur. Derrière la prière et la méditation se cachent l'obéissance et le des engagements qu'on prend avec le Seigneur, toute la vie d'Abraham était basée sur l'obéissance au Seigneur.  Le texte de 1 Jean4 nous permet de comprendre l'importance de la manifestation de l’amour car plus important que le jeûne et la prière, car l'amour est la preuve même de ce qu'on cherche le Seigneur véritablement. Esaïe 58 nous montre les raisons de l'inefficacité du jeûne. L’état de notre cœur peut être un piège dans notre recherche du Seigneur c'est pourquoi l'examen de soi est important.|Toutes ces conditions sont indispensables lorsque nous cherchons véritablement le Seigneur, il faudrait donc les considérer avec la plus grande importance.|Que le Seigneur vous bénisse et vous garde et à Samedi si le Seigneur le permet.|Shalom !!",
             en:"Isaiah 9:5-6; Zechariah 11:9-13 — the LORD who spoke to Isaiah and to Zechariah is Jesus Christ. In Matthew 27:1-8 we see the fulfilment of Zechariah's prophecy.|Isaiah 35:4-10 — it is the LORD Himself who provides the ransom.|Isaiah 44:6; Revelation 1:16-17. It is seduction to believe that the different revelations of God are different persons.|Understanding that Christ is God is a mystery — 1 Timothy 3:16.|SEEKING GOD.|Jeremiah 29:13-14. It must be stressed that there is a difference between seeking God and seeking God with all one's heart; it is by seeking God with all one's heart that one comes to find Him — and that is not limited to a simple daily routine of getting up in the morning and devoting five minutes to prayer or meditation; it goes far beyond.|1 Samuel 22:1-3 — we must therefore know:|God is not sought lightly; it is a struggle of which we know only the beginning, not the end. In this context David is fleeing from Saul, and we see him determined to seek the face of the Lord until he has understood what God expects of him — which involved separation from his family. Seeking God is a road of no return; and if we stop along the way, we shall not eat the fruit of our labour.|Luke 9:59-62 — God must be sought without regrets and without fear. If we are too attached to our appearance, our past, our parents, to power and so on, it would be better not to say we are seeking God. To seek God is to commit ourselves to walking in the desert, knowing that water and food may run short — but God is there. Fear and regrets are the starting points of failure.|The search for the Lord takes place in WITHDRAWAL. David went into the cave, far from men; the Lord Jesus Himself withdrew to pray; Moses withdrew to the mountain to receive the laws of the Lord. We must separate ourselves, withdraw, step away from all distractions in order to hear God better.|We must rid ourselves of everything that belongs to the enemy: in Genesis 35, Jacob sanctifies his family because they are to meet the Lord. One cannot seek the face of the Lord without sanctification, for sin is what creates separation from the Lord.|The Lord is sought in prayer (accompanied by meditation), in fasting, and in the manifestation of the love of God. Without love it is impossible to seek the Lord. Behind prayer and meditation lie obedience and the commitments we make with the Lord; the whole of Abraham's life was based on obedience to the Lord. The text of 1 John 4 helps us understand the importance of manifesting love, more important even than fasting and prayer, for love is the very proof that we are truly seeking the Lord. Isaiah 58 shows us the reasons why fasting can be ineffective. The state of our heart can be a trap in our search for the Lord; that is why self-examination is important.|All these conditions are indispensable when we truly seek the Lord; they must therefore be given the greatest importance.|May the Lord bless you and keep you — and until Saturday, if the Lord permits.|Shalom!",
             it:"Isaia 9:5-6; Zaccaria 11:9-13 — l'Eterno che ha parlato a Isaia e a Zaccaria è Gesù Cristo. In Matteo 27:1-8 vediamo il compimento della profezia di Zaccaria.|Isaia 35:4-10 — è l'Eterno stesso che provvede il riscatto.|Isaia 44:6; Apocalisse 1:16-17. È seduzione credere che le diverse rivelazioni di Dio siano persone diverse.|Comprendere che Cristo è Dio è un mistero — 1 Timoteo 3:16.|CERCARE DIO.|Geremia 29:13-14. Bisogna sottolineare che c'è differenza tra cercare Dio e cercare Dio con tutto il cuore; è cercando Dio con tutto il cuore che si arriva a trovarlo — e questo non si limita a una semplice routine quotidiana di alzarsi al mattino e dedicare cinque minuti alla preghiera o alla meditazione: va ben oltre.|1 Samuele 22:1-3 — bisogna dunque sapere:|Dio non si cerca alla leggera; è una lotta di cui si conosce solo l'inizio ma non la fine. In questo contesto Davide è in fuga da Saul, e lo vediamo determinato a cercare il volto del Signore finché non abbia capito che cosa Dio si aspetta da lui — il che comportava una separazione dalla sua famiglia. Cercare Dio è un cammino senza ritorno; e se ci si ferma per strada, non si potranno mangiare i frutti del proprio lavoro.|Luca 9:59-62 — bisogna cercare Dio senza rimpianti né paura. Se si è troppo attaccati alla propria apparenza, al proprio passato, ai propri genitori, al potere ecc., sarebbe meglio non dire che si cerca Dio. Cercare Dio è impegnarsi a camminare nel deserto sapendo che possono mancare acqua e cibo — ma Dio è là. Paura e rimpianti sono i punti di partenza del fallimento.|La ricerca del Signore si fa nel RITIRO. Davide è andato nella caverna, lontano dagli uomini; il Signore Gesù stesso si appartava per pregare; Mosè si è ritirato sul monte per ricevere le leggi del Signore. Bisogna separarsi, ritirarsi, allontanarsi da ogni distrazione per ascoltare meglio Dio.|Bisogna sbarazzarsi di tutto ciò che è del nemico: in Genesi 35 Giacobbe santifica la sua famiglia perché devono incontrare il Signore. Non si può cercare il volto del Signore senza santificazione, perché il peccato è ciò che crea la separazione dal Signore.|Il Signore si cerca nella preghiera (accompagnata dalla meditazione), nel digiuno e nella manifestazione dell'amore di Dio. Senza amore è impossibile cercare il Signore. Dietro la preghiera e la meditazione si nascondono l'ubbidienza e gli impegni che si prendono con il Signore; tutta la vita di Abramo era basata sull'ubbidienza al Signore. Il testo di 1 Giovanni 4 ci permette di comprendere l'importanza della manifestazione dell'amore, più importante ancora del digiuno e della preghiera, perché l'amore è la prova stessa che si cerca veramente il Signore. Isaia 58 ci mostra le ragioni dell'inefficacia del digiuno. Lo stato del nostro cuore può essere una trappola nella nostra ricerca del Signore; per questo l'esame di sé è importante.|Tutte queste condizioni sono indispensabili quando cerchiamo veramente il Signore; bisogna dunque considerarle con la massima importanza.|Che il Signore vi benedica e vi custodisca — e a sabato, se il Signore lo permette.|Shalom!" }
  },
  {
    id:"le-mariage-et-les-alliances", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-23", auteur:"Gaël, le frère",
    titre:{ fr:"Le mariage et les alliances",
           en:"Marriage and covenants",
           it:"Il matrimonio e le alleanze" },
    verset:{ fr:"" },
    extrait:{ fr:"Genèse2 : 18-24 lorsque Dieu fait l'homme masculin, Il a prévu que celui-ci aurait besoin d'une aide à lui semblable, c'est pourquoi l'homme s'attache à une seule personne dans sa vie et celle-ci…",
             en:"Husband and wife are one spiritual entity — which is why the choice of a spouse cannot be made at random. Every alliance either helps us or turns us away from the Lord.",
             it:"Marito e moglie sono un'unica entità spirituale — per questo la scelta del coniuge non può essere fatta a caso. Ogni alleanza o ci è di aiuto o ci allontana dal Signore." },
    contenu:{ fr:"Genèse2 : 18-24 lorsque Dieu fait l'homme masculin, Il a prévu que celui-ci aurait besoin d'une aide à lui semblable, c'est pourquoi l'homme s'attache à une seule personne dans sa vie et celle-ci est sa femme et grâce à cette attachement les deux deviennent une seule chair, c'est donc pour cela que pour affecter l'un il suffit de s'attaquer à l’autre. Un exemple dans actes 9 :3-4, en réalité Saul persécutait l'Eglise mais le Seigneur lui demanda \" pourquoi me persécutes-tu ?'' , ceci explique donc  le pourquoi de la souffrance des chrétien car Christ étant l'époux Satan persécute son épouse pour l'affecter ; le mari et la femme sont donc une entité spirituelle. Sachant que par les liens du mariage on est attaché à une personne au point de générer un autre être, le choix du conjoint ne peut et ne doit être fait de façon hasardeuse, ceci explique pourquoi le Seigneur interdit d'aller vers les étrangères. Tel Abraham en genèse 24 envoya son serviteur dans sa maison chercher une épouse à son fils, ainsi le chrétien doit avoir son conjoint dans l'assemblée des saints car l'étranger est un piège pour nous, comme ce fut le cas pour Salomon.|Esdras 10 :6-19 l'alliance par le mariage est très sacrée, c'est pourquoi la mauvaise personne pourrait nous amener à se détourner de Dieu.|2Chroniques18 :1-2 Josaphat était exposé parce que lié à Achab par le mariage, 2 rois8 :25-27 la conduite du roi ici est déterminer les liens de mariage, ceci pour terminer qu'on peut-être bien disposé mais être lié à la mauvaise personne nous rend vulnérable.|Une autre alliance importante est celle de l'amitié un enfant de Dieu ne peut avoir pour ami intime un païen, car celui-ci devient une porte d'entrée de l'ennemi dans sa vie, si le chrétien peut être utilisé de Satan combien de fois le païen ?  \" les mauvaises compagnies corrompent la bonne mœurs dit l'apôtre Paul.|D’autres alliances sont souvent conçues dans le spirituel et invitent les esprits chez nous, celles-ci généralement prob=viennent des assemblées (genre le \"pasteur a plus d'influence dans la vie du troupeau que Dieu lui-même) c’est pourquoi le Seigneur dit d'en sortir car il n'y a rien de commun entre la lumière et les ténèbres.|Il est donc judicieux de demander l'avais du Seigneur avant de se lier avec qui que ce soit car les alliances soient elles nous sont d'une aide soit elles détournent du Seigneur.",
             en:"Genesis 2:18-24 — when God made man male, He foresaw that man would need a helper suited to him; that is why a man cleaves to one person in his life, his wife, and through this attachment the two become one flesh. This is why, to strike one, it is enough to attack the other. An example is in Acts 9:3-4: in reality Saul was persecuting the Church, but the Lord asked him, 'Why do you persecute ME?' This explains the suffering of Christians: Christ being the bridegroom, Satan persecutes His bride in order to strike Him. Husband and wife are therefore one spiritual entity. Knowing that by the bonds of marriage we are joined to a person to the point of generating another being, the choice of a spouse cannot and must not be made at random; this explains why the Lord forbids going to foreign women. As Abraham in Genesis 24 sent his servant to his own kindred to find a wife for his son, so the Christian must find his spouse in the assembly of the saints, for the stranger is a snare for us — as was the case for Solomon.|Ezra 10:6-19 — the covenant of marriage is very sacred; that is why the wrong person can lead us to turn away from God.|2 Chronicles 18:1-2 — Jehoshaphat was exposed because he was bound to Ahab by marriage; 2 Kings 8:25-27 — the conduct of the king here is determined by marriage ties. All this to conclude: one may be well disposed, yet being bound to the wrong person makes us vulnerable.|Another important alliance is friendship: a child of God cannot have a pagan as an intimate friend, for such a friend becomes a door of entry for the enemy into his life — if even the Christian can be used by Satan, how much more the pagan? 'Bad company corrupts good morals,' says the apostle Paul.|Other alliances are often formed in the spiritual realm and invite spirits into our homes; these generally come from the assemblies (of the kind where the 'pastor' has more influence over the flock's life than God Himself). That is why the Lord says to come out of them, for there is nothing in common between light and darkness.|It is therefore wise to ask the Lord's counsel before binding ourselves to anyone, for alliances either are a help to us or turn us away from the Lord.",
             it:"Genesi 2:18-24 — quando Dio fa l'uomo maschio, prevede che questi avrà bisogno di un aiuto simile a lui; per questo l'uomo si unisce a una sola persona nella sua vita, sua moglie, e grazie a questo legame i due diventano una sola carne. È per questo che, per colpire l'uno, basta attaccare l'altro. Un esempio è in Atti 9:3-4: in realtà Saulo perseguitava la Chiesa, ma il Signore gli chiese: 'Perché MI perseguiti?' Questo spiega la sofferenza dei cristiani: essendo Cristo lo sposo, Satana perseguita la sua sposa per colpirlo. Marito e moglie sono dunque un'unica entità spirituale. Sapendo che con i vincoli del matrimonio ci si lega a una persona al punto di generare un altro essere, la scelta del coniuge non può e non deve essere fatta a caso; questo spiega perché il Signore proibisce di andare verso le straniere. Come Abramo, in Genesi 24, mandò il suo servo nella propria parentela a cercare una moglie per suo figlio, così il cristiano deve trovare il coniuge nell'assemblea dei santi, perché lo straniero è una trappola per noi — come lo fu per Salomone.|Esdra 10:6-19 — l'alleanza del matrimonio è molto sacra; per questo la persona sbagliata potrebbe portarci ad allontanarci da Dio.|2 Cronache 18:1-2 — Giosafat era esposto perché legato ad Acab dal matrimonio; 2 Re 8:25-27 — la condotta del re è qui determinata dai legami di matrimonio. Tutto questo per concludere: si può essere ben disposti, ma essere legati alla persona sbagliata ci rende vulnerabili.|Un'altra alleanza importante è quella dell'amicizia: un figlio di Dio non può avere per amico intimo un pagano, perché questi diventa una porta d'ingresso del nemico nella sua vita — se perfino il cristiano può essere usato da Satana, quanto più il pagano? 'Le cattive compagnie corrompono i buoni costumi', dice l'apostolo Paolo.|Altre alleanze sono spesso concepite nello spirituale e invitano gli spiriti in casa nostra; queste generalmente provengono dalle assemblee (del tipo in cui il 'pastore' ha più influenza sulla vita del gregge di Dio stesso). Per questo il Signore dice di uscirne, perché non c'è nulla in comune tra la luce e le tenebre.|È dunque saggio chiedere il parere del Signore prima di legarsi con chicchessia, perché le alleanze o ci sono di aiuto o ci allontanano dal Signore." }
  },
  {
    id:"un-chretien-peut-il-participer-aux-associations-mondaines-pa", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-22", auteur:"Gaël, le frère",
    titre:{ fr:"Un chrétien peut-il participer aux associations mondaines par exemple \"association des camerounais d’italie » ??",
           en:"May a Christian take part in worldly associations — for example an 'association of Cameroonians in Italy'?",
           it:"Un cristiano può partecipare alle associazioni mondane — per esempio l'«associazione dei camerunesi d'Italia»?" },
    verset:{ fr:"" },
    extrait:{ fr:"Le Chrétien peut mais il est important d'évaluer avant le but de l'association, l'impact qu'elle a sur notre foi (est-ce qu'elle me demande de me compromettre ou pas ?) et le plus important…",
             en:"The Christian may, but must first weigh the association's purpose, its impact on his faith, and above all seek the will of God.",
             it:"Il cristiano può, ma è importante valutare prima lo scopo dell'associazione, il suo impatto sulla nostra fede e, soprattutto, cercare la volontà di Dio." },
    contenu:{ fr:"Le Chrétien peut mais il est important d'évaluer avant le but de l'association, l'impact qu'elle a sur notre foi (est-ce qu'elle me demande de me compromettre ou pas ?) et le plus important rechercher la volonté de Dieu par rapport ; ainsi on doit évaluer toutes les associations avant d'y adhérer ou pas qu'elles soient é dénomination tribale ou pas.|Faut-il donc y adhérer afin d'en évaluer les objectifs ou alors pas du tout ?|Écouter les différents témoignages que les personnes ont de celle-ci et demander conseil au Seigneur avant de décider quoique ce soit.|Il est donc important pour les bien-aimés de se soutenir soi matériellement que spirituellement pour pas que les chrétiens dans le but de subvenir à certains besoins et aussi voulant faire comme les autres se retrouvent dans certaines choses qu'ils ne comprennent pas eux-mêmes, on doit apprendre à vivre dans la simplicité et le contentement.",
             en:"The Christian may, but it is important first to assess the purpose of the association, the impact it has on our faith (does it require me to compromise or not?), and — most important — to seek God's will in the matter. Thus every association must be weighed before joining or not, whether it is tribal in character or not.|Should one then join in order to assess its objectives, or not at all?|Listen to the various testimonies people give of it, and ask the Lord's counsel before deciding anything.|It is therefore important for the beloved to support one another, both materially and spiritually, so that Christians — seeking to meet certain needs, or wanting to do as others do — do not end up involved in things they themselves do not understand. We must learn to live in simplicity and contentment.",
             it:"Il cristiano può, ma è importante valutare prima lo scopo dell'associazione, l'impatto che essa ha sulla nostra fede (mi chiede di compromettermi o no?) e, cosa più importante, cercare la volontà di Dio al riguardo. Così bisogna valutare tutte le associazioni prima di aderirvi o meno, che siano a carattere tribale o no.|Bisogna dunque aderirvi per valutarne gli obiettivi, oppure no?|Ascoltare le diverse testimonianze che le persone ne danno, e chiedere consiglio al Signore prima di decidere qualsiasi cosa.|È dunque importante che i fratelli amati si sostengano a vicenda, sia materialmente che spiritualmente, affinché i cristiani — per provvedere a certi bisogni, o volendo fare come gli altri — non si ritrovino in cose che essi stessi non comprendono. Dobbiamo imparare a vivere nella semplicità e nel contentamento." }
  },
  {
    id:"quelle-est-l-attitude-a-adopter-face-a-la-compagnie-quand-es", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-21", auteur:"Gaël, le frère",
    titre:{ fr:"Quelle est l'attitude à adopter face a la compagnie quand est devenu enfant de Dieu ??",
           en:"What attitude should we adopt towards our former company once we have become children of God?",
           it:"Quale atteggiamento adottare verso le vecchie compagnie quando si è diventati figli di Dio?" },
    verset:{ fr:"" },
    extrait:{ fr:"Il faut déjà souligner que, ce n'est pas à l'enfant d Dieu de baisser ses standards bien au contraire il doit se faire accepter ainsi et faire accepter sa foi auprès des autres. Il ne faut pas…",
             en:"It is not for the child of God to lower his standards; he must not reject people, but set a certain distance — and if a friendship harms us, the bridge must be cut off categorically.",
             it:"Non spetta al figlio di Dio abbassare i suoi standard; non bisogna rigettare le persone, ma porre una certa distanza — e se un'amicizia ci è nociva, bisogna tagliare i ponti categoricamente." },
    contenu:{ fr:"Il faut déjà souligner que, ce n'est pas à l'enfant d Dieu de baisser ses standards bien au contraire il doit se faire accepter ainsi et faire accepter sa foi auprès des autres. Il ne faut pas rejeter les personnes mais poser une certaine distance et éviter une certaine intimité parce que déjà les objectifs et les visions sont différentes, on peut néanmoins continuer à leur parler et parler aussi du Seigneur car devant témoigner de notre foi car le Seigneur peut nous utiliser pour transformer leurs vies. Il ne faut pas rejeter les païens mais il ne faut pas non plus se compromettre, et si une amitié nous est nuisible alors il faut couper catégoriquement les ponts.",
             en:"It must be stressed from the outset that it is not for the child of God to lower his standards; on the contrary, he must make himself accepted as he is, and make his faith accepted by others. We must not reject people, but set a certain distance and avoid a certain intimacy, since the aims and visions are now different. We may nevertheless keep talking with them, and also talk about the Lord — for we must bear witness to our faith, and the Lord can use us to transform their lives. The pagans are not to be rejected, but neither must we compromise ourselves; and if a friendship is harmful to us, then the bridge must be cut off categorically.",
             it:"Bisogna anzitutto sottolineare che non spetta al figlio di Dio abbassare i propri standard; al contrario, deve farsi accettare così com'è e far accettare la sua fede presso gli altri. Non bisogna rigettare le persone, ma porre una certa distanza ed evitare una certa intimità, poiché ormai gli obiettivi e le visioni sono diversi. Si può tuttavia continuare a parlare con loro, e parlare anche del Signore — perché dobbiamo testimoniare la nostra fede, e il Signore può usarci per trasformare le loro vite. Non bisogna rigettare i pagani, ma nemmeno compromettersi; e se un'amicizia ci è nociva, allora bisogna tagliare i ponti categoricamente." }
  },
  {
    id:"partage-luc-22-14-23", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-20", auteur:"Gaël, le frère",
    titre:{ fr:"Partage : Luc 22 :14-23",
           en:"Sharing: Luke 22:14-23",
           it:"Condivisione: Luca 22:14-23" },
    verset:{ fr:"" },
    extrait:{ fr:"Aujourd'hui encore nous sommes tout autant des traitres du Seigneur de par notre façon d’agir, dans notre désobéissance, dans notre union avec le monde on trahit le Seigneur. On n'est pas radical…",
             en:"Today we too betray the Lord by our way of acting, by our disobedience, by our union with the world. What if our cistern were cracked?",
             it:"Anche oggi tradiamo il Signore con il nostro modo di agire, con la nostra disubbidienza, con la nostra unione con il mondo. E se la nostra cisterna fosse screpolata?" },
    contenu:{ fr:"Aujourd'hui encore nous sommes tout autant des traitres du Seigneur de par notre façon d’agir, dans notre désobéissance, dans notre union avec le monde on trahit le Seigneur. On n'est pas radical dans nos prises de positions par rapport au Seigneur, on ne témoigne plus du Seigneur, on s'accommode au monde et on s'y plait sans se gêner.|Jérémie 2 :8-20 comme le peuple d'Israël a modifié les commandements du Seigneur pour les adapter à notre aise, on s'est détourné de la source d'eau vive qu'est le Seigneur pour se creuser des citernes (fausses doctrines) ;  il faut se demander qui est-ce que l'on sert réellement? Quels risques courrons-nous si nous nous détournons de Dieu ?  Il est impératif de s'examiner et se remettre en question : et si notre citerne était fissurée ?  Aujourd'hui le christianisme est regardé de haut à cause des personnes qui se disent chrétiennes et dont la vie ne reflète en rien le caractère de Christ ; les plus déçus au dernier jour seront ceux qui étaient chrétiens sans vraiment l'être. Un véritable enfant du Seigneur s'examine au quotidien pour s'assurer d'être en train d'avancer sur les sentiers détournés.",
             en:"Today we too are just as much betrayers of the Lord, by our way of acting: in our disobedience, in our union with the world, we betray the Lord. We are not radical in our stands for the Lord; we no longer bear witness to Him; we accommodate ourselves to the world and enjoy it without embarrassment.|Jeremiah 2:8-20 — as the people of Israel modified the Lord's commandments to suit their own ease, we have turned away from the spring of living water which is the Lord, to dig for ourselves cisterns (false doctrines). We must ask ourselves: whom do we really serve? What risks do we run if we turn away from God? It is imperative to examine ourselves and question ourselves: what if our cistern were cracked? Today Christianity is looked down upon because of people who call themselves Christians and whose life reflects nothing of the character of Christ; the most disappointed on the last day will be those who were Christians without really being so. A true child of the Lord examines himself daily, to make sure he is not walking on crooked paths.",
             it:"Anche oggi siamo altrettanto traditori del Signore per il nostro modo di agire: nella nostra disubbidienza, nella nostra unione con il mondo tradiamo il Signore. Non siamo radicali nelle nostre prese di posizione per il Signore, non testimoniamo più del Signore, ci adattiamo al mondo e ce ne compiacciamo senza imbarazzo.|Geremia 2:8-20 — come il popolo d'Israele ha modificato i comandamenti del Signore per adattarli al proprio comodo, ci siamo allontanati dalla sorgente d'acqua viva che è il Signore per scavarci delle cisterne (false dottrine). Bisogna chiedersi: chi serviamo realmente? Quali rischi corriamo se ci allontaniamo da Dio? È imperativo esaminarsi e rimettersi in discussione: e se la nostra cisterna fosse screpolata? Oggi il cristianesimo è guardato dall'alto in basso a causa delle persone che si dicono cristiane e la cui vita non riflette in nulla il carattere di Cristo; i più delusi nell'ultimo giorno saranno coloro che erano cristiani senza esserlo veramente. Un vero figlio del Signore si esamina quotidianamente per assicurarsi di non star camminando su sentieri tortuosi." }
  },
  {
    id:"la-place-de-nos-culture-dans-notre-vie-avec-le-seigneur", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-19", auteur:"Gaël, le frère",
    titre:{ fr:"La place de nos culture dans notre vie avec le Seigneur",
           en:"The place of our cultures in our life with the Lord",
           it:"Il posto delle nostre culture nella nostra vita con il Signore" },
    verset:{ fr:"" },
    extrait:{ fr:"La culture est vue comme cet ensemble de signe là qui caractérisent les individus appartenant à un groupe (langue, vêtement, comportement, gestuelle etc.)",
             en:"The bronze serpent, instituted by God Himself, had become an idol. The tradition of the children of the Lord is the word of God: everything must be examined in its light.",
             it:"Il serpente di rame, istituito da Dio stesso, era diventato un idolo. La tradizione dei figli del Signore è la parola di Dio: tutto dev'essere esaminato alla sua luce." },
    contenu:{ fr:"La culture est vue comme cet ensemble de signe là qui caractérisent les individus appartenant à un groupe (langue, vêtement, comportement, gestuelle etc.)|Il y'a donc dans la culture, les us qui comportent généralement les aspects cultuels et qui sont transmis de génération en génération et comportent le bon et le mauvais.|2 rois 18 :1-3 le serpent d'Airain détruit par Ézéchias avait été conservé depuis le désert et était adoré par les israélites sous le nom de Nehushtan, une chose pourtant instituée par Dieu lui-même était devenue une idole pour le peuple, ceci pour dire que ce n'est pas parce que certaines choses ont toujours été faites d'une certaine façon qu'on doit juste le faire mais bien au contraire il faut tout passer au peigne fin et ne pas obéir aveuglement. Quand une chose ne se soumet pas au seigneur elle est soumise à une autre divinité, et c'est ce à quoi nous porte les alliances avec les païens, c'est pourquoi il est important de se dissocier de ces choses et ce de façon totale et radicale (que nos noms ne soient même pas dit dans ces choses), car les traditions d’hommes en arrivent à annuler les commandements du Seigneur.|La tradition des enfants du Seigneur c'est la parole de Dieu, il nous faut examiner tout à la lumière de la parole de Dieu par le Saint-Esprit et ne prendre part à rien, ne rien pratiquer qui compromettent l'esprit du Seigneur en nous.",
             en:"Culture is seen as the set of signs that characterise the individuals belonging to a group (language, dress, behaviour, gestures, etc.).|Within culture there are customs, which generally include ritual aspects, are handed down from generation to generation, and contain both good and bad.|2 Kings 18:1-4 — the bronze serpent destroyed by Hezekiah had been kept since the wilderness and was worshipped by the Israelites under the name Nehushtan: a thing instituted by God Himself had become an idol for the people. This is to say that it is not because certain things have always been done a certain way that we should simply do them; on the contrary, everything must be combed through, and we must not obey blindly. When a thing does not submit to the Lord, it is subject to another deity — and that is where alliances with the pagans lead us. That is why it is important to dissociate ourselves from these things totally and radically (may our names not even be mentioned in them), for the traditions of men end up annulling the commandments of the Lord.|The tradition of the children of the Lord is the word of God: we must examine everything in the light of the word of God by the Holy Spirit, and take part in nothing, practise nothing, that compromises the Spirit of the Lord in us.",
             it:"La cultura è vista come quell'insieme di segni che caratterizzano gli individui appartenenti a un gruppo (lingua, abbigliamento, comportamento, gestualità, ecc.).|Nella cultura ci sono dunque gli usi, che comportano generalmente aspetti cultuali, si trasmettono di generazione in generazione e contengono il buono e il cattivo.|2 Re 18:1-4 — il serpente di rame distrutto da Ezechia era stato conservato fin dal deserto ed era adorato dagli israeliti sotto il nome di Nehustan: una cosa pure istituita da Dio stesso era diventata un idolo per il popolo. Questo per dire che non è perché certe cose sono sempre state fatte in un certo modo che dobbiamo semplicemente farle; al contrario, bisogna passare tutto al setaccio e non ubbidire ciecamente. Quando una cosa non si sottomette al Signore, è sottomessa a un'altra divinità — ed è a questo che ci portano le alleanze con i pagani. Per questo è importante dissociarsi da queste cose in modo totale e radicale (che i nostri nomi non siano nemmeno pronunciati in esse), perché le tradizioni degli uomini finiscono per annullare i comandamenti del Signore.|La tradizione dei figli del Signore è la parola di Dio: dobbiamo esaminare tutto alla luce della parola di Dio per mezzo dello Spirito Santo, e non prendere parte a nulla, non praticare nulla che comprometta lo Spirito del Signore in noi." }
  },
  {
    id:"question-1timothee2-1-2-esther-4-16-jonas-3-6", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-18", auteur:"Gaël, le frère",
    titre:{ fr:"Question : 1timothee2 :1-2 ; Esther 4 :16 ; Jonas 3:6",
           en:"Question: 1 Timothy 2:1-2; Esther 4:16; Jonah 3:6 — if a national fast were proclaimed including all religious confessions, would we take part?",
           it:"Domanda: 1 Timoteo 2:1-2; Ester 4:16; Giona 3:6 — se fosse proclamato un digiuno nazionale che includesse tutte le confessioni religiose, vi prenderemmo parte?" },
    verset:{ fr:"" },
    extrait:{ fr:"SI L'ON PROCLAME UN JEUNE NATIONAL AU CAMEROUN INCLUANT TOUTES LES CONFESSIONS RELIGIEUSES QUI S'Y TROUVENT Y PRENDRONS-NOUS PART ? POURQUOI ? REPONDRE A LA LUMIERE DE LA PAROLE DE DIEU.",
             en:"We must obey the authorities according to the Lord. In general gatherings we must discern who is being prayed to and why — the Christian acts led by the Spirit, not because everyone else does.",
             it:"Dobbiamo ubbidire alle autorità secondo il Signore. Nei raduni generali bisogna discernere chi viene pregato e perché — il cristiano agisce guidato dallo Spirito, non perché lo fanno tutti." },
    contenu:{ fr:"SI L'ON PROCLAME UN JEUNE NATIONAL AU CAMEROUN INCLUANT TOUTES LES CONFESSIONS RELIGIEUSES QUI S'Y TROUVENT Y PRENDRONS-NOUS PART ? POURQUOI ? REPONDRE A LA LUMIERE DE LA PAROLE DE DIEU.|Le but de la question est de nous amener à méditer sur les pratiques que nous faisons sans toutefois nous poser des questions en rapport à celles-ci, si elles sont en accord avec notre foi ou pas.|D’aucuns diront qu'il faut obéir aux autorités comme c'est écrit dans la parole ; Dans le livre de Daniel 6 :12-16 et 3 :7-17 nous voyons des exemples de désobéissance aux autorités ceci nous enseignant que nous devons obéir aux autorités selon le Seigneur. Daniel et ses amis ne pouvaient se lier à une imposture et ils en ont profité pour rendre leur témoignage. Dans les rassemblements généraux il faut discerner qui est-ce qu'on prie et pourquoi il faut adorer telle ou telle autre divinité 1 Rois 18 :19-21.|Nos prières sont des actions d'adoration car dégageant un parfum lévitiques 10:1-6 , comme les fils d'Aaron aujourd'hui nous apportons au Seigneur les sujets qu'ils ne faut pas , par exemple on prie pour la destruction de nos ennemis, la mort des sorciers etc. et on oublie la prescription du Seigneur de prier pour ceux qui nous persécutent et de bénir seulement, de telles prières sont des sujets de malédictions dans nos vies et on ne s'en aperçoit même pas parce que distrait et peu prompt à écouter le Seigneur.|L’autre chose est que le Chrétien ne fait pas qch parce que tout le monde fait mais parce que conduit par l'Esprit Josué 24 : 14-25 nos engagements sont des alliances qu'on fait et donc il est important d'être convaincu par le Seigneur avant de faire quoique ce soit.|Daniel 6 :10, les habitudes de Daniel n'ont pas été modifiées, ni influencées par le décret d roi, il dit en être de même pour nous, on ne doit pas tout simplement obéir aux injonctions des autorités mais bien établir à qui est-ce qu'on obéit à Dieu au roi, déjà qu'on n'a pas besoin que qch de national soit proclamé pour que nous prions ou jeunions pour notre nation, faire tout conduit par l'esprit de Christ et ne pas être influencé par les décisions d'ensemble.|(Pour qch de plus personnel le chrétien ne prie pas avec n'importe qui, parce que ne sachant pas qui cette personne invoque et qui elle est, ainsi certains invitent des esprits chez eux.)|Et donc pour terminer, on ne peut prendre part à un tel programme parce que n'étant pas pour le Seigneur et donc nous amènerait à adorer d'autres dieux, les ordres des autorités doivent être examinés à la lumière de la parole de Dieu mais quand il s’agit d'un ordre du Seigneur le chrétien doit obéir sans poser de résistance.|Restez bénis en Jésus-Christ !",
             en:"IF A NATIONAL FAST WERE PROCLAIMED IN CAMEROON, INCLUDING ALL THE RELIGIOUS CONFESSIONS FOUND THERE, WOULD WE TAKE PART? WHY? ANSWER IN THE LIGHT OF THE WORD OF GOD.|The aim of the question is to lead us to reflect on practices we engage in without asking ourselves whether they agree with our faith or not.|Some will say we must obey the authorities, as it is written in the word. In Daniel 6:12-16 and 3:7-17 we see examples of disobedience to the authorities, teaching us that we must obey the authorities according to the Lord. Daniel and his friends could not bind themselves to an imposture — and they took the opportunity to bear their testimony. In general gatherings we must discern who is being prayed to, and why this or that deity should be worshipped (1 Kings 18:19-21).|Our prayers are acts of worship, for they release a fragrance (Leviticus 10:1-6). Like the sons of Aaron, today we bring the Lord requests we should not — for example, we pray for the destruction of our enemies, the death of sorcerers, and so on, forgetting the Lord's command to pray for those who persecute us and to bless only. Such prayers become sources of curses in our lives, and we do not even notice, because we are distracted and slow to listen to the Lord.|The other point is that the Christian does not do something because everyone does it, but because he is led by the Spirit (Joshua 24:14-25). Our commitments are covenants that we make; it is therefore important to be convinced by the Lord before doing anything.|Daniel 6:10 — Daniel's habits were not modified or influenced by the king's decree; it must be the same for us. We must not simply obey the injunctions of the authorities, but establish clearly whom we obey — God or the king. Besides, we do not need something national to be proclaimed in order to pray or fast for our nation; let us do everything led by the Spirit of Christ, without being swayed by collective decisions.|(On a more personal note: the Christian does not pray with just anyone, not knowing whom that person invokes or who they are; it is thus that some invite spirits into their homes.)|To conclude, then: we cannot take part in such a programme, because it is not for the Lord and would lead us to worship other gods. The orders of the authorities must be examined in the light of the word of God; but when it is an order of the Lord, the Christian must obey without resistance.|Remain blessed in Jesus Christ!",
             it:"SE SI PROCLAMASSE UN DIGIUNO NAZIONALE IN CAMERUN, INCLUDENDO TUTTE LE CONFESSIONI RELIGIOSE CHE VI SI TROVANO, VI PRENDEREMMO PARTE? PERCHÉ? RISPONDERE ALLA LUCE DELLA PAROLA DI DIO.|Lo scopo della domanda è portarci a meditare sulle pratiche che compiamo senza porci domande al loro riguardo: se sono in accordo con la nostra fede o no.|Alcuni diranno che bisogna ubbidire alle autorità, come è scritto nella parola. Nel libro di Daniele 6:12-16 e 3:7-17 vediamo esempi di disubbidienza alle autorità, che ci insegnano che dobbiamo ubbidire alle autorità secondo il Signore. Daniele e i suoi amici non potevano legarsi a un'impostura — e ne hanno approfittato per rendere la loro testimonianza. Nei raduni generali bisogna discernere chi viene pregato, e perché si dovrebbe adorare questa o quella divinità (1 Re 18:19-21).|Le nostre preghiere sono atti di adorazione, perché sprigionano un profumo (Levitico 10:1-6). Come i figli di Aaronne, oggi portiamo al Signore richieste che non dovremmo — per esempio preghiamo per la distruzione dei nostri nemici, la morte degli stregoni, ecc., dimenticando la prescrizione del Signore di pregare per quelli che ci perseguitano e di benedire soltanto. Simili preghiere diventano fonti di maledizione nelle nostre vite, e non ce ne accorgiamo nemmeno, perché siamo distratti e poco pronti ad ascoltare il Signore.|L'altra cosa è che il cristiano non fa qualcosa perché tutti la fanno, ma perché è guidato dallo Spirito (Giosuè 24:14-25). I nostri impegni sono alleanze che facciamo; è dunque importante essere convinti dal Signore prima di fare qualsiasi cosa.|Daniele 6:10 — le abitudini di Daniele non furono modificate né influenzate dal decreto del re; dev'essere lo stesso per noi. Non dobbiamo semplicemente ubbidire alle ingiunzioni delle autorità, ma stabilire chiaramente a chi ubbidiamo: a Dio o al re. Del resto, non abbiamo bisogno che venga proclamato qualcosa di nazionale per pregare o digiunare per la nostra nazione; facciamo tutto guidati dallo Spirito di Cristo, senza farci influenzare dalle decisioni collettive.|(Per qualcosa di più personale: il cristiano non prega con chiunque, non sapendo chi quella persona invochi e chi essa sia; è così che alcuni invitano degli spiriti in casa loro.)|Per concludere, dunque: non possiamo prendere parte a un simile programma, perché non è per il Signore e ci porterebbe ad adorare altri dèi. Gli ordini delle autorità devono essere esaminati alla luce della parola di Dio; ma quando si tratta di un ordine del Signore, il cristiano deve ubbidire senza opporre resistenza.|Restate benedetti in Gesù Cristo!" }
  },
  {
    id:"qu-est-ce-que-le-repos-du-seigneur-dieu-se-fatigue-t-il", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-17", auteur:"Gaël, le frère",
    titre:{ fr:"Qu'est-ce que le repos du Seigneur ? Dieu se fatigue-t-il ?",
           en:"What is the rest of the Lord? Does God grow weary?",
           it:"Che cos'è il riposo del Signore? Dio si stanca?" },
    verset:{ fr:"" },
    extrait:{ fr:"Genèse 2 :1-3, Exode20 :8-11",
             en:"The Lord's rest is not that of the flesh but of the soul: it is the rest He grants our souls when they are saved — and it began at the cross, when the Lord said, 'It is finished.'",
             it:"Il riposo del Signore non è quello della carne ma dell'anima: è il riposo che egli accorda alle nostre anime quando sono salvate — ed è cominciato alla croce, quando il Signore ha detto: «Tutto è compiuto»." },
    contenu:{ fr:"Genèse 2 :1-3, Exode20 :8-11|(Il y avait deux sabbats en Israël : le repos normal et le sabbat des fêtes)|Notons que dans la genèse le repos d Seigneur était pour l'accomplissement d'une œuvre.|Hébreux 4 :8-13, Psaumes 95, le repose du Seigneur n'est point celui de la chair mais de l'âme comme le Seigneur le dit en Matthieu 11 :28.|Hébreux 3 :5-11 il s'agit donc ici du salut, toute l'œuvre de la création pendant 6jours se résume en la mort de Christ pour en contempler la magnificence le 7em jour ; c'est le sabbat qui réjouit le cœur de Dieu, car Sa volonté c’est que nous entrions dans Son repos c'est-à-dire que nous soyons sauvés en Christ afin de nous reposer des œuvres de la chair.|Le repos du Seigneur c'est le repos qu'il accorde à nos âmes lorsque celles-ci sont sauvées, nous-y trouvons le repos la sécurité et la paix, c'est pourquoi il est dit en Ésaïe 48 qu'il n'y a point de repos pour le méchant car ils ne sont pas dans le repos de Dieu. Il n'est nullement question ici d'un repos charnel mais celui des âmes et celui-ci a commencé à la croix lorsque le Seigneur a dit \"tout est accompli\" car en Christ se trouve toute la valeur de l'œuvre de Dieu.",
             en:"Genesis 2:1-3; Exodus 20:8-11.|(There were two sabbaths in Israel: the ordinary rest and the sabbath of the feasts.)|Note that in Genesis the Lord's rest followed the completion of a work.|Hebrews 4:8-13; Psalm 95 — the rest of the Lord is not that of the flesh but of the soul, as the Lord says in Matthew 11:28.|Hebrews 3:5-11 — what is in view here is salvation. The whole work of creation over six days is summed up in the death of Christ, its magnificence contemplated on the seventh day; that is the sabbath which rejoices the heart of God, for His will is that we enter into His rest — that is, that we be saved in Christ, so as to rest from the works of the flesh.|The rest of the Lord is the rest He grants our souls when they are saved: there we find rest, security and peace. That is why Isaiah 48 says there is no rest for the wicked — for they are not in the rest of God. It is in no way a matter of fleshly rest, but of the rest of souls; and it began at the cross, when the Lord said 'It is finished' — for in Christ lies the whole worth of the work of God.",
             it:"Genesi 2:1-3; Esodo 20:8-11.|(C'erano due sabati in Israele: il riposo normale e il sabato delle feste.)|Notiamo che nella Genesi il riposo del Signore seguiva il compimento di un'opera.|Ebrei 4:8-13; Salmo 95 — il riposo del Signore non è affatto quello della carne ma quello dell'anima, come il Signore dice in Matteo 11:28.|Ebrei 3:5-11 — si tratta dunque qui della salvezza. Tutta l'opera della creazione durante sei giorni si riassume nella morte di Cristo, per contemplarne la magnificenza il settimo giorno; è questo il sabato che rallegra il cuore di Dio, perché la sua volontà è che entriamo nel suo riposo — cioè che siamo salvati in Cristo, per riposarci dalle opere della carne.|Il riposo del Signore è il riposo che egli accorda alle nostre anime quando sono salvate: vi troviamo il riposo, la sicurezza e la pace. Per questo è detto in Isaia 48 che non c'è riposo per l'empio — perché non è nel riposo di Dio. Non si tratta affatto di un riposo carnale, ma di quello delle anime; ed esso è cominciato alla croce, quando il Signore ha detto 'Tutto è compiuto' — perché in Cristo si trova tutto il valore dell'opera di Dio." }
  },
  {
    id:"peut-on-vraiment-craindre-l-eternel-et-reste-fidele-a-un-sub", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-16", auteur:"Gaël, le frère",
    titre:{ fr:"Peut-on vraiment craindre l'eternel et reste fidele a un subordonnant dont les voies s'opposent a celles de notre Dieu ? l'exemple d'abdias en 1rois 18",
           en:"Can one truly fear the LORD and remain loyal to a superior whose ways oppose those of our God? The example of Obadiah in 1 Kings 18",
           it:"Si può veramente temere l'Eterno e restare fedeli a un superiore le cui vie si oppongono a quelle del nostro Dio? L'esempio di Abdia in 1 Re 18" },
    verset:{ fr:"" },
    extrait:{ fr:"Cette question fait surgir le sujet des métiers que le chrétien peut exercer et les positions qu'il peut occuper.",
             en:"Joseph influenced Pharaoh rather than the reverse; Daniel influenced the king. To work in a given setting, one must be sent there by the Lord — what matters in all things is God's seal.",
             it:"Giuseppe influenzò il faraone anziché il contrario; Daniele influenzò il re. Per operare in un ambiente bisogna esservi mandati dal Signore — ciò che conta in ogni cosa è il sigillo di Dio." },
    contenu:{ fr:"Cette question fait surgir le sujet des métiers que le chrétien peut exercer et les positions qu'il peut occuper.|Joseph dans sa position en Egypte a eu une influence sur pharaon plutôt que Pharaon sur Lui ; Daniel aussi dans la grâce qu'il a reçue et sa fermeté a influencé le Roi qui croyait en d'autres divinités jusqu'à ce que celui-ci rende grâce à Dieu.|2 Rois5 : 13-19 pour œuvrer dans un milieu il faut y être envoyé par le Seigneur sinon on mènera des combats à cause de notre désobéissance ; Dieu accompagnait Daniel, Joseph et Il avait donné son accord à Naaman par la bouche du prophète Elisée. L’attitude de Naama nous permet de faire un crochet sur la disposition du cœur, pour lui-même s'il se prosternait de par son travail dans le temple d'un autre dieu son cœur ‘n’y était pas car il l'avait donné au Seigneur, or certains chrétiens sont des adorateurs au bord des lèvres.|Pour terminer donc, dans tout ce que nous faisons, nous devons chercher la volonté du Seigneur afin de ne pas se retrouver seul face aux défis conséquents à la décision que nous avons eu à prendre. Le plus important en toutes choses c'est qu'l y ait le sceau de Dieu car Il veillera.",
             en:"This question raises the subject of the professions a Christian may practise and the positions he may hold.|Joseph, in his position in Egypt, had influence over Pharaoh rather than Pharaoh over him; Daniel likewise, in the grace he received and his firmness, influenced the king who believed in other deities, until that king gave thanks to God.|2 Kings 5:13-19 — to work in a given setting, one must be sent there by the Lord; otherwise we will fight battles brought on by our disobedience. God accompanied Daniel and Joseph, and He gave His consent to Naaman through the mouth of the prophet Elisha. Naaman's attitude allows a side note on the disposition of the heart: even if, because of his duties, he bowed down in the temple of another god, his heart was not in it, for he had given it to the Lord — whereas some Christians are worshippers only at the edge of their lips.|To conclude, then: in everything we do, we must seek the Lord's will, so as not to find ourselves alone facing the challenges that follow from the decision we had to take. The most important thing in all matters is that God's seal be on it — for then He will watch over it.",
             it:"Questa domanda fa emergere il tema dei mestieri che il cristiano può esercitare e delle posizioni che può occupare.|Giuseppe, nella sua posizione in Egitto, ebbe un'influenza sul faraone piuttosto che il faraone su di lui; anche Daniele, nella grazia che ricevette e nella sua fermezza, influenzò il re che credeva in altre divinità, fino a che questi rese grazie a Dio.|2 Re 5:13-19 — per operare in un ambiente bisogna esservi mandati dal Signore, altrimenti condurremo dei combattimenti a causa della nostra disubbidienza. Dio accompagnava Daniele e Giuseppe, e aveva dato il suo consenso a Naaman per bocca del profeta Eliseo. L'atteggiamento di Naaman ci permette una parentesi sulla disposizione del cuore: anche se, per via del suo incarico, si prostrava nel tempio di un altro dio, il suo cuore non vi era, perché lo aveva dato al Signore — mentre certi cristiani sono adoratori solo a fior di labbra.|Per concludere, dunque: in tutto ciò che facciamo dobbiamo cercare la volontà del Signore, per non ritrovarci soli di fronte alle sfide conseguenti alla decisione che abbiamo dovuto prendere. La cosa più importante in ogni cosa è che vi sia il sigillo di Dio — perché allora egli veglierà." }
  },
  {
    id:"nos-sens-des-portes-d-entree-du-peche", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-15", auteur:"Gaël, le frère",
    titre:{ fr:"Nos sens : des portes d'entrée du péché",
           en:"Our senses: doorways for sin",
           it:"I nostri sensi: porte d'ingresso del peccato" },
    verset:{ fr:"" },
    extrait:{ fr:"Disons d'entrée de jeu que c'est à dessein si le Seigneur en nous créant a mis tous les sens sur notre tête, et comme l'absence de chacun d'eux affecte fortement l'organisme il en est de même que…",
             en:"Everything we listen to penetrates our soul and our spirit, to the glory of God or of the enemy. Just as sound by God's power can deliver, the enemy can use it to captivate souls.",
             it:"Tutto ciò che ascoltiamo penetra nella nostra anima e nel nostro spirito, per glorificare Dio o il nemico. Come il suono per la potenza di Dio può liberare, il nemico può usarlo per catturare le anime." },
    contenu:{ fr:"Disons d'entrée de jeu que c'est à dessein si le Seigneur en nous créant a mis tous les sens sur notre tête, et comme l'absence de chacun d'eux affecte fortement l'organisme il en est de même que ce pourquoi nous les utilisons affectent de façon consciente ou non notre esprit|LES OREILLES : elles ont été faites de façon à ce que nous n'écoutions pas tous les sons qui nous entourent ceux-ci nous rendraient fous car chaque chose qui nous entoure émet un son, et donc même ce que nos oreilles physiques n'entendent pas est perçu par notre esprit et l'influence d'une certaine façon.|Pour parler de musique elle tire son origine de la semence de l'ennemi Genèse4 :17-22 (la science la connaissance sont de Cain ce qui fait que la prospérité dans le showbiz ne peut être sous la bénédiction du seigneur car cela ne relève pas de Lui.|L’oreille joue un rôle important car tout ce qu'on écoute pénètre notre âme et notre esprit à des fins de glorifier Dieu ou l'ennemi.|Josué 6 :1-5 de même que les cris des enfants d'Israël la louange des enfants Dieu ont une certaine onction c’est pourquoi ils peuvent porter à la manifestation des esprits ;|1 Samuel 16 :14-23 c'est parce que Saul écoutait le son que dégageait la harpe de David que l'esprit en lui sortait ; de même que le sont par la puissance de Dieu peut délivrer qqn l'ennemi peut s'en servir pour captiver les âmes il est donc important de faire attention à ce que l'on écoute afin de ne pas se laisser conduire par l'ennemi.|2rois3 :10-15 il faut être conduit par le Saint-Esprit quand on veut faire quoique ce soit afin de ne pas tomber dans la monotonie les façons d'agir de Dieu ne sont pas toujours les mêmes.|Pour conclure Romains 6 et 2 Pierre2:12-22.",
             en:"Let us say from the outset that it is by design that the Lord, in creating us, placed all the senses on our head; and just as the absence of any one of them severely affects the body, so what we use them for affects our spirit, consciously or not.|THE EARS: they were made in such a way that we do not hear all the sounds around us — those would drive us mad, for everything around us emits a sound; and so even what our physical ears do not hear is perceived by our spirit and influences it in a certain way.|As for music, it draws its origin from the seed of the enemy (Genesis 4:17-22 — science and craft come from Cain's line), which is why prosperity in show business cannot be under the Lord's blessing, for it does not proceed from Him.|The ear plays an important role, for everything we listen to penetrates our soul and our spirit, ultimately to glorify God or the enemy.|Joshua 6:1-5 — just as with the shouts of the children of Israel, the praise of God's children carries a certain anointing; that is why it can lead to the manifestation of spirits.|1 Samuel 16:14-23 — it was because Saul listened to the sound of David's harp that the spirit in him departed; just as sound, by the power of God, can deliver someone, the enemy can use it to captivate souls. It is therefore important to pay attention to what we listen to, so as not to be led by the enemy.|2 Kings 3:10-15 — we must be led by the Holy Spirit in whatever we wish to do, so as not to fall into routine: God's ways of acting are not always the same.|To conclude: Romans 6 and 2 Peter 2:12-22.",
             it:"Diciamo fin dall'inizio che è di proposito che il Signore, creandoci, ha messo tutti i sensi sulla nostra testa; e come l'assenza di ciascuno di essi colpisce fortemente l'organismo, così ciò per cui li usiamo influisce, in modo consapevole o no, sul nostro spirito.|LE ORECCHIE: sono state fatte in modo che non ascoltiamo tutti i suoni che ci circondano — ci renderebbero folli, perché ogni cosa intorno a noi emette un suono; e dunque anche ciò che le nostre orecchie fisiche non sentono è percepito dal nostro spirito e lo influenza in un certo modo.|Quanto alla musica, essa trae la sua origine dalla semenza del nemico (Genesi 4:17-22 — la scienza e la tecnica vengono dalla discendenza di Caino), il che fa sì che la prosperità nel mondo dello spettacolo non possa essere sotto la benedizione del Signore, perché non procede da lui.|L'orecchio gioca un ruolo importante, perché tutto ciò che ascoltiamo penetra nella nostra anima e nel nostro spirito, per finire col glorificare Dio o il nemico.|Giosuè 6:1-5 — come le grida dei figli d'Israele, la lode dei figli di Dio porta una certa unzione; per questo può condurre alla manifestazione degli spiriti.|1 Samuele 16:14-23 — è perché Saul ascoltava il suono che emanava l'arpa di Davide che lo spirito in lui usciva; come il suono, per la potenza di Dio, può liberare qualcuno, il nemico può servirsene per catturare le anime. È dunque importante fare attenzione a ciò che si ascolta, per non lasciarsi condurre dal nemico.|2 Re 3:10-15 — bisogna essere guidati dallo Spirito Santo in qualsiasi cosa si voglia fare, per non cadere nella monotonia: i modi di agire di Dio non sono sempre gli stessi.|Per concludere: Romani 6 e 2 Pietro 2:12-22." }
