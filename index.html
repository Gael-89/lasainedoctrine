             en:"To prophesy means to speak in the name of God; consequently, what is said in the prophecy need not necessarily come to pass. Prophecy has several purposes, set out in 1 Corinthians 14, among which is exposing what is hidden in the hearts of men. This chapter raises a problem — that of the fulfilment of prophecy. Sometimes, faced with this, prophets do not realise that prayer can affect the fulfilment of a prophecy; so at times they say something and then behave like Jonah — standing somewhere waiting for what they said to come to pass, forgetting the effect of prayer.|The salient point of prophecy is the denunciation of sin: the prophet has the ministry of denouncing sin (Jeremiah 23:9-26). A prophet is not recognised by the fact that what he says comes to pass, but by the fact that he confronts us with sin. If someone calls himself a prophet and does not confront those who follow him with their sins, then questions must be asked.|Jonah announces the gospel to a people who did not know God after his 'resurrection' (the death in the belly of the fish — cf. Jonah's song in chapter 2). This is a preparation for what would happen later with Christ, namely the announcement of the gospel to the Gentiles after the Lord's resurrection: salvation by grace. And so we understand why Peter received the key from the Lord: it is Peter who would open the door of the churches in Jerusalem in Acts, in Samaria, and finally among the Gentiles through Cornelius.|Jonah presents himself as an antitype of Christ, in that he cares more about a plant for which he did not even suffer than about men; and the Lord thereby teaches that HE grieves for human beings because He suffered for them — that is why He holds to them. He thereby demonstrates the work of salvation, the reason Christ came: because men have value in the Lord's eyes. Christ died because we are precious in His sight.",
             it:"Profetizzare significa parlare nel nome di Dio; di conseguenza, ciò che è detto nella profezia non deve necessariamente compiersi. La profezia ha diversi scopi, esposti in 1 Corinzi 14, tra i quali svelare ciò che è nascosto nel cuore degli uomini. Questo capitolo pone un problema, quello del compimento della profezia. A volte, di fronte a ciò, i profeti non si rendono conto che la preghiera può incidere sul compimento della profezia; così a volte dicono una cosa e si comportano come Giona, cioè si mettono da qualche parte ad aspettare che ciò che hanno detto si realizzi, dimenticando l'effetto della preghiera.|Il punto saliente della profezia è la denuncia del peccato: il profeta ha il ministero della denuncia del peccato (Geremia 23:9-26). Non si riconosce un profeta dal fatto che ciò che dice si compie, ma dal fatto che ci mette di fronte al peccato. Se qualcuno si dice profeta e non mette coloro che lo seguono di fronte ai loro peccati, allora bisogna porsi delle domande.|Giona annuncia il vangelo a un popolo che non conosceva Dio dopo la sua 'risurrezione' (la morte nel ventre del pesce — cfr. il cantico di Giona al capitolo 2). Questa è una preparazione a ciò che avverrà più tardi con Cristo, cioè l'annuncio del vangelo ai gentili dopo la risurrezione del Signore: la salvezza per grazia. E si comprende dunque perché Pietro abbia ricevuto la chiave dal Signore: è Pietro che aprirà la porta delle chiese a Gerusalemme negli Atti, in Samaria, e infine presso i gentili attraverso Cornelio.|Giona si presenta come un antitipo di Cristo, nel senso che si preoccupa più di una pianta per la quale non ha nemmeno sofferto che degli uomini; e il Signore insegna con questo che EGLI ha compassione degli esseri umani perché ha sofferto per loro — per questo tiene a loro. Dimostra così l'opera della salvezza, la ragione per cui Cristo è venuto: perché gli uomini hanno valore agli occhi del Signore. Cristo è morto perché siamo preziosi ai suoi occhi." }
  },
  {
    id:"exhortation-i-ve-decided-to-follow-jesus", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-01", auteur:"Gaël, le frère",
    titre:{ fr:"Exhortation: i’ve decided to follow jesus",
           en:"Exhortation: 'I have decided to follow Jesus'",
           it:"Esortazione: «I have decided to follow Jesus»" },
    verset:{ fr:"" },
    extrait:{ fr:"La meilleure manière de suivre le Seigneur est d'avancer sans se retourner, sans regarder en arrière, avancer sans tenir compte des difficultés, des douleurs juste être ferme. En Jean 10 le…",
             en:"The best way to follow the Lord is to move forward without turning back. He is the Shepherd — not one shepherd among others — and the sheep that strays from the flock is exposed to death.",
             it:"Il modo migliore di seguire il Signore è avanzare senza voltarsi indietro. Egli è il Pastore — non uno dei pastori — e la pecora che si allontana dal gregge è esposta alla morte." },
    contenu:{ fr:"La meilleure manière de suivre le Seigneur est d'avancer sans se retourner, sans regarder en arrière, avancer sans tenir compte des difficultés, des douleurs juste être ferme. En Jean 10 le Seigneur dit qu'il est le Berger pas l'un des bergers mais le berger donc le seul vrai, La Porte et pas l'une des portes, c'est pourquoi marcher à sa suite nécessite le tact pour éviter d'entrer par la porte large. Pour comprendre le comment de l'amour du Seigneur il suffit les bergers, les vrais bergers. Le berger prend soin du troupeau, il le soigne, le protège, il défend les brebis jusqu'à risquer sa vie pour celles-ci. Quand bien même le troupeau n'est pas le sien, son objectif est de ramener toutes les brebis à son maitre, il ne veut perdre aucune au contraire il veut en rapporter plus. Il marche généralement devant elles pour leur montrer la voie à suivre et quand il se met derrière ça veut dire que les brebis sont sur un chemin déjà droit qui n'a qu'une issue donc aucune en se perdra, quand un est malade et faible il la prend même dans ses bras pour la soigner.|Pour ce qui est des brebis leur vie est à la suite du berger, car celle qui s'éloigne du troupeau est vulnérable et exposée à la mort, il en est de même pour nous qui sommes en Christ, si nous nous éloignons du Berger et du troupeau, nous nous mettons à la merci du prince de ce monde. Tous les intempérés auxquels doivent faire face les brebis, représentent les difficultés par lesquelles en tant que chrétien. Et parfois certains trouvent la vie de chrétien difficile à cause de la pensée qu'ils se sont fait de celle-ci car se disent-ils quand on est chrétien on peut faire comme tout le monde or on doit se détacher du monde, se préserver tout en se dépouillant des choses du monde ; rester vigilant parce que les temps sont mauvais.",
             en:"The best way to follow the Lord is to move forward without turning round, without looking back — to advance without regard to difficulties or pain, simply to stand firm. In John 10 the Lord says He is the Shepherd — not one of the shepherds, but THE Shepherd, the only true one — and the Door, not one of the doors; that is why walking in His footsteps requires care, to avoid entering by the wide gate. To understand how the Lord loves, it is enough to watch shepherds — true shepherds. The shepherd takes care of the flock: he tends it, protects it, defends the sheep even at the risk of his life. Even when the flock is not his own, his aim is to bring all the sheep back to his master; he does not want to lose a single one — on the contrary, he wants to bring back more. He usually walks ahead of them to show them the way; and when he walks behind, it means the sheep are on a road already straight, with only one way out, so that none will be lost. When one is sick and weak, he even takes it in his arms to tend it.|As for the sheep, their life consists in following the shepherd, for the one that strays from the flock is vulnerable and exposed to death. It is the same for us who are in Christ: if we stray from the Shepherd and from the flock, we put ourselves at the mercy of the prince of this world. All the storms the sheep must face represent the difficulties we pass through as Christians. Some find the Christian life difficult because of the idea they have formed of it — thinking that as a Christian one can live like everyone else; whereas we must detach ourselves from the world, keep ourselves while stripping ourselves of the things of the world, and remain vigilant, because the days are evil.",
             it:"Il modo migliore di seguire il Signore è avanzare senza voltarsi, senza guardare indietro — avanzare senza tenere conto delle difficoltà e dei dolori, semplicemente restare fermi. In Giovanni 10 il Signore dice di essere il Pastore — non uno dei pastori, ma IL Pastore, l'unico vero — e la Porta, non una delle porte; per questo camminare al suo seguito richiede attenzione, per evitare di entrare per la porta larga. Per capire come il Signore ama, basta osservare i pastori — i veri pastori. Il pastore si prende cura del gregge: lo cura, lo protegge, difende le pecore fino a rischiare la vita per loro. Anche quando il gregge non è suo, il suo obiettivo è riportare tutte le pecore al suo padrone; non vuole perderne nessuna — al contrario, vuole riportarne di più. Cammina generalmente davanti a loro per mostrare la via da seguire; e quando si mette dietro, vuol dire che le pecore sono su una strada già diritta, con una sola uscita, così nessuna si perderà. Quando una è malata e debole, la prende perfino tra le braccia per curarla.|Quanto alle pecore, la loro vita è al seguito del pastore, perché quella che si allontana dal gregge è vulnerabile ed esposta alla morte. Lo stesso vale per noi che siamo in Cristo: se ci allontaniamo dal Pastore e dal gregge, ci mettiamo alla mercé del principe di questo mondo. Tutte le intemperie che le pecore devono affrontare rappresentano le difficoltà che attraversiamo come cristiani. E a volte alcuni trovano la vita cristiana difficile a causa dell'idea che se ne sono fatti — pensando che da cristiani si possa fare come tutti; invece dobbiamo distaccarci dal mondo, custodirci spogliandoci delle cose del mondo, e restare vigilanti, perché i tempi sono malvagi." }
  },
  {
    id:"l-attitude-des-enfants-de-dieu-dans-un-monde-qui-change-vers", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-31", auteur:"Gaël, le frère",
    titre:{ fr:"L'attitude des enfants de Dieu dans un monde qui change vers le pire",
           en:"The attitude of God's children in a world changing for the worse",
           it:"L'atteggiamento dei figli di Dio in un mondo che cambia verso il peggio" },
    verset:{ fr:"" },
    extrait:{ fr:"Il est important de préciser que les évènements qui arrivent ont un but bien précis dans le plan de l'ennemi celui de placer les limites de tolérance de l'iniquité le plus loin possible et cela…",
             en:"We cannot stop the world from getting worse; what matters is our attitude. Like Lot, strangers in a depraved land, we must find with the Lord's grace the way to bring up our children — and the victory that overcomes the world is our faith.",
             it:"Non possiamo impedire al mondo di peggiorare; ciò che conta è il nostro atteggiamento. Come Lot, stranieri in un paese depravato, dobbiamo trovare con la grazia del Signore il modo di educare i nostri figli — e la vittoria che vince il mondo è la nostra fede." },
    contenu:{ fr:"Il est important de préciser que les évènements qui arrivent ont un but bien précis dans le plan de l'ennemi celui de placer les limites de tolérance de l'iniquité le plus loin possible et cela passe par tous les moyens que nous voyons aujourd’hui, et en tant qu'enfant du Seigneur nous ne pouvons nullement empêcher cela d'arriver les choses vont seulement empirer le plus important c'est notre attitude face à cela.|Genèse 13:7-12, Genèse19:1-9 si nous sommes réellement nous sommes enfants du Seigneur il y'a un certain nombre de chose dont on ne peut se permettre pour la seul fait que nous nous considérons comme des étrangers sur la terre; Lot par la grâce du Seigneur a trouvé le moyen d'élever ses enfants tout en les préservant dans un pays aux mœurs dépravée; et donc comme Lot nous devons savoir qu'en tant qu'enfant de Dieu et étrangers dans le monde, notre comportement jugera le monde et donc il va falloir en subir les conséquences, secundo nous devons trouver avec la grâce du Seigneur, le moyen d'éduquer nos enfants et de nous éduquer nous-même car nous allons souffrir et s qqn n'y est pas prêt il ferait mieux de s'aligner aux autres maintenant.|2 Pierre2 :1-10|Maintenant selon la situation qui se pose comment réagir ? Moi le parent qui ai déjà inscrit mon enfant à l'école que dois-je faire ? La parole dit de respecter les autorités mais c respect doit être jusqu'à sacrifier le salut des enfants ?|Le système dans lequel nous vivons nous a laissé croire qu'on ne peut vivre sans avoir atteint un certain standard économique, ce qui fait que certains parents sont obligés de sacrifier les enfants pour plus travailler (d’aucuns passent à peine 2h avec les enfants). Et donc on se demande est-ce que certains parents pourraient sacrifier le confort économique recherché pour l'éducation des enfants ? Si on ne peut choisir entre le bienêtre matériel et le bien des enfants on va se retrouver en train de suivre monde. Il faudra se rendre disponible pour les enfants, prêter attention à tout ce qu'ils font comme les grands parents au village. En tant que parents chrétiens on doit se préparer à changer de statut social, on va devoir arrêter de regarder aux illusions que le monde vend parce qu'en fait ce sont elles qui détruisent nos vies, or toutes ces choses ne sont que poursuite du vent. Il va falloir tout détruire car On a subi une sorte de lavage de cerveau par la société qui nous fait croire que si on n'a pas un certain niveau de vie alors on a échoué. Nous devons résister à ce que le monde nous propose sinon il faudra en payer le prix : nos standards ne sont pas ceux du monde.|1 Pierre1 :13-25 si nous avons réellement été regénéré de Dieu alors nos pensées ne devraient pas se conformer à ce monde ; Romains 12 :1-2 si notre intelligence n'est pas renouvelée alors nous allons tomber dans le conformisme car n'ayant pas été transformé par la parole ; et Jacques nous enseigne que quiconque aime le monde  se fait ennemi de Dieu Jacques4:4|1Jean 5 si on a le Saint-Esprit on ne peut faire certaines choses (le Saint-Esprit en toi ne peut faire insulter le Saint-Esprit, en parlant du péché qui mène à la mort ce qui n'exclut pas qu'on peut pécher en ayant le Saint-Esprit 1Jean1 :9 mais nous ne pouvons franchir certaines extrêmes).|Nous devons garder à l'esprit que le monde dans lequel nous vivons est dominé par le mal, et donc rester accroché au fait que nous sommes des pèlerins pour ne pas se conformer mais être transformés afin que notre esprit soit renouvelé ; les murs de Jéricho doivent tomber afin que l'esprit déconstruise les paradigmes. Le combat est spirituel et donc nous devrons faire des sacrifices pour nos enfants.|ET LE MOYEN DE REMPORTER LA VICTOIRE SUR LE MONDE C'EST NOTRE FOI !!|Que le <seigneur nous bénisse en Jésus-Christ.",
             en:"It is important to state that the events taking place have a very precise purpose in the enemy's plan: to push the limits of tolerance of iniquity as far as possible, by every means we see today. As children of the Lord we can in no way prevent this from happening — things will only get worse; what matters most is our attitude in the face of it.|Genesis 13:7-12; Genesis 19:1-9 — if we really are children of the Lord, there are a certain number of things we cannot allow ourselves, for the simple reason that we regard ourselves as strangers on the earth. Lot, by the grace of the Lord, found the way to raise his children while preserving them in a land of depraved morals. Like Lot, we must know that as children of God and strangers in the world, our conduct will judge the world, and we shall have to bear the consequences of that. Secondly, we must find, with the Lord's grace, the way to educate our children and ourselves, for we are going to suffer — and if someone is not ready for that, he had better fall in line with the others now.|2 Peter 2:1-10.|Now, depending on the situation, how should we react? I, the parent who has already enrolled my child in school — what should I do? The word says to respect the authorities; but must that respect go as far as sacrificing the salvation of our children?|The system we live in has led us to believe that one cannot live without reaching a certain economic standard, so that some parents are forced to sacrifice their children in order to work more (some spend barely two hours with their children). So the question arises: could some parents sacrifice the economic comfort they seek for the sake of their children's upbringing? If we cannot choose between material well-being and the good of our children, we will end up following the world. We shall have to make ourselves available for our children, pay attention to everything they do, like the grandparents in the village. As Christian parents we must prepare to change social status; we shall have to stop looking at the illusions the world sells, because it is precisely these that destroy our lives — all these things are but chasing after wind. It will all have to be torn down, for we have undergone a kind of brainwashing by society, which makes us believe that without a certain standard of living we have failed. We must resist what the world offers us, or we shall pay the price: our standards are not the world's.|1 Peter 1:13-25 — if we have truly been born again of God, our thoughts should not be conformed to this world. Romans 12:1-2 — if our mind is not renewed, we will fall into conformity, not having been transformed by the word; and James teaches us that whoever loves the world makes himself an enemy of God (James 4:4).|1 John 5 — if we have the Holy Spirit, there are certain things we cannot do (the Holy Spirit in you cannot lead you to insult the Holy Spirit — speaking of the sin that leads to death; which does not exclude that one can sin while having the Holy Spirit, 1 John 1:9, but there are certain extremes we cannot cross).|We must keep in mind that the world we live in is dominated by evil, and therefore hold on to the fact that we are pilgrims — so as not to be conformed, but transformed, that our mind may be renewed. The walls of Jericho must fall so that the Spirit may pull down the old paradigms. The battle is spiritual, and so we shall have to make sacrifices for our children.|AND THE WAY TO WIN THE VICTORY OVER THE WORLD IS OUR FAITH!|May the Lord bless us in Jesus Christ.",
             it:"È importante precisare che gli avvenimenti che accadono hanno uno scopo ben preciso nel piano del nemico: spostare il più lontano possibile i limiti di tolleranza dell'iniquità, e questo con tutti i mezzi che vediamo oggi. Come figli del Signore non possiamo in alcun modo impedire che ciò avvenga — le cose non faranno che peggiorare; la cosa più importante è il nostro atteggiamento di fronte a tutto questo.|Genesi 13:7-12; Genesi 19:1-9 — se siamo realmente figli del Signore, ci sono un certo numero di cose che non possiamo permetterci, per il solo fatto che ci consideriamo stranieri sulla terra. Lot, per la grazia del Signore, ha trovato il modo di crescere i suoi figli preservandoli in un paese dai costumi depravati. Come Lot, dobbiamo sapere che, in quanto figli di Dio e stranieri nel mondo, il nostro comportamento giudicherà il mondo, e bisognerà subirne le conseguenze. In secondo luogo, dobbiamo trovare, con la grazia del Signore, il modo di educare i nostri figli e noi stessi, perché soffriremo — e se qualcuno non è pronto, farebbe meglio ad allinearsi agli altri fin d'ora.|2 Pietro 2:1-10.|Ora, secondo la situazione che si presenta, come reagire? Io, genitore che ho già iscritto mio figlio a scuola, che cosa devo fare? La parola dice di rispettare le autorità; ma questo rispetto deve arrivare fino a sacrificare la salvezza dei figli?|Il sistema in cui viviamo ci ha fatto credere che non si possa vivere senza aver raggiunto un certo standard economico, cosicché alcuni genitori sono costretti a sacrificare i figli per lavorare di più (alcuni passano appena due ore con i figli). Ci si chiede dunque: certi genitori potrebbero sacrificare il benessere economico ricercato per l'educazione dei figli? Se non sappiamo scegliere tra il benessere materiale e il bene dei figli, ci ritroveremo a seguire il mondo. Bisognerà rendersi disponibili per i figli, prestare attenzione a tutto ciò che fanno, come i nonni al villaggio. Come genitori cristiani dobbiamo prepararci a cambiare condizione sociale; dovremo smettere di guardare alle illusioni che il mondo vende, perché in realtà sono proprio esse a distruggere le nostre vite — tutte queste cose non sono che un correre dietro al vento. Bisognerà demolire tutto, perché abbiamo subito una sorta di lavaggio del cervello da parte della società, che ci fa credere che senza un certo tenore di vita abbiamo fallito. Dobbiamo resistere a ciò che il mondo ci propone, altrimenti ne pagheremo il prezzo: i nostri standard non sono quelli del mondo.|1 Pietro 1:13-25 — se siamo stati veramente rigenerati da Dio, i nostri pensieri non dovrebbero conformarsi a questo mondo. Romani 12:1-2 — se la nostra intelligenza non è rinnovata, cadremo nel conformismo, non essendo stati trasformati dalla parola; e Giacomo ci insegna che chiunque ama il mondo si fa nemico di Dio (Giacomo 4:4).|1 Giovanni 5 — se abbiamo lo Spirito Santo, certe cose non possiamo farle (lo Spirito Santo in te non può portarti a insultare lo Spirito Santo — parlando del peccato che conduce alla morte; il che non esclude che si possa peccare avendo lo Spirito Santo, 1 Giovanni 1:9, ma certi estremi non possiamo oltrepassarli).|Dobbiamo tenere presente che il mondo in cui viviamo è dominato dal male, e dunque restare aggrappati al fatto che siamo pellegrini, per non conformarci ma essere trasformati, affinché la nostra mente sia rinnovata. Le mura di Gerico devono cadere affinché lo Spirito smonti i vecchi paradigmi. Il combattimento è spirituale, e dunque dovremo fare dei sacrifici per i nostri figli.|E IL MEZZO PER RIPORTARE LA VITTORIA SUL MONDO È LA NOSTRA FEDE!|Che il Signore ci benedica in Gesù Cristo." }
  },
  {
    id:"pourquoi-les-europeens-ne-vont-ils-pas-dans-les-eglises-des", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-30", auteur:"Gaël, le frère",
    titre:{ fr:"Pourquoi les europeens ne vont-ils pas dans les \"Églises\" des africains ??",
           en:"Why do Europeans not go to the 'churches' of Africans?",
           it:"Perché gli europei non vanno nelle «chiese» degli africani?" },
    verset:{ fr:"" },
    extrait:{ fr:"La question en elle-même intrigante parce qu'elle suscite une autre question : les africains ont-ils une église à eux ? Ou bien les européens ? c'est un fait triste parce qu'on se rend compte que…",
             en:"The question raises another: do Africans have a church of their own? Or Europeans? Why make distinctions if we share the same faith?",
             it:"La domanda ne solleva un'altra: gli africani hanno una chiesa loro? O gli europei? Perché fare distinzioni se condividiamo la stessa fede?" },
    contenu:{ fr:"La question en elle-même intrigante parce qu'elle suscite une autre question : les africains ont-ils une église à eux ? Ou bien les européens ? c'est un fait triste parce qu'on se rend compte que dans la plupart de nos communautés, qui se ressemblent s'assemblent, ici il se pose le problème de la communauté de la foi, pourquoi faire des distinctions si on partage la même foi ?|Galates3 :25-29 le fait démontre clairement qu'il y'a un sérieux problème dans le milieu chrétien car on devrait se sentir l'aise dans une assemblée des saints peu importe les origines.",
             en:"The question is intriguing in itself, because it raises another question: do Africans have a church of their own? Or do Europeans? It is a sad fact, because we realise that in most of our communities, birds of a feather flock together. Here the problem of the community of faith arises: why make distinctions if we share the same faith?|Galatians 3:25-29 — this fact clearly shows that there is a serious problem in Christian circles, for one should feel at home in an assembly of the saints whatever one's origins.",
             it:"La domanda è di per sé sconcertante, perché ne suscita un'altra: gli africani hanno forse una chiesa loro? O gli europei? È un fatto triste, perché ci si rende conto che nella maggior parte delle nostre comunità chi si somiglia si raduna. Qui si pone il problema della comunità della fede: perché fare distinzioni se condividiamo la stessa fede?|Galati 3:25-29 — questo fatto dimostra chiaramente che c'è un serio problema nell'ambiente cristiano, perché ci si dovrebbe sentire a proprio agio in un'assemblea dei santi qualunque siano le origini." }
  },
  {
    id:"la-mort-de-clarisse-valery-qu-est-ce-qu-elle-enseigne", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-29", auteur:"Gaël, le frère",
    titre:{ fr:"La mort de clarisse valery qu'est-ce qu'elle enseigne ??",
           en:"The death of Clarisse Valery: what does it teach us?",
           it:"La morte di Clarisse Valery: che cosa ci insegna?" },
    verset:{ fr:"" },
    extrait:{ fr:"Cette affaire pose trois problèmes :1-la proximité de la famille,",
             en:"Three problems: closeness to family, the world's gaze, and each person before his own life — with a note on worldly music in the assemblies, and on the location of the garden of Eden.",
             it:"Tre problemi: la vicinanza della famiglia, lo sguardo della società e la persona di fronte alla propria vita — con una nota sulla musica mondana nelle assemblee e sulla collocazione del giardino di Eden." },
    contenu:{ fr:"Cette affaire pose trois problèmes :1-la proximité de la famille,|2-la vision de la société et 3- et la personne face à sa propre vie.|Il est important de savoir comment réagir lorsque certaines situations se présentent dans notre famille, parce que la famille est sacrée, on ne peut s'en séparer parce qu'on ne l'a pas choisie même étant enfant du Seigneur on a des responsabilités face à notre famille.|1Jean5 :19-22, on ne doit pas se retrouver à abandonner les gens parce que se dit-on ils sont mauvais parce qu'en réalité nous n'avons pas à lutter contre la chair mais l'esprit ; en d'autres mots la personne en elle-même n'est pas un problème mais c'est l'esprit qui est en elle. C’est pourquoi il est important d'être prudent avec l'entourage, ceux de notre entourage qui ne sont pas des enfants du Seigneur sont de potentiels instruments que l'ennemi peut utiliser contre nous même s'ils ne sont pas des sorciers. La prudence dans ce qu'on dit ou fait à/avec les autres car nous sommes naïfs mais eux savent ce qu'ils font.|La 2 em attitude à adopter est la sagesse c’est-à-dire agir par l'esprit et interroger à chaque fois la volonté du Seigneur. Nous vivons dans un monde où les gens utilisent tout pour tout et les gens s'en foutent de votre malheur, car ils n'hésitent pas à l'utiliser si ça peut leur apporter un quelconque intérêt.|Au-delà de tout, chacun a sa part de responsabilité car peu importe le comportement de la famille et de l'entourage c'est nous qui serons face au Seigneur plu tard il est donc important de se comporter en conséquence, il est indispensable de se faire violence sinon le prix à payer sera grand.|L’aspect musique :|À noter ici les rythmes mondains qu'on a pris pour faire des musiques \"chrétiennes » ; les musiques chrétiennes transformées en mondaine ; les danses mondaines dans les assemblées. Qu'est ce qui se passe en fait ? Il est très important à ce que nous suivons ou faisons-en assemblée car on peut être clairement en train d'honorer Satan et penser qu'on n'honore le Seigneur. Nous sommes chrétiens, la lumière du monde on n'a donc pas besoin d'inviter les ténèbres dans notre louange. Le Seigneur ne regarde pas à combien tu sais ambiancer, ni combien tu sais danser. C’est au cœur qu'il regarde et la louange se fait en esprit peu importe la qualité de ta voix la louange avec un cœur sincère est celle que le Seigneur agrée !|OU SE TROUVE LE JARDIN D’EDEN ??|Genèse2 :1-13 Kutch est une nation réelle, qui a réellement existé, ça réfute déjà l'idée que le jardin d’Eden se trouvait au ciel ! Genèse10 : 1,6-8 ''Kutch, Seba, Havila\" sont e fait en Afrique et donc le jardin d'Eden se trouvait en Afrique si on voudrait localiser ce serait de la partie Nord-est vers le Moyen-Orient.|Sachant que les africains sont des descendants de Cham l'esclavage qu'a subi l'Afrique et qu'elle subisse encore ne serait pas un accomplissement de la prophétie de Noé sur Cham ? Si c'est le cas devons-nous prier pour que cela change ?|On ne peut pas simplement dire que l'Afrique aujourd'hui encore subi les effets de la prophétie , déjà que ce n'est plus autant valable comme  au temps de la traite négrière et autres, et une chose importante est de savoir que ce n'est pas parce que une  prophétie a été dite qu'il faut l'utiliser pour des fins à se satisfaire soi ; par exemple il était écrit que Jésus devait mourir mais la parole dit encore malheur à celui par qui cela arrive, ou encore la punition de Babylone parce qu'il avait assujetti Israël or c'est le Seigneur qui avait dit que ça se fera ainsi. Ces choses ont une connotation spirituelle importante.|Il n'est pas nécessaire de prier pour faire changer les choses, déjà qu'étant enfant de Dieu même si la malédiction est encore sur l'Afrique nous en sommes exempt parce qu'étant juste des pèlerins et donc on n'est pas sous ce joug-là.",
             en:"This affair raises three problems: 1) closeness to the family;|2) the way society looks on; and 3) the person before his own life.|It is important to know how to react when certain situations arise in our family, because the family is sacred: we cannot cut ourselves off from it, for we did not choose it; even as children of the Lord we have responsibilities towards our family.|1 John 5:19-21 — we must not end up abandoning people on the grounds that they are bad, because in reality our fight is not against flesh but against the spirit; in other words, the person himself is not the problem, but the spirit that is in him. That is why it is important to be prudent with those around us: those in our circle who are not children of the Lord are potential instruments the enemy can use against us, even if they are not sorcerers. Prudence in what we say or do to and with others — for we are naive, but they know what they are doing.|The second attitude to adopt is wisdom, that is, acting by the Spirit and asking the Lord's will each time. We live in a world where people use everything for anything, and people do not care about your misfortune — they will not hesitate to use it if it can bring them any advantage.|Beyond all this, each one bears his share of responsibility, for whatever the behaviour of family and entourage, it is we who will stand before the Lord later. It is therefore important to behave accordingly; we must do violence to ourselves, otherwise the price to pay will be great.|The music aspect:|Note here the worldly rhythms taken to make 'Christian' songs; Christian songs turned worldly; worldly dances in the assemblies. What is actually going on? What we follow or do in the assembly matters greatly, for one can clearly be honouring Satan while thinking one is honouring the Lord. We are Christians, the light of the world; we therefore have no need to invite darkness into our praise. The Lord does not look at how well you can liven up the room, nor how well you can dance. It is at the heart that He looks, and praise is offered in spirit; whatever the quality of your voice, praise with a sincere heart is the praise the Lord accepts!|WHERE IS THE GARDEN OF EDEN?|Genesis 2:10-13 — Cush is a real nation, which really existed; that already refutes the idea that the garden of Eden was in heaven! Genesis 10:1, 6-8 — 'Cush, Seba, Havilah' are in fact in Africa, so the garden of Eden was in Africa; if we wanted to locate it, it would be from the north-east towards the Middle East.|Knowing that Africans are descendants of Ham, would the slavery Africa suffered, and still suffers, not be a fulfilment of Noah's prophecy concerning Ham? If so, should we pray for that to change?|We cannot simply say that Africa today still suffers the effects of that prophecy — it no longer applies as in the days of the slave trade and the like. One important thing to know is that just because a prophecy has been spoken does not mean it may be used for self-serving ends. For example, it was written that Jesus had to die, but the word also says: woe to the man by whom it happens; or again, the punishment of Babylon for having subjugated Israel, even though it was the Lord who had said it would be so. These things have an important spiritual dimension.|It is not necessary to pray to change things: being children of God, even if the curse were still on Africa, we are exempt from it, being merely pilgrims — we are not under that yoke.",
             it:"Questa vicenda pone tre problemi: 1) la vicinanza della famiglia;|2) lo sguardo della società; e 3) la persona di fronte alla propria vita.|È importante sapere come reagire quando certe situazioni si presentano nella nostra famiglia, perché la famiglia è sacra: non ce ne si può separare, perché non l'abbiamo scelta; anche da figli del Signore abbiamo delle responsabilità verso la nostra famiglia.|1 Giovanni 5:19-21 — non dobbiamo ritrovarci ad abbandonare le persone dicendoci che sono cattive, perché in realtà non dobbiamo lottare contro la carne ma contro lo spirito; in altre parole, la persona in sé non è il problema, ma lo spirito che è in lei. Per questo è importante essere prudenti con chi ci circonda: quelli del nostro entourage che non sono figli del Signore sono potenziali strumenti che il nemico può usare contro di noi, anche se non sono stregoni. Prudenza in ciò che diciamo o facciamo agli altri e con gli altri — perché noi siamo ingenui, ma loro sanno quello che fanno.|Il secondo atteggiamento da adottare è la saggezza, cioè agire per lo Spirito e interrogare ogni volta la volontà del Signore. Viviamo in un mondo in cui la gente usa tutto per tutto e non si cura della vostra disgrazia: non esiterà a usarla se può trarne un qualche interesse.|Al di là di tutto, ciascuno ha la sua parte di responsabilità, perché qualunque sia il comportamento della famiglia e dell'entourage, saremo noi a trovarci davanti al Signore più tardi. È dunque importante comportarsi di conseguenza; è indispensabile farsi violenza, altrimenti il prezzo da pagare sarà grande.|L'aspetto musicale:|Da notare qui i ritmi mondani presi per fare musiche 'cristiane'; le musiche cristiane trasformate in mondane; le danze mondane nelle assemblee. Che cosa sta succedendo in realtà? È molto importante ciò che seguiamo o facciamo in assemblea, perché si può chiaramente stare onorando Satana pensando di onorare il Signore. Siamo cristiani, la luce del mondo: non abbiamo dunque bisogno di invitare le tenebre nella nostra lode. Il Signore non guarda a quanto sai animare, né a quanto sai ballare. È al cuore che guarda, e la lode si fa in spirito; qualunque sia la qualità della tua voce, la lode con un cuore sincero è quella che il Signore gradisce!|DOVE SI TROVA IL GIARDINO DI EDEN?|Genesi 2:10-13 — Cus è una nazione reale, realmente esistita: questo confuta già l'idea che il giardino di Eden si trovasse in cielo! Genesi 10:1, 6-8 — 'Cus, Seba, Avila' sono in effetti in Africa, e dunque il giardino di Eden si trovava in Africa; volendolo localizzare, sarebbe dalla parte nord-orientale verso il Medio Oriente.|Sapendo che gli africani sono discendenti di Cam, la schiavitù che l'Africa ha subito e subisce ancora non sarebbe un compimento della profezia di Noè su Cam? Se è così, dobbiamo pregare perché ciò cambi?|Non si può semplicemente dire che l'Africa ancora oggi subisca gli effetti della profezia — già non vale più come al tempo della tratta degli schiavi e simili. Una cosa importante da sapere è che non è perché una profezia è stata pronunciata che la si può usare per fini personali; per esempio, era scritto che Gesù doveva morire, ma la parola dice anche: guai a colui per mezzo del quale ciò avviene; o ancora, la punizione di Babilonia per aver assoggettato Israele, benché fosse il Signore ad aver detto che così sarebbe stato. Queste cose hanno una connotazione spirituale importante.|Non è necessario pregare per far cambiare le cose: essendo figli di Dio, anche se la maledizione fosse ancora sull'Africa, noi ne siamo esenti, essendo soltanto pellegrini — non siamo sotto quel giogo." }
  },
  {
    id:"question-un-enfant-de-dieut-peut-il-prier-pour-demander-des", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-28", auteur:"Gaël, le frère",
    titre:{ fr:"Question : un enfant de Dieu peut-il prier pour demander des choses physiques ???",
           en:"Question: may a child of God pray for physical things?",
           it:"Domanda: un figlio di Dio può pregare per chiedere cose materiali?" },
    verset:{ fr:"" },
    extrait:{ fr:"Déjà dans la prière nous n'avons pas de limite dans ce que nous pouvons demander ou pas, nous devons juste avoir des priorités. Éphésiens6 :18. Philippiens 4 :6-7 nous avons le droit de demander…",
             en:"In prayer there is no limit to what we may ask; we simply need priorities. There is a difference between asking and worrying — seek FIRST the kingdom and righteousness of God.",
             it:"Nella preghiera non c'è limite a ciò che possiamo chiedere; dobbiamo solo avere delle priorità. C'è differenza tra chiedere e preoccuparsi — cercate PRIMA il regno e la giustizia di Dio." },
    contenu:{ fr:"Déjà dans la prière nous n'avons pas de limite dans ce que nous pouvons demander ou pas, nous devons juste avoir des priorités. Éphésiens6 :18. Philippiens 4 :6-7 nous avons le droit de demander au Seigneur ce dont nous avons besoin|Mathieu6 :19-34|Ce que nous demandons rend compte de l'état de notre cœur. Pourquoi on se fait du souci pour les choses matérielles alors que le Seigneur dont nous disons être les enfants à soin des herbes des champs ?  Agar est un exemple de ce que le Seigneur nous exauce même dans les moindres choses, et c'est en fait ça l'essence de l'intimité avec le Seigneur telle une relation avec un père qu'on interroge pour tous et à qui on demande tout ce dont on a besoin ce père-là se sent honoré et est heureux de combler son enfant il en est de même pour notre Seigneur. Chercher PREMIEREMENT le royaume et la justice de Dieu non pas seulement mais premièrement. D’abord les choses spirituelles ensuite les matérielles.|Il y'a une différence entre demander et se soucier, nous pouvons prier pour demander une chose mais pas en faire une raison de s'inquiéter. Le fait de s'inquiéter du demain, de faire des plans sur comment quand on aura des enfants en se basant sur notre situation d’aujourd’hui es le signe qu'on a un problème, est le symbole même du fait qu'on ne fait pas confiance au Seigneur. Comment moi enfant de Dieu je peux me dire que je vais décider de ne plus faire telle ou telle autre chose, que je ne ferai pas d'enfant parce que ma situation actuelle ne me le permet pas et pourtant je dis de ma bouche que c'est le Seigneur qui a soin de demain ? Nous rendons-nous vraiment compte de ce que de par notre attitude nous disons au Seigneur que c'est nous qui commandons et pas Lui ?|Le Seigneur veut que nous ayons à cœur les choses spirituelles, que notre priorité soit le bien-être des frères, qu'on prie, jeune et rende grâce les uns pour les autres. Si nous nous considérons vraiment comme des pèlerins sur cette terre nous aurons une considération primordiale pour les choses célestes et tout ce qui est terrestre sera relégué au second rang.|Psaumes 127 si ce n'est pas le Seigneur qui œuvre et qui travaille dans notre vie alors tout ce que nous faisons est vain.|Jeans2 : 23-25 ne nous fions pas au témoignage des hommes car ils peuvent nous tromper, beaucoup sont devenus ennemi de Dieu parce qu'ils ont fait confiance à ce que disait l'homme et se sont élevés eux même. Le plus important c'est le témoignage que le Seigneur fait de nous comme il a fait pour Jésus : 3 celui-ci est mon Fils bien-aimé…\". Nous devons chercher la face de Dieu non pour plaire aux hommes mais à Dieu lui-même. Travaillons à sonder la pensée du Seigneur dans ce que nous faisons. Que le Seigneur nous aide à nous poser des questions justes et de prêter attention aux répons. Que dans chaque chose que nous faisons, dans tout ce qui se passe dans le monde et dans tout ce que nous faisons dans nos vies nous devons nous demander :|Quelle est l’origine ?? Quel est le but ?? À qui ça profite ??|Souvenons-nous que nous sommes dans le monde mais pas du monde.|\"si vous savez ces choses, vous êtes heureux, pourvu que vous les pratiquiez. Je ne parle point de vous tous mais je sais ceux que j'ai choisi ;\" jean13 :17-18|Que le seigneur nous bénisse tous !!",
             en:"First of all, in prayer there is no limit to what we may or may not ask; we simply need to have priorities (Ephesians 6:18). Philippians 4:6-7 — we have the right to ask the Lord for what we need.|Matthew 6:19-34.|What we ask for reveals the state of our heart. Why do we worry about material things, when the Lord whose children we claim to be cares even for the grass of the field? Hagar is an example of how the Lord answers us even in the smallest things — and that is in fact the essence of intimacy with the Lord: like a relationship with a father whom one consults about everything and from whom one asks everything one needs; such a father feels honoured and is happy to provide for his child, and it is the same with our Lord. Seek FIRST the kingdom and the righteousness of God — not 'only', but first. First the spiritual things, then the material.|There is a difference between asking and worrying: we may pray to ask for something, but not make it a cause of anxiety. Worrying about tomorrow, making plans about when we will have children based on our situation today, is the sign of a problem — the very symbol of not trusting the Lord. How can I, a child of God, tell myself that I will decide to stop doing this or that, that I will not have children because my present situation does not allow it, and yet say with my mouth that it is the Lord who takes care of tomorrow? Do we really realise that by our attitude we are telling the Lord that it is we who are in command, and not He?|The Lord wants us to have spiritual things at heart — that our priority be the well-being of the brethren; that we pray, fast and give thanks for one another. If we truly consider ourselves pilgrims on this earth, we will give first place to heavenly things, and everything earthly will be relegated to second place.|Psalm 127 — if it is not the Lord who works and labours in our life, then everything we do is vain.|John 2:23-25 — let us not rely on the testimony of men, for they can deceive us; many have become enemies of God because they trusted what man said and exalted themselves. What matters most is the testimony the Lord bears about us, as He did for Jesus: 'This is my beloved Son...' We must seek the face of God not to please men but God Himself. Let us labour to search out the Lord's mind in what we do. May the Lord help us to ask the right questions and pay attention to the answers. In everything we do, in everything happening in the world and in everything we do in our lives, we must ask ourselves:|What is its origin? What is its aim? Who profits from it?|Let us remember that we are in the world but not of the world.|'If you know these things, blessed are you if you do them. I do not speak of you all; I know whom I have chosen' (John 13:17-18).|May the Lord bless us all!",
             it:"Anzitutto, nella preghiera non abbiamo limiti in ciò che possiamo chiedere o no; dobbiamo solo avere delle priorità (Efesini 6:18). Filippesi 4:6-7 — abbiamo il diritto di chiedere al Signore ciò di cui abbiamo bisogno.|Matteo 6:19-34.|Ciò che chiediamo rivela lo stato del nostro cuore. Perché ci preoccupiamo delle cose materiali, quando il Signore di cui ci diciamo figli ha cura perfino dell'erba dei campi? Agar è un esempio del fatto che il Signore ci esaudisce anche nelle minime cose — ed è proprio questa l'essenza dell'intimità con il Signore: come una relazione con un padre che si consulta per tutto e a cui si chiede tutto ciò di cui si ha bisogno; quel padre si sente onorato ed è felice di colmare suo figlio, e lo stesso vale per il nostro Signore. Cercare PRIMA il regno e la giustizia di Dio — non 'soltanto', ma prima. Prima le cose spirituali, poi quelle materiali.|C'è differenza tra chiedere e preoccuparsi: possiamo pregare per chiedere una cosa, ma non farne un motivo di inquietudine. Preoccuparsi del domani, fare piani su quando avere figli basandosi sulla nostra situazione di oggi, è il segno di un problema — il simbolo stesso del fatto che non ci fidiamo del Signore. Come posso io, figlio di Dio, dirmi che deciderò di non fare più questa o quella cosa, che non avrò figli perché la mia situazione attuale non me lo permette, e intanto dire con la mia bocca che è il Signore che ha cura del domani? Ci rendiamo davvero conto che con il nostro atteggiamento diciamo al Signore che siamo noi a comandare, e non Lui?|Il Signore vuole che abbiamo a cuore le cose spirituali, che la nostra priorità sia il bene dei fratelli; che preghiamo, digiuniamo e rendiamo grazie gli uni per gli altri. Se ci consideriamo davvero pellegrini su questa terra, daremo il primo posto alle cose celesti, e tutto ciò che è terreno sarà relegato in secondo piano.|Salmo 127 — se non è il Signore che opera e lavora nella nostra vita, allora tutto ciò che facciamo è vano.|Giovanni 2:23-25 — non fidiamoci della testimonianza degli uomini, perché possono ingannarci; molti sono diventati nemici di Dio perché hanno dato fiducia a ciò che diceva l'uomo e si sono innalzati. La cosa più importante è la testimonianza che il Signore rende di noi, come ha fatto per Gesù: 'Questi è il mio Figlio diletto...' Dobbiamo cercare il volto di Dio non per piacere agli uomini ma a Dio stesso. Lavoriamo a scrutare il pensiero del Signore in ciò che facciamo. Che il Signore ci aiuti a porci le domande giuste e a prestare attenzione alle risposte. In ogni cosa che facciamo, in tutto ciò che avviene nel mondo e in tutto ciò che facciamo nelle nostre vite, dobbiamo chiederci:|Qual è l'origine? Qual è lo scopo? A chi giova?|Ricordiamoci che siamo nel mondo ma non del mondo.|'Se sapete queste cose, siete beati se le fate. Non parlo di tutti voi; io conosco quelli che ho scelti' (Giovanni 13:17-18).|Che il Signore ci benedica tutti!" }
