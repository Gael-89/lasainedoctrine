<style>
:root{
  --nuit:#1C2545;          /* bleu de minuit — fonds profonds */
  --nuit-2:#141B33;
  --parchemin:#FAF6EC;     /* fond de lecture */
  --parchemin-2:#F2ECDC;
  --or:#B8933F;            /* or ancien — accent */
  --or-clair:#D9BC72;
  --encre:#23252B;         /* texte principal */
  --encre-douce:#5A5D66;
  --blanc:#FFFFFF;
  --rouge:#8A3324;         /* rappel des lettrines anciennes */
  --ombre:0 10px 30px rgba(28,37,69,.12);
  --rayon:10px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:'Spectral',Georgia,serif;
  background:var(--parchemin);
  color:var(--encre);
  line-height:1.75;
  font-size:17px;
}
img,iframe{max-width:100%}
a{color:inherit}
h1,h2,h3,.display{font-family:'Cormorant Garamond',Georgia,serif;line-height:1.15}
.ui{font-family:'Inter',system-ui,sans-serif}

/* ---------- En-tête ---------- */
.bandeau-verset{
  background:var(--nuit-2);color:var(--or-clair);
  font-family:'Inter',sans-serif;font-size:.78rem;letter-spacing:.06em;
  text-align:center;padding:.45rem 1rem;
}
header.site{
  position:sticky;top:0;z-index:60;
  background:var(--nuit);color:var(--parchemin);
  border-bottom:1px solid rgba(217,188,114,.35);
}
.nav-int{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:1.5rem;padding:.8rem 1.25rem}
.logo{display:flex;flex-direction:column;text-decoration:none;line-height:1.05}
.logo .titre{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:1.55rem;color:var(--parchemin)}
.logo .titre em{color:var(--or-clair);font-style:normal}
.logo .sous{font-family:'Inter',sans-serif;font-size:.62rem;letter-spacing:.28em;text-transform:uppercase;color:var(--or-clair)}
nav.principale{margin-left:auto;display:flex;align-items:center;gap:.25rem}
nav.principale a,nav.principale button.menu-item{
  font-family:'Inter',sans-serif;font-size:.86rem;font-weight:500;color:var(--parchemin);
  text-decoration:none;background:none;border:0;cursor:pointer;
  padding:.55rem .75rem;border-radius:6px;
}
nav.principale a:hover,nav.principale button.menu-item:hover{background:rgba(217,188,114,.14);color:var(--or-clair)}
.deroulant{position:relative}
.deroulant .panneau{
  position:absolute;top:calc(100% + 6px);left:0;min-width:280px;
  background:var(--blanc);color:var(--encre);border-radius:var(--rayon);
  box-shadow:var(--ombre);padding:.5rem;display:none;border-top:3px solid var(--or);
}
.deroulant.ouvert .panneau{display:block}
.deroulant .panneau a{display:block;padding:.6rem .8rem;border-radius:6px;color:var(--encre);font-size:.88rem}
.deroulant .panneau a:hover{background:var(--parchemin);color:var(--nuit)}
.deroulant .panneau a small{display:block;color:var(--encre-douce);font-weight:400;font-size:.75rem}
.zone-compte{display:flex;gap:.5rem;align-items:center}
.btn{
  font-family:'Inter',sans-serif;font-size:.85rem;font-weight:600;cursor:pointer;
  border-radius:8px;padding:.55rem 1.05rem;border:1px solid transparent;text-decoration:none;display:inline-block;
}
.btn-or{background:var(--or);color:var(--nuit-2)}
.btn-or:hover{background:var(--or-clair)}
.btn-contour{background:transparent;color:var(--parchemin);border-color:rgba(250,246,236,.45)}
.btn-contour:hover{border-color:var(--or-clair);color:var(--or-clair)}
.btn-nuit{background:var(--nuit);color:var(--parchemin)}
.btn-nuit:hover{background:var(--nuit-2)}
.burger{display:none;background:none;border:0;color:var(--parchemin);font-size:1.6rem;cursor:pointer;margin-left:auto}
.langues{display:flex;gap:2px;border:1px solid rgba(250,246,236,.35);border-radius:999px;padding:2px;margin-left:.3rem}
.langues button{
  background:none;border:0;color:var(--parchemin);font-family:'Inter',sans-serif;
  font-size:.7rem;font-weight:600;padding:.32rem .55rem;border-radius:999px;cursor:pointer;letter-spacing:.04em;
}
.langues button.actif{background:var(--or);color:var(--nuit-2)}

/* ---------- Héros ---------- */
.heros{
  background:
    radial-gradient(1100px 420px at 75% -10%, rgba(184,147,63,.22), transparent 60%),
    linear-gradient(180deg,var(--nuit) 0%,var(--nuit-2) 100%);
  color:var(--parchemin);
  padding:4.5rem 1.25rem 5rem;
}
.heros-int{max-width:900px;margin:0 auto;text-align:center}
.ref-biblique{
  font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;
  color:var(--or-clair);display:inline-block;margin-bottom:1.4rem;
}
.heros h1{font-size:clamp(2.4rem,6vw,4.2rem);font-weight:600;margin-bottom:1.2rem}
.verset-heros{
  font-size:clamp(1.05rem,2.4vw,1.35rem);font-style:italic;font-weight:300;
  max-width:640px;margin:0 auto 2.2rem;color:#E9E2CF;
}
.verset-heros .lettrine{
  float:none;display:inline-block;font-family:'Cormorant Garamond',serif;font-style:normal;
  font-size:2.6em;line-height:.8;color:var(--or-clair);vertical-align:-0.18em;margin-right:.06em;
}
.heros .actions{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap}

/* ---------- Séparateur croix ---------- */
.separateur{display:flex;align-items:center;gap:1rem;max-width:1180px;margin:0 auto;padding:0 1.25rem}
.separateur::before,.separateur::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--or) 40%,var(--or) 60%,transparent)}
.separateur span{color:var(--or);font-size:1.05rem}

/* ---------- Sections ---------- */
main{min-height:60vh}
section.bloc{max-width:1180px;margin:0 auto;padding:3.5rem 1.25rem}
.entete-bloc{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin-bottom:1.8rem;flex-wrap:wrap}
.entete-bloc h2{font-size:clamp(1.7rem,3.5vw,2.4rem);font-weight:600;color:var(--nuit)}
.entete-bloc .oeil{font-family:'Inter',sans-serif;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--rouge);display:block;margin-bottom:.35rem}
.lien-tout{font-family:'Inter',sans-serif;font-size:.84rem;font-weight:600;color:var(--nuit);text-decoration:none;border-bottom:1.5px solid var(--or)}
.lien-tout:hover{color:var(--or)}

/* ---------- Cartes d'articles ---------- */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.4rem}
.carte{
  background:var(--blanc);border-radius:var(--rayon);box-shadow:var(--ombre);
  padding:1.6rem 1.5rem 1.4rem;display:flex;flex-direction:column;gap:.7rem;
  border-top:3px solid transparent;transition:transform .18s ease,border-color .18s ease;
}
.carte:hover{transform:translateY(-4px);border-top-color:var(--or)}
.carte .etiquette{
  font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--rouge);
}
.carte h3{font-size:1.35rem;font-weight:600}
.carte h3 a{text-decoration:none;color:var(--nuit)}
.carte h3 a:hover{color:var(--rouge)}
.carte .extrait{color:var(--encre-douce);font-size:.95rem;flex:1}
.carte .pied{display:flex;justify-content:space-between;align-items:center;font-family:'Inter',sans-serif;font-size:.76rem;color:var(--encre-douce);border-top:1px solid var(--parchemin-2);padding-top:.8rem}
.puces-partage{display:flex;gap:.45rem}
.puce{
  width:30px;height:30px;border-radius:50%;border:1px solid var(--parchemin-2);
  display:grid;place-items:center;cursor:pointer;background:var(--blanc);
  font-size:.8rem;color:var(--nuit);transition:all .15s;
}
.puce:hover{background:var(--nuit);color:var(--or-clair);border-color:var(--nuit)}
.puce svg{width:14px;height:14px;fill:currentColor}

/* ---------- Page article ---------- */
.article-page{max-width:760px;margin:0 auto;padding:3.5rem 1.25rem}
.article-page .etiquette{font-family:'Inter',sans-serif;font-size:.72rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--rouge)}
.article-page h1{font-size:clamp(2rem,5vw,3rem);font-weight:600;color:var(--nuit);margin:.6rem 0 .9rem}
.article-page .meta{font-family:'Inter',sans-serif;font-size:.82rem;color:var(--encre-douce);margin-bottom:1.6rem}
.article-page .verset-cle{
  border-left:3px solid var(--or);background:var(--blanc);border-radius:0 var(--rayon) var(--rayon) 0;
  padding:1.1rem 1.4rem;font-style:italic;margin:1.4rem 0;color:var(--nuit);
}
.article-page .corps p{margin-bottom:1.15rem}
.corps .titre-section{font-family:'Cormorant Garamond',serif;font-size:1.55rem;color:var(--bleu-nuit);
  margin:2.2rem 0 .9rem;padding-bottom:.4rem;border-bottom:1px solid rgba(212,175,55,.45)}
.corps .sous-titre-section{font-family:'Spectral',serif;font-size:1.15rem;font-weight:600;
  color:var(--bleu-nuit);margin:1.6rem 0 .7rem}
.corps .puce-texte{margin:0 0 .6rem;padding-left:1.4rem;position:relative}
.corps .puce-texte::before{content:"◆";position:absolute;left:.25rem;color:var(--or);font-size:.7rem;top:.35rem}
.corps strong{font-weight:600;color:var(--bleu-nuit)}
.corps .lien-texte, .lien-texte{color:#8a6d1f;text-decoration:underline;
  text-decoration-color:rgba(212,175,55,.6);text-underline-offset:2px;word-break:break-word}
.corps .lien-texte:hover{color:var(--bleu-nuit);text-decoration-color:var(--or)}
.doc-joint{display:flex;align-items:center;gap:.9rem;background:var(--blanc);border-radius:10px;
  padding:.95rem 1.2rem;margin:1.5rem 0;box-shadow:var(--ombre);text-decoration:none;
  border-left:4px solid var(--or);transition:transform .15s,box-shadow .15s}
.doc-joint:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(16,28,51,.16)}
.doc-icone{background:var(--bleu-nuit);color:var(--or-clair);font-family:'Inter',sans-serif;
  font-size:.7rem;font-weight:600;letter-spacing:.06em;padding:.4rem .6rem;border-radius:5px;flex-shrink:0}
.doc-nom{flex:1;font-family:'Spectral',serif;color:var(--bleu-nuit);font-size:.98rem}
.doc-action{font-family:'Inter',sans-serif;font-size:.76rem;color:var(--or-fonce,#8a6d1f);white-space:nowrap}
.article-page .corps p:first-of-type::first-letter{
  font-family:'Cormorant Garamond',serif;font-size:3.4em;float:left;line-height:.82;
  padding-right:.09em;color:var(--rouge);font-weight:600;
}
.barre-partage{
  margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--parchemin-2);
  display:flex;align-items:center;gap:.7rem;flex-wrap:wrap;
}
.barre-partage .lib{font-family:'Inter',sans-serif;font-size:.78rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--encre-douce)}
.retour{font-family:'Inter',sans-serif;font-size:.85rem;text-decoration:none;color:var(--nuit);border-bottom:1.5px solid var(--or);display:inline-block;margin-bottom:1.5rem}

/* ---------- Chaînes YouTube ---------- */
.fond-nuit{background:linear-gradient(180deg,var(--nuit) 0%,var(--nuit-2) 100%);color:var(--parchemin)}
.fond-nuit .entete-bloc h2{color:var(--parchemin)}
.fond-nuit .entete-bloc .oeil{color:var(--or-clair)}
.onglets-chaines{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.onglet{
  font-family:'Inter',sans-serif;font-size:.84rem;font-weight:600;cursor:pointer;
  padding:.55rem 1.1rem;border-radius:999px;border:1px solid rgba(217,188,114,.4);
  background:transparent;color:var(--parchemin);
}
.onglet.actif,.onglet:hover{background:var(--or);color:var(--nuit-2);border-color:var(--or)}
.cadre-video{
  position:relative;width:100%;padding-top:56.25%;border-radius:var(--rayon);
  overflow:hidden;background:#000;box-shadow:0 18px 45px rgba(0,0,0,.45);
}
.cadre-video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.info-chaine{display:flex;justify-content:space-between;align-items:center;gap:1rem;margin-top:1.1rem;flex-wrap:wrap}
.info-chaine p{font-size:.92rem;color:#D9D3C2;max-width:640px}
.carte-chaine-vide{
  border:1px dashed rgba(217,188,114,.5);border-radius:var(--rayon);
  padding:3rem 1.5rem;text-align:center;color:#D9D3C2;
}

/* ---------- Formulaires ---------- */
.champ{margin-bottom:1.1rem}
.champ label{display:block;font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;margin-bottom:.35rem;color:var(--nuit)}
.champ input,.champ textarea,.champ select{
  width:100%;padding:.7rem .9rem;border:1px solid #DDD5C2;border-radius:8px;
  font-family:'Spectral',serif;font-size:.95rem;background:var(--blanc);color:var(--encre);
}
.champ input:focus,.champ textarea:focus{outline:2px solid var(--or);border-color:var(--or)}
.note-form{font-family:'Inter',sans-serif;font-size:.78rem;color:var(--encre-douce);margin-top:.8rem}
.msg{border-radius:8px;padding:.8rem 1rem;font-family:'Inter',sans-serif;font-size:.85rem;margin-bottom:1rem;display:none}
.msg.ok{display:block;background:#EAF3E6;color:#2F5D2A;border:1px solid #BCD8B2}
.msg.err{display:block;background:#F9E9E5;color:var(--rouge);border:1px solid #E5C4BA}

/* ---------- Fenêtre modale (compte) ---------- */
.voile{
  position:fixed;inset:0;background:rgba(20,27,51,.72);z-index:100;
  display:none;align-items:center;justify-content:center;padding:1.25rem;
}
.voile.ouvert{display:flex}
.modale{
  background:var(--parchemin);border-radius:14px;max-width:440px;width:100%;
  padding:2.2rem;position:relative;border-top:4px solid var(--or);max-height:92vh;overflow:auto;
}
.modale h2{color:var(--nuit);font-size:1.8rem;margin-bottom:.3rem}
.modale .sous-titre{font-size:.92rem;color:var(--encre-douce);margin-bottom:1.4rem}
.fermer{
  position:absolute;top:.9rem;right:1rem;background:none;border:0;font-size:1.5rem;
  cursor:pointer;color:var(--encre-douce);line-height:1;
}
.bascule-auth{font-family:'Inter',sans-serif;font-size:.83rem;text-align:center;margin-top:1.1rem;color:var(--encre-douce)}
.bascule-auth button{background:none;border:0;color:var(--rouge);font-weight:600;cursor:pointer;font-size:.83rem;text-decoration:underline}

/* ---------- Pied de page ---------- */
footer.site{background:var(--nuit-2);color:#C9C3B2;padding:3rem 1.25rem 2rem;margin-top:3rem}
.pied-int{max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.8fr 1fr 1fr 1.2fr;gap:2.2rem}
@media(max-width:980px){.pied-int{grid-template-columns:1fr 1fr}}
footer.site h4{font-family:'Inter',sans-serif;font-size:.75rem;letter-spacing:.24em;text-transform:uppercase;color:var(--or-clair);margin-bottom:.9rem}
footer.site a{color:#C9C3B2;text-decoration:none;display:block;padding:.2rem 0;font-size:.9rem}
footer.site a:hover{color:var(--or-clair)}
.pied-bas{max-width:1180px;margin:2.2rem auto 0;padding-top:1.2rem;border-top:1px solid rgba(217,188,114,.2);font-family:'Inter',sans-serif;font-size:.75rem;text-align:center;color:#8B8877}

/* ---------- Divers ---------- */
.vide{padding:3rem 1rem;text-align:center;color:var(--encre-douce);font-style:italic}
.chip-filtres{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.6rem}
.chip{
  font-family:'Inter',sans-serif;font-size:.8rem;font-weight:600;cursor:pointer;
  padding:.45rem .95rem;border-radius:999px;border:1px solid #DDD5C2;background:var(--blanc);color:var(--nuit);
}
.chip.actif,.chip:hover{background:var(--nuit);color:var(--or-clair);border-color:var(--nuit)}
.avis{position:fixed;bottom:5.4rem;left:50%;transform:translateX(-50%);background:var(--nuit);color:var(--parchemin);font-family:'Inter',sans-serif;font-size:.85rem;padding:.7rem 1.3rem;border-radius:999px;box-shadow:var(--ombre);z-index:120;display:none}

/* ---------- Radio biblique ---------- */
.radio-hero{
  background:
    radial-gradient(900px 380px at 20% -10%, rgba(184,147,63,.25), transparent 60%),
    linear-gradient(180deg,var(--nuit) 0%,var(--nuit-2) 100%);
  color:var(--parchemin);border-radius:16px;padding:3rem 2rem;text-align:center;
  box-shadow:var(--ombre);
}
.radio-hero h2{color:var(--parchemin);font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:.6rem}
.radio-hero p{color:#E9E2CF;max-width:560px;margin:0 auto 1.6rem;font-size:1rem}
.onde{display:flex;gap:5px;justify-content:center;align-items:flex-end;height:38px;margin-bottom:1.6rem}
.onde i{width:5px;background:var(--or-clair);border-radius:3px;height:10px}
.onde.joue i{animation:onde 1s ease-in-out infinite}
.onde i:nth-child(2){animation-delay:.15s}.onde i:nth-child(3){animation-delay:.3s}
.onde i:nth-child(4){animation-delay:.45s}.onde i:nth-child(5){animation-delay:.6s}
.onde i:nth-child(6){animation-delay:.3s}.onde i:nth-child(7){animation-delay:.15s}
@keyframes onde{0%,100%{height:8px}50%{height:34px}}
.radio-ref{font-family:'Cormorant Garamond',serif;font-size:1.5rem;color:var(--or-clair);min-height:2rem;margin-bottom:.4rem}
.radio-etat{font-family:'Inter',sans-serif;font-size:.8rem;color:#B9B4A3;margin-bottom:1.4rem;min-height:1.2rem}
.commandes-radio{display:flex;gap:.7rem;justify-content:center;flex-wrap:wrap}
.btn-rond{
  width:52px;height:52px;border-radius:50%;border:1px solid rgba(217,188,114,.5);
  background:transparent;color:var(--parchemin);font-size:1.15rem;cursor:pointer;
  display:grid;place-items:center;font-family:'Inter',sans-serif;
}
.btn-rond:hover{background:rgba(217,188,114,.15)}
.btn-rond.principal{width:66px;height:66px;background:var(--or);color:var(--nuit-2);border-color:var(--or);font-size:1.5rem}
.btn-rond.principal:hover{background:var(--or-clair)}
.barre-radio{
  position:fixed;bottom:0;left:0;right:0;z-index:110;
  background:var(--nuit-2);color:var(--parchemin);border-top:2px solid var(--or);
  display:none;align-items:center;gap:.9rem;padding:.6rem 1.1rem;
  font-family:'Inter',sans-serif;font-size:.84rem;
}
.barre-radio.active{display:flex}
.barre-radio .ref{font-family:'Cormorant Garamond',serif;font-size:1.05rem;color:var(--or-clair);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.barre-radio button{

  {
    id:"l-effusion-de-sang-et-l-aspersion-de-sang", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-07-02", auteur:"Gaël, le frère",
    titre:{ fr:"L'effusion de sang et l'aspersion de sang",
           en:"The shedding of blood and the sprinkling of blood",
           it:"Lo spargimento del sangue e l'aspersione del sangue" },
    verset:{ fr:"" },
    extrait:{ fr:"Le principe de l'effusion du sang (égorger et recueillir l sang) et de l'aspersion du sang sont en fait lié. Le sang des boucs n'était que l'ombre des choses à venir car il ne pouvait pas…",
             en:"The shedding of blood and the sprinkling of blood are bound together. The blood of goats was only a shadow of things to come — only the perfect blood of Christ could take away sin once for all.",
             it:"Lo spargimento del sangue e l'aspersione del sangue sono legati fra loro. Il sangue dei capri era solo l'ombra dei beni futuri: solo il sangue perfetto di Cristo poteva togliere il peccato una volta per sempre." },
    contenu:{ fr:"Le principe de l'effusion du sang (égorger et recueillir l sang) et de l'aspersion du sang sont en fait lié. Le sang des boucs n'était que l'ombre des choses à venir car il ne pouvait pas définitivement ôter le pécher car il fallait pour cela un sang parfait... Or ce n'est qu'âpres le Saint-Esprit que nous comprenons le sens de toutes ces choses-là. L’effusion du sang porte toute sa signification après le sacrifice de Christ. Hébreux 9 dans l'organisation du tabernacle, le sacrificateur entrait tout le temps dans le lieu saint mais seulement le souverain sacrificateur avait accès au lieu très saint une seule fois dans l'année offrant le sacrifice pour ses péchés avant d'offrir pour ceux du peuple , ceci montrait déjà l'imperfection du sacrifice qui y était fait c'est pourquoi le sang des boucs ne sanctifiait que quant à la chair nous en voulons pour preuve le fait qu'ils étaient frappés dans la chair lorsqu'ils avaient un problème avec Dieu et après le sacrifice ils étaient purifiés. Ceci fait donc qu'on ne pouvait pas servir Dieu comme il se devait en ce temps-là car la conscience n'était pas pure. C'est pourquoi le sacrifice de Christ était nécessaire pour permettre purifier la conscience et donner l'accès à une nouvelle alliance... Sans effusion de sang il n'y a pas de purification. Christ en versant son sang passant par un tabernacle qui n'avait pas été fait de mains d'hommes a résolu le problème du péché une fois pour toute sang car il n'avait pas de péché en lui car le problème de l'homme face au péché est unique c'est pourquoi il n'y a pas deux statuts soit on est de Christ soit on ne l'est pas... Depuis le jardin d'Eden même le principe de l'effusion du sang était déjà établi lorsque le Seigneur tuera un animal innocent pour cacher le pécher d'Adam et Eve couvrir la nudité qui est l'image du péché. Cependant cette effusion de ce sang ne pouvait pas purifier la conscience. Pour ce qui est de l'aspersion du sang elle concerne le fait de tremper qch dans le sang avec pour but de marquer les surfaces qui seront touchées par ce sang c'est donc pourquoi ceux qui ne sont pas marqués du sang de Christ ne seront pas épargnés de la colère de Dieu Hébreux 11:23.|1 pierre : 1-2 l'aspersion du sang c'est donc cet acte de toucher qqn avec le sang de Christ. Exode 24: 6-8 l'engagement du peuple au verset 7 es comme lors du baptême il fait un serment; l'aspersion du sang de Christ est spirituelle pour chaque personne qui entre en Christ pour faire partie de son alliance; lorsque la parole est prêchée et qu'elle baptise la personne qui écoute qui s'engage et est scellé par l'Esprit ainsi Il est aspergé du sang de Christ. Tout est spirituel car Dieu est Esprit et les vrais adorateurs l'adorent en esprit et en vérité, il n'y a pas de raison d'utiliser le sang de Jésus-Christ pour faire quoique ce soit avec (prier se couvrir avec le sang de Christ) ; tout est dans le NOM DE JÉSUS-CHRIST c'est pourquoi nous devons tout faire par ce Nom comme le dit Colossiens 3:17|Le premier baptême c'est la parole de Dieu car comme le dit le Seigneur Jésus dans Jean 3 il faut naître d'eau qui est la parole c'est pourquoi Paul faut allusion à l'évangile de notre salut car chacun a une parole qui lui est destiné afin que l’écoutant, la soif du Seigneur le remplisse et pour que ceci arrive il faut que cet évangile soit prêché par la personne adéquate et pour qu'une personne prêche jusqu'à changer qqn il faut qu'il soit mandaté par le Seigneur car ce mandat contient les personnes à appeler; c'est pourquoi si qqn prêche sans être envoyé il n'est pas en train de faire l'œuvre de Dieu mais contenter sa propre chair... Et un prédicateur qui est envoyé prêche le message adapté au temps vécu et c'est pourquoi la plupart des chrétiens dans les assemblées sont passifs et n'ont aucune relation d'intimité avec le Seigneur",
             en:"The principle of the shedding of blood (slaying the victim and collecting its blood) and that of the sprinkling of blood are in fact bound together. The blood of goats was only a shadow of the things to come, for it could not definitively take away sin: for that, a perfect blood was required. It is only after receiving the Holy Spirit that we understand the meaning of all these things — the shedding of blood carries its full significance after the sacrifice of Christ. In Hebrews 9, in the arrangement of the tabernacle, the priests entered the holy place continually, but only the high priest had access to the most holy place, once a year, offering the sacrifice first for his own sins and then for those of the people. This already showed the imperfection of the sacrifice offered there; that is why the blood of goats sanctified only as regards the flesh. The proof is that the people were struck in their flesh when they had a problem with God, and after the sacrifice they were purified. One could therefore not serve God as one ought in those days, because the conscience was not pure. That is why the sacrifice of Christ was necessary: to purify the conscience and give access to a new covenant. Without the shedding of blood there is no purification. Christ, in pouring out His blood, passing through a tabernacle not made with hands, resolved the problem of sin once for all, for there was no sin in Him. Man's problem before sin is one and the same; that is why there are not two standings: either one belongs to Christ or one does not. From the garden of Eden the principle of the shedding of blood was already established, when the Lord killed an innocent animal to cover the sin of Adam and Eve — covering their nakedness, which is the image of sin. Yet the shedding of that blood could not purify the conscience. As for the sprinkling of blood, it consists in dipping something into the blood in order to mark the surfaces it touches; this is why those who are not marked with the blood of Christ will not be spared from the wrath of God.|1 Peter 1:2 — the sprinkling of blood is that act of touching someone with the blood of Christ. In Exodus 24:6-8, the commitment of the people in verse 7 is like the oath made at baptism. The sprinkling of the blood of Christ is spiritual, for every person who enters into Christ to become part of His covenant: when the word is preached and it baptises the one who hears, who commits himself and is sealed by the Spirit, he is thereby sprinkled with the blood of Christ. Everything is spiritual, for God is Spirit and the true worshippers worship Him in spirit and in truth. There is therefore no reason to use the blood of Jesus Christ to do anything with it (praying to 'cover oneself with the blood of Christ'); everything is in the NAME OF JESUS CHRIST, which is why we must do all things in that Name, as Colossians 3:17 says.|The first baptism is the word of God, for as the Lord Jesus says in John 3, one must be born of water — which is the word. That is why Paul refers to the gospel of our salvation: each person has a word destined for him, so that on hearing it the thirst for the Lord may fill him. For this to happen, that gospel must be preached by the right person; and for someone to preach in a way that truly changes a person, he must be commissioned by the Lord, for that commission contains the people to be called. Therefore if someone preaches without being sent, he is not doing the work of God but gratifying his own flesh. A preacher who is sent preaches the message suited to the present time — and this is why most Christians in the assemblies are passive and have no relationship of intimacy with the Lord.",
             it:"Il principio dello spargimento del sangue (sgozzare la vittima e raccoglierne il sangue) e quello dell'aspersione del sangue sono in realtà legati fra loro. Il sangue dei capri non era che l'ombra delle cose future, perché non poteva togliere definitivamente il peccato: per questo occorreva un sangue perfetto. Solo dopo aver ricevuto lo Spirito Santo comprendiamo il senso di tutte queste cose: lo spargimento del sangue riceve tutto il suo significato dopo il sacrificio di Cristo. In Ebrei 9, nell'ordinamento del tabernacolo, i sacerdoti entravano continuamente nel luogo santo, ma solo il sommo sacerdote aveva accesso al luogo santissimo, una sola volta all'anno, offrendo il sacrificio prima per i propri peccati e poi per quelli del popolo. Questo mostrava già l'imperfezione del sacrificio che vi si compiva; per questo il sangue dei capri santificava solo quanto alla carne. Ne abbiamo la prova nel fatto che il popolo era colpito nella carne quando aveva un problema con Dio, e dopo il sacrificio era purificato. Non si poteva dunque servire Dio come si doveva in quel tempo, perché la coscienza non era pura. Ecco perché il sacrificio di Cristo era necessario: per purificare la coscienza e dare accesso a una nuova alleanza. Senza spargimento di sangue non c'è purificazione. Cristo, versando il suo sangue e passando per un tabernacolo non fatto da mani d'uomo, ha risolto il problema del peccato una volta per sempre, perché in lui non c'era peccato. Il problema dell'uomo di fronte al peccato è unico; per questo non ci sono due condizioni: o si è di Cristo o non lo si è. Fin dal giardino di Eden il principio dello spargimento del sangue era già stabilito, quando il Signore uccise un animale innocente per coprire il peccato di Adamo ed Eva — coprendo la nudità, che è l'immagine del peccato. Tuttavia lo spargimento di quel sangue non poteva purificare la coscienza. Quanto all'aspersione del sangue, essa consiste nell'intingere qualcosa nel sangue allo scopo di segnare le superfici che ne saranno toccate; ecco perché coloro che non sono segnati dal sangue di Cristo non saranno risparmiati dall'ira di Dio.|1 Pietro 1:2 — l'aspersione del sangue è quell'atto di toccare qualcuno con il sangue di Cristo. In Esodo 24:6-8 l'impegno del popolo al versetto 7 è come il giuramento fatto al battesimo. L'aspersione del sangue di Cristo è spirituale, per ogni persona che entra in Cristo per far parte della sua alleanza: quando la parola è predicata e battezza colui che ascolta, che si impegna ed è sigillato dallo Spirito, egli è così asperso del sangue di Cristo. Tutto è spirituale, perché Dio è Spirito e i veri adoratori lo adorano in spirito e verità. Non c'è dunque alcuna ragione di usare il sangue di Gesù Cristo per farne qualcosa (pregare 'coprendosi con il sangue di Cristo'); tutto è nel NOME DI GESÙ CRISTO, ed è per questo che dobbiamo fare ogni cosa in quel Nome, come dice Colossesi 3:17.|Il primo battesimo è la parola di Dio, perché come dice il Signore Gesù in Giovanni 3 bisogna nascere d'acqua — che è la parola. Per questo Paolo fa riferimento al vangelo della nostra salvezza: ciascuno ha una parola che gli è destinata, affinché ascoltandola la sete del Signore lo riempia. E perché ciò avvenga, quel vangelo deve essere predicato dalla persona adeguata; e perché qualcuno predichi fino a trasformare una persona, deve essere mandato dal Signore, perché quel mandato contiene le persone da chiamare. Perciò, se qualcuno predica senza essere stato mandato, non sta facendo l'opera di Dio ma sta compiacendo la propria carne. Un predicatore mandato predica il messaggio adatto al tempo presente — ed è per questo che la maggior parte dei cristiani nelle assemblee è passiva e non ha alcuna relazione di intimità con il Signore." }

  {
    id:"pourquoi-paul-et-les-autres-allaient-dans-les-synagogues", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-07-01", auteur:"Gaël, le frère",
    titre:{ fr:"Pourquoi Paul et les autres allaient dans les synagogues ???",
           en:"Why did Paul and the others go into the synagogues?",
           it:"Perché Paolo e gli altri andavano nelle sinagoghe?" },
    verset:{ fr:"" },
    extrait:{ fr:"La synagogue était le lieu de rassemblement des juifs du même courant de pensée ( les pharisiens, les saducceens....)... En d'autres mots ce sont  les racines des dénominations Actes 6:9-10.",
             en:"The synagogue was the gathering place of Jews of the same school of thought — the roots of today's denominations. The apostles went there not to conform, but to present the Scriptures.",
             it:"La sinagoga era il luogo di raduno dei giudei della stessa corrente di pensiero — le radici delle denominazioni. Gli apostoli vi andavano non per conformarsi, ma per presentare le Scritture." },
    contenu:{ fr:"La synagogue était le lieu de rassemblement des juifs du même courant de pensée ( les pharisiens, les saducceens....)... En d'autres mots ce sont  les racines des dénominations Actes 6:9-10.|Quand les apôtres allaient dans les synagogues ce n'était pas pour se confirmer à leur façon de penser mais c'était pour le présenter les écritures, en essayant de les convaincre de l'erreur dans laquelle ils étaient.|Ils étaient juste conduits par le Seigneur à faire ainsi, comme qqn peut l'être aujourd'hui à aller dans une mosquée où une chapelle cela ne veut pas dire qu'il sera devenu mulsuman ou catholique.|Les apôtres n'étaient pas en contradiction avec la parole \"Dieu n'habite pas dans un temple fait de mains d'homme\".|Ils marchaient dans le plan de Dieu... Car en effet l'homme ne peut pas faire de demeure à Dieu... La  parole de Christ démontre qu'il devait y avoir la transition entre les briques et le corps. Le Seigneur n'habite plus à Jérusalem mais dans nos cœurs avec nous en nous.|En sommes Pierre et Cie y allaient pour essayer de convaincre de l'évangile et certains étaient convaincus et les suivaient d'autres pas... Mais les apôtres ne sont pas retournés au culte dans le temple car ils avaient compris qu'il fallait adorer le Seigneur en esprit.",
             en:"The synagogue was the gathering place of Jews of the same school of thought (the Pharisees, the Sadducees...). In other words, they are the roots of the denominations (Acts 6:9-10).|When the apostles went into the synagogues, it was not to conform to their way of thinking, but to present the Scriptures to them, seeking to convince them of the error in which they stood.|They were simply led by the Lord to do so — just as someone today might be led to enter a mosque or a chapel; that does not mean he has become a Muslim or a Catholic.|The apostles were not in contradiction with the word: 'God does not dwell in temples made with hands.'|They were walking in the plan of God. For indeed man cannot make a dwelling for God; the word of Christ shows that there had to be a transition from bricks to the body. The Lord no longer dwells in Jerusalem, but in our hearts — with us, in us.|In short, Peter and the others went there to try to convince people of the gospel; some were convinced and followed them, others were not. But the apostles did not return to the temple worship, for they had understood that the Lord must be worshipped in spirit.",
             it:"La sinagoga era il luogo di raduno dei giudei della stessa corrente di pensiero (i farisei, i sadducei...). In altre parole, sono le radici delle denominazioni (Atti 6:9-10).|Quando gli apostoli andavano nelle sinagoghe non era per conformarsi al loro modo di pensare, ma per presentare loro le Scritture, cercando di convincerli dell'errore in cui si trovavano.|Erano semplicemente condotti dal Signore ad agire così — come qualcuno oggi può essere condotto ad andare in una moschea o in una cappella: ciò non significa che sia diventato musulmano o cattolico.|Gli apostoli non erano in contraddizione con la parola: 'Dio non abita in templi fatti da mani d'uomo.'|Camminavano nel piano di Dio. In effetti l'uomo non può fare una dimora a Dio; la parola di Cristo mostra che doveva esserci la transizione dai mattoni al corpo. Il Signore non abita più a Gerusalemme, ma nei nostri cuori — con noi, in noi.|In sintesi, Pietro e gli altri vi andavano per cercare di convincere del vangelo; alcuni erano convinti e li seguivano, altri no. Ma gli apostoli non sono tornati al culto del tempio, perché avevano compreso che bisogna adorare il Signore in spirito." }

  {
    id:"dieu-le-seigneur-jesus-christ-nous-aime-vraiment", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-30", auteur:"Gaël, le frère",
    titre:{ fr:"Dieu, le Seigneur Jésus-Christ nous aime vraiment",
           en:"God, the Lord Jesus Christ, truly loves us",
           it:"Dio, il Signore Gesù Cristo, ci ama davvero" },
    verset:{ fr:"" },
    extrait:{ fr:"La création tout entière expérimente l'amour de Dieu, même les personnes qui ne l'aiment pas en font l'expérience. Et souvent nous sommes distraits par les circonstances, l'actualité, que nous…",
             en:"All creation experiences the love of God — even those who do not love Him. Circumstances often distract us from this love, yet it is the most wonderful thing that exists.",
             it:"Tutta la creazione sperimenta l'amore di Dio — perfino coloro che non lo amano. Le circostanze spesso ci distraggono da questo amore, che è la cosa più meravigliosa che esista." },
    contenu:{ fr:"La création tout entière expérimente l'amour de Dieu, même les personnes qui ne l'aiment pas en font l'expérience. Et souvent nous sommes distraits par les circonstances, l'actualité, que nous perdons de vue cet amour, alors que c'est la chose la plus merveilleuse et formidable qui puisse exister. Ce qui arrive lorsqu'on se converti c'est qu'on se rend compte que cet amour a toujours été là mais on ne le voyait pas, et on se sent mal et on a le mépris pour sa propre personne à cause du fait qu'on a foulé au pied cette amour. On était aveugle, et pourquoi ?? Parce que nous les hommes perçoivent les choses en fonctions de ce que nous voyons et ça c'est une mauvaise perception car la qualification se fait en fonction de nos sentiments. Par exemple, les enfants quand ils grandissent c'est alors qu'ils comprennent que la réprimande était pour la bonne cause or quand il est petit il perçoit que c'est de la brimade inutile, de la haine etc. Et parfois c'est ce qui arrive avec Dieu car nous le qualifions en fonction des sentiments dans notre cœur, on a tous des pourquoi dans nos cœurs qui fassent qu'on perçoit mal l'amour de Dieu. On se demande pourquoi moi ? Pourquoi moi qui suis juste je souffre alors que le méchant prospère ? Pourquoi malgré ma droiture ce sont les injustes qui mènent une vue épanouie ? Dans ces questions sans réponse, on se demande où est Dieu ? Où est-Il passé ? À quoi bon rester dans la droiture du c'est pour subir ça !? Si Dieu m'aimait est-ce que... ? Chacun de nous a au moins une question sans réponse dans sa vie pour laquelle seul Dieu sait. Dans la plupart des cas, ces situations nous portent à mal apprécier l'amour de Dieu ; ces questions dont Dieu détient seul la connaissance fait de sorte que nous devons nous abandonner à Dieu car nul ne peut maîtriser tous les contours de sa vie, si qqn a toutes les réponses alors Dieu perdrait sa place... si même Moïse malgré sa proximité avec Dieu n'avait pas toutes les réponses à combien plus forte raison nous ? Parfois au milieu de tous ces blocages, la seule chose à laquelle nous devons rentrer c'est à l'amour de Dieu ; nous le calmons et disons même que Dieu nous aime cependant nous gardons dur notre cœur les situations qui nous dépassent. Il faut que le Seigneur nous révèle que dans nos plaintes, dans nos pleurs, dans nos difficultés, Il a toujours été là même lorsqu'on l'a méprisé, abandonné Il est resté fidèle Il nous aime par-dessus tout. C'est cet amour-là qui surpasse tout car Dieu ne nous juge pas de façon superficielle. Car notre problème n'est pas physique, nous n'avons pas besoin d'une satisfaction charnelle mais spirituelle et c'est le Seigneur seul qui peut nous combler. C'est pourquoi lorsque je Seigneur nous touche on a une satisfaction sui ne quitte pas, même lorsqu'on est faible pour un moment pu affligé pendant un temps on est renouvelé, on ne regarde plus les choses comme avant car Il y a cet amour-là qui nous comble, c'est pourquoi certaines personnes étant couché dans un lit d'hôpital exhortent et encouragent les autres, celles-ci ont perdu l'attachement aux choses physiques, et ne jugent plus l'amour de Dieu par rapport aux choses physiques. Il faut donc se détacher des choses superficielles et physiques et alors on se rend compte que plus les choses vont mal plus on se rapproche de Dieu, on devient des personnes redoutables. Lorsqu'on devient qqn qui ne se soucie plus de l'extérieur, peu importe les situations difficiles par lesquelles on peut passer et on est disponible pour servir le Seigneur on ne remet pas en question l'amour de Dieu, Sa compassion, alors Satan sait qu'il nous a définitivement perdu et il ne plus nous utiliser. Les inquiétudes et les questions existent encore parce qu'on n'est pas encore complètement comblé par l'amour et la présence de Dieu. Le Seigneur nous y conduit et nous posons des résistances à cause de ces choses physiques pays vite nous apprenons mieux c'est. Lorsque nous saurons que le Seigneur nous aime vraiment et que nous aurons compris que le Seigneur nous aime et que ça ne dépend pas des circonstances et lorsque nous aurons reçu la marque de cela alors nous serons des personnes différentes et on vivra différemment. Chacun de nous a un moment où comme Charlotte Eliot le Seigneur te pousse à faire table rase sur toutes ces choses qui font l'objet de nos préoccupations et lorsque le Seigneur nous visite de cette façon, on sent sa misère et on comprend l'immensité de la Grace et l'amour de Dieu. Puissions-nous detour5le regard des questions sans réponses pour les poser sur le Seigneur seul. Puissions-nous trouver en Jésus-Christ les réponses à question. Puissions-nous nous contenter pour un temps des questions qu’il nous a donné nous disant que DIEU NOIS AIME TELLEMENT QU'IL BE PEUT PAS NOUS LAISSER. Quelques soient les craintes les doutes les préoccupations etc. Gardons cela à cœur Dieu nous aime et il ne va jamais nous laisser. DIEU T'AIME ETIL M'AIME. Trouvons la force dans le Seigneur.|Que le Seigneur nous donne cette foi qui transcende les doutes, les circonstances, les problèmes, les difficultés.",
             en:"The whole creation experiences the love of God; even those who do not love Him experience it. And often we are so distracted by circumstances and current events that we lose sight of this love, though it is the most marvellous and wonderful thing that can exist. What happens at conversion is that we realise this love had always been there, but we did not see it; we feel ashamed and despise ourselves for having trampled such love underfoot. We were blind — and why? Because we human beings perceive things according to what we see, and that is a faulty perception, for we judge according to our feelings. Children, for example, only understand when they have grown up that correction was for their good; while small, they perceive it as pointless harshness, even hatred. Sometimes that is how we treat God: we judge Him according to the feelings in our heart. We all carry unanswered 'whys' that distort our view of the love of God. Why me? Why do I, who am upright, suffer while the wicked prosper? In these unanswered questions we wonder: where is God? What is the use of remaining upright if this is the outcome? If God loved me, would He...? Each of us has at least one question in life whose answer God alone knows. In most cases these situations lead us to misjudge the love of God; and these questions, whose knowledge belongs to God alone, mean that we must surrender ourselves to Him, for no one can master every turn of his own life. If even Moses, despite his closeness to God, did not have all the answers, how much less do we? Sometimes, in the midst of all these blockages, the only thing we can return to is the love of God. It takes the Lord Himself to reveal to us that in our complaints, our tears and our difficulties, He was always there; even when we despised and abandoned Him, He remained faithful — He loves us above all. It is that love which surpasses everything, for God does not judge us superficially. Our problem is not physical; we do not need fleshly satisfaction but spiritual, and the Lord alone can fill us. That is why, when the Lord touches us, we receive a satisfaction that does not leave; even when we are weak for a moment or afflicted for a time, we are renewed and no longer look at things as before. This is why some people, lying in a hospital bed, exhort and encourage others: they have lost their attachment to physical things and no longer measure the love of God by them. When we let go of superficial things, we discover that the worse things get, the closer we draw to God, and we become formidable. When we become people who no longer worry about outward things, available to serve the Lord whatever hard situations we pass through, no longer calling His love and compassion into question, then Satan knows he has lost us for good and can no longer use us. Worries and questions remain only because we are not yet fully satisfied with the love and presence of God. The Lord is leading us there, and we resist because of these physical things; but when we know that the Lord truly loves us, that His love does not depend on circumstances, and when we have received the mark of that, we will be different people and will live differently. Each of us has a moment when, like Charlotte Elliott, the Lord moves us to sweep aside all these preoccupations; and when the Lord visits us in this way, we feel our misery and understand the immensity of His grace and love. May we turn our gaze away from unanswered questions to set it on the Lord alone. May we find in Jesus Christ the answer to every question. Whatever the fears, the doubts, the concerns — let us hold this in our hearts: God loves us, and He will never let us go. GOD LOVES YOU, AND HE LOVES ME. Let us find our strength in the Lord.|May the Lord give us that faith which transcends doubts, circumstances, problems and difficulties.",
             it:"L'intera creazione sperimenta l'amore di Dio; perfino le persone che non lo amano ne fanno esperienza. E spesso siamo così distratti dalle circostanze e dall'attualità che perdiamo di vista questo amore, mentre è la cosa più meravigliosa e formidabile che possa esistere. Ciò che accade alla conversione è che ci rendiamo conto che questo amore c'era sempre stato, ma non lo vedevamo; ci sentiamo male e proviamo disprezzo per noi stessi per aver calpestato un tale amore. Eravamo ciechi — e perché? Perché noi uomini percepiamo le cose in funzione di ciò che vediamo, e questa è una percezione sbagliata, perché giudichiamo secondo i nostri sentimenti. I bambini, per esempio, solo da grandi capiscono che il rimprovero era per il loro bene; da piccoli lo percepiscono come una durezza inutile, perfino come odio. A volte è così che trattiamo Dio: lo giudichiamo secondo i sentimenti del nostro cuore. Tutti portiamo dei 'perché' senza risposta che ci fanno percepire male l'amore di Dio. Perché proprio io? Perché io che sono giusto soffro mentre il malvagio prospera? In queste domande senza risposta ci chiediamo: dov'è Dio? A che serve restare nella rettitudine se il risultato è questo? Se Dio mi amasse, forse...? Ognuno di noi ha almeno una domanda nella vita la cui risposta solo Dio conosce. Nella maggior parte dei casi queste situazioni ci portano a giudicare male l'amore di Dio; e queste domande, la cui conoscenza appartiene a Dio solo, fanno sì che dobbiamo abbandonarci a lui, perché nessuno può dominare tutti i risvolti della propria vita. Se perfino Mosè, nonostante la sua vicinanza a Dio, non aveva tutte le risposte, quanto meno noi? A volte, in mezzo a tutti questi blocchi, l'unica cosa a cui possiamo tornare è l'amore di Dio. Occorre che il Signore stesso ci riveli che nei nostri lamenti, nelle nostre lacrime, nelle nostre difficoltà, lui c'è sempre stato; anche quando lo abbiamo disprezzato e abbandonato, è rimasto fedele — ci ama al di sopra di tutto. È quell'amore che supera ogni cosa, perché Dio non ci giudica in modo superficiale. Il nostro problema non è fisico: non abbiamo bisogno di una soddisfazione carnale ma spirituale, e solo il Signore può colmarci. Per questo, quando il Signore ci tocca, riceviamo una soddisfazione che non se ne va; anche quando siamo deboli per un momento o afflitti per un tempo, siamo rinnovati e non guardiamo più le cose come prima. Ecco perché alcune persone, distese in un letto d'ospedale, esortano e incoraggiano gli altri: hanno perso l'attaccamento alle cose fisiche e non misurano più l'amore di Dio in base ad esse. Quando ci stacchiamo dalle cose superficiali, scopriamo che più le cose vanno male, più ci avviciniamo a Dio, e diventiamo persone temibili. Quando diventiamo persone che non si preoccupano più dell'esteriorità, disponibili a servire il Signore qualunque siano le situazioni difficili che attraversiamo, senza mettere in discussione il suo amore e la sua compassione, allora Satana sa di averci definitivamente perduti e non può più usarci. Le inquietudini e le domande esistono ancora perché non siamo ancora completamente colmati dall'amore e dalla presenza di Dio. Il Signore ci sta conducendo lì, e noi opponiamo resistenza a causa di queste cose fisiche; ma quando sapremo che il Signore ci ama davvero, che il suo amore non dipende dalle circostanze, e quando ne avremo ricevuto il segno, saremo persone diverse e vivremo diversamente. Ciascuno di noi ha un momento in cui, come Charlotte Elliott, il Signore ci spinge a fare tabula rasa di tutte queste preoccupazioni; e quando il Signore ci visita in questo modo, sentiamo la nostra miseria e comprendiamo l'immensità della sua grazia e del suo amore. Possiamo distogliere lo sguardo dalle domande senza risposta per posarlo sul Signore soltanto. Possiamo trovare in Gesù Cristo la risposta a ogni domanda. Qualunque siano i timori, i dubbi, le preoccupazioni — teniamolo nel cuore: Dio ci ama e non ci lascerà mai. DIO TI AMA, E AMA ANCHE ME. Troviamo la forza nel Signore.|Che il Signore ci doni quella fede che trascende i dubbi, le circostanze, i problemi e le difficoltà." }

  {
    id:"est-ce-un-probleme-de-temoignage-si-on-n-informe-pas-sa-fami", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-29", auteur:"Gaël, le frère",
    titre:{ fr:"Est‐ce un problème de témoignage si on n'informe pas sa famille avant son baptême ?",
           en:"Is it a problem of testimony not to inform one's family before baptism?",
           it:"È un problema di testimonianza non informare la famiglia prima del battesimo?" },
    verset:{ fr:"" },
    extrait:{ fr:"On ne doit pas se laisser conduire par la chair mais on doit se laisser conduire par le Seigneur. Ceci entraîne que lorsqu’une personne doit se baptiser il n'y a qu'elle concernée, normalement il…",
             en:"When a person is to be baptised, he alone is concerned: in Scripture, baptism follows the preaching immediately. What can harm the testimony is the fear of affirming one's position afterwards.",
             it:"Quando una persona deve battezzarsi, è lei sola a essere coinvolta: nella Scrittura il battesimo segue immediatamente la predicazione. Ciò che può nuocere alla testimonianza è la paura di affermare poi la propria posizione." },
    contenu:{ fr:"On ne doit pas se laisser conduire par la chair mais on doit se laisser conduire par le Seigneur. Ceci entraîne que lorsqu’une personne doit se baptiser il n'y a qu'elle concernée, normalement il ne donne pas le temps d'informer les gens car le baptême suit directement la prédication, la norme biblique ne prévoit pas la préparation d'un événement. Ce qui peut faire problème de témoignage, c'est la peur d'affirmer plutard notre position par rapport au baptême. Actes 2: 37-39 la repentance et le baptême devaient se faire eur le moment. Actes 10: 44-48 Pierre a commandé que ceux qui avaient reçu le baptême du Saint-Esprit soient baptisés, ceci dit le baptême n'est une option peu importe si le Seigneur utilise déjà cette personne car le baptême est un commandement, et le Seigneur dit dans Marc 16 que le baptême suit le fait d'avoir cru peu importe si on a été baptisé du Saint-Esprit car c'est le mystère de la mort et de la résurrection et il faut éviter de se calquer sur les autres (genre prebdrenl'exemple du brigand à la croix pour justifier que ce n'est pas obligé de se faire baptisé) car chacun marche avec le selon sa portion mais l'instruction reste si qqn croit qu'il se fasse baptisé avec la présence ou non de ses parents car on ne peut faire autrement.|En ce qui concerne \"l'officiant\" du baptême si qqn s'est fait baptisé par une femme au nom de Jesus-Christ il n'est pas baptisé du bois lisons dans le livre de Mathieu 28: 16-20 on voit que le Seigneur s'est adressé à ses disciples et chaque fois que le Seigneur a envoyé il a envoyé des hommes et pas des femmes et même en Marc il précise que celui qui aura laissé père, mère...|Femme cette précision de plus montre que les envoyés étaient des hommes et que ce qu'on appelle communément \"grande commission \" n'était pas adressé à tous.",
             en:"We must not be led by the flesh but by the Lord. This means that when a person is to be baptised, he alone is concerned; normally there is no time to inform people, for baptism follows the preaching directly — the biblical norm makes no provision for staging an event. What can become a problem of testimony is the fear of affirming our position regarding baptism afterwards. In Acts 2:37-39, repentance and baptism were to take place on the spot. In Acts 10:44-48, Peter commanded that those who had received the baptism of the Holy Spirit be baptised. Baptism is therefore not optional, even if the Lord is already using a person, for baptism is a commandment; and the Lord says in Mark 16 that baptism follows believing, whether or not one has been baptised in the Holy Spirit, for it is the mystery of death and resurrection. We must avoid patterning ourselves on others (for instance invoking the thief on the cross to claim that baptism is not required), for each one walks with the Lord according to his portion; but the instruction stands: if someone believes, let him be baptised, with or without the presence of his parents, for there is no other way.|As for the one who administers baptism: if someone was baptised by a woman in the name of Jesus Christ, he is not properly baptised. Let us read Matthew 28:16-20: we see that the Lord addressed His disciples, and each time the Lord sent, He sent men, not women. Even in Mark He specifies 'whoever has left father, mother... wife'.|This further detail shows that those who were sent were men, and that what is commonly called the 'Great Commission' was not addressed to everyone.",
             it:"Non dobbiamo lasciarci guidare dalla carne, ma dal Signore. Questo significa che quando una persona deve battezzarsi, è lei sola a essere coinvolta; normalmente non c'è il tempo di informare la gente, perché il battesimo segue direttamente la predicazione — la norma biblica non prevede la preparazione di un evento. Ciò che può diventare un problema di testimonianza è la paura di affermare in seguito la nostra posizione riguardo al battesimo. In Atti 2:37-39 il ravvedimento e il battesimo dovevano avvenire sul momento. In Atti 10:44-48 Pietro comandò che coloro che avevano ricevuto il battesimo dello Spirito Santo fossero battezzati; il battesimo non è dunque un'opzione, anche se il Signore già usa quella persona, perché il battesimo è un comandamento. E il Signore dice in Marco 16 che il battesimo segue l'aver creduto, che si sia stati battezzati o no nello Spirito Santo, perché è il mistero della morte e della risurrezione. Bisogna evitare di modellarsi sugli altri (per esempio prendere l'esempio del ladrone sulla croce per sostenere che il battesimo non è obbligatorio), perché ciascuno cammina con il Signore secondo la sua porzione; ma l'istruzione rimane: se qualcuno crede, si faccia battezzare, con o senza la presenza dei suoi genitori, perché non si può fare altrimenti.|Per quanto riguarda chi amministra il battesimo: se qualcuno è stato battezzato da una donna nel nome di Gesù Cristo, non è battezzato validamente. Leggiamo Matteo 28:16-20: vediamo che il Signore si è rivolto ai suoi discepoli, e ogni volta che il Signore ha mandato, ha mandato uomini e non donne; e anche in Marco precisa 'chi avrà lasciato padre, madre... moglie'.|Questa ulteriore precisazione mostra che gli inviati erano uomini, e che quello che comunemente si chiama il 'grande mandato' non era rivolto a tutti." }
  },
  {
    id:"il-y-a-de-la-puissance-dans-le-nom-de-jesus-christ", rubrique:"enseignements", sousRubrique:"realites",
    date:"2026-06-28", auteur:"Gaël, le frère",
    titre:{ fr:"Il y'a de la puissance dans le nom'de jesus-Christ",
           en:"There is power in the Name of Jesus Christ",
           it:"C'è potenza nel Nome di Gesù Cristo" },
    verset:{ fr:"" },
    extrait:{ fr:"Il y'a un Nom au dessus de tous noms c'est le nom de Jesus-Christ, Il a reçu le Nom qui est élevé au dessus de tout nom, le nom qui est digne de recevoir exaltation glorification. Dans les maux…",
             en:"There is a Name above every name: the Name of Jesus Christ. In the Name that conquered at the cross reside power, deliverance and healing — no impure spirit can stand before it.",
             it:"C'è un Nome al di sopra di ogni nome: il Nome di Gesù Cristo. Nel Nome che ha vinto alla croce risiedono la potenza, la liberazione e la guarigione — nessuno spirito impuro può resistervi." },
    contenu:{ fr:"Il y'a un Nom au dessus de tous noms c'est le nom de Jesus-Christ, Il a reçu le Nom qui est élevé au dessus de tout nom, le nom qui est digne de recevoir exaltation glorification. Dans les maux Jesus Soulage , Il guérit l'esprit froissé, quand tu viens au Seigneur avec tes faiblesses tes péchés, tes liens tes chaine et autres, Jesus Libere et redonne du courage lorsque tu es affaiblie dépassée débordée,. Il y avait un homme fou, dont le démon était tellement fort qu'il brisait les chaînes mais un jour il a rencontré le Seigneur Jesus-Christ de Nazareth. Marc 5: 1-20 Un homme qu'on ne pouvait retenir, dompter, il était incontrôlable sa vie était détruite il était inutile à Dieu et aux hommes; personne ne pouvait plus rien pour lui... Il est venu de lui-même se prosterner devant Lui nous avons un Dieu grand dont nous n'avons pas encore mesure la grandeur. Des démons une légion de démons qui se sont mis à supplier le Seigneur , devant le Jesus-Christ avant la croix avant sa victoire sur les principautés et les autorités.,. Si c'était commença avant la croix que serait-il aujourd'hui où à cette gloire s'est ajoutée la gloire de la croix! Invoquons donc ce nom car nous avons un Dieu Puissant, Capable car Il a reçu le Nom au dessus de tous les noms et que tous genou fléchira y compris ceux qui l'ont rejeté ici bas ils se prosterneront là-haut au jugement. Nous avons reçu en Jesus-Christ la Puissance , la victoire, la délivrance, la guérison, la fin du péché... ces esprits savaient qu,ils ne peuvent pas tenir et qu'il y'a qqn qui est plus élevé qu'eux; la Bible nous a donné UN NOM PUISSANT contre lequel aucun esprit impurnne peut demeurer, LE CHEMIN PAR EXCELLENCE C'EST DANS LE NOM DE JESUS-CHRIST IL N'Y EN A PAS D'AUTRES. Les esprits dans le monde ont été déchus, ils étaient à la croix et c'est eux que Jésus a tourmenté à la croix... ayant vécu longtemps il ont l'expérience des hommes ils maîtrisent les faiblesses des hommes , ils continuent de vivre mais après la croix leur pouvoir est assujetti à UN NOM , nous pouvons chasser les démons, nous pouvons guérir les malades car Jesus-Christ nous en a donné l'autorité... avons nous la foi'que dans le Nom de Jesus-Christ résident la Puissance la Gloire l'honneur... que toutes les chaînes qui subsistent depuis des années peuvent être vaincues dans le Nom de Jesus ? Sais tu que tu as reçu et que tu dois demeurer dans le Nom de Jesus-Christ et prier jusqu'à ce que ces puissances tombent? Ce qui a été fait au temps de Gedeon doit être fait aujourd'hui, les pouvoirs de l'ennemi doivent être vaincu non pas avec ta force mais avec la Gloire qui réside dans le Nom qui a Vaincu. Il n'y a pas sur la terre et dans les cieux un être qui résiste lorsqu'on invoquera son nom. Colossiens 2: 14-15 De la même façon que les enfants sont invités au festin de l'agneau quand Jesus est monté à la croix il a convoqué les démons et là il les a publiquement expoqe et a vaincu leur puissance à la croix nous donnant autorité dans Son Nom c'est Paul dira que tout genou doit fléchir et toute langue confesse car Il n'y a pas d'autre Nom, tout ce que nous faisons nous devons le faire au Nom du Seigneur Jésus-Christ. JÉSUS-CHRIST C'EST LE NOM qui délivre libère guérit HalleluJah!",
             en:"There is a Name above every name: the Name of Jesus Christ. He has received the Name exalted above every name, the Name worthy of exaltation and glorification. In our afflictions Jesus relieves; He heals the bruised spirit. When you come to the Lord with your weaknesses, your sins, your bonds, your chains and all the rest, Jesus sets free and restores courage when you are weakened, overwhelmed, at the end of yourself. There was a demon-possessed man whose demon was so strong that he broke chains — but one day he met the Lord Jesus Christ of Nazareth (Mark 5:1-20). A man no one could restrain or subdue, uncontrollable, his life destroyed, useless to God and to men; no one could do anything more for him. Yet he came of his own accord and fell down before Him — we have a great God whose greatness we have not yet measured. A legion of demons began to beg the Lord — and this was before the cross, before His victory over the principalities and powers. If it was so before the cross, what must it be today, now that to His glory has been added the glory of the cross! Let us therefore call on this Name, for we have a mighty, able God: He has received the Name above every name, and every knee shall bow, including those who rejected Him here below — they will bow at the judgment. In Jesus Christ we have received power, victory, deliverance, healing, the end of sin. Those spirits knew they could not stand, and that there is One higher than they; the Bible has given us a MIGHTY NAME before which no impure spirit can remain. THE WAY PAR EXCELLENCE IS IN THE NAME OF JESUS CHRIST — THERE IS NO OTHER. The spirits of this world have been cast down; they were at the cross, and it was they whom Jesus made a spectacle of at the cross. Having lived long, they have experience of men and know their weaknesses; they still operate, but since the cross their power is subject to ONE NAME. We can cast out demons, we can heal the sick, for Jesus Christ has given us the authority. Do we have faith that in the Name of Jesus Christ reside the power, the glory, the honour — that chains standing for years can be broken in the Name of Jesus? Do you know that you have received, and that you must remain in the Name of Jesus Christ and pray until those powers fall? What was done in the days of Gideon must be done today: the powers of the enemy must be defeated, not by your strength, but by the glory that resides in the Name that conquered. There is no being on earth or in the heavens that can resist when His Name is invoked. Colossians 2:14-15 — when Jesus went up to the cross He summoned the demons, exposed them publicly and triumphed over their power at the cross, giving us authority in His Name. As Paul says, every knee shall bow and every tongue confess, for there is no other Name; and everything we do, we must do in the Name of the Lord Jesus Christ. JESUS CHRIST is THE NAME that delivers, sets free and heals. Hallelujah!",
             it:"C'è un Nome al di sopra di ogni nome: il Nome di Gesù Cristo. Egli ha ricevuto il Nome che è innalzato al di sopra di ogni nome, il Nome degno di ricevere esaltazione e glorificazione. Nei mali Gesù dà sollievo; guarisce lo spirito affranto. Quando vieni al Signore con le tue debolezze, i tuoi peccati, i tuoi legami, le tue catene e tutto il resto, Gesù libera e ridona coraggio quando sei indebolito, sopraffatto, allo stremo. C'era un uomo indemoniato il cui demone era così forte che spezzava le catene — ma un giorno incontrò il Signore Gesù Cristo di Nazaret (Marco 5:1-20). Un uomo che non si poteva trattenere né domare, incontrollabile, la vita distrutta, inutile a Dio e agli uomini; nessuno poteva più fare nulla per lui. Eppure venne da sé a prostrarsi davanti a Lui — abbiamo un Dio grande di cui non abbiamo ancora misurato la grandezza. Una legione di demòni si mise a supplicare il Signore — e questo davanti al Gesù Cristo di prima della croce, prima della sua vittoria sui principati e sulle potestà. Se era così prima della croce, che cosa sarà oggi, ora che a quella gloria si è aggiunta la gloria della croce! Invochiamo dunque questo Nome, perché abbiamo un Dio potente e capace: ha ricevuto il Nome al di sopra di ogni nome, e ogni ginocchio si piegherà, compresi quelli che lo hanno rifiutato quaggiù — si prostreranno lassù, al giudizio. In Gesù Cristo abbiamo ricevuto la potenza, la vittoria, la liberazione, la guarigione, la fine del peccato. Quegli spiriti sapevano di non poter resistere e che c'è Qualcuno più elevato di loro; la Bibbia ci ha dato un NOME POTENTE davanti al quale nessuno spirito impuro può rimanere. LA VIA PER ECCELLENZA È NEL NOME DI GESÙ CRISTO — NON CE NE SONO ALTRE. Gli spiriti di questo mondo sono stati abbattuti; erano alla croce, e sono loro che Gesù ha esposto pubblicamente alla croce. Avendo vissuto a lungo, hanno esperienza degli uomini e ne conoscono le debolezze; continuano ad agire, ma dopo la croce il loro potere è assoggettato a UN NOME. Possiamo scacciare i demòni, possiamo guarire i malati, perché Gesù Cristo ce ne ha dato l'autorità. Abbiamo fede che nel Nome di Gesù Cristo risiedono la potenza, la gloria, l'onore — che le catene che durano da anni possono essere vinte nel Nome di Gesù? Sai che hai ricevuto, e che devi rimanere nel Nome di Gesù Cristo e pregare finché quelle potenze cadano? Ciò che fu fatto al tempo di Gedeone dev'essere fatto oggi: i poteri del nemico devono essere vinti non con la tua forza, ma con la gloria che risiede nel Nome che ha vinto. Non c'è sulla terra né nei cieli un essere che resista quando si invoca il suo Nome. Colossesi 2:14-15 — quando Gesù è salito alla croce ha convocato i demòni, li ha pubblicamente esposti e ha trionfato sul loro potere alla croce, dandoci autorità nel suo Nome. Come dice Paolo, ogni ginocchio si piegherà e ogni lingua confesserà, perché non c'è altro Nome; e tutto ciò che facciamo, dobbiamo farlo nel Nome del Signore Gesù Cristo. GESÙ CRISTO è IL NOME che libera, affranca e guarisce. Alleluia!" }
  },
  {
    id:"la-tristesse-selon-dieu-conduit-a-la-repentance", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-27", auteur:"Gaël, le frère",
    titre:{ fr:"La tristesse selon Dieu conduit à la repentance",
           en:"Godly sorrow leads to repentance",
           it:"La tristezza secondo Dio conduce al ravvedimento" },
    verset:{ fr:"" },
    extrait:{ fr:"Quand tu passes par des situations complexes, bien que tu sois repenti, et que tu n'as pas de problème avec Dieu, satan reviens à la charge pour te rappeler une faute que tu avais commise par le…",
             en:"The sorrow that comes from Satan does not lead to repentance but to guilt — and guilt is not from the Holy Spirit, for when God forgives, He does not go back on it.",
             it:"La tristezza che viene da Satana non spinge al ravvedimento ma alla colpevolezza — e la colpevolezza non viene dallo Spirito Santo, perché quando Dio perdona, non torna indietro." },
    contenu:{ fr:"Quand tu passes par des situations complexes, bien que tu sois repenti, et que tu n'as pas de problème avec Dieu, satan reviens à la charge pour te rappeler une faute que tu avais commise par le passé et tu es plongée dans la tristesse, cette forme de tristesse qui vient de satan ne te pousse pas la repentance mais plutôt à la culpabilité or la culpabilité n'est pas du Saint-Esprit car Dieu lorsqu'il pardonne Il ne revient pas dessus. Quand le Saint-Esprit nous conduit devant le Seigneur face à nos fautes, Il nous pousse à la repentance avec pour but le salut. Si tu te sens coupable et que tu ne peux pas non plus te repentir alors il y'a un problème tu pourrais te retrouver dans le cas de Judas il a eu la culpabilité et s'est suicidé. Il ne faut donc pas se laisser troubler par satan car nous avons une vivante espérance ; cependant, Il faut s'attacher véritablement à Dieu, Il a dit qu'il ne va pas se souvenir de nos fautes et Il ne s'en souviendra pas si nous demandons sincèrement pardon, si nous nous humiliés véritablement Il est Fidèle et juste pour nous pardonner et nous purifier de toutes nos iniquités comme le déclare la parole. Mais il faut éviter s'y revenir car ce serait comme tenter le Seigneur !",
             en:"When you pass through complex situations, even though you have repented and have no standing issue with God, Satan returns to the charge to remind you of a fault you committed in the past, and you are plunged into sorrow. That kind of sorrow, which comes from Satan, does not lead you to repentance but to guilt — and guilt is not of the Holy Spirit, for when God forgives, He does not go back on it. When the Holy Spirit brings us before the Lord concerning our faults, He moves us to repentance with salvation as the goal. If you feel guilty and yet cannot repent, then something is wrong: you could end up in the case of Judas, who fell into guilt and took his own life. We must therefore not let ourselves be troubled by Satan, for we have a living hope. Nevertheless we must truly cling to God: He has said He will not remember our faults, and He will not remember them if we sincerely ask forgiveness and truly humble ourselves — He is faithful and just to forgive us and to purify us from all our iniquities, as the word declares. But we must avoid returning to them, for that would be like tempting the Lord!",
             it:"Quando attraversi situazioni complesse, benché tu ti sia ravveduto e non abbia problemi con Dio, Satana torna alla carica per ricordarti una colpa commessa in passato, e sei immerso nella tristezza. Questa forma di tristezza, che viene da Satana, non ti spinge al ravvedimento ma alla colpevolezza; e la colpevolezza non è dello Spirito Santo, perché Dio, quando perdona, non torna indietro. Quando lo Spirito Santo ci conduce davanti al Signore di fronte alle nostre colpe, ci spinge al ravvedimento avendo per scopo la salvezza. Se ti senti colpevole e non riesci nemmeno a ravvederti, allora c'è un problema: potresti ritrovarti nel caso di Giuda — provò la colpevolezza e si tolse la vita. Non bisogna dunque lasciarsi turbare da Satana, perché abbiamo una speranza viva. Tuttavia bisogna attaccarsi veramente a Dio: ha detto che non si ricorderà delle nostre colpe, e non se ne ricorderà se chiediamo sinceramente perdono, se ci umiliamo davvero — egli è fedele e giusto per perdonarci e purificarci da ogni iniquità, come dichiara la parola. Ma bisogna evitare di ritornarvi, perché sarebbe come tentare il Signore!" }
  },
  {
    id:"jesus-christ-nous-a-rachete", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-26", auteur:"Gaël, le frère",
    titre:{ fr:"Jesus-Christ nous a racheté",
           en:"Jesus Christ has redeemed us",
           it:"Gesù Cristo ci ha riscattati" },
    verset:{ fr:"" },
    extrait:{ fr:"Pour libérer un coupable deux choses sont possibles une libération sous caution (avec un procès qui continue) ou un acquittement total par la grâce ou parce qqn d'autre a pris la condamnation.",
             en:"In Christ we are not released on bail with a trial still pending: He took our place, He took upon Himself the punishment that was ours. What a privilege to have been redeemed by Jesus Christ!",
             it:"In Cristo non siamo liberati su cauzione con un processo ancora in corso: ha preso il nostro posto, ha preso su di sé il castigo che ci era destinato. Che privilegio essere stati riscattati da Gesù Cristo!" },
    contenu:{ fr:"Pour libérer un coupable deux choses sont possibles une libération sous caution (avec un procès qui continue) ou un acquittement total par la grâce ou parce qqn d'autre a pris la condamnation.|En Christ nous ne sommes pas libérés sous caution, il n'y a plus de procès en cours contre nous mais Il a pris notre place, il nous a ôté de la prison à laquelle on était ; on était tous destiné à la condamnation mais il a pris sur lui le châtiment qui nous était destiné comme le dit le livre d'Esaïe 53. Le sang des boucs nettoyait de façon partielle les fautes alors que quand Jésus nous a lavés, il nous donné un vêtement neuf, on ne porte plus sur nous nos souillures... Quel privilège pour nous d'avoir été racheté par Jésus-Christ ! Toute personne qui s'est abandonnée entre les mains du Seigneur est bénie ; Jésus a tout pris sur les nos fardeaux, nos péchés, nos malédictions, Esaïe va plus loin que nous avons été guéris par ses meurtrissures.... Comment ne pas se sentir béni devant tout cela ? C'est pourquoi ce n'est pas normal qu'un enfant de Dieu soit triste abattu à cause des choses physiques ... Le Seigneur s'est choisi un peuple au milieu de la multitude Il nous a choisi nous ; juste à penser à la multitude des personnes qui sont dans le monde et voir que nous sommes parmi les élus devrait être un sujet de joie continuel. Satan utilise ces choses du quotidien pour nous détourner de l'objectif principal LA CROIX ; Au-delà des circonstances qui peuvent meubler notre quotidien nous devons nous souvenir du merveilleux prix que le Seigneur a payé pour nous ; le sang de Jésus-Christ a un prix qu'on ne peut estimer nous avons de la valeur aux yeux du Seigneur. Nous ne devons non plus nous laisser amoindrir par les difficultés de la vie... Je suis en Christ et mon souhait est que SA lumière resplendisse toujours et davantage dans ma vie peu importe les difficultés et les épreuves car Christ est ma vie la mort m'est un gain. Sentons nous heureux et privilégiés!",
             en:"To release a guilty man, two things are possible: release on bail (with the trial still pending), or full acquittal — by grace, or because someone else has borne the sentence.|In Christ we are not released on bail; there is no longer any case pending against us. He took our place; He brought us out of the prison where we were. We were all destined for condemnation, but He took upon Himself the punishment that was meant for us, as the book of Isaiah 53 says. The blood of goats cleansed faults only partially, whereas when Jesus washed us, He gave us a new garment — we no longer carry our defilements on us. What a privilege for us to have been redeemed by Jesus Christ! Everyone who has surrendered into the hands of the Lord is blessed: Jesus took upon Himself our burdens, our sins, our curses; Isaiah goes further — by His wounds we have been healed. How can we not feel blessed before all this? That is why it is not normal for a child of God to be sad and downcast over physical things. The Lord chose a people for Himself out of the multitude — He chose us. Simply to think of the multitude of people in the world and to see that we are among the elect ought to be a continual source of joy. Satan uses everyday things to turn us away from the main objective: THE CROSS. Beyond the circumstances that fill our daily lives, we must remember the wonderful price the Lord paid for us; the blood of Jesus Christ has a value beyond estimation — we are precious in the Lord's eyes. Neither must we let ourselves be diminished by the difficulties of life. I am in Christ, and my desire is that HIS light may shine ever more brightly in my life, whatever the difficulties and trials, for Christ is my life and death is gain to me. Let us feel happy and privileged!",
             it:"Per liberare un colpevole due cose sono possibili: una liberazione su cauzione (con un processo che continua) o un'assoluzione totale — per grazia, o perché qualcun altro ha preso su di sé la condanna.|In Cristo non siamo liberati su cauzione: non c'è più alcun processo in corso contro di noi. Ha preso il nostro posto; ci ha tolti dalla prigione in cui eravamo. Eravamo tutti destinati alla condanna, ma ha preso su di sé il castigo che ci era destinato, come dice il libro di Isaia 53. Il sangue dei capri lavava le colpe in modo parziale, mentre quando Gesù ci ha lavati ci ha dato un vestito nuovo: non portiamo più su di noi le nostre sozzure. Che privilegio per noi essere stati riscattati da Gesù Cristo! Ogni persona che si è abbandonata nelle mani del Signore è benedetta: Gesù ha preso su di sé i nostri fardelli, i nostri peccati, le nostre maledizioni; Isaia va oltre — dalle sue lividure siamo stati guariti. Come non sentirsi benedetti davanti a tutto questo? Ecco perché non è normale che un figlio di Dio sia triste e abbattuto a causa delle cose materiali. Il Signore si è scelto un popolo in mezzo alla moltitudine: ha scelto noi. Il solo pensare alla moltitudine di persone che sono nel mondo e vedere che siamo tra gli eletti dovrebbe essere un motivo di gioia continua. Satana usa le cose del quotidiano per distoglierci dall'obiettivo principale: LA CROCE. Al di là delle circostanze che riempiono il nostro quotidiano, dobbiamo ricordarci del prezzo meraviglioso che il Signore ha pagato per noi; il sangue di Gesù Cristo ha un valore inestimabile — abbiamo valore agli occhi del Signore. Non dobbiamo neppure lasciarci sminuire dalle difficoltà della vita. Io sono in Cristo e il mio desiderio è che la SUA luce risplenda sempre di più nella mia vita, qualunque siano le difficoltà e le prove, perché Cristo è la mia vita e la morte mi è un guadagno. Sentiamoci felici e privilegiati!" }
  },
  {
    id:"la-necessite-d-une-rencontre-personnelle-avec-le-seigneur", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-25", auteur:"Gaël, le frère",
    titre:{ fr:"La nécessité d'une rencontre personnelle avec le Seigneur",
           en:"The necessity of a personal encounter with the Lord",
           it:"La necessità di un incontro personale con il Signore" },
    verset:{ fr:"" },
    extrait:{ fr:"Jean 1",
             en:"When we have only heard about the Lord without making our own experience with Him, faith is less solid. Everyone must have his own encounter with the Lord.",
             it:"Quando si è soltanto sentito parlare del Signore senza fare la propria esperienza con lui, la fede è meno solida. Ognuno deve avere il proprio incontro con il Signore." },
    contenu:{ fr:"Jean 1|La Parole est Christ... les ténèbres ne l'on pas reçu et le monde ne l'a pas connu ces extraits démontrent la nécessité de recevoir la parole qui était la lumière afin de le connaître. Mais ceux qui reçoivent la lumière reçoivent par elle le pouvoir de devenir enfant de Dieu, ce n'est donc pas un être humain qui décide qui devient enfant de Dieu car si le salut de qqn vient d'homme alors ce salut n'est pas vrai. Car ce salut ne dépend pas de la volonté de la chair donc ce n’est pas la prière, les supplications mais c'est la Volonté de Dieu c'est Lui qui décide de qui devient son enfant. La loi a été donnée par Moise mais la grâce et la vérité sont venues par Jésus-Christ. Lorsque Jean est venu les gens étaient confus à son sujet parce que pensant que c'était lui le Messie et dans la vie de Jésus ils ont vu des prophéties s'accomplir dans sa vie mais ils n'ont pas cru. Jean-Baptiste est venu afin de préparer le chemin à Christ c'est-à-dire il est venu prêcher la repentance ....|*Pourquoi la prédication de la repentance avant la venue du Seigneur ?*|Ceci démontre que pour une rencontre efficace avec le Seigneur il faut que le cœur soit préparé, c'est en mettant l'homme face à sa vie, face à son péché qu'il se rend compte qu'il a besoin d'un pécheur. Pour rencontrer le Seigneur véritablement il faut une véritable repentance. La bonne nouvelle ce ne sont pas les bonnes nouvelles... la bonne nouvelle c'est que Jésus-Christ est Seigneur et Il donné sa vie pour le salut et peu importe ton état de péché il est là pour toi, or les bonnes nouvelles sont les prédications du genre tu vas prospérer, te marier ces nouvelles ne préparent pas le cœur à rencontrer le Seigneur ... ce n'est pas pour ça que Dieu est venu. Jean dit qu'il l'a vu et que Dieu a rendu témoignage. Et lorsque les disciples ont rencontré Jésus-Christ de Nazareth celui-ci leur a demandé ce qu'ils cherchaient ils ont dit qu'ils cherchaient où Jésus demeure. Et dans cette question laisse
