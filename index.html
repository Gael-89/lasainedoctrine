y our parents — otherwise we shall suffer the consequences, for the fact that we were not there does not mean we are not concerned (Saul struck the Gibeonites though he was not there when Joshua swore the oath, and David lived through the consequences).|When we arrive in a new area, if people come to us all smiles, we must be careful and not embrace everyone; someone who wants to harm us will not come at us directly with attacks but will come as a friend, to create a bond of closeness. We must avoid making commitments without consulting the Lord, as the leaders of Israel did in Joshua 9. Just because someone smiles and laughs with us does not necessarily make him a friend: it can be a ruse. Satan is cunning, and that is always how he proceeds.|A bad neighbourly relationship that looks like a good one can cost extremely dear. Blind trust in a person we do not know, merely because they were kind to us, exposes us. We must therefore take right and necessary precautions, watching constantly with prayer. When we have difficult relations with members of the family — natural or spiritual — because of geographical closeness, we should adopt Abraham's attitude in Genesis 13: separate, take some distance, to preserve peace; Paul and Barnabas had to part. Distance often allows each one to reconsider his position: the distance between Esau and Jacob calmed their hearts, whereas while they were together Esau was determined to kill his brother.|Hebrews 12:14.|The apostle says to pursue peace with all; it is not said that we will necessarily obtain peace with all, but we must walk in the pursuit of peace. Nor does it mean embracing everyone blindly: it means not setting ourselves against them as enemies — but we must be PRUDENT.|1 John 2 — the brother makes us understand that THE SUPREME COMMANDMENT OF THE CHRISTIAN IS LOVE; prudence and love therefore walk together, and the Lord Himself taught on prudence.|Matthew 10:16-17.|Often certain Christians live not in simplicity but in pride and contempt, drawing on themselves the evil eye of the enemy and troubles they could have avoided by living simply. We must therefore heed this commandment to be harmless as doves. Being proud, haughty and slanderous while a Christian does not spare us from attacks. John says that whoever abides in Christ must walk as He walked — and Christ walked in simplicity. The love of the things of the world is an open door for the enemy; by clinging to the world we risk its affecting our life and even that of our children.|A Christian must examine and exercise discernment in everything he does. Hatred is not a feeling a child of God may harbour. Even surrounded by sorcerers, we must pray and work on our heart so as not to hate them. We must also take serious measures with them — such as avoiding close company — but we must not hate, for that would be a rupture in our relationship with the Lord: one cannot draw near to the Lord with hatred in the heart.|Proverbs 25:21-22; Matthew 5:42-48.|Prudence must not become a source of lovelessness, nor of such extreme distrust that we no longer help. If we are simple and prayerful, we shall not bear punishment for having shown love. The Lord can reveal hidden things to us, and when He does not, He spares and preserves us. But if we live a life of distrust, fear and suspicion, we may fail to show the love the Lord expects of us, and Satan will boast. We must therefore have discernment in all things and seek the face of God before engaging in anything with the neighbourhood — for if we begin to nurse evil thoughts, hatred and unforgiveness, we shall become like them.|Love must precede any of our actions, for it can do extraordinary things. We must remain balanced: the whole world lies under the power of the evil one, but let not the knowledge of these things make us become, in our attitude, like the people of this world. Stephen suffered the ultimate persecution, and yet he prayed that the Lord would forgive his executioners. We must seek the Lord's face — He may ask us to leave a place in order to flourish — but in everything we must be attentive to His voice. If we act with simplicity, prudence and love despite persecution, then even if our sorcerer neighbours succeed in some of their blows, they will not be able to go beyond the limit the Lord permits. We must not act as though our battle were carnal, but act knowing that our battle is spiritual. There will be cases where we are called to tell sorcerers that we know what they are — but in everything, discernment is needed.|What about giving to the people sitting by the roadside asking for alms?|We must act out of love and conviction; we are not obliged to give alms. Some people have been bound by spirits because of alms they gave — we must do everything moved by the Holy Spirit.",
             it:"Se qualcuno non è in salute, è chiaro che non può pregare in modo conveniente. Quando le persone che sono nell'occultismo attaccano per distruggere la vita dei figli del Signore, Satana sa che anche se non ti distrugge completamente, questo ti distoglierà da ciò che è importante — e per lui questo ha valore. Le relazioni di vicinato hanno già distrutto famiglie e coppie; capita che alcune persone subiscano afflizioni nella loro vita a causa del vicinato, a volte senza saperlo.|Come figlio di Dio, come comportarsi dunque con il nostro vicinato? Quali atteggiamenti adottare quando abbiamo un vicinato difficile?|Genesi 13; Giosuè 9; Numeri 25.|Il primo testo è l'esempio di due fratelli che vivono vicini; gli altri due sono l'esempio di un figlio di Dio vicino di un non credente. La prima osservazione è che la persona non cristiana può sottilmente diventare tua amica con uno scopo preciso. I figli di Dio devono essere illuminati e pregare contro le tenebre. Un figlio di Dio non può essere intimo dei pagani; questo non significa che non si debba salutarli, ma non dobbiamo avere con loro una relazione di stretta intimità, come il Signore aveva comandato in Levitico 18:1-5. Inoltre, nella vita di un uomo convertito c'è la trappola di essere tentato a tornare al passato, perché il passato viene costantemente a tentare — e anche il presente e il futuro, perché nella nuova vita Satana usa persone nuove. Vediamo che nel cammino verso Canaan, ogni volta che Israele aveva un motivo di lamentarsi, faceva appello all'Egitto: è l'immagine del cristiano per il quale la vita di santificazione è un fardello pesante da portare. Allo stesso modo, quando arrivarono a Canaan, il contatto con il vicinato li portò ad allontanarsi dal Signore. Questo mostra a sufficienza che il vicinato può essere un grande ostacolo alla nostra crescita.|2 Samuele 21.|Conosciamo persone che vivono situazioni inspiegabili a causa delle alleanze fatte dai loro genitori; per questo è importante, quando veniamo al Signore, prendere il tempo di sciogliersi da tutti i legami contratti dai nostri genitori — altrimenti ne subiremo le conseguenze, perché il fatto che non c'eravamo non significa che non siamo coinvolti (Saul colpì Gabaon benché non ci fosse quando Giosuè fece il giuramento, e Davide ne visse le conseguenze).|Quando arriviamo in un quartiere, se le persone vengono verso di noi tutte sorridenti, dobbiamo fare attenzione e non abbracciare tutti: chi vuole farci del male non verrà direttamente con gli attacchi, ma verrà come un amico per creare un legame di vicinanza. Bisogna evitare di prendere impegni senza consultare il Signore, come fecero i capi d'Israele in Giosuè 9. Non è perché qualcuno sorride e ride con noi che è per forza un amico: può essere un'astuzia. In effetti Satana è astuto, ed è sempre così che procede.|Una relazione di cattivo vicinato che ci sembra buona può costare estremamente cara. Fidarsi ciecamente di una persona che non si conosce solo perché è stata gentile con noi ci espone. Dobbiamo dunque prendere le giuste precauzioni che si impongono, vegliando costantemente con la preghiera. Quando abbiamo relazioni difficili con i membri della famiglia — carnale o spirituale — a causa della vicinanza geografica, dobbiamo adottare l'atteggiamento di Abramo in Genesi 13, cioè separarsi, prendere le distanze per preservare la pace; Paolo e Barnaba dovettero separarsi. Spesso la distanza permette a ciascuno di riconsiderare la propria posizione: la distanza tra Esaù e Giacobbe ha placato i cuori, mentre quando erano insieme Esaù era determinato a uccidere suo fratello.|Ebrei 12:14.|L'apostolo dice di ricercare la pace con tutti; non è detto che otterremo per forza la pace con tutti, ma dobbiamo camminare nella ricerca della pace. Non significa nemmeno abbracciare tutti ciecamente: significa non mettersi in conflitto con loro come nemici — ma dobbiamo essere PRUDENTI.|1 Giovanni 2 — il fratello ci fa comprendere che IL COMANDAMENTO PER ECCELLENZA DEL CRISTIANO È L'AMORE; la prudenza e l'amore camminano dunque insieme, e il Signore stesso ha insegnato sulla prudenza.|Matteo 10:16-17.|Spesso certi cristiani vivono non nella semplicità ma nell'orgoglio e nel disprezzo, attirando su di sé lo sguardo maligno del nemico e guai che avrebbero potuto evitare vivendo nella semplicità. Bisogna dunque tenere conto di questo comandamento di essere semplici come colombe. Essere orgogliosi, alteri e maldicenti pur essendo cristiani non ci risparmia dagli attacchi. Giovanni dice che chi dimora in Cristo deve camminare come lui ha camminato — e Cristo ha camminato nella semplicità. L'amore delle cose del mondo è una porta aperta per il nemico; attaccandoci al mondo corriamo il rischio che questo colpisca la nostra vita e perfino quella dei nostri figli.|Un cristiano deve esaminare e avere discernimento in tutto ciò che fa. L'odio non è un sentimento che un figlio di Dio possa avere. Anche circondati da stregoni, dobbiamo pregare e lavorare sul nostro cuore in modo da non detestarli. Dobbiamo anche prendere misure serie con loro — come evitare le frequentazioni — ma bisogna evitare di odiare, perché sarebbe una frattura nella nostra relazione con il Signore: non ci si può avvicinare al Signore con l'odio nel cuore.|Proverbi 25:21-22; Matteo 5:42-48.|La prudenza non deve diventare fonte di mancanza d'amore, né di una diffidenza estrema al punto da non aiutare più. Se siamo semplici e preghiamo, non porteremo alcun castigo per aver manifestato amore. Il Signore può rivelarci le cose nascoste, e quando non lo fa, ci risparmia e ci preserva. Ma se viviamo una vita di diffidenza, di paura e di sospetto, c'è la possibilità che non manifestiamo l'amore che il Signore si attende da noi, e Satana se ne glorierà. Dobbiamo dunque avere discernimento in ogni cosa e cercare il volto di Dio prima di impegnarci in qualsiasi cosa con il vicinato — perché se cominciamo a meditare cattivi pensieri, odio e mancanza di perdono, diventeremo come loro.|L'amore deve precedere qualunque nostra azione, perché è capace di fare cose straordinarie. Dobbiamo restare equilibrati: il mondo intero giace sotto il potere del maligno, ma la conoscenza di queste cose non ci faccia diventare, nel nostro atteggiamento, come la gente di questo mondo. Stefano ha subito la persecuzione estrema, eppure ha pregato perché il Signore perdonasse i suoi carnefici. Dobbiamo cercare il volto del Signore — può chiederci di lasciare quel luogo per crescere — ma in tutto dobbiamo essere attenti alla sua voce. Se agiamo con semplicità, prudenza e amore malgrado le persecuzioni, anche se i nostri vicini stregoni riescono in alcuni dei loro colpi, non potranno superare il limite permesso dal Signore. Non dobbiamo agire come se il nostro combattimento fosse carnale, ma agire sapendo che il nostro combattimento è spirituale. Ci saranno casi in cui saremo chiamati a dire agli stregoni che sappiamo chi sono — ma in tutto occorre il discernimento.|Che fare dei doni alle persone sedute sul bordo della strada che chiedono l'elemosina?|Dobbiamo agire per amore e per convinzione; non siamo obbligati a fare l'elemosina. Alcune persone sono state legate dagli spiriti a causa dell'elemosina che hanno fatto: dobbiamo fare ogni cosa spinti dallo Spirito Santo." }
  },
  {
    id:"faut-il-prier-pour-une-prophetie-qui-doit-s-accomplir", rubrique:"propheties", sousRubrique:null,
    date:"2026-06-18", auteur:"Gaël, le frère",
    titre:{ fr:"Faut-il prier pour une prophétie qui doit s'accomplir ?",
           en:"Should we pray about a prophecy that must be fulfilled?",
           it:"Bisogna pregare per una profezia che deve compiersi?" },
    verset:{ fr:"" },
    extrait:{ fr:"Cette question est un problème qui touche et affecte le corps du Christ, dans le sens ou certaines personnes ont la position selon laquelle on ne doit pas prier quand une prophétie est entrain de…",
             en:"Some hold that one must not pray while a prophecy is being fulfilled. Yet only God can tell a man to be silent on a matter — there is no situation in which there is no reason to pray.",
             it:"Alcuni sostengono che non si debba pregare mentre una profezia si sta compiendo. Ma solo Dio può dire a un uomo di tacere su un argomento — non esiste situazione in cui non ci sia motivo di pregare." },
    contenu:{ fr:"Cette question est un problème qui touche et affecte le corps du Christ, dans le sens ou certaines personnes ont la position selon laquelle on ne doit pas prier quand une prophétie est entrain de s'accomplir. Il n'y a aucune situation selon laquelle il n'y a pas de raison de prier en jugeant par Somme, il n'y a que Dieu qui puisse dire à un homme de se taire sur un sujet, c'est une erreur de soutenir sans la direction du Seigneur que pour tel sujet on ne doit pas prier. Les vraies serviteurs de Dieu devant n'importe quelle situation voulaient prier mais c'est le Seigneur qui les en empêchait comme ce fût le cas dans le livre de Jérémie,; , lorsqu'on lapidait Etienne il priait. Il faut prier pour toutes les situations ce qui change c'est la posture de prière ( Intercession, action de grâce; repentance...) ce qu'il faut faire c'est chercher la direction du Seigneur. à combien plus forte raison lorsque le chrétien assiste au jugement de Dieu sur une nation c'est donc méchant de dire qu'il faut regarder et ne rien faire; ceux qui soutiennent cett position sont entrain d'accomplir une prophétie selon laquelle \"la charité du plus grand nomb. L'Eglise lorsqu'elle souffrait implorait la grâce de Dieu et pourtant le Seigneur avait dit que \"Vous aurez des tribulations dans le monde\" ; le peuple de Dieu est meurtris devant la soufrance pour implorer Sa grâce afin que le Seigneur accorde la grâce de la repentance or aujourd'hui on assiste au contraire en milei chrétien on se croit trop spirituel pour prier pour ces gens qui meurent. Dans Actes 4:23-31 après que Pierre et Jeans aient été libérés , les saints élevés une prière sous la direction du Saint-Esprit selon le besoin de l'heure, c'est e défaut de plusieurs aujourd'hui: nous n'avaons pas la direction du Seigneur. Aujourd'hui on se dit servir mais nous allons dans la direction opposée à celle du Seigneur savoir L'a,our on se réjouit même deja du malheur de ceux qui n'ont pas la même vision des choses que soi. l'potre Paul dira de prier en tout tep,s par l'esprit (Ephesiens 6:18) ce que nous devons faire c'est chercher la direction du Seigneur dans tout ce qui se passe et non ne contenter de regarder les évènements et dire que tel ou tel autre ne necessite pas la prière, Paul demandait de prier pour lui alors qu'il savait qu'il deavait souffrir à cause de l'avangie. on ne va oas forcement demmandr à Dieu d'annuler ce qui est entrain d'arriver mais pour qu'il donn ela force pour surmonter la situation. Apocalypse 6: 8-11 des saints prient mais c'était pas le moment et dans son amour les consoler Il leur donna des robes dans l'attente de l'heure. Comment sommes-nous arriv\"s au point de se réjouir du malheur des autres? avonsnous des ennemis dans la chair? Notre Dieu meme lorsqu'Il chatie est amour et Il use de patience ,la bible dit de Lui qu'Il ne tarde pas dans l'accomplissement de sa promesse mais Il use de patience, ce n'est donc pas à nous de se rejouir réjouir lorsque le Seigneur chatie un peuple, l'attitude de plusieurs prouvent veritablement Mathieu 24: 7-13 l'amour disparait disparaît, même ceux qui sont remplis de connaissance or la connaissance sans l'amour est vaine comme le dit l'apotre Paul en 1cor 13... en ces derniers temps c'est LA MANIFESTATION DE L'AMOUR LA MARQUE PAR EXCELLENCE DE L'EGLISE, donc au lieu de chercher à etre rempli de prophetie ou de connaissance, nous devons demander à petre remplie d'amour afin d'être conduit par celuici en ces fins des temps car comme le dit l'apotre Paul en 1corintheins 8:1-3 la connaissance enfle le coeur mais la charité (l'amour) fait grandir la foi. Que le Seigneur nous accorde la gâce de ne pas perdre la charité en ces temps difficile; de ne pas nous egarer; qu'il nous donne de l'amour non seulement pour les frères et soeurs mais aussi pour les autres afin que nous pprions dans la bonne direction. Que le Seigneur nous accorde la sagesse necessaire et l'amour qu'il faut!",
             en:"This question is a problem that touches and affects the body of Christ, in that some hold the position that one must not pray when a prophecy is being fulfilled. There is no situation in which there is no reason to pray; only God can tell a man to be silent on a subject, and it is an error to maintain, without the Lord's direction, that for such and such a matter one must not pray. The true servants of God, before any situation, wanted to pray — it was the Lord who restrained them, as was the case in the book of Jeremiah; and when Stephen was being stoned, he prayed. We must pray in every situation; what changes is the posture of prayer (intercession, thanksgiving, repentance...) — what we must do is seek the Lord's direction. How much more when the Christian witnesses the judgment of God upon a nation! It is therefore cruel to say that we should watch and do nothing; those who hold that position are themselves fulfilling a prophecy: 'the love of the many will grow cold.' The Church, when she suffered, implored the grace of God — yet the Lord had said, 'In the world you will have tribulation.' The people of God are grieved before suffering and implore His grace, that the Lord may grant the grace of repentance; but today we witness the opposite in Christian circles — people think themselves too spiritual to pray for those who are dying. In Acts 4:23-31, after Peter and John were released, the saints lifted up a prayer under the direction of the Holy Spirit, according to the need of the hour; that is the failing of many today: we do not have the Lord's direction. Today we claim to serve, yet we go in the direction opposite to the Lord's — namely love — and some even rejoice at the misfortune of those who do not share their view of things. The apostle Paul says to pray at all times in the Spirit (Ephesians 6:18). What we must do is seek the Lord's direction in everything that happens, not merely watch events and declare that this or that does not call for prayer. Paul asked for prayer for himself although he knew he was to suffer for the gospel. We will not necessarily ask God to cancel what is happening, but to give strength to overcome the situation. In Revelation 6:8-11 saints pray, but it was not yet the time, and in His love, to console them, He gave them robes while they awaited the hour. How have we come to the point of rejoicing at the misfortune of others? Do we have enemies in the flesh? Our God, even when He chastens, is love, and He is patient; the Bible says of Him that He is not slow concerning His promise, but is patient. It is therefore not for us to rejoice when the Lord chastens a people; the attitude of many truly proves Matthew 24:7-13 — love disappears, even among those filled with knowledge. Yet knowledge without love is vain, as the apostle Paul says in 1 Corinthians 13. In these last times, THE MANIFESTATION OF LOVE IS THE MARK PAR EXCELLENCE OF THE CHURCH; so instead of seeking to be filled with prophecy or knowledge, let us ask to be filled with love, so as to be led by it in these end times — for as Paul says in 1 Corinthians 8:1-3, knowledge puffs up, but love builds up. May the Lord grant us grace not to lose love in these difficult times, not to go astray; may He give us love not only for the brothers and sisters but also for others, so that we may pray in the right direction. May the Lord grant us the wisdom needed, and the love that is required!",
             it:"Questa domanda è un problema che tocca e colpisce il corpo di Cristo, nel senso che alcune persone hanno la posizione secondo cui non si deve pregare quando una profezia si sta compiendo. Non esiste alcuna situazione in cui non ci sia motivo di pregare; solo Dio può dire a un uomo di tacere su un argomento, ed è un errore sostenere, senza la direzione del Signore, che per un certo argomento non si debba pregare. I veri servitori di Dio, davanti a qualsiasi situazione, volevano pregare — era il Signore a impedirglielo, come avvenne nel libro di Geremia; e mentre Stefano veniva lapidato, pregava. Bisogna pregare in ogni situazione; ciò che cambia è la postura della preghiera (intercessione, ringraziamento, ravvedimento...) — ciò che bisogna fare è cercare la direzione del Signore. A maggior ragione quando il cristiano assiste al giudizio di Dio su una nazione! È dunque crudele dire che bisogna guardare e non fare nulla; coloro che sostengono questa posizione stanno essi stessi compiendo una profezia: 'l'amore dei più si raffredderà.' La Chiesa, quando soffriva, implorava la grazia di Dio — eppure il Signore aveva detto: 'Nel mondo avrete tribolazione.' Il popolo di Dio è afflitto davanti alla sofferenza e implora la sua grazia, affinché il Signore accordi la grazia del ravvedimento; ma oggi si assiste al contrario negli ambienti cristiani: ci si crede troppo spirituali per pregare per queste persone che muoiono. In Atti 4:23-31, dopo che Pietro e Giovanni furono liberati, i santi elevarono una preghiera sotto la direzione dello Spirito Santo, secondo il bisogno dell'ora; questo è il difetto di molti oggi: non abbiamo la direzione del Signore. Oggi diciamo di servire, ma andiamo nella direzione opposta a quella del Signore — cioè l'amore — e alcuni si rallegrano perfino della disgrazia di chi non condivide la loro visione delle cose. L'apostolo Paolo dice di pregare in ogni tempo per mezzo dello Spirito (Efesini 6:18). Ciò che dobbiamo fare è cercare la direzione del Signore in tutto ciò che accade, e non limitarci a guardare gli avvenimenti e dire che questo o quello non richiede la preghiera. Paolo chiedeva di pregare per lui pur sapendo che doveva soffrire a causa del vangelo. Non chiederemo necessariamente a Dio di annullare ciò che sta accadendo, ma di dare la forza per superare la situazione. In Apocalisse 6:8-11 dei santi pregano, ma non era ancora il momento, e nel suo amore, per consolarli, egli diede loro delle vesti nell'attesa dell'ora. Come siamo arrivati al punto di rallegrarci della disgrazia degli altri? Abbiamo forse nemici nella carne? Il nostro Dio, anche quando castiga, è amore, e usa pazienza; la Bibbia dice di lui che non ritarda l'adempimento della sua promessa, ma usa pazienza. Non spetta dunque a noi rallegrarci quando il Signore castiga un popolo; l'atteggiamento di molti dimostra veramente Matteo 24:7-13 — l'amore scompare, anche tra coloro che sono pieni di conoscenza. Ma la conoscenza senza l'amore è vana, come dice l'apostolo Paolo in 1 Corinzi 13. In questi ultimi tempi, LA MANIFESTAZIONE DELL'AMORE È IL SEGNO PER ECCELLENZA DELLA CHIESA; perciò, invece di cercare di essere pieni di profezia o di conoscenza, chiediamo di essere riempiti d'amore, per esserne guidati in questi tempi della fine — perché come dice l'apostolo Paolo in 1 Corinzi 8:1-3, la conoscenza gonfia, ma l'amore edifica. Che il Signore ci accordi la grazia di non perdere l'amore in questi tempi difficili, di non smarrirci; che ci dia amore non solo per i fratelli e le sorelle ma anche per gli altri, affinché preghiamo nella giusta direzione. Che il Signore ci accordi la sapienza necessaria e l'amore che occorre!" }
  },
  {
    id:"le-repas-du-seigneur-les-fondements-bibliques-et-la-vraie-pa", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-17", auteur:"Gaël, le frère",
    titre:{ fr:"Le repas du Seigneur : les fondements bibliques, et la vraie Pâque",
           en:"The Lord's Supper: the biblical foundations, and the true Passover",
           it:"La cena del Signore: i fondamenti biblici e la vera Pasqua" },
    verset:{ fr:"" },
    extrait:{ fr:"L’INSTITUTION DE LA PAQUE :",
             en:"From the institution of the Passover in Egypt to the supper the Lord shared with His disciples: the Lord's Supper is the only Christian feast instituted by Jesus Himself, the high point of brotherly communion.",
             it:"Dall'istituzione della Pasqua in Egitto alla cena che il Signore condivise con i suoi discepoli: la cena del Signore è l'unica festa cristiana istituita da Gesù stesso, il culmine della comunione fraterna." },
    contenu:{ fr:"L’INSTITUTION DE LA PAQUE :|Exode 12 :1-14|Le Seigneur institua en Israël un calendrier (qui jusqu’aujourd’hui est utilisé des juifs), et durant le premier mois de cette année était célébrée la fête de pâque ;|Un agneau mâle ou un chevreau sans défaut d’un an devait être gardé du 10em au 14em jour du mois, (si on compte à partir du mois de mars de notre calendrier on se rendra compte que le mois de septembre est équivalent au septième mois du calendrier juif ainsi de suite. Mais le 10 em jour n’est pas forcément le 10 mars parce que l’année juive varie, c’est généralement pourquoi ceux qui célèbrent la « paques » le font entre mars et avril).|L’agneau ou le chevreau était immolé entre le 14em et le 15 em soir puis il devait être rôti (pas bouilli dans de l’eau ou cuit à demi) avec toutes ses parties, les familles qui ne pouvaient pas finir un agneau devait s’entendre avec la famille voisine, cette viande devait être mangée avec du pain sans levain, en portant une ceinture autour des reins, un bâton à la main et de façon très rapide on ne devait pas en conserver les restes. Le sang des agneaux immolés devait ensuite être utilisé pour marquer les maisons afin que l’ange de la mort voyant le sang passa par-dessus de la maison épargnant les premiers nés de ces familles marqués du sang de l’agneau, c’est de là que cette fête tire son nom, du mot hébreu « Pecach » qui signifie « passer outre, épargner «.|La pâque est donc la première fête instituée par le Seigneur (hormis le Sabbat qui était une convocation du peuple pour recevoir des instructions ou des visions, pour le chrétien Christ est notre Sabbat Cf Matthieu 11 : 28)|L’agneau ou le chevreau devait être un mâle parce que Christ notre pâque était un mâle, et il devait être sans défaut parce que le Seigneur Jésus n’a pas connu de péché.|Pendant son séjour terrestre le Seigneur Jésus a lui aussi pris part à la pâque avec les siens Matthieu26 :1-13 la femme dans la maison de Simon prépare le corps du Seigneur pour le tombeau, elle accomplit un acte prophétique du fait que le corps du Seigneur ne serait pas parfumé avant la sépulture. 17-20 il préparent la pâque, et le soir il partage le repas avec ses disciples et instituent le « diner du Seigneur «|Avant la Scène, Jean 13 : 1-17 le Seigneur donne l’exemple du lavage des pieds. Pourquoi seulement les pieds ?? parce qu’étant chrétiens on est déjà lavé on a juste besoin chaque fois de laver ce pied qui est en contact avec la terre (le péché) en d’autres mots on a juste besoin de se repentir pour les fautes commises, plus besoin d’aller reprendre le processus à zéro. Se laver les pieds les uns des autres en plus de l’acte physique dans les communautés la portée spirituelle est que nous devons intercéder les uns pour les autres, prier pour la purification des frères afin d’être tous purs et cheminer ensemble.|Donc autour de la pâque juive il y avait l’agneau immolé, le grand repas et le lavage des pieds, et ceci était répété chaque année ; ça c’est pour l’ancienne alliance. Maintenant qu’est-ce qu’il en est dans la nouvelle alliance ??|Actes2 :44-47 les premiers chrétiens se retrouvaient au temple pour partager la parole (les communautés n’étaient pas encore bien formées donc pas encore d’assemblée de maison parce qu’il n’y avait pas encore de leader) et ils rentraient ensuite dans la maison rompre le pain et partageaient le repas).|1corinthiens 11 : 20-34|Le but de la réunion des chrétiens en fait ce n’était pas pour le repas du Seigneur, le repas du Seigneur en fait c’est un repas du soir(quand le soir fût venu), un repas complet où chacun des membres a apporté qqch à manger on a mis ensemble et chacun se sert c’est cet amour agapè, durant lequel un bien aimé béni #le pain et on le partage après le repas il béni #la coupe et tout le monde y prend part. on devrait s’assurer que tous ceux qui doivent prendre part soient présent avant le repas (attendez-vous les uns les autres).|1corinthiens 10 :16-17 UN SEUL PAIN et symbole d’une seule alliance, de l’unité dans le corps de Christ. Le fait de participer à plusieurs pains et plusieurs coupes n’est pas du Seigneur ça veut tout simplement dire que chacun a son alliance …|1corinthiens 5 :6-8 le pain doit être sans levain parce que le levain symbolise le faux, le mauvais ; le vin c’est le fruit de la vigne ou encore le raisin pressé.|L’unique fête chrétienne instituée par le Seigneur Jésus lui-même est donc le « repas du Seigneur ».|Tel que l’agneau était immolé en Israël le Seigneur Jésus s’est livré, s’est sacrifié une fois pour toute ( pour cela on n’a pas besoin de le répéter toutes les années comme en Israël), s’est donné afin que nous soyons épargné par l’ange de la mort( celui qui n’est pas marqué du sang de Christ mourra), il mis du comble à son amour pour nous c’est pourquoi il est important de respecter le repas du Seigneur , ce repas doit être pris avec beaucoup de discernement afin de ne pas se rendre coupable de la chair et du sang de Christ, on ne peut pas être conscient de ne pas être en bon terme avec le Seigneur (même si ça e devrait pas arriver si on est chrétien) et prendre le repas du Seigneur. Il est donc important de le faire tel que recommandé par le Seigneur afin de le faire « en mémoire de Lui »|Le repas du Seigneur c’est le point culminant de la communion fraternelle, le point culminant de l’amour Agape car symbole de l’œuvre parfaite de la croix par laquelle nous avons aujourd’hui la grâce d’être appelée enfant de Dieu.|Que le Seigneur nous bénisse abondamment !!!",
             en:"THE INSTITUTION OF THE PASSOVER:|Exodus 12:1-14.|The Lord instituted a calendar in Israel (used by the Jews to this day), and during the first month of that year the feast of Passover was celebrated.|A male lamb or kid, one year old and without blemish, was to be kept from the 10th to the 14th day of the month. (If we count from March in our calendar, we find that September corresponds to the seventh month of the Jewish calendar, and so on. But the 10th day is not necessarily the 10th of March, because the Jewish year varies — which is generally why those who celebrate 'Easter' do so between March and April.)|The lamb or kid was slain between the 14th and 15th evening, then it was to be roasted (not boiled in water or half-cooked) with all its parts; families who could not finish a lamb were to arrange matters with the neighbouring family. The meat was to be eaten with unleavened bread, with a belt around the waist and a staff in hand, in great haste, and none of it was to be kept over. The blood of the slain lambs was then to be used to mark the houses, so that the angel of death, seeing the blood, would pass over the house, sparing the firstborn of those families marked with the blood of the lamb. That is where the feast takes its name: from the Hebrew word 'Pesach', which means 'to pass over, to spare'.|The Passover is therefore the first feast instituted by the Lord (apart from the Sabbath, which was a convocation of the people to receive instructions or visions; for the Christian, Christ is our Sabbath — cf. Matthew 11:28).|The lamb or kid had to be a male because Christ our Passover was a male, and it had to be without blemish because the Lord Jesus knew no sin.|During His earthly life the Lord Jesus Himself also took part in the Passover with His own. In Matthew 26:1-13 the woman in Simon's house prepares the Lord's body for the tomb — she performs a prophetic act, since the Lord's body would not be perfumed before burial. In verses 17-20 they prepare the Passover, and in the evening He shares the meal with His disciples and institutes the 'Lord's supper'.|Before the supper, in John 13:1-17, the Lord gives the example of the washing of feet. Why only the feet? Because as Christians we are already washed; we simply need, each time, to wash the foot that is in contact with the earth (sin) — in other words, we need only repent of the faults committed, without starting the whole process over from the beginning. Washing one another's feet, beyond the physical act practised in the communities, has this spiritual significance: we must intercede for one another, pray for the purification of the brethren, so that all may be pure and walk together.|So around the Jewish Passover there were the slain lamb, the great meal and the washing of feet, repeated every year — that is for the old covenant. Now what about the new covenant?|Acts 2:44-47 — the first Christians gathered at the temple to share the word (the communities were not yet well formed, so there were not yet house assemblies, because there were not yet leaders), and they then went home to break bread and share the meal.|1 Corinthians 11:20-34.|The purpose of the Christians' gathering was in fact not the Lord's Supper itself. The Lord's Supper is an evening meal ('when evening had come'), a full meal to which each member brought something to eat; everything was put together and each one served himself — that is agape love — during which a beloved brother blesses the bread and it is shared, and after the meal he blesses the cup and everyone partakes. We should make sure that all who are to take part are present before the meal ('wait for one another').|1 Corinthians 10:16-17 — ONE BREAD, the symbol of one covenant and of unity in the body of Christ. Partaking of several loaves and several cups is not of the Lord; it simply means that each one has his own covenant.|1 Corinthians 5:6-8 — the bread must be unleavened, because leaven symbolises what is false and evil; the wine is the fruit of the vine, that is, pressed grapes.|The only Christian feast instituted by the Lord Jesus Himself is therefore the 'Lord's Supper'.|Just as the lamb was slain in Israel, the Lord Jesus gave Himself up, sacrificed Himself once for all (which is why we do not need to repeat it every year as in Israel), gave Himself so that we might be spared by the angel of death (whoever is not marked with the blood of Christ will die). He crowned His love for us; that is why it is important to honour the Lord's Supper. This meal must be taken with much discernment, so as not to become guilty of the body and blood of Christ; one cannot knowingly be at odds with the Lord (even though that should not happen to a Christian) and still take the Lord's Supper. It is therefore important to do it as the Lord commanded, in order to do it 'in remembrance of Him'.|The Lord's Supper is the high point of brotherly communion, the high point of agape love, for it is the symbol of the perfect work of the cross, by which we today have the grace of being called children of God.|May the Lord bless us abundantly!",
             it:"L'ISTITUZIONE DELLA PASQUA:|Esodo 12:1-14.|Il Signore istituì in Israele un calendario (usato dai giudei fino a oggi), e durante il primo mese di quell'anno si celebrava la festa di Pasqua.|Un agnello maschio o un capretto senza difetto, di un anno, doveva essere custodito dal 10° al 14° giorno del mese. (Se contiamo a partire dal mese di marzo del nostro calendario, ci accorgiamo che settembre equivale al settimo mese del calendario ebraico, e così via. Ma il 10° giorno non è necessariamente il 10 marzo, perché l'anno ebraico varia — ed è generalmente per questo che coloro che celebrano la 'Pasqua' lo fanno tra marzo e aprile.)|L'agnello o il capretto era immolato tra la 14ª e la 15ª sera, poi doveva essere arrostito (non bollito nell'acqua né cotto a metà) con tutte le sue parti; le famiglie che non potevano finire un agnello dovevano accordarsi con la famiglia vicina. Questa carne doveva essere mangiata con pane senza lievito, con una cintura ai fianchi e un bastone in mano, in gran fretta, e non se ne dovevano conservare i resti. Il sangue degli agnelli immolati doveva poi essere usato per segnare le case, affinché l'angelo della morte, vedendo il sangue, passasse oltre la casa, risparmiando i primogeniti di quelle famiglie segnate dal sangue dell'agnello. È da lì che questa festa prende il suo nome: dalla parola ebraica 'Pesach', che significa 'passare oltre, risparmiare'.|La Pasqua è dunque la prima festa istituita dal Signore (a parte il sabato, che era una convocazione del popolo per ricevere istruzioni o visioni; per il cristiano, Cristo è il nostro sabato — cfr. Matteo 11:28).|L'agnello o il capretto doveva essere un maschio perché Cristo, nostra Pasqua, era un maschio; e doveva essere senza difetto perché il Signore Gesù non ha conosciuto peccato.|Durante il suo soggiorno terreno anche il Signore Gesù prese parte alla Pasqua con i suoi. In Matteo 26:1-13 la donna nella casa di Simone prepara il corpo del Signore per il sepolcro: compie un atto profetico, poiché il corpo del Signore non sarebbe stato profumato prima della sepoltura. Nei versetti 17-20 preparano la Pasqua, e la sera egli condivide il pasto con i suoi discepoli e istituisce la 'cena del Signore'.|Prima della cena, in Giovanni 13:1-17, il Signore dà l'esempio della lavanda dei piedi. Perché solo i piedi? Perché, essendo cristiani, siamo già lavati; abbiamo solo bisogno, ogni volta, di lavare quel piede che è a contatto con la terra (il peccato) — in altre parole, abbiamo solo bisogno di ravvederci per le colpe commesse, senza dover ricominciare il processo da zero. Lavarsi i piedi gli uni gli altri, oltre all'atto fisico praticato nelle comunità, ha questa portata spirituale: dobbiamo intercedere gli uni per gli altri, pregare per la purificazione dei fratelli, affinché tutti siano puri e camminino insieme.|Dunque attorno alla Pasqua ebraica c'erano l'agnello immolato, il grande pasto e la lavanda dei piedi, e questo si ripeteva ogni anno — questo per l'antica alleanza. E ora, che cosa avviene nella nuova alleanza?|Atti 2:44-47 — i primi cristiani si ritrovavano al tempio per condividere la parola (le comunità non erano ancora ben formate, quindi non c'erano ancora assemblee di casa perché non c'erano ancora responsabili), e poi rientravano nelle case a rompere il pane e condividevano il pasto.|1 Corinzi 11:20-34.|Lo scopo della riunione dei cristiani, in realtà, non era la cena del Signore in sé. La cena del Signore è un pasto serale ('quando fu sera'), un pasto completo al quale ciascun membro ha portato qualcosa da mangiare; si mette tutto insieme e ciascuno si serve — è quell'amore agape — durante il quale un fratello benedice il pane e lo si condivide, e dopo il pasto benedice il calice e tutti vi prendono parte. Bisognerebbe assicurarsi che tutti coloro che devono partecipare siano presenti prima del pasto ('aspettatevi gli uni gli altri').|1 Corinzi 10:16-17 — UN SOLO PANE, simbolo di una sola alleanza e dell'unità nel corpo di Cristo. Partecipare a più pani e più calici non è dal Signore: significa semplicemente che ciascuno ha la propria alleanza.|1 Corinzi 5:6-8 — il pane dev'essere senza lievito, perché il lievito simboleggia il falso, il male; il vino è il frutto della vite, cioè l'uva spremuta.|L'unica festa cristiana istituita dal Signore Gesù stesso è dunque la 'cena del Signore'.|Come l'agnello era immolato in Israele, il Signore Gesù si è consegnato, si è sacrificato una volta per sempre (per questo non c'è bisogno di ripeterlo ogni anno come in Israele), si è donato affinché fossimo risparmiati dall'angelo della morte (chi non è segnato dal sangue di Cristo morirà). Ha portato al colmo il suo amore per noi; per questo è importante rispettare la cena del Signore. Questo pasto dev'essere preso con molto discernimento, per non rendersi colpevoli del corpo e del sangue di Cristo; non si può essere consapevoli di non essere in buoni rapporti con il Signore (anche se questo non dovrebbe accadere a un cristiano) e prendere la cena del Signore. È dunque importante farla come il Signore ha raccomandato, per farla 'in memoria di Lui'.|La cena del Signore è il culmine della comunione fraterna, il culmine dell'amore agape, perché è il simbolo dell'opera perfetta della croce, per la quale oggi abbiamo la grazia di essere chiamati figli di Dio.|Che il Signore ci benedica abbondantemente!" }
  },
  {
    id:"la-place-de-la-sanctification-dans-la-vie-d-un-enfant-du-sei", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-16", auteur:"Gaël, le frère",
    titre:{ fr:"La place de la sanctification dans la vie d'un enfant du Seigneur : qu'est-ce que la sanctification et comment la vivre ??",
           en:"The place of sanctification in the life of a child of the Lord: what is sanctification, and how is it lived?",
           it:"Il posto della santificazione nella vita di un figlio del Signore: che cos'è la santificazione e come viverla?" },
    verset:{ fr:"" },
    extrait:{ fr:"La sanctification est un processus de mise à part qui nous porte à refléter l'image du Seigneur Jésus.",
             en:"Sanctification is a process of setting apart that leads us to reflect the image of the Lord Jesus. A life in the Lord without sanctification is simply impossible.",
             it:"La santificazione è un processo di separazione che ci porta a riflettere l'immagine del Signore Gesù. Una vita nel Signore senza santificazione è semplicemente impossibile." },
    contenu:{ fr:"La sanctification est un processus de mise à part qui nous porte à refléter l'image du Seigneur Jésus.|Elle touche tous les aspects de notre vie soit le plan spirituel que celui Physique (intérieur et extérieur).|Et on ne peut se dire enfant de Dieu sans se sanctifier. Une vie dans le Seigneur sans sanctification est tout simplement impossible, ce n'est pas une vie en Christ.|Exode 19 :1-12,21-22|Une chose sainte est mise à part réservée et consacrée. En outre, la consécration c'est la purification la consécration.|Qui sanctifie ?? 1Thessaloniciens5 :23 Dieu nous sanctifie lui-même pour nous préserver purs.|C’est en effet ça le but de la sanctification : se conserver pour avoir part aux récompenses quand le Seigneur reviendra ; c'est le Christ qui doit accomplir en nous cette œuvre.|Ephésiens 5 :25-27.|Nous allons distinguer dans la sanctification :|- La sanctification ponctuelle qui est accomplie de Dieu lors de la conversion elle est celle qui ôte le péché et donne le salut faisant de nous désormais des saints ;|- Et la sanctification processus qui se fait au travers de la parole du seigneur par le Saint-Esprit. 1Jean6 : 6-10, Jean 17 :9-26 ce processus débute dès notre conversion et ne se termine qu'à la mort ou alors à la venue du Seigneur pour ceux qui le verront.|Elle comporte une dimension invisible (comporte la transformation du cœur de pierre en cœur de chair) et visible (comporte le changement du comportement du mode vestimentaire etc.).|La sanctification est pour l'accomplissement d'une œuvre bien précise c'est-à-dire quand on se sanctifie on devient un ouvrier du Seigneur, on devient comme cet instrument-là fabriqué de l'artisan mais sur lequel de l'huile d'onction a été versé et donc il ne peut plus être utilisé de n'importe quelle façon.|Donc quand on reçoit l'eau (la parole) elle opère en nous cette œuvre de transformation, on ne peut donc recevoir l'esprit de Dieu et refuser de compléter l'œuvre à travers la transformation et la mise à part pour Christ.",
             en:"Sanctification is a process of setting apart that leads us to reflect the image of the Lord Jesus.|It touches every aspect of our life, both the spiritual and the physical (inward and outward).|And no one can call himself a child of God without sanctifying himself. A life in the Lord without sanctification is simply impossible — it is not a life in Christ.|Exodus 19:1-12, 21-22.|A holy thing is set apart, reserved and consecrated. Consecration, moreover, involves purification.|Who sanctifies? 1 Thessalonians 5:23 — God Himself sanctifies us, to preserve us pure.|That is indeed the aim of sanctification: to keep ourselves so as to have a share in the rewards when the Lord returns; it is Christ who must accomplish this work in us.|Ephesians 5:25-27.|Within sanctification we distinguish:|— punctual sanctification, accomplished by God at conversion: it is the one that removes sin and gives salvation, henceforth making us saints;|— and sanctification as a process, which takes place through the word of the Lord by the Holy Spirit (1 John, John 17:9-26). This process begins at our conversion and ends only at death — or at the coming of the Lord, for those who will see it.|It has an invisible dimension (the transformation of the heart of stone into a heart of flesh) and a visible one (the change in behaviour, in manner of dress, and so on).|Sanctification is for the accomplishment of a very precise work: when we sanctify ourselves we become workers of the Lord — like that vessel fashioned by the craftsman on which anointing oil has been poured, which can therefore no longer be used just any way.|So when we receive the water (the word), it performs in us this work of transformation; we cannot receive the Spirit of God and refuse to complete the work through transformation and setting apart for Christ.",
             it:"La santificazione è un processo di separazione che ci porta a riflettere l'immagine del Signore Gesù.|Tocca tutti gli aspetti della nostra vita, sia sul piano spirituale che su quello fisico (interiore ed esteriore).|E non ci si può dire figli di Dio senza santificarsi. Una vita nel Signore senza santificazione è semplicemente impossibile: non è una vita in Cristo.|Esodo 19:1-12, 21-22.|Una cosa santa è messa da parte, riservata e consacrata. La consacrazione, inoltre, comporta la purificazione.|Chi santifica? 1 Tessalonicesi 5:23 — Dio stesso ci santifica per conservarci puri.|È proprio questo lo scopo della santificazione: conservarsi per avere parte alle ricompense quando il Signore tornerà; è Cristo che deve compiere in noi quest'opera.|Efesini 5:25-27.|Nella santificazione distingueremo:|— la santificazione puntuale, compiuta da Dio alla conversione: è quella che toglie il peccato e dona la salvezza, facendo di noi ormai dei santi;|— e la santificazione come processo, che si compie attraverso la parola del Signore per mezzo dello Spirito Santo (1 Giovanni, Giovanni 17:9-26). Questo processo inizia alla nostra conversione e termina solo alla morte — o alla venuta del Signore, per coloro che la vedranno.|Essa comporta una dimensione invisibile (la trasformazione del cuore di pietra in cuore di carne) e una visibile (il cambiamento del comportamento, del modo di vestire, ecc.).|La santificazione è in vista del compimento di un'opera ben precisa: quando ci santifichiamo diventiamo operai del Signore — come quello strumento fabbricato dall'artigiano sul quale è stato versato l'olio dell'unzione, e che perciò non può più essere usato in qualsiasi modo.|Dunque, quando riceviamo l'acqua (la parola), essa opera in noi quest'opera di trasformazione; non possiamo quindi ricevere lo Spirito di Dio e rifiutare di completare l'opera attraverso la trasformazione e la separazione per Cristo." }
  },
  {
    id:"apocalypse-5-decrit-la-vision-d-un-agneau-qui-va-prendre-le", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-15", auteur:"Gaël, le frère",
    titre:{ fr:"Apocalypse 5 décrit la vision d'un agneau qui va prendre le livre dans les mains de celui qui est assis sur le trône. comment ça se fait étant donné que nous savons qu'il y'a un seul trône et seul Seigneur ??",
           en:"Revelation 5 describes a Lamb taking the book from the hand of the One seated on the throne — how can this be, since there is only one throne and one Lord?",
           it:"Apocalisse 5 descrive un Agnello che prende il libro dalla mano di Colui che siede sul trono — come può essere, visto che c'è un solo trono e un solo Signore?" },
    verset:{ fr:"" },
    extrait:{ fr:"Si nous allons lire dans Daniel 7 :1-9 nous lisons la description d l'Ancien des jours qui correspond à celle de Jésus que Jean a vu dans apocalypse 1, ceci nous fait donc comprendre que Jésus est…",
             en:"Comparing Daniel 7, Revelation 1 and Stephen's vision: these are visions, and each one recounts how God revealed Himself to him. The Lamb who receives the book and the One on the throne are the same person.",
             it:"Confrontando Daniele 7, Apocalisse 1 e la visione di Stefano: si tratta di visioni, e ciascuno racconta come Dio si è rivelato a lui. L'Agnello che riceve il libro e Colui che è sul trono sono la stessa persona." },
    contenu:{ fr:"Si nous allons lire dans Daniel 7 :1-9 nous lisons la description d l'Ancien des jours qui correspond à celle de Jésus que Jean a vu dans apocalypse 1, ceci nous fait donc comprendre que Jésus est l'Ancien des jours. Or allant plus dans le livre de Daniel on a l'impression qu'on a à faire à une autre personne, ce parce qu'il s'agit d'une vision, or quand qqn raconte une vision celui qui écoute pourrait ne pas comprendre s'il n'a pas l'Esprit.|Dans les versets 13-14 le Seigneur veut faire passer un message à Daniel, il y'a un homme qui est descendu parmi les hommes faire un sacrifice c'est ce pourquoi on lui a donné la souveraineté, la domination, il a été élevé au-dessus de tout afin que tous confessent qu'il est Seigneur et celui-ci c'est Jésus-Christ. Jésus est Seigneur, Il est Dieu, l'Ancien des jours.|Actes 7 :49-59 à lire la vision d'Etienne on devrait se demander si Dieu est Esprit comment se fait-il qu'Il soit assis ?? Etienne a vu qqch et a compris de quoi il s'agissait mais il est fort probable que celui qui lit ne comprenne pas.|Si donc nous avons une interprétation d'une vision qui ne cadre pas avec la révélation c'est que nous nous trompons.|Pour donc revenir à notre Agneau : parce qu'il a fait un sacrifice, il est digne de recevoir toute gloire, il y'a un seul Dieu, un seul seigneur, un seul médiateur entre Dieu et les hommes : Jésus-Christ.|Ces textes peuvent porter à confusion dans le sens que ce sont des visions donc chacun raconte ce qu'il vu, la façon dont il a vu Dieu se révéler lui mais ça ne veut pas pour autant dire qqn a vu Dieu et l'autre ne l'a pas vu parce qu'ils ont vu des choses différentes. Un exemple la voix qui parlait dans le ciel et le feu sur le buisson était Dieu, une autre preuve nous sommes à endroit différents pendant que j'ai une vision du Seigneur un autre ailleurs le voit aussi au même moment et nous le voyons de façon différente mais c'est toujours Dieu, notre Dieu est capable de tout comment pouvons-nous encore douter qu'il soit en même de se dédoubler ?? Donc l'agneau qui reçoit le livre avec les sceaux et celui sur le trône sont la même personne.",
             en:"If we read Daniel 7:1-9, we find a description of the Ancient of Days which corresponds to that of Jesus whom John saw in Revelation 1; this makes us understand that Jesus is the Ancient of Days. Yet going further into the book of Daniel we get the impression of dealing with another person — because it is a vision, and when someone recounts a vision, the hearer may not understand if he does not have the Spirit.|In verses 13-14 the Lord wants to convey a message to Daniel: there is a man who came down among men to make a sacrifice, and that is why He was given sovereignty and dominion; He was exalted above all so that all might confess that He is Lord — and this One is Jesus Christ. Jesus is Lord; He is God, the Ancient of Days.|Acts 7:49-59 — reading Stephen's vision, we might ask: if God is Spirit, how can He be seated? Stephen saw something and understood what it was, but it is quite possible that the reader does not.|If, therefore, we have an interpretation of a vision that does not agree with revelation, it means we are mistaken.|To return, then, to our Lamb: because He made a sacrifice, He is worthy to receive all glory. There is one God, one Lord, one mediator between God and men: Jesus Christ.|These texts can cause confusion because they are visions: each one recounts what he saw, the way God chose to reveal Himself to him. But that does not mean one man saw God and the other did not, simply because they saw different things. For example, the voice speaking from heaven and the fire on the bush were both God. Another proof: we may be in different places — while I have a vision of the Lord, another elsewhere sees Him at the same moment, and we see Him differently, yet it is still God. Our God is capable of everything; how can we still doubt that He is able to manifest Himself in more than one form at once? So the Lamb who receives the book with the seals and the One on the throne are the same person.",
             it:"Se leggiamo Daniele 7:1-9, troviamo la descrizione dell'Antico dei giorni che corrisponde a quella di Gesù che Giovanni ha visto in Apocalisse 1; questo ci fa capire che Gesù è l'Antico dei giorni. Eppure, proseguendo nel libro di Daniele, si ha l'impressione di avere a che fare con un'altra persona — perché si tratta di una visione, e quando qualcuno racconta una visione, chi ascolta potrebbe non capire se non ha lo Spirito.|Nei versetti 13-14 il Signore vuole trasmettere un messaggio a Daniele: c'è un uomo che è disceso tra gli uomini per compiere un sacrificio, ed è per questo che gli sono state date la sovranità e la signoria; è stato innalzato al di sopra di tutto affinché tutti confessino che egli è il Signore — e questi è Gesù Cristo. Gesù è il Signore; è Dio, l'Antico dei giorni.|Atti 7:49-59 — leggendo la visione di Stefano dovremmo chiederci: se Dio è Spirito, come può essere seduto? Stefano ha visto qualcosa e ha capito di che cosa si trattava, ma è ben probabile che chi legge non capisca.|Se dunque abbiamo un'interpretazione di una visione che non concorda con la rivelazione, vuol dire che ci stiamo sbagliando.|Per tornare dunque al nostro Agnello: poiché ha compiuto un sacrificio, è degno di ricevere ogni gloria. C'è un solo Dio, un solo Signore, un solo mediatore fra Dio e gli uomini: Gesù Cristo.|Questi testi possono generare confusione perché sono visioni: ciascuno racconta ciò che ha visto, il modo in cui Dio si è rivelato a lui. Ma questo non significa che uno abbia visto Dio e l'altro no, solo perché hanno visto cose diverse. Un esempio: la voce che parlava dal cielo e il fuoco sul roveto erano entrambi Dio. Un'altra prova: possiamo trovarci in luoghi diversi — mentre io ho una visione del Signore, un altro altrove lo vede nello stesso momento, e lo vediamo in modo diverso, ma è sempre Dio. Il nostro Dio è capace di tutto; come possiamo ancora dubitare che sia in grado di manifestarsi in più forme al tempo stesso? Dunque l'Agnello che riceve il libro con i sigilli e Colui che è sul trono sono la stessa persona." }
  },
  {
    id:"nous-voyons-souvent-dans-les-assemblees-des-personnes-qui-di", rubrique:"enseignements", sousRubrique:"realites",
    date:"2026-06-14", auteur:"Gaël, le frère",
    titre:{ fr:"Nous voyons souvent dans les assemblées des personnes qui disent être sous l'effet de l'Esprit Saint et s'agitent, se torpillent çà et là, que dire ??",
           en:"We often see people in the assemblies who claim to be under the power of the Holy Spirit, thrashing and hurling themselves about — what should we say?",
           it:"Vediamo spesso nelle assemblee persone che dicono di essere sotto l'effetto dello Spirito Santo e si agitano, si scagliano qua e là — che dire?" },
    verset:{ fr:"" },
    extrait:{ fr:"Le Saint-Esprit ne peut venir sur qqn et lui faire du mal, le blesser ; le Saint-Esprit est un esprit de paix de douceur… le Saint-Esprit aurait-il changé ses fruits ? Il pourrait arriver…",
             en:"The Holy Spirit cannot come upon someone and harm him: He is a Spirit of peace and gentleness. Would the Holy Spirit have changed His fruits?",
             it:"Lo Spirito Santo non può venire su qualcuno e fargli del male: è uno Spirito di pace e di dolcezza. Lo Spirito Santo avrebbe forse cambiato i suoi frutti?" },
    contenu:{ fr:"Le Saint-Esprit ne peut venir sur qqn et lui faire du mal, le blesser ; le Saint-Esprit est un esprit de paix de douceur… le Saint-Esprit aurait-il changé ses fruits ? Il pourrait arriver qu’emporté par la prière, on se retrouve en train de tomber mais ce n'est pas une chute aussi violente que ce qu'on observe aujourd'hui.|Gal5 :16-24 la chair et l'esprit ont des désirs des manifestations opposées, c'est pourquoi ayant l'Esprit nous accomplissons ses désirs pas ce que nous voulons ; il peut aussi arriver que qqn tombe sous l'effet du Saint-Esprit  parce qu'on est en train de prier pour lui  et le Seigneur est en train d'accomplir une œuvre, il y'a un combat qui se mène, il y'a un problème à résoudre et c'est cet affront-là qui fait de sorte que la personne tombe. Mais qqn ne peut pas être sous l'effet de l'esprit tout le temps et il faut qu'on l’arrête, le Saint-Esprit agirait-il comme les démons ?? La parole devrait nous servir d'appui plusieurs personnes ont parlé avec le Seigneur et en Son nom mais on ne verra nulle part de telles manifestation.|Et le parler en langue donc ?? Disons déjà que les dos spirituels ne se manifestent pas quand celui qui l'a le veut mais quand l'Esprit le décide.  Si le Saint-Esprit se manifeste en qqn par le parler en langue ce n'est pas cette personne qui décide quand elle doit parler en langue mais quand l'Esprit le veut elle sent le besoin et ne peut le retenir et donc elle parle. Les premiers parler en langue sont ceux sur lesquels ont devrait s'appuyer pour distinguer parce qu'étant les originaux, sous l'effet de l'Esprit les apôtres ont parlé en des langues compréhensibles, même si celui qui parle ne comprend pas c'est une langue qui existe, qui peut être comprise par qqn quelque part, même le Seigneur Jésus dit : \" vous parlerez des langues nouvelles. Tout ceci n'est pas pour dire que tous les parler en langue sont faux il y'a des originaux mais si qqn parle et ce de façon non contrôlée et qu'en plus ce soit un parler vide de sens, une langue inexistante alors il y'a un problème et si on en arrive à la délivrance ça veut dire que ce n'était pas le Saint-Esprit parce qu'on ne peut délivrer personne du Saint-Esprit quand il est entré en qqn c'est pour y rester pour toujours.|Que le Seigneur nous bénisse !",
             en:"The Holy Spirit cannot come upon someone and do him harm or injure him; the Holy Spirit is a Spirit of peace, of gentleness... Would the Holy Spirit have changed His fruits? It may happen that, carried away in prayer, someone ends up falling — but not with the violence of the falls we observe today.|Galatians 5:16-24 — the flesh and the Spirit have opposing desires and manifestations; that is why, having the Spirit, we carry out His desires and not our own. It can also happen that someone falls under the power of the Holy Spirit because prayer is being made for him and the Lord is accomplishing a work: there is a battle being waged, a problem being resolved, and it is that confrontation which causes the person to fall. But no one can be under the power of the Spirit all the time to the point of having to be restrained — would the Holy Spirit act like the demons? The word should be our support: many people spoke with the Lord and in His name, but nowhere do we see such manifestations.|And what about speaking in tongues? Let us say first that spiritual gifts do not manifest themselves whenever their bearer wishes, but when the Spirit decides. If the Holy Spirit manifests Himself in someone by speaking in tongues, it is not that person who decides when to speak in tongues; when the Spirit wills it, he feels the need, cannot hold it back, and so he speaks. The first instances of speaking in tongues are the ones we should rely on to discern, because they are the originals: under the power of the Spirit, the apostles spoke in intelligible languages. Even if the speaker does not understand, it is a language that exists, that can be understood by someone somewhere — the Lord Jesus Himself says, 'they will speak with new tongues.' None of this is to say that all speaking in tongues is false — there are genuine ones. But if someone speaks in an uncontrolled way, and moreover it is empty speech, a non-existent language, then there is a problem; and if it comes to deliverance, that means it was not the Holy Spirit, for no one can be delivered from the Holy Spirit — when He enters someone, it is to remain forever.|May the Lord bless us!",
             it:"Lo Spirito Santo non può venire su qualcuno e fargli del male, ferirlo; lo Spirito Santo è uno Spirito di pace, di dolcezza... Lo Spirito Santo avrebbe forse cambiato i suoi frutti? Può accadere che, trasportati dalla preghiera, ci si ritrovi a cadere — ma non è una caduta così violenta come quella che si osserva oggi.|Galati 5:16-24 — la carne e lo Spirito hanno desideri e manifestazioni opposti; per questo, avendo lo Spirito, compiamo i suoi desideri e non ciò che vogliamo noi. Può anche accadere che qualcuno cada sotto l'effetto dello Spirito Santo perché si sta pregando per lui e il Signore sta compiendo un'opera: c'è un combattimento in corso, un problema da risolvere, ed è quello scontro a far cadere la persona. Ma nessuno può essere sotto l'effetto dello Spirito in ogni momento al punto da doverlo fermare — lo Spirito Santo agirebbe forse come i demòni? La parola deve servirci da appoggio: molte persone hanno parlato con il Signore e nel suo nome, ma da nessuna parte si vedono simili manifestazioni.|E il parlare in lingue, allora? Diciamo anzitutto che i doni spirituali non si manifestano quando lo vuole chi li possiede, ma quando lo decide lo Spirito. Se lo Spirito Santo si manifesta in qualcuno con il parlare in lingue, non è quella persona a decidere quando parlare in lingue; quando lo Spirito lo vuole, essa ne sente il bisogno, non può trattenerlo, e quindi parla. I primi episodi di parlare in lingue sono quelli su cui dovremmo appoggiarci per discernere, perché sono gli originali: sotto l'effetto dello Spirito, gli apostoli parlarono in lingue comprensibili. Anche se chi parla non capisce, è una lingua che esiste, che può essere compresa da qualcuno da qualche parte — il Signore Gesù stesso dice: 'parleranno lingue nuove'. Tutto questo non per dire che ogni parlare in lingue sia falso — ci sono gli originali; ma se qualcuno parla in modo incontrollato, e per di più è un parlare vuoto di senso, una lingua inesistente, allora c'è un problema. E se si arriva alla liberazione, vuol dire che non era lo Spirito Santo, perché non si può liberare nessuno dallo Spirito Santo: quando è entrato in qualcuno, è per rimanervi per sempre.|Che il Signore ci benedica!" }
  },
  {
    id:"les-enfants-de-dieu-face-aux-injustices-les-attitudes-a-adop", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-13", auteur:"Gaël, le frère",
    titre:{ fr:"Les enfants de Dieu face aux injustices : les attitudes à adopter",
           en:"The children of God in the face of injustice: the attitudes to adopt",
           it:"I figli di Dio di fronte alle ingiustizie: gli atteggiamenti da adottare" },
    verset:{ fr:"" },
    extrait:{ fr:"1Pierre2 : 11-25 ; Actes5 : 33-42",
             en:"The first reaction of a Christian who suffers injustice is thanksgiving — remaining confident even when we do not understand, for all things work together for the good of those who love God.",
             it:"La prima reazione di un cristiano che subisce un'ingiustizia è il ringraziamento — restare fiduciosi anche quando non si capisce, perché tutte le cose cooperano al bene di quelli che amano Dio." },
    contenu:{ fr:"1Pierre2 : 11-25 ; Actes5 : 33-42|(Une chose qui n'est pas de Dieu elle ne pas perdurer.)|Une chose intéressante est que nous voyons les apôtres au verstes 41 après cette confrontation être heureux d’avoir été dignes de subir des outrages au nom du Seigneur Jésus.|Parlons des différents types d’injustices :|-celles liées à notre foi|-celles qui ne dépendent pas de notre foi par exemple les salaires impayés|Faces à celles-ci nos réactions ne doivent pas être pareilles à celles des hommes du monde  car un chrétien ne se mêle pas au désordre mais bien il doit être patient lorsqu'on souffre de façon injuste et que nous acceptons cela nous rendons u culte à Dieu c'est donc pourquoi la première réaction d'un chrétien qui subit l'injustice est l'action de grâce c'est-à-dire être conscient de ce que tout dépend de Dieu car tout concoure au bien de ceux qui aiment Dieu ,  donc rester confiant  même quand on ne comprend pas.|*les injustices peuvent souvent affecter notre relation avec le Seigneur et c'est là le signe qu'il y'a du travail à faire dans le cœur, travailler le cœur de façon à ce que peu importe ce que l'on subit on arrive à rendre grâce au Seigneur ; on ne doit pas vivre en fonction des évènements mais se laisser enseigneur par ceux-ci ! Ce qu'il y aura à subir est grand et donc il faut préparer son cœur.|L’attitude que nous adoptons face à une injustice rend compte de l'état de notre cœur.|Que dire donc de ce qu'on pourrait faire face aux injustices du monde ?|Notons que vouloir imposer la justice au monde c'est comme entrer dans un bar et interdire aux gens d'écouter leur style de musique ; on ne peut certainement pas changer le monde mais à notre niveau on pourrait décider que l'injustice ne passera pas par nous en faisant la justice à notre niveau, et aussi prier pour ceux qui subissent et aussi pour leur bourreau.",
             en:"1 Peter 2:11-25; Acts 5:33-42.|(A thing that is not of God cannot last.)|One interesting point: in verse 41 we see the apostles, after that confrontation, rejoicing at having been counted worthy to suffer shame for the name of the Lord Jesus.|Let us speak of the different types of injustice:|— those linked to our faith;|— those that do not depend on our faith, for example unpaid wages.|In the face of these, our reactions must not be like those of the people of the world, for a Christian does not join in disorder; rather, he must be patient. When we suffer unjustly and accept it, we render worship to God. That is why the first reaction of a Christian who suffers injustice is thanksgiving — that is, being aware that everything depends on God, for all things work together for the good of those who love God; therefore remaining confident even when we do not understand.|Injustices can often affect our relationship with the Lord, and that is the sign that there is work to be done in the heart: to work on the heart so that, whatever we suffer, we manage to give thanks to the Lord. We must not live at the mercy of events, but let ourselves be taught by them! What will have to be endured is great, so the heart must be prepared.|The attitude we adopt in the face of an injustice reveals the state of our heart.|What then can be done about the injustices of the world?|Note that wanting to impose justice on the world is like walking into a bar and forbidding people to listen to their style of music. We certainly cannot change the world, but at our own level we can decide that injustice will not pass through us, by doing justice at our level — and also pray for those who suffer, and for their tormentors as well.",
             it:"1 Pietro 2:11-25; Atti 5:33-42.|(Una cosa che non è da Dio non può durare.)|Un punto interessante: al versetto 41 vediamo gli apostoli, dopo quel confronto, rallegrarsi di essere stati ritenuti degni di subire oltraggi per il nome del Signore Gesù.|Parliamo dei diversi tipi di ingiustizia:|— quelle legate alla nostra fede;|— quelle che non dipendono dalla nostra fede, per esempio i salari non pagati.|Di fronte ad esse le nostre reazioni non devono essere uguali a quelle degli uomini del mondo, perché un cristiano non si mescola al disordine; deve invece essere paziente. Quando soffriamo ingiustamente e lo accettiamo, rendiamo un culto a Dio. Ecco perché la prima reazione di un cristiano che subisce l'ingiustizia è il ringraziamento — cioè essere consapevoli che tutto dipende da Dio, perché tutte le cose cooperano al bene di quelli che amano Dio; dunque restare fiduciosi anche quando non si capisce.|Le ingiustizie possono spesso toccare la nostra relazione con il Signore, ed è lì il segno che c'è un lavoro da fare nel cuore: lavorare il cuore in modo che, qualunque cosa si subisca, si riesca a rendere grazie al Signore. Non dobbiamo vivere in funzione degli avvenimenti, ma lasciarci istruire da essi! Ciò che ci sarà da subire è grande, quindi bisogna preparare il cuore.|L'atteggiamento che adottiamo di fronte a un'ingiustizia rivela lo stato del nostro cuore.|Che dire dunque di ciò che si potrebbe fare di fronte alle ingiustizie del mondo?|Notiamo che voler imporre la giustizia al mondo è come entrare in un bar e vietare alla gente di ascoltare il proprio genere di musica. Certamente non possiamo cambiare il mondo, ma al nostro livello possiamo decidere che l'ingiustizia non passerà attraverso di noi, facendo giustizia al nostro livello — e anche pregare per coloro che la subiscono, e pure per i loro aguzzini." }
  },
  {
    id:"marc-14-3-9-2-samuel6-16-23-luc7-47", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-06-12", auteur:"Gaël, le frère",
    titre:{ fr:"Étude biblique : Marc 14:3-9 ; 2 Samuel 6:16-23 ; Luc 7:47",
           en:"Bible study: Mark 14:3-9; 2 Samuel 6:16-23; Luke 7:47",
           it:"Studio biblico: Marco 14:3-9; 2 Samuele 6:16-23; Luca 7:47" },
    verset:{ fr:"" },
    extrait:{ fr:"- L'ACTION DE GRACE : les actions de grâces sont différentes selon la manifestation de Dieu dans la vie de chacun car chacun a son intimité et sa propre expérience avec le Seigneur les standards…",
             en:"Thanksgiving differs according to God's dealings in each life. Does our thanksgiving truly take account of the place from which we were drawn?",
             it:"Il ringraziamento è diverso secondo l'opera di Dio nella vita di ciascuno. Il nostro ringraziamento tiene davvero conto del luogo da cui siamo stati tratti?" },
    contenu:{ fr:"- L'ACTION DE GRACE : les actions de grâces sont différentes selon la manifestation de Dieu dans la vie de chacun car chacun a son intimité et sa propre expérience avec le Seigneur les standards pour qu'une action de grâce soit agréable au Seigneur ; nous voyons dans les gestes de David et de la femme de mauvaise vie le symbole de ce qu'est véritablement le Seigneur pour eux. Nous nous préoccupons souvent de ce que vont penser les autres or cette femme n'a pas considéré combien ces gens qui connaissaient son style de vie pouvaient la juger, car elle savait une seule chose l'endroit d'où le Seigneur l'avait retirée, il en est de même pour David ils n'ont pas eu honte de quoique ce soit, ils voulaient juste rendre grâce.|Est-ce que notre action de grâce tient vraiment compte de l'endroit d'où nous avons été tirés ??|Comme cette femme a brisé le flacon du parfum (symbole d'une action délibérée) notre action doit avoir pour essence l’amour, la prise en considération de la distance que le Seigneur nous a fait parcourir des ténèbres pour la lumière, tous ces paramètres vont donner un autre cours à notre façon de rendre grâce.|Exercice : chacun doit examiner sa façon d'approcher le Seigneur avec nos actions de grâce afin de les rendre meilleures.",
             en:"THANKSGIVING: acts of thanksgiving differ according to the manifestation of God in each person's life, for each has his own intimacy and his own experience with the Lord. In the gestures of David and of the woman of ill repute we see the symbol of what the Lord truly is for them. We often worry about what others will think; yet that woman did not consider how those who knew her way of life might judge her, for she knew only one thing — the place from which the Lord had drawn her. It is the same with David: they were ashamed of nothing; they simply wanted to give thanks.|Does our thanksgiving truly take account of the place from which we were drawn?|As that woman broke the flask of perfume (the symbol of a deliberate act), our act must have love as its essence, and the consideration of the distance the Lord has made us travel from darkness to light; all these factors will give a different course to our way of giving thanks.|Exercise: let each one examine his way of approaching the Lord with his thanksgiving, in order to make it better.",
             it:"IL RINGRAZIAMENTO: i ringraziamenti sono diversi secondo la manifestazione di Dio nella vita di ciascuno, perché ognuno ha la propria intimità e la propria esperienza con il Signore. Nei gesti di Davide e della donna di cattiva vita vediamo il simbolo di ciò che il Signore è veramente per loro. Spesso ci preoccupiamo di ciò che penseranno gli altri; quella donna invece non ha considerato quanto coloro che conoscevano il suo stile di vita avrebbero potuto giudicarla, perché sapeva una sola cosa: il luogo da cui il Signore l'aveva tratta. Lo stesso vale per Davide: non si sono vergognati di nulla, volevano soltanto rendere grazie.|Il nostro ringraziamento tiene davvero conto del luogo da cui siamo stati tratti?|Come quella donna ha spezzato il vaso di profumo (simbolo di un atto deliberato), il nostro atto deve avere per essenza l'amore, la considerazione della distanza che il Signore ci ha fatto percorrere dalle tenebre alla luce; tutti questi elementi daranno un altro corso al nostro modo di rendere grazie.|Esercizio: ciascuno esamini il proprio modo di avvicinarsi al Signore con i propri ringraziamenti, per renderli migliori." }
  },
  {
    id:"exhortations-1-corinthiens-14-26", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-06-11", auteur:"Gaël, le frère",
    titre:{ fr:"Exhortations : 1 Corinthiens 14 :26",
           en:"Exhortations: 1 Corinthians 14:26",
           it:"Esortazioni: 1 Corinzi 14:26" },
    verset:{ fr:"" },
    extrait:{ fr:"Une chose importante que nous devons retenir avant d'entrer dans ce verset c'est qu'on ne va pas au culte car en réalité le culte qu'on rend à Dieu c'est notre vie tel Romains 12 :1-2 le culte que…",
             en:"The worship we render to God is our life itself. The Lord's plan is that everyone take part in the assembly meetings for the edification of all — plus two questions: casting out demons by demons, and objects consecrated to Satan.",
             it:"Il culto che rendiamo a Dio è la nostra stessa vita. Il piano del Signore è che tutti prendano parte alle riunioni dell'assemblea per l'edificazione di tutti — più due domande: scacciare i demòni con i demòni, e gli oggetti consacrati a Satana." },
    contenu:{ fr:"Une chose importante que nous devons retenir avant d'entrer dans ce verset, c'est qu'on ne « va » pas au culte : en réalité, le culte qu'on rend à Dieu, c'est notre vie, selon Romains 12:1-2 — le culte que Dieu agrée, c'est le sacrifice de nos cœurs, marcher dans la sainteté, la piété, etc. L'apôtre Paul ajoute encore dans 1 Thessaloniciens 4:3 que ce que le Seigneur veut, c'est notre sanctification. Donc quand on déclare « aller au culte », on se rend spectateur de la chose, comme si on allait au cinéma par exemple ; or le Seigneur n'a pas besoin de cela. Le plan de l'Éternel, c'est que tous prennent part de manière participative aux réunions d'assemblée, pas seulement venir suivre ce qui a été sculpté à l'avance par un groupe de personnes. Chaque chrétien peut chanter, prier, dire une exhortation, partager une vision ou un songe, tout ceci avec un but : l'édification de tous (ce qui n'édifie pas n'est pas utile à l'assemblée) ; il suffit de se laisser utiliser par le Saint-Esprit.|Il faut déjà souligner qu'aucune dénomination, aucune église-institution ne respecte le standard établi par les apôtres. Des exemples : ces églises ont des noms, or le nom est déjà symbole de division (1 Corinthiens 3:1-7) — un chrétien qui se réclame d'une dénomination est tout simplement charnel. D'autres exemples sont la construction des bâtiments, la hiérarchisation, le mode de baptême, le repas du Seigneur, etc. Donc un enfant du Seigneur dans ces positions devrait interroger le Seigneur et obéir. Si le Seigneur demande d'en sortir, il faudrait le faire, parce que c'est ainsi qu'Il nous recevra ; n'ayons pas peur, bien-aimés, de prendre des décisions fermes avec le Seigneur, ni de la réaction des autres — parfois nous nous perdons à cause de cela.|Une communauté chrétienne est faite de cohésion et d'amour, pas d'activisme.|Lévitique 10:1-2 ; 2 Samuel 6:1-7 ; Nombres 7:9.|Le feu étranger est symbole de l'enseignement qui ne vient pas du Seigneur, qui n'est pas inspiré du Saint-Esprit. Peu importe nos bonnes intentions : quand on n'est pas appelé à faire l'œuvre du Seigneur, si on y touche, on meurt — pas forcément d'une mort physique. Retenons que les instructions du Seigneur doivent être exécutées telles que données ; peu importe si nos intentions sont bonnes, le Seigneur voit la désobéissance. Il est mieux pour le chrétien de bien faire et d'être seul que de suivre la foule et de se tromper avec elle, car comme le dit la parole, la voie est étroite et peu sont ceux qui y passent. Si le Seigneur nous montre une voie à suivre, c'est que c'est celle de notre salut, car Il est amour et ne peut nous mentir ; il vaudrait mieux pour nous d'obéir, car l'obéissance vaut mieux que le sacrifice. Que le Seigneur nous donne la grâce d'être des hommes obéissants et des serviteurs selon Son cœur.|QUESTION (partage du 02 juin 2018) : Dans Matthieu 12, les pharisiens accusent Jésus de chasser les démons par les démons, et Jésus répond qu'on ne chasse pas des démons par des démons. Comment se fait-il alors qu'aujourd'hui des personnes ayant des pouvoirs occultes chassent des démons ?|En lisant Matthieu 12:22-33, la première remarque que l'on fait, c'est que les juifs reconnaissent en Jésus le fils de David, c'est-à-dire le Messie qui devait venir ; or ce sont les pharisiens, censés mieux le connaître, qui disent qu'il a des démons. La pensée des pharisiens fait comprendre qu'en réalité il est possible de chasser un démon par un autre démon. Parce que le démon dans le corps de quelqu'un représente l'homme fort de la maison, pour le chasser il faudrait soit le Saint-Esprit, soit un autre démon plus fort (l'homme fort sera ainsi lié et mis dehors). Ceux qui chassent les démons par des forces démoniaques vont voir les hautes autorités ténébreuses, soit pour le faire remplacer, soit pour l'endormir. 2 Thessaloniciens 2:9-12 et Exode 8:1-19 montrent que Satan aussi a une puissance (qui est de loin inférieure à celle du Seigneur), sauf que celle-ci
