const musiqueFond = new Audio();
musiqueFond.loop = true;
musiqueFond.volume = VOLUME_MUSIQUE;
let musiqueActive = MUSIQUE_GENEREE || AMBIANCE_FORET || !!MUSIQUE_FOND;

// --- Musique générée : nappe de notes aléatoires (gamme pentatonique, esprit
// cantique paisible) + ambiance de forêt (vent léger, chants d'oiseaux).
// Tout est composé par le navigateur : aucun fichier, aucun droit d'auteur. ---
let ctxSon = null, gainMusique = null, gainForet = null, minuteries = [], ventNoeud = null;
const NOTES = [261.63,293.66,329.63,392.00,440.00,523.25,587.33,659.25,783.99]; // do majeur pentatonique
function initSon(){
  if(ctxSon) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  ctxSon = new AC();
  const delai = ctxSon.createDelay(); delai.delayTime.value = 0.42;
  const retour = ctxSon.createGain(); retour.gain.value = 0.32;
  delai.connect(retour); retour.connect(delai);
  gainMusique = ctxSon.createGain(); gainMusique.gain.value = VOLUME_MUSIQUE;
  gainMusique.connect(ctxSon.destination);
  delai.connect(gainMusique);
  gainMusique._delai = delai;
  gainForet = ctxSon.createGain(); gainForet.gain.value = VOLUME_MUSIQUE * 0.6;
  gainForet.connect(ctxSon.destination);
}
function jouerNote(freq, duree, force){
  const o = ctxSon.createOscillator(); o.type = "triangle"; o.frequency.value = freq;
  const f = ctxSon.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1300;
  const g = ctxSon.createGain();
  const t0 = ctxSon.currentTime;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(force, t0 + 0.35);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + duree);
  o.connect(f); f.connect(g); g.connect(gainMusique); g.connect(gainMusique._delai);
  o.start(t0); o.stop(t0 + duree + 0.1);
}
function prochaineNote(){
  if(!(radio.actif && !radio.enPause && musiqueActive && MUSIQUE_GENEREE && ctxSon)) return;
  const n = NOTES[Math.floor(Math.random()*NOTES.length)];
  jouerNote(n, 3.5 + Math.random()*2, 0.5);
  if(Math.random() < 0.35) jouerNote(n * 1.5, 4, 0.26);  // quinte, en écho
  if(Math.random() < 0.25) jouerNote(n / 2, 5, 0.32);    // basse douce
  minuteries.push(setTimeout(prochaineNote, 1800 + Math.random()*2600));
}
function chantOiseau(){
  if(!(radio.actif && !radio.enPause && musiqueActive && AMBIANCE_FORET && ctxSon)) return;
  const cris = 2 + Math.floor(Math.random()*3);
  for(let i=0;i<cris;i++){
    const t0 = ctxSon.currentTime + i * (0.14 + Math.random()*0.1);
    const o = ctxSon.createOscillator(); o.type = "sine";
    const base = 2600 + Math.random()*1700;
    o.frequency.setValueAtTime(base, t0);
    o.frequency.exponentialRampToValueAtTime(base * (1.25 + Math.random()*0.3), t0 + 0.05);
    o.frequency.exponentialRampToValueAtTime(base * 0.9, t0 + 0.11);
    const g = ctxSon.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(0.05 + Math.random()*0.04, t0 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.13);
    o.connect(g); g.connect(gainForet);
    o.start(t0); o.stop(t0 + 0.16);
  }
  minuteries.push(setTimeout(chantOiseau, 2500 + Math.random()*6000));
}
function ventForet(demarrer){
  if(!ctxSon) return;
  if(demarrer && !ventNoeud && AMBIANCE_FORET){
    const duree = 3, taille = ctxSon.sampleRate * duree;
    const tampon = ctxSon.createBuffer(1, taille, ctxSon.sampleRate);
    const d = tampon.getChannelData(0);
    let x = 0;
    for(let i=0;i<taille;i++){ x = x*0.98 + (Math.random()*2-1)*0.02; d[i] = x*6; }
    const src = ctxSon.createBufferSource(); src.buffer = tampon; src.loop = true;
    const f = ctxSon.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 380;
    const g = ctxSon.createGain(); g.gain.value = 0.5;
    src.connect(f); f.connect(g); g.connect(gainForet);
    src.start(); ventNoeud = src;
  }
  if(!demarrer && ventNoeud){ try{ventNoeud.stop();}catch(e){} ventNoeud = null; }
}
function majMusique(){
  const enLecture = radio.actif && !radio.enPause && musiqueActive;
  if(MUSIQUE_FOND){ // votre MP3 personnel, prioritaire s'il est configuré
    if(enLecture){ if(!musiqueFond.src) musiqueFond.src = MUSIQUE_FOND; musiqueFond.play().catch(()=>{}); }
    else musiqueFond.pause();
  }else if(MUSIQUE_GENEREE || AMBIANCE_FORET){
    if(enLecture){
      initSon();
      if(ctxSon){
        ctxSon.resume().catch(()=>{});
        if(!minuteries.length){ if(MUSIQUE_GENEREE) prochaineNote(); if(AMBIANCE_FORET) chantOiseau(); }
        ventForet(true);
      }
    }else{
      minuteries.forEach(clearTimeout); minuteries = [];
      ventForet(false);
    }
  }
  const b = $("#barreMusique");
  if(b) b.style.opacity = musiqueActive ? "1" : ".45";
}

function chargerChapitre(){
  if(!radio.actif) return;
  speechSynthesis.cancel();
  radio.mode = "mp3"; radio.versets = []; radio.index = 0;
  majAffichageRadio(t("r_chargement"));

  majMusique();

// Lecture de secours : le texte du chapitre lu par la voix de l'appareil
async function chargerChapitreTexte(){
  majAffichageRadio(t("r_chargement"));
  try{
    const rep=await fetch("https://api.getbible.net/v2/"+audioRadio().texte+"/"+(radio.livre+1)+"/"+radio.chapitre+".json");
    if(!rep.ok)throw new Error("HTTP "+rep.status);
    const d=await rep.json();
    radio.versets=d.verses||[];
    if(!radio.versets.length)throw new Error("vide");
    radio.index=0; radio.essais=0;
    majAffichageRadio(etatLecture());
    annoncerPuisLire();
  }catch(e){
    radio.essais++;
    if(radio.essais<=2){majAffichageRadio(t("r_essai"));setTimeout(chargerChapitreTexte,900);}
    else if(radio.essais<=5){radio.essais=3;avancerRadio();setTimeout(chargerChapitre,500);}
    else{arreterRadio();afficherAvis(t("r_indispo"));}
  }
}
function parler(texte,apres){
  const u=new SpeechSynthesisUtterance(texte);
  u.lang=audioRadio().tts;
  const v=voixPour(audioRadio().tts); if(v)u.voice=v;
  u.rate=radio.vitesses[radio.iVitesse];
  u.onend=()=>{if(radio.actif&&!radio.enPause)apres&&apres();};
  u.onerror=()=>{if(radio.actif)apres&&apres();};
  radio.utt=u; // référence conservée (bug connu de certains navigateurs)
  speechSynthesis.speak(u);
}
function annoncerPuisLire(){
  if(!radio.actif)return;
  const mots = {fr:["Livre de ",", chapitre "], en:["Book of ",", chapter "], it:["Libro di ",", capitolo "]}[radio.langue] || ["Livre de ",", chapitre "];
  parler(mots[0]+nomLivreLg(radio.livre, radio.langue)+mots[1]+radio.chapitre+".",lireVersetSuivant);
}
function lireVersetSuivant(){
  if(!radio.actif)return;
  if(radio.index>=radio.versets.length){
    parler("Fin du chapitre.",()=>setTimeout(()=>{if(radio.actif){avancerRadio();chargerChapitre();}},600));
    return;
  }
  const v=radio.versets[radio.index];
  majAffichageRadio(etatLecture());
  radio.index++;
  parler(v.text,lireVersetSuivant);
}
function demarrerRadio(livre,chapitre){
  speechSynthesis.cancel();
  if(typeof livre==="number"){radio.livre=livre;radio.chapitre=chapitre||1;}
  radio.langue = LANGUE; // la voix suit la langue choisie en haut du site
  radio.actif=true; radio.enPause=false; radio.essais=0; radio.stopManuel=false;
  $("#barreRadio").classList.add("active");
  const bm=$("#barreMusique"); if(bm) bm.style.display = (MUSIQUE_FOND||MUSIQUE_GENEREE||AMBIANCE_FORET) ? "" : "none";
  chargerChapitre();
}

function basculerPause(){
  if(!radio.actif)return;

    radio.enPause=false;

function chapitreSuivant(){
  if(!radio.actif)return;

function changerVitesse(){
  radio.iVitesse=(radio.iVitesse+1)%radio.vitesses.length;

function arreterRadio(){
  radio.actif=false; radio.enPause=false; radio.versets=[]; radio.index=0; radio.stopManuel=true;

  lecteurAudio.pause(); lecteurAudio.removeAttribute("src");

  $("#barreRadio").classList.remove("active");
  majAffichageRadio("");
}

function vueBible(){

  const optionsLivres=LIVRES.map((l,i)=>'<option value="'+i+'"'+(i===lecture.livre?" selected":"")+'>'+nomLivre(i)+'</option>').join("");
  let optionsChap="";
  for(let c=1;c<=LIVRES[lecture.livre][1];c++)optionsChap+='<option value="'+c+'"'+(c===lecture.chapitre?" selected":"")+'>'+c+'</option>';

        '<div class="champ"><label for="choixComparer">'+t("bi_comp")+'</label><select id="choixComparer" onchange="changerLecture()">'+optionsComparer+'</select></div>'+
        '<div class="champ"><label for="choixLivre">'+t("bi_livre")+'</label><select id="choixLivre" onchange="changerLivreLecture()">'+optionsLivres+'</select></div>'+
        '<div class="champ etroit"><label for="choixChapitre">'+t("bi_chap")+'</label><select id="choixChapitre" onchange="changerLecture()">'+optionsChap+'</select></div>'+
      '</div>'+
      (v2 ? '<div class="lecture-comparee">'+panneauLecture(v,"zoneVersets")+panneauLecture(v2,"zoneVersets2")+'</div>'
          : panneauLecture(v,"zoneVersets"))+

        '<button class="btn btn-nuit" onclick="chapitrePrecedentLecture()">'+t("bi_prec")+'</button>'+
        '<button class="btn btn-or" onclick="ecouterDepuisLecture()">'+t("bi_ecouter")+'</button>'+
        '<button class="btn btn-nuit" onclick="chapitreSuivantLecture()">'+t("bi_suiv")+'</button>'+
      '</div>'+
      '<p class="note-semeur">'+t("bi_note")+'</p>'+

function changerLecture(){
  lecture.version=$("#choixVersion").value;
  lecture.comparer=$("#choixComparer").value;
  if(lecture.comparer===lecture.version) lecture.comparer="non";
  lecture.chapitre=parseInt($("#choixChapitre").value,10);
  vueBible();
}
function changerLivreLecture(){
  lecture.livre=parseInt($("#choixLivre").value,10);
  lecture.chapitre=1; vueBible();
}
function chapitreSuivantLecture(){
  lecture.chapitre++;
  if(lecture.chapitre>LIVRES[lecture.livre][1]){lecture.livre=(lecture.livre+1)%LIVRES.length;lecture.chapitre=1;}
  vueBible();
}
function chapitrePrecedentLecture(){
  lecture.chapitre--;
  if(lecture.chapitre<1){lecture.livre=(lecture.livre-1+LIVRES.length)%LIVRES.length;lecture.chapitre=LIVRES[lecture.livre][1];}
  vueBible();
}
async function chargerTexteDans(v, idZone){
  const zone=$("#"+idZone);
  try{
    let versets=[];
    if(v.type==="getbible"){
      const rep=await fetch("https://api.getbible.net/v2/"+v.code+"/"+(lecture.livre+1)+"/"+lecture.chapitre+".json");
      if(!rep.ok)throw new Error("HTTP "+rep.status);
      const d=await rep.json();
      versets=(d.verses||[]).map(x=>({n:x.verse,t:x.text}));
    }else{
      const ref=encodeURIComponent(LIVRES[lecture.livre][2]+" "+lecture.chapitre);
      const rep=await fetch("https://api.biblesupersearch.com/api?bible="+v.code+"&reference="+ref);
      if(!rep.ok)throw new Error("HTTP "+rep.status);
      const d=await rep.json();
      const bloc=d.results&&d.results[0]&&d.results[0].verses&&d.results[0].verses[v.code];
      if(bloc){
        const chap=bloc[lecture.chapitre]||bloc[Object.keys(bloc)[0]];
        versets=Object.values(chap).map(x=>({n:x.verse,t:x.text}));
      }
    }
    if(!versets.length)throw new Error("vide");
    if(zone)zone.innerHTML=versets.map(x=>'<p><span class="num-verset">'+x.n+'</span>'+echap(String(x.t).replace(/<[^>]*>/g," "))+'</p>').join("");
  }catch(e){
    if(zone)zone.innerHTML='<div class="chargement">'+t("bi_erreur").replace("{v}",echap(v.nom))+'</div>';
  }
}

// ---------- Rendre modifiables les enseignements du fichier ----------
// Les articles d'origine sont écrits dans le fichier du site : pour pouvoir les
// corriger depuis cet espace, on les recopie une fois dans la base en ligne.
// Ensuite, la version en ligne remplace automatiquement celle du fichier.
function majZoneImport(){
  const zone=$("#zoneImport");
  if(!zone||!db) return;
  const restants = articlesNonImportes();
  const importes = ARTICLES.length - restants.length;
  zone.innerHTML = restants.length
    ? '<p class="note-form" style="margin-bottom:1rem">'+
        '<strong>'+restants.length+'</strong> enseignement(s) d\'origine ne sont pas encore modifiables depuis cet espace, '+
        'car ils sont écrits dans le fichier du site. Cliquez ci-dessous pour les recopier dans la base en ligne : '+
        'ils apparaîtront alors dans la liste ci-dessus, avec les boutons Modifier et Supprimer. '+
        'Rien n\'est perdu et rien n\'est dupliqué — la version en ligne remplace simplement celle du fichier.'+
        (importes?'<br>('+importes+' déjà transféré(s).)':'')+'</p>'+
      '<button class="btn btn-or" id="btnImport" onclick="importerArticlesFichier()">'+
        '📥 Rendre modifiables les '+restants.length+' enseignements</button>'+
      '<div class="msg" id="msgImport"></div>'
    : '<p class="note-form">Tous les enseignements d\'origine ont été transférés : ils sont modifiables dans la liste ci-dessus. ✔</p>';
}
function importerArticlesFichier(){
  if(!db||!estAdmin()) return;
  const restants = articlesNonImportes();
  if(!restants.length) return;
  const bouton=$("#btnImport"), m=$("#msgImport");
  if(bouton){ bouton.disabled=true; bouton.textContent="Transfert en cours…"; }
  const paquets=[];
  for(let i=0;i<restants.length;i+=100) paquets.push(restants.slice(i,i+100));
  let faits=0;
  const suivant = (n)=>{
    if(n>=paquets.length){
      chargerArticlesEnLigne().then(()=>{
        vueAdmin();
        const msg=$("#msgAdmin");
        if(msg){ msg.className="msg ok"; msg.textContent=faits+" enseignement(s) sont désormais modifiables depuis cet espace."; }
      });
      return;
    }
    const lot = db.batch();
    paquets[n].forEach(a=>{
      const ref = db.collection("articles").doc(a.id);
      lot.set(ref, {
        id: a.id, rubrique: a.rubrique, sousRubrique: a.sousRubrique || null,
        date: a.date, auteur: a.auteur || "Gaël, le frère",
        image: a.image || "", pdf: a.pdf || "", pdfNom: a.pdfNom || "",
        titre: a.titre, verset: a.verset || {fr:""}, extrait: a.extrait, contenu: a.contenu
      });
    });
    lot.commit()
      .then(()=>{ faits += paquets[n].length;
        if(m){ m.className="msg"; m.textContent="Transfert : "+faits+" / "+restants.length+"…"; }
        suivant(n+1); })
      .catch(e=>{
        if(m){ m.className="msg err"; m.textContent="Transfert interrompu : "+(e.message||"")+" — vérifiez les règles de sécurité Firestore."; }
        if(bouton){ bouton.disabled=false; bouton.textContent="📥 Réessayer"; }
      });
  };
  suivant(0);
}

    .catch(()=>afficherAvis("Copie impossible."));

// ---------- Envoi d'une photo depuis l'appareil ----------
function choisirPhoto(idChamp){
  if(!CLE_IMGBB){ afficherAvis(t("md_photo_non")); return; }
  const entree = document.createElement("input");
  entree.type = "file"; entree.accept = "image/*";
  entree.onchange = () => {
    const fichier = entree.files && entree.files[0];
    if(!fichier) return;
    afficherAvis(t("md_envoi"));
    const lecteur = new FileReader();
    lecteur.onload = () => {
      const donnees = String(lecteur.result).split(",")[1];
      const corps = new FormData();
      corps.append("image", donnees);
      fetch("https://api.imgbb.com/1/upload?key="+encodeURIComponent(CLE_IMGBB), {method:"POST", body:corps})
        .then(r=>r.json())
        .then(d=>{
          const url = d && d.data && (d.data.display_url || d.data.url);
          if(!url) throw new Error("réponse inattendue");
          const champ = document.getElementById(idChamp);
          if(champ){
            const sep = champ.value && !champ.value.endsWith("\n") ? "\n\n" : "";
            champ.value += sep + "image: " + url + "\n";
            champ.focus();
          }
          afficherAvis(t("md_photo_ok"));
        })
        .catch(()=>afficherAvis(t("md_photo_err")));
    };
    lecteur.readAsDataURL(fichier);
  };
  entree.click();
}

// ---------- Envoi d'une vidéo depuis l'appareil ----------
function choisirVideo(idChamp){
  if(!CLOUDINARY_NOM || !CLOUDINARY_PRESET){ afficherAvis(t("md_video_non")); return; }
  const entree = document.createElement("input");
  entree.type = "file"; entree.accept = "video/*";
  entree.onchange = () => {

    afficherAvis(t("md_video_envoi"));
    const corps = new FormData();
    corps.append("file", fichier);
    corps.append("upload_preset", CLOUDINARY_PRESET);
    fetch("https://api.cloudinary.com/v1_1/"+encodeURIComponent(CLOUDINARY_NOM)+"/video/upload",
          {method:"POST", body:corps})
      .then(r=>r.json())
      .then(d=>{
        if(!d || !d.secure_url) throw new Error("réponse inattendue");
        const champ = document.getElementById(idChamp);
        if(champ){
          const sep = champ.value && !champ.value.endsWith("\n") ? "\n\n" : "";
          champ.value += sep + "video: " + d.secure_url + "\n";
          champ.focus();
        }
        afficherAvis(t("md_video_ok"));
      })
      .catch(()=>afficherAvis(t("md_video_err")));
  };

}

    .then(snap=>{
      SUJETS = snap.docs.map(d=>Object.assign({_fs:d.id}, d.data()))

      return db.collection("commentaires").orderBy("articleId")
        .startAt("parvis:").endAt("parvis:\uf8ff").get();

function sansAccents(s){
  return (s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
}
function vueRecherche(){
  app.innerHTML=
    '<section class="bloc" style="max-width:860px">'+
      '<div class="entete-bloc"><h2><span class="oeil">'+t("re_oeil")+'</span>'+t("re_titre")+'</h2></div>'+
      '<div class="champ"><input id="champRecherche" type="search" autocomplete="off" '+
        'placeholder="'+t("re_placeholder")+'" oninput="lancerRecherche()"></div>'+
      '<p class="note-form">'+t("re_aide")+'</p>'+
      '<div id="resultatsRecherche"><p class="vide">'+t("re_invite")+'</p></div>'+
    '</section>';
  const c=$("#champRecherche"); if(c){ c.value=rechercheTexte; c.focus(); }
  if(rechercheTexte) lancerRecherche();
  window.scrollTo(0,0);
}
let rechercheTexte="";
function lancerRecherche(){
  const champ=$("#champRecherche"), zone=$("#resultatsRecherche");
  if(!champ||!zone) return;
  rechercheTexte = champ.value;
  const q = sansAccents(rechercheTexte.trim());
  if(q.length<2){ zone.innerHTML='<p class="vide">'+t("re_invite")+'</p>'; return; }
  const mots = q.split(/\s+/).filter(Boolean);
  const trouves = tous().filter(a=>{
    const foin = sansAccents([tr(a.titre), tr(a.extrait), tr(a.contenu), a.auteur,
                              nomR(a.rubrique), a.sousRubrique?nomSR(a.sousRubrique):""].join(" "));
    return mots.every(m=>foin.indexOf(m)!==-1);
  });
  zone.innerHTML = trouves.length
    ? '<p class="note-form" style="margin-bottom:1rem">'+t("re_resultats").replace("{n}",trouves.length)+'</p>'+
      '<div class="grille">'+trouves.map(carteArticle).join("")+'</div>'
    : '<p class="vide">'+t("re_rien")+'</p>';
}

function brancherLettre(){
  const b=$("#btnLettre"); if(b) b.onclick=abonnerLettre;

function abonnerLettre(){
  const champ=$("#champLettre"), m=$("#msgLettre");
  if(!champ||!m) return;
  const email=(champ.value||"").trim().toLowerCase();
  m.className="msg";
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ m.className="msg err"; m.textContent=t("nl_email_err"); return; }
  if(!db){ m.className="msg err"; m.textContent=t("nl_hors"); return; }
  db.collection("abonnes").doc(email).get()
    .then(doc=>{
      if(doc.exists){ m.className="msg"; m.textContent=t("nl_deja"); return null; }
      return db.collection("abonnes").doc(email).set({
        email: email, langue: LANGUE,
        date: new Date().toISOString().slice(0,10),
        creeLe: new Date().toISOString()
      }).then(()=>{ champ.value=""; m.className="msg ok"; m.textContent=t("nl_ok"); });
    })
    .catch(e=>{ m.className="msg err"; m.textContent=t("nl_err")+(e.message||""); });
}

function chargerCommentaires(idArticle){
  const zone=$("#listeCommentaires");
  if(!db){ if(zone) zone.innerHTML='<p class="vide">'+t("co_besoin")+'</p>'; return; }
  db.collection("commentaires").where("articleId","==",idArticle).get()
    .then(snap=>{
      if(!zone) return;
      const liste=snap.docs.map(d=>Object.assign({_fs:d.id}, d.data()))
        .sort((a,b)=>(a.creeLe||"")<(b.creeLe||"")?-1:1);
      const racines=liste.filter(c=>!c.parentId);
      const reponses=id=>liste.filter(c=>c.parentId===id);
      zone.innerHTML = liste.length
        ? racines.map(c=>htmlCommentaire(c,false)+reponses(c._fs).map(r=>htmlCommentaire(r,true)).join("")).join("")
        : '<p class="vide">'+t("co_vide")+'</p>';
    })
    .catch(()=>{ if(zone) zone.innerHTML='<p class="vide">'+t("co_besoin")+'</p>'; });
}

        '<div style="display:flex;gap:.5rem;flex-shrink:0">'+
        '<button class="btn btn-nuit" onclick="editerArticle(\''+a._fs+'\')">Modifier</button>'+

        '<button class="btn" style="background:var(--rouge);color:#fff" onclick="supprimerArticle(\''+a._fs+'\')">Supprimer</button></div></div>').join("")
    : '<p class="vide">Aucun article publié en ligne pour le moment. Les articles intégrés au fichier restent visibles sur le site.</p>';
  app.innerHTML=
    '<section class="bloc" style="max-width:860px">'+
      '<div class="entete-bloc"><h2><span class="oeil">Espace privé</span>Administration</h2></div>'+
      '<div class="msg" id="msgAdmin"></div>'+
      '<div class="panneau-lecture" style="margin-bottom:2rem">'+
        '<h3 id="adTitreForm">Publier un nouvel article</h3>'+

        '<div class="barre-outils-bible">'+

function basculerSousAdmin(){
  $("#zoneSousAdmin").style.display = $("#adRubrique").value==="enseignements" ? "" : "none";
}
// Une ligne qui commence par l'un de ces signes forme toujours son propre
// paragraphe : puce (-), titre (##), image:, pdf:
function ligneSpeciale(l){
  return /^\s*(?:[-•]\s+|#{2,3}\s+|image\s*:|pdf\s*:)/i.test(l);
}
function decouperEnParagraphes(texte){
  const blocs = [];
  texte.split(/\n\s*\n/).forEach(bloc=>{
    let courant = [];
    bloc.split(/\n/).forEach(ligne=>{
      const l = ligne.trim();
      if(!l) return;
      if(ligneSpeciale(l)){
        if(courant.length){ blocs.push(courant.join(" ")); courant = []; }
        blocs.push(l);
      }else{
        courant.push(l);
      }
    });
    if(courant.length) blocs.push(courant.join(" "));
  });
  return blocs.filter(Boolean).join("|");
}
function lireTrilingue(idBase, versParagraphes){
  const o = {};
  ["Fr","En","It"].forEach(l=>{
    let v = ($("#"+idBase+l).value||"").trim();
    if(versParagraphes) v = decouperEnParagraphes(v);
    if(v) o[l.toLowerCase()] = v;
  });
  if(!o.fr) o.fr = "";
  return o;
}
function sauverArticle(){
  const m=$("#msgAdmin"); m.className="msg";
  const titre = lireTrilingue("adTitre"), contenu = lireTrilingue("adContenu", true);
  if(!titre.fr || !contenu.fr){ m.className="msg err"; m.textContent="Le titre et le contenu en français sont obligatoires."; window.scrollTo(0,0); return; }
  const rubrique = $("#adRubrique").value;
  const donnees = {
    id: slugJs(titre.fr) || "article-"+Date.now(),
    rubrique: rubrique,
    sousRubrique: rubrique==="enseignements" ? $("#adSous").value : null,
    date: $("#adDate").value || new Date().toISOString().slice(0,10),
    auteur: ($("#adAuteur").value||"").trim() || "La rédaction",
    image: ($("#adImage").value||"").trim(),
    pdf: ($("#adPdf").value||"").trim(),
    pdfNom: ($("#adPdfNom").value||"").trim(),
    titre: titre,
    verset: lireTrilingue("adVerset"),
    extrait: lireTrilingue("adExtrait"),
    contenu: contenu
  };
  if(!donnees.extrait.fr) donnees.extrait.fr = contenu.fr.split("|")[0].slice(0,180);
  const operation = adEdition
    ? db.collection("articles").doc(adEdition).set(donnees)
    : db.collection("articles").add(donnees);
  operation
    .then(()=>chargerArticlesEnLigne())
    .then(()=>{ adEdition=null; vueAdmin();
      const msg=$("#msgAdmin"); msg.className="msg ok"; msg.textContent="Article publié ! Il est maintenant visible sur le site."; })
    .catch(e=>{ m.className="msg err"; m.textContent="Publication impossible : "+(e.message||"vérifiez votre connexion et vos droits."); window.scrollTo(0,0); });
}
function editerArticle(fsId){
  const a = ARTICLES_LIGNE.find(x=>x._fs===fsId);
  if(!a) return;
  adEdition = fsId; vueAdmin();
  $("#adTitreForm").textContent = "Modifier : " + tr(a.titre);
  $("#adRubrique").value = a.rubrique; basculerSousAdmin();
  if(a.sousRubrique) $("#adSous").value = a.sousRubrique;
  $("#adDate").value = a.date; $("#adAuteur").value = a.auteur||"";
  $("#adImage").value = a.image||"";
  $("#adPdf").value = a.pdf||""; $("#adPdfNom").value = a.pdfNom||"";
  ["titre","verset","extrait","contenu"].forEach(ch=>{
    ["fr","en","it"].forEach(l=>{
      const el = $("#ad"+ch.charAt(0).toUpperCase()+ch.slice(1)+l.charAt(0).toUpperCase()+l.slice(1));
      let v = (a[ch]&&a[ch][l])||"";
      if(ch==="contenu") v = v.split("|").join("\n\n");
      if(el) el.value = v;
    });
  });
  window.scrollTo(0,0);
}
function supprimerArticle(fsId){
  const a = ARTICLES_LIGNE.find(x=>x._fs===fsId);
  if(!a) return;
  if(!confirm("Supprimer définitivement « "+tr(a.titre)+" » ?")) return;
  db.collection("articles").doc(fsId).delete()
    .then(()=>chargerArticlesEnLigne())
    .then(()=>{ vueAdmin(); afficherAvis("Article supprimé."); })
    .catch(e=>afficherAvis("Suppression impossible : "+(e.message||"")));
}

// ---------- Routeur ----------
function router(){
  const h=location.hash.replace(/^#/,"")||"/";
  const seg=h.split("/").filter(Boolean);
  if(seg.length===0)return vueAccueil();
  if(seg[0]==="rubrique"&&seg[1])return vueRubrique(seg[1]);
  if(seg[0]==="sous"&&seg[1])return vueSousRubrique(seg[1]);
  if(seg[0]==="article"&&seg[1])return vueArticle(seg[1]);
  if(seg[0]==="chaines")return vueChaines();
  if(seg[0]==="bible")return vueBible();
  if(seg[0]==="radio")return vueRadio();
  if(seg[0]==="contact")return vueContact();
  if(seg[0]==="profil")return vueProfil();
  if(seg[0]==="parvis")return vueParvis();
  if(seg[0]==="sujet")return vueSujet(seg[1]);
  if(seg[0]==="apropos")return vueApropos();
  if(seg[0]==="recherche")return vueRecherche();
  if(seg[0]==="admin")return vueAdmin();
  vueAccueil();
}
window.addEventListener("hashchange",router);

majTextesStatiques();
majZoneCompte();
majAffichageRadio();
initFirebase();
router();

(function(){
  const m = location.pathname.match(/\/p\/([^/]+)\.html$/);
  if(m && !location.hash) location.replace(baseSite()+"#/article/"+m[1]);
})();

}
