  {
    id:"etude-biblique-2corinthiens-9", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-14", auteur:"Gaël, le frère",
    titre:{ fr:"Etude biblique 2corinthiens 9",
           en:"Bible study: 2 Corinthians 9",
           it:"Studio biblico: 2 Corinzi 9" },
    verset:{ fr:"" },
    extrait:{ fr:"Dans ce passage il n'est nullement question des offrandes diverses qui se font dans les communautés tels offrandes pour les congés du pasteur, dons au pasteur etc. mais bel et bien de l'aide aux…",
             en:"This passage speaks of help for the beloved, of liberality: the offering is an act of worship, and the manner of giving determines the worth of the gift.",
             it:"Questo passo parla dell'aiuto ai fratelli amati, della liberalità: l'offerta è un atto di adorazione, e il modo di donare determina il valore del dono." },
    contenu:{ fr:"Dans ce passage il n'est nullement question des offrandes diverses qui se font dans les communautés tels offrandes pour les congés du pasteur, dons au pasteur etc. mais bel et bien de l'aide aux bien-aimés, de libéralité, l'apôtre Paul encourage les bien-aimés à consentir des sacrifices pour les frères qui sont dans le besoin. L’offrande est une action d'adoration car lorsque nous aidons qqn il rend grâce à Dieu et donc la façon de donner est très importante elle est responsable de la valeur du don que l'on fait.|Quand qqn donne pour recevoir des acclamations pour être vu des hommes il y tire sa gloire et donc cela n'a aucune valeur aux yeux de Dieu ; par contre le chrétien quand il donne c'est pour que la gloire soit rendue au Seigneur et c'est de la gloire de Dieu qu'il tire sa bénédiction.|Question : Quelle est donc la valeur d'un don fait aux païens vus qu’eux ne rendent pas grâce à Jésus-Christ ?|Il est important de tenir compte du fait que le chrétien avant de faire un quelconque don à un non chrétien il faut le discernement car ignorant à quelle fin sera utilisée ce don, même s’il pourrait être une occasion de rendre grâce encore au Seigneur si plu tard la personne venait à se convertir se rendant compte ainsi que le Seigneur a toujours pourvu pour lui-même quand il était dans le monde.|Il est donc important pour le chrétien lorsqu'il fait un don qu'il spécifie qu'il le fait au nom du Seigneur et parce qu'il veut partager avec l'autre l'amour du Christ qui l'a aimé lui et qui aime aussi le nom croyant, car ce don accompagné du partage de l'amour de Christ en Nous est l'essence même de la gloire de Dieu.|Non que nous devions avoir peur de ce qui sera fait de notre don mais que nous devons discerner car le Seigneur ne prend pas plaisir à toutes sortes de dons et c'est une façon de marcher par la chair que de s'empresser à faire qch sans toutefois demander la volonté du Seigneur avant.|Nous recevons tout ce que nous avons du Seigneur ; c'est par contre u problème que de douter avant de donner à un bien-aimé ou encore à un membre de sa famille à moins que celui-ci soit un méchant alors il faudrait demander la volonté du Seigneur ; néanmoins les premières personnes vers qui nos dons doivent être dirigés sont les saints.|L’assistance aux saints est au cœur de l’assemblée car c'est un ministère de partage et d'amour elle est le pilier de l'assemblée avec le ministère de l’enseignement.|Prions afin que le Seigneur nous apprenne à donner comme Il aime.",
             en:"In this passage there is no question of the various offerings made in the communities — offerings for the pastor's holidays, gifts to the pastor and so on — but truly of help for the beloved, of liberality: the apostle Paul encourages the beloved to make sacrifices for the brethren in need. The offering is an act of worship, for when we help someone he gives thanks to God; the manner of giving is therefore very important — it determines the worth of the gift we make.|When someone gives to receive applause, to be seen by men, he draws his glory from it, and it therefore has no value in God's eyes; the Christian, on the other hand, gives so that glory may be given to the Lord, and it is from God's glory that he draws his blessing.|Question: what then is the worth of a gift made to pagans, seeing that they do not give thanks to Jesus Christ?|It is important to bear in mind that before making any gift to a non-Christian, the Christian needs discernment, not knowing to what end the gift will be used — even though it could yet become an occasion of thanksgiving to the Lord if the person later came to conversion, realising that the Lord had always provided for him even while he was in the world.|It is therefore important for the Christian, when he makes a gift, to state that he does so in the name of the Lord, and because he wants to share with the other the love of Christ who loved him and who also loves the unbeliever; for this gift, accompanied by the sharing of the love of Christ in us, is the very essence of the glory of God.|Not that we should fear what will be done with our gift, but we must discern, for the Lord does not take pleasure in every kind of gift; and it is a way of walking by the flesh to rush into doing something without first asking the Lord's will.|Everything we have, we receive from the Lord. It is, on the other hand, a problem to hesitate before giving to a beloved brother or to a member of one's family — unless that person is wicked, in which case the Lord's will must be sought; nevertheless, the first people towards whom our gifts must be directed are the saints.|The assistance of the saints is at the heart of the assembly, for it is a ministry of sharing and of love; it is the pillar of the assembly, together with the ministry of teaching.|Let us pray that the Lord may teach us to give as He loves.",
             it:"In questo passo non si tratta affatto delle offerte varie che si fanno nelle comunità — offerte per le ferie del pastore, doni al pastore, ecc. — ma proprio dell'aiuto ai fratelli amati, della liberalità: l'apostolo Paolo incoraggia i fratelli ad acconsentire a dei sacrifici per i fratelli nel bisogno. L'offerta è un atto di adorazione, perché quando aiutiamo qualcuno egli rende grazie a Dio; il modo di donare è dunque molto importante — è esso a determinare il valore del dono che facciamo.|Quando qualcuno dona per ricevere applausi, per essere visto dagli uomini, ne trae la propria gloria, e dunque ciò non ha alcun valore agli occhi di Dio; il cristiano, invece, quando dona è affinché la gloria sia resa al Signore, ed è dalla gloria di Dio che trae la sua benedizione.|Domanda: qual è dunque il valore di un dono fatto ai pagani, visto che essi non rendono grazie a Gesù Cristo?|È importante tenere conto del fatto che il cristiano, prima di fare un qualunque dono a un non cristiano, ha bisogno di discernimento, ignorando a quale fine sarà usato quel dono — anche se potrebbe diventare un'occasione di rendere ancora grazie al Signore, se più tardi la persona si convertisse, rendendosi conto che il Signore aveva sempre provveduto per lei anche quando era nel mondo.|È dunque importante per il cristiano, quando fa un dono, specificare che lo fa nel nome del Signore e perché vuole condividere con l'altro l'amore di Cristo che ha amato lui e che ama anche il non credente; perché questo dono, accompagnato dalla condivisione dell'amore di Cristo in noi, è l'essenza stessa della gloria di Dio.|Non che dobbiamo avere paura di ciò che sarà fatto del nostro dono, ma dobbiamo discernere, perché il Signore non prende piacere in ogni sorta di doni; ed è un modo di camminare secondo la carne affrettarsi a fare qualcosa senza prima chiedere la volontà del Signore.|Tutto ciò che abbiamo lo riceviamo dal Signore. È invece un problema dubitare prima di donare a un fratello amato o a un membro della propria famiglia — a meno che questi non sia un malvagio: allora bisognerebbe chiedere la volontà del Signore; tuttavia le prime persone verso cui i nostri doni devono essere diretti sono i santi.|L'assistenza ai santi è al cuore dell'assemblea, perché è un ministero di condivisione e di amore; è il pilastro dell'assemblea, insieme al ministero dell'insegnamento.|Preghiamo affinché il Signore ci insegni a donare come egli ama." }
  },
  {
    id:"matthieu-5-1-16", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-13", auteur:"Gaël, le frère",
    titre:{ fr:"Matthieu 5 :1-16",
           en:"Matthew 5:1-16",
           it:"Matteo 5:1-16" },
    verset:{ fr:"" },
    extrait:{ fr:"Le sermon sur les béatitudes est un ensemble de défi que le Seigneur nous lance et chaque fois dans notre marche il va falloir y jeter un coup d’œil pour méditer et voir à quel point o en est avec…",
             en:"The Beatitudes are a set of challenges the Lord sets before us. Being the salt of the earth and the light of the world means preaching by example — witnessing by our way of life that we carry the light within.",
             it:"Le Beatitudini sono un insieme di sfide che il Signore ci lancia. Essere il sale della terra e la luce del mondo significa predicare con l'esempio — testimoniare con il nostro modo di vivere che abbiamo la luce in noi." },
    contenu:{ fr:"Le sermon sur les béatitudes est un ensemble de défi que le Seigneur nous lance et chaque fois dans notre marche il va falloir y jeter un coup d’œil pour méditer et voir à quel point o en est avec le Seigneur. Chacune de ces béatitudes commence par 3heureux\" ce qui laisse comprendre que celui qui ne s'y applique pas est et sera malheureux.|Les choses après lesquelles nous courrons, celles que nous admirons ne sont pas forcément l'objet de l'admiration de Dieu ;|Quand nous ne pardonnons pas aux autres nous empêchons aussi Dieu de nous pardonner ;|Pouvons-nous encore trouver des justes dans ce monde corrompu, souillé par ce que nous voyons et écoutons ?  C’est difficile de se détacher du monde mais c'est à cela que Dieu nous attend ;|Ceux qui sont querelleux, dans notre langage ceux qui aiment les problèmes ne seront appelés fils de Dieu ; nous devons être des artisans c'est-à-dire des fabricants de paix en toutes les circonstances ; on ne doit cultiver la guerre au milieu des enfants de Dieu Philippiens 4 :1-5 l'apôtre exhorte les bien-aimés à être d'un même sentiment. C’est facile de dire qu'on est chrétien parce qu'on chante dans la chorale ou alors parce qu'on appartient à une certaine dénomination, le Seigneur ne regarde pas le groupe mais il nous regarde de façon individuelle. C’est facile de réciter la bible mais il faut aussi appliquer, il faut se réjouir comme dit le verset 4 de ce texte il faut se réjouir dans et selon le Seigneur, il n'y a point de réelle réjouissance si on n'est pas en paix avec les autres, c'est pourquoi on doit cultiver en notre cœur et dans la prière un esprit pacifique, c'est la recherche de la paix qui fait de nous des enfants de Dieu , le prince de la paix c'est Lui il devrait en être de même pour ses enfants.|13-16 les bonnes œuvres qui doivent être observées sont celles citées dans les versets plus haut. Le sel qui a perdu sa saveur est semblable à du sable voilà pourquoi il est jeté par terre pour être foulé au pied; si on a été oint par le Seigneur pour arriver à un certain niveau alors  on y sera ; être sel de la terre et lumière du monde ne veut pas dire chercher à tout prix et à tous les prix à se hisser dans les hautes sphères de ce monde , ça ne veut pas dire qu'on doit dominer le monde etc. mais qu'on prêche par l'exemple, de témoigner par notre mode vie que nous avons la lumière en nous . Le but de chaque enfant de Dieu est d'être transformé et formé à l'image de Christ pour être un sacrifice agréable à Dieu",
             en:"The sermon on the Beatitudes is a set of challenges the Lord sets before us, and at every stage of our walk we must look back at it, meditate, and see where we stand with the Lord. Each of these beatitudes begins with 'blessed', which makes it clear that whoever does not apply himself to them is, and will be, unhappy.|The things we run after, the things we admire, are not necessarily the object of God's admiration.|When we do not forgive others, we also prevent God from forgiving us.|Can we still find righteous people in this corrupt world, defiled by what we see and hear? It is hard to detach ourselves from the world, but that is what God expects of us.|The quarrelsome — in our language, those who love trouble — will not be called sons of God; we must be craftsmen, that is, makers of peace in all circumstances. War must not be cultivated among the children of God: in Philippians 4:1-5 the apostle exhorts the beloved to be of one mind. It is easy to say we are Christians because we sing in the choir or belong to a certain denomination, but the Lord does not look at the group — He looks at each of us individually. It is easy to recite the Bible, but it must also be applied. We must rejoice, as verse 4 of that text says — rejoice in and according to the Lord; and there is no real rejoicing if we are not at peace with others. That is why we must cultivate in our heart, and in prayer, a peaceable spirit: it is the pursuit of peace that makes us children of God. He is the Prince of Peace — it should be the same for His children.|Verses 13-16: the good works that are to be seen are those cited in the verses above. Salt that has lost its savour is like sand — that is why it is thrown to the ground to be trodden underfoot. If we have been anointed by the Lord to reach a certain level, we will reach it; being the salt of the earth and the light of the world does not mean seeking at any cost to climb into the high spheres of this world, nor that we must dominate the world — it means preaching by example, witnessing by our way of life that we carry the light within us. The goal of every child of God is to be transformed and formed into the image of Christ, to be a sacrifice pleasing to God.",
             it:"Il sermone sulle Beatitudini è un insieme di sfide che il Signore ci lancia, e ogni volta, nel nostro cammino, bisognerà dargli uno sguardo per meditare e vedere a che punto siamo con il Signore. Ciascuna di queste beatitudini comincia con 'beati', il che fa capire che chi non vi si applica è, e sarà, infelice.|Le cose dietro cui corriamo, quelle che ammiriamo, non sono necessariamente l'oggetto dell'ammirazione di Dio.|Quando non perdoniamo agli altri, impediamo anche a Dio di perdonarci.|Possiamo ancora trovare dei giusti in questo mondo corrotto, contaminato da ciò che vediamo e ascoltiamo? È difficile distaccarsi dal mondo, ma è a questo che Dio ci attende.|Gli attaccabrighe — nel nostro linguaggio, quelli che amano i problemi — non saranno chiamati figli di Dio; dobbiamo essere degli artigiani, cioè dei costruttori di pace in ogni circostanza. Non si deve coltivare la guerra in mezzo ai figli di Dio: in Filippesi 4:1-5 l'apostolo esorta i fratelli ad avere un medesimo sentimento. È facile dire di essere cristiani perché si canta nel coro o perché si appartiene a una certa denominazione, ma il Signore non guarda al gruppo: ci guarda individualmente. È facile recitare la Bibbia, ma bisogna anche applicarla. Bisogna rallegrarsi, come dice il versetto 4 di quel testo — rallegrarsi nel Signore e secondo il Signore; e non c'è vera gioia se non si è in pace con gli altri. Per questo dobbiamo coltivare nel nostro cuore e nella preghiera uno spirito pacifico: è la ricerca della pace che fa di noi dei figli di Dio. Il Principe della pace è lui — dovrebbe essere lo stesso per i suoi figli.|Versetti 13-16: le buone opere che devono essere osservate sono quelle citate nei versetti precedenti. Il sale che ha perso il suo sapore è simile alla sabbia — ecco perché viene gettato a terra per essere calpestato. Se siamo stati unti dal Signore per arrivare a un certo livello, vi arriveremo; essere il sale della terra e la luce del mondo non significa cercare a ogni costo di innalzarsi nelle alte sfere di questo mondo, né che dobbiamo dominare il mondo — significa predicare con l'esempio, testimoniare con il nostro modo di vivere che abbiamo la luce in noi. Lo scopo di ogni figlio di Dio è essere trasformato e formato a immagine di Cristo, per essere un sacrificio gradito a Dio." }
  },
  {
    id:"comment-determiner-le-type-d-epreuve-par-lequel-on-passe-c-e", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-12", auteur:"Gaël, le frère",
    titre:{ fr:"Comment determiner le type d'epreuve par lequel on passe ? c'est-a-dire les souffrances sont souvent soit des epreuves pour juger notre attachement au Seigneur ou a cause de nos fautes comment savoir si c'est l'un ou l’autre ?",
           en:"How can we determine what kind of trial we are going through — a test of our attachment to the Lord, or the consequence of our faults?",
           it:"Come determinare il tipo di prova che stiamo attraversando — una prova del nostro attaccamento al Signore, o la conseguenza delle nostre colpe?" },
    verset:{ fr:"" },
    extrait:{ fr:"2samuel21 : 1-3",
             en:"When we pass through difficulty, the thing to do is pray and persist until the Lord speaks. It is easy to be faithful when all goes well — may we remain faithful even in the trial.",
             it:"Quando attraversiamo una difficoltà, la cosa da fare è pregare e insistere finché il Signore parli. È facile essere fedeli quando tutto va bene — possiamo restare fedeli anche nella prova." },
    contenu:{ fr:"2samuel21 : 1-3|Lorsqu'on passe une difficulté, la chose à faire c'est prier, insister jusqu'à ce que le Seigneur parle à moins de savoir déjà quelle est notre situation avec le Seigneur comme Job. Nos souffrances nos difficultés sont souvent pour la gloire de Dieu, le Seigneur se réjouit quand nous restons fidèles dans la difficulté no, qu'il se réjouit de la souffrance mais lorsque nous souffrons alors que nous ne le méritons pas nous nous assimilons alors à Christ. Dieu ne tire aucune gloire quand nous souffrons pour nos fautées mais l'innocence la justice et surtout la fidélité sont la gloire de Dieu.|Lorsque nous passons par une période difficile la première chose à faire est d'aller devant le Seigneur|C’est dans la prière que le Seigneur a dit à Paul \" ma Grace te suffit|C’est parce que David a prié avec insistance qu'il a reçu une réponse de la part du Seigneur. L’autre chose après la prière reste dans l'intimité avec le seigneur, il faut demeurer dans Sa présence jusqu'à ce qu'il révèle la source. On doit vivre dans la prière et de prière, ce n'est pas parce qu'on a prié pendant une certaine période qu'il faut se décourager, le souffle de vie qu'on a est le signe que le Seigneur peut encore faire grâce pour ce problème là ; les bien et les maux viennent de Dieu. Paul dans actes 13 est l'exemple de ce que lorsque le Seigneur a mis qqn à part Sa souffrance peut être utilisée pour ramener une autre personne à Lui ; les gens nous observent et notre façon de demeurer fidèle dans la souffrance est un enseignement pour les autres. Il est facile d'être fidèle quand tout va bien mais puissions-nous demeurer fidèle même dans l'épreuve et pouvoir dire comme les amis de Daniel \"Même s'Il ne nous délivre pas nous ne nous prosternerons pas\".",
             en:"2 Samuel 21:1-3.|When we pass through a difficulty, the thing to do is to pray, to persist until the Lord speaks — unless we already know where we stand with the Lord, like Job. Our sufferings and difficulties are often for the glory of God: the Lord rejoices when we remain faithful in difficulty — not that He rejoices in suffering, but when we suffer without deserving it, we are made like Christ. God draws no glory from our suffering for our faults; but innocence, righteousness and above all faithfulness are the glory of God.|When we go through a difficult period, the first thing to do is to go before the Lord.|It was in prayer that the Lord said to Paul, 'My grace is sufficient for you.'|It was because David prayed with persistence that he received an answer from the Lord. The other thing, after prayer, is to remain in intimacy with the Lord: we must dwell in His presence until He reveals the source. We must live in prayer and by prayer; the fact of having prayed for a certain time is no reason to be discouraged — the breath of life we still have is the sign that the Lord can yet show grace concerning that problem; both good and hardship come from God. Paul in Acts is the example that when the Lord has set someone apart, his suffering can be used to bring another person to Him; people watch us, and our way of remaining faithful in suffering is a lesson for others. It is easy to be faithful when all goes well — but may we remain faithful even in the trial, and be able to say like Daniel's friends: 'Even if He does not deliver us, we will not bow down.'",
             it:"2 Samuele 21:1-3.|Quando attraversiamo una difficoltà, la cosa da fare è pregare, insistere finché il Signore parli — a meno che non sappiamo già qual è la nostra situazione con il Signore, come Giobbe. Le nostre sofferenze e difficoltà sono spesso per la gloria di Dio: il Signore si rallegra quando restiamo fedeli nella difficoltà — non che si rallegri della sofferenza, ma quando soffriamo senza meritarlo siamo resi simili a Cristo. Dio non trae alcuna gloria quando soffriamo per le nostre colpe; ma l'innocenza, la giustizia e soprattutto la fedeltà sono la gloria di Dio.|Quando passiamo per un periodo difficile, la prima cosa da fare è andare davanti al Signore.|È nella preghiera che il Signore disse a Paolo: 'La mia grazia ti basta.'|È perché Davide pregò con insistenza che ricevette una risposta dal Signore. L'altra cosa, dopo la preghiera, è restare nell'intimità con il Signore: bisogna dimorare nella sua presenza finché egli riveli la fonte. Dobbiamo vivere nella preghiera e di preghiera; non è perché si è pregato per un certo periodo che bisogna scoraggiarsi — il soffio di vita che abbiamo è il segno che il Signore può ancora fare grazia per quel problema; i beni e i mali vengono da Dio. Paolo negli Atti è l'esempio che quando il Signore ha messo qualcuno da parte, la sua sofferenza può essere usata per ricondurre un'altra persona a lui; la gente ci osserva, e il nostro modo di restare fedeli nella sofferenza è un insegnamento per gli altri. È facile essere fedeli quando tutto va bene — ma possiamo restare fedeli anche nella prova, e poter dire come gli amici di Daniele: 'Anche se non ci libererà, noi non ci prostreremo.'" }
  },
  {
    id:"le-respect-des-autorites", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-11", auteur:"Gaël, le frère",
    titre:{ fr:"Le respect des autorites",
           en:"Respect for the authorities",
           it:"Il rispetto delle autorità" },
    verset:{ fr:"" },
    extrait:{ fr:"Proverbes 10 :6-10",
             en:"As children of God we are called to respect authority; our part lies in calm and in prayer, for the Lord has established the prophets to denounce what is false and evil in a State.",
             it:"Come figli di Dio siamo chiamati a rispettare l'autorità; la nostra parte sta nella calma e nella preghiera, perché il Signore ha stabilito i profeti per denunciare il falso e il male di uno Stato." },
    contenu:{ fr:"Proverbes 10 :6-10|Les personnes qui suscitent les soulèvements le font pour défier les autorités or en tant qu'enfants de Dieu on est appelé à respecter l’autorité ; on ne doit être associée à aucune pensée, lutte ou action dite révolutionnaire parce qu'inspirées par des esprits, notre part est dans le respect de Dieu et des autorités par Lui établies. L'objectif de l'ennemi est de distraire même le chrétien et surtout les enfants de Dieu parce qu'il sait que l'Eglise peut délivrer une nation. La pensée de Dieu n'est pas que nous supportions ou que nous prenions son parti, que non mais notre rôle est dans le calme et la prière. Ecclesiaste10 :8-9|Avant de poser un quelconque acte et de prendre un certain engagement il faudrait en évaluer les conséquences sur notre vie et celle de notre de notre descendance les actes qu'on pose en soutenant que nous le faisons pour le pays ne sont pas sans conséquence Saul  dans son zèle patriotique  a tué les gabaonites il ne se doutait pas que ça allait couter des années de famines à Israël et en plus l'extermination de sa descendance, il est donc très important de chercher la direction du Seigneur dans ces choses. Le seigneur a établi des personnes pour dénoncer le faux et le mauvais d’un Etat et c'est le rôle joué par les prophètes ce sont eux qui ont le droit de parler pour dénoncer car Dieu leur met les mots à la bouche. Pour le reste nous devons nous en tenir au respect de l'autorité et prier pour que Dieu opère le changement pas aller marcher dans les rues en défiant l'autorité.",
             en:"Proverbs 24:21-22 warns against those who stir up revolt.|Those who incite uprisings do so to defy the authorities; but as children of God we are called to respect authority. We must not be associated with any so-called revolutionary thought, struggle or action, for these are inspired by spirits; our part lies in reverence for God and for the authorities He has established. The enemy's objective is to distract even the Christian, and above all the children of God, because he knows that the Church can deliver a nation. God's thought is not that we should take sides — no; our role lies in calm and in prayer. Ecclesiastes 10:8-9.|Before performing any act or making any commitment, we should weigh its consequences on our life and on that of our descendants: the acts we perform, claiming to do them for our country, are not without consequence. Saul, in his patriotic zeal, killed the Gibeonites; he did not suspect that this would cost Israel years of famine, and moreover the extermination of his own descendants. It is therefore very important to seek the Lord's direction in these things. The Lord has established people to denounce what is false and evil in a State — that is the role played by the prophets; they are the ones entitled to speak out and denounce, for God puts the words in their mouth. For the rest, we must hold to respect for authority and pray that God may bring about change — not go marching in the streets defying authority.",
             it:"Proverbi 24:21-22 mette in guardia contro coloro che fomentano le rivolte.|Le persone che suscitano le sommosse lo fanno per sfidare le autorità; ma come figli di Dio siamo chiamati a rispettare l'autorità. Non dobbiamo essere associati ad alcun pensiero, lotta o azione cosiddetta rivoluzionaria, perché sono ispirati da spiriti; la nostra parte sta nel timore di Dio e nel rispetto delle autorità da lui stabilite. L'obiettivo del nemico è distrarre anche il cristiano, e soprattutto i figli di Dio, perché sa che la Chiesa può liberare una nazione. Il pensiero di Dio non è che prendiamo posizione — no; il nostro ruolo sta nella calma e nella preghiera. Ecclesiaste 10:8-9.|Prima di compiere un qualunque atto e di prendere un certo impegno, bisognerebbe valutarne le conseguenze sulla nostra vita e su quella della nostra discendenza: gli atti che compiamo sostenendo di farli per il paese non sono senza conseguenze. Saul, nel suo zelo patriottico, uccise i Gabaoniti; non sospettava che ciò sarebbe costato a Israele anni di carestia, e per di più lo sterminio della sua discendenza. È dunque molto importante cercare la direzione del Signore in queste cose. Il Signore ha stabilito delle persone per denunciare il falso e il male di uno Stato — è il ruolo svolto dai profeti; sono loro ad avere il diritto di parlare per denunciare, perché Dio mette loro le parole in bocca. Per il resto, dobbiamo attenerci al rispetto dell'autorità e pregare affinché Dio operi il cambiamento — non andare a marciare nelle strade sfidando l'autorità." }
  },
  {
    id:"exhortation-saf-598", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-10", auteur:"Gaël, le frère",
    titre:{ fr:"Exhortation : SAF 598",
           en:"Exhortation: hymn 598 (SAF)",
           it:"Esortazione: cantico 598 (SAF)" },
    verset:{ fr:"" },
    extrait:{ fr:"Suivre le Seigneur n'est pas une chose facile ce n'est pas non plus une chose à prendre à la légère, la marche avec le Seigneur n'est pas non plus un long fleuve tranquille mais bien au contraire…",
             en:"To follow Jesus Christ one must SELL what one has: it is impossible to follow the Lord if our work, studies or family occupy us more than He does. No one has ever done enough for the Lord.",
             it:"Per seguire Gesù Cristo bisogna VENDERE ciò che si ha: è impossibile seguire il Signore se il lavoro, gli studi o la famiglia ci occupano più di lui. Nessuno ha mai fatto abbastanza per il Signore." },
    contenu:{ fr:"Suivre le Seigneur n'est pas une chose facile ce n'est pas non plus une chose à prendre à la légère, la marche avec le Seigneur n'est pas non plus un long fleuve tranquille mais bien au contraire elle est pleine de tribulation. C’est très de chanter et dire qu'on va perdre ce qu'on aime mais est-ce une réalité dans notre marche avec le Père ? Combien de temps consacrons-nous à celui qui nous donne le temps ? Les choses que nous négligeons souvent pourraient être celles-là même qui nous éloignent du Seigneur.|Luc 18 :18-23 il est bel et bien possible de suivre le Seigneur à sa propre façon et bien des fois c'est ce que nous faisons et à cause de la distraction on ne se rend pas compte de cela, comme l'homme riche on a des choses auxquelles on est plus attaché qu'au Seigneur et la façon de le savoir c'est juste d'évaluer combien il est difficile de s'en défaire, parfois o a fait beaucoup d'effort avec le Seigneur mais il y'a encore un dernier effort à fournir pour parfaire la chose. Pour suivre Jésus-Christ il faut VENDRE ce que l'on a : on ne peut suivre le Seigneur le Seigneur avec les fardeaux de la vie, il est impossible de suivre le Seigneur si notre travail, nos études, notre famille et autres nous préoccupent plus que le Seigneur. Dieu ne va pas comprendre que nous sommes trop occupés car une chose qui nous occupe trop au point que nous manquions du temps pour le Seigneur est assise sur le trône de notre cœur et le Seigneur ne partage pas sa gloire avec quoique ce soit. Nous ne disons pas ici qu'on doit arrêter de travailler, d'étudier ou de s'occuper des siens mais au milieu de tout cela plaire au Seigneur doit être notre préoccupation principale. Comment avoir la vie Eternelle ou encore comment suivre Jésus-Christ ? Était la question de cet homme riche, pour se faire il faut ôter tout ce qui est sur le trône de notre cœur pour aller jusqu'au bout avancer sans se contenter des efforts déjà fournis mais continuellement se dépouiller de tout ce qui serait susceptible de nuire à notre relation avec le Seigneur, ôter le mensonge, le vol, l'avarice, la cupidité, l'impudicité, les pensées impures etc.|On devrait continuellement se demander suis-je sur le chemin étroit ? Est-ce que je suis dans la bonne part comme Marie ou alors dans la multitude des occupations comme Marthe ? Souvent comme cet homme riche nous allons interroger le Seigneur sans être prêt à appliquer ce qu'il nous dit ; quand nous nous approchons de la lumière du Seigneur laissons-là nous éblouir afin qu'elle chasse les ténèbres en nous, il serait inutile d'arriver devant la lumière comme cet homme et se cacher le visage ou se retourner pour fuir, car cette lumière-là loin de nous faire du mal nous transforme pour nous rendre meilleur. Soyons de véritables adorateurs qui ne se limitent pas à chanter mais à méditer sur les paroles afin qu'elles nous pénètrent ainsi nous grandirons avec le Seigneur.|Si on ne meurt pas à soi-même alors on e peut suivre le Seigneur ; il est impossible de suivre le Seigneur sans avoir au préalable crucifié la chair et ses passions. Cessons de nous mentir à nous même en disant que j'ai déjà tout essayé pour me séparer de ci ou de ça car nous n'avons pas fait de sacrifice comparable à celui de Christ qui était Dieu, le Créateur de tout, il a abandonné toute sa gloire pour prendre une forme d'homme il a marché dans l'obéissance jusqu'à la mort de la croix. Comment pouvons-nous au regard d'un sacrifice aussi grand que celui de notre Seigneur être incapable de consentir des petits sacrifices que demande la marche avec Lui ?  Personne n'a jamais fait suffisamment pour le Seigneur, le seul sacrifice parfait a été celui de Christ pour nous notre sanctification doit être continuelle.|Puissions-nous suivre le Seigneur non pas à notre façon mais comme il le veut.",
             en:"Following the Lord is not an easy thing, nor is it a thing to be taken lightly; the walk with the Lord is not a long quiet river — on the contrary, it is full of tribulation. It is very easy to sing and say we will lose what we love, but is it a reality in our walk with the Father? How much time do we devote to the One who gives us time? The things we often neglect could be the very things that draw us away from the Lord.|Luke 18:18-23 — it is quite possible to follow the Lord in one's own way, and very often that is what we do; because of distraction we do not even realise it. Like the rich man, we have things to which we are more attached than to the Lord, and the way to find out is simply to measure how hard it is to part with them. Sometimes we have made much effort with the Lord, but there remains one last effort to perfect the matter. To follow Jesus Christ one must SELL what one has: we cannot follow the Lord with the burdens of this life; it is impossible to follow the Lord if our work, our studies, our family and the rest occupy us more than the Lord. God will not accept the excuse that we are too busy, for anything that occupies us so much that we lack time for the Lord is seated on the throne of our heart — and the Lord does not share His glory with anything. We are not saying here that we must stop working, studying or caring for our own; but in the midst of all that, pleasing the Lord must be our chief concern. 'How can I have eternal life?' — or, how can I follow Jesus Christ? — was the rich man's question. To do so, we must remove everything that sits on the throne of our heart, and go all the way: keep moving forward without being content with the efforts already made, continually stripping ourselves of everything that could harm our relationship with the Lord — putting away lying, theft, greed, covetousness, immorality, impure thoughts and so on.|We should continually ask ourselves: am I on the narrow way? Am I in the good part, like Mary, or in the multitude of occupations, like Martha? Often, like that rich man, we go and question the Lord without being ready to apply what He tells us. When we draw near to the Lord's light, let us allow it to dazzle us so that it drives out the darkness within us; it would be useless to come before the light like that man and hide our face or turn to flee, for that light, far from harming us, transforms us to make us better. Let us be true worshippers who do not limit themselves to singing, but meditate on the words so that they penetrate us — and thus we will grow with the Lord.|If we do not die to ourselves, we cannot follow the Lord; it is impossible to follow the Lord without first crucifying the flesh and its passions. Let us stop lying to ourselves, saying 'I have already tried everything to break with this or that,' for we have made no sacrifice comparable to that of Christ, who was God, the Creator of all: He gave up all His glory to take the form of a man, and walked in obedience unto the death of the cross. How can we, in view of a sacrifice as great as our Lord's, be incapable of consenting to the small sacrifices the walk with Him requires? No one has ever done enough for the Lord; the only perfect sacrifice was Christ's for us — our sanctification must be continual.|May we follow the Lord not in our own way, but as He wills.",
             it:"Seguire il Signore non è una cosa facile, né una cosa da prendere alla leggera; il cammino con il Signore non è un lungo fiume tranquillo — al contrario, è pieno di tribolazioni. È molto facile cantare e dire che perderemo ciò che amiamo, ma è una realtà nel nostro cammino con il Padre? Quanto tempo consacriamo a colui che ci dona il tempo? Le cose che spesso trascuriamo potrebbero essere proprio quelle che ci allontanano dal Signore.|Luca 18:18-23 — è ben possibile seguire il Signore a modo proprio, e molte volte è ciò che facciamo; a causa della distrazione non ce ne rendiamo nemmeno conto. Come l'uomo ricco, abbiamo cose a cui siamo più attaccati che al Signore, e il modo per saperlo è semplicemente valutare quanto sia difficile disfarsene. A volte abbiamo fatto molti sforzi con il Signore, ma resta un ultimo sforzo da compiere per perfezionare la cosa. Per seguire Gesù Cristo bisogna VENDERE ciò che si ha: non si può seguire il Signore con i fardelli della vita; è impossibile seguire il Signore se il nostro lavoro, i nostri studi, la nostra famiglia e il resto ci preoccupano più del Signore. Dio non accetterà la scusa che siamo troppo occupati, perché una cosa che ci occupa al punto da farci mancare il tempo per il Signore è seduta sul trono del nostro cuore — e il Signore non divide la sua gloria con nulla. Non diciamo qui che si debba smettere di lavorare, di studiare o di occuparsi dei propri cari; ma in mezzo a tutto questo, piacere al Signore dev'essere la nostra preoccupazione principale. 'Come avere la vita eterna?' — ovvero, come seguire Gesù Cristo? — era la domanda di quell'uomo ricco. Per farlo bisogna togliere tutto ciò che sta sul trono del nostro cuore e andare fino in fondo: avanzare senza accontentarsi degli sforzi già compiuti, ma spogliarsi continuamente di tutto ciò che potrebbe nuocere alla nostra relazione con il Signore — togliere la menzogna, il furto, l'avarizia, la cupidigia, l'impudicizia, i pensieri impuri, ecc.|Dovremmo chiederci continuamente: sono sulla via stretta? Sono nella parte buona come Maria, o nella moltitudine delle occupazioni come Marta? Spesso, come quell'uomo ricco, andiamo a interrogare il Signore senza essere pronti ad applicare ciò che ci dice. Quando ci avviciniamo alla luce del Signore, lasciamoci abbagliare da essa affinché scacci le tenebre in noi; sarebbe inutile arrivare davanti alla luce come quell'uomo e nascondersi il volto o voltarsi per fuggire, perché quella luce, lungi dal farci del male, ci trasforma per renderci migliori. Siamo veri adoratori che non si limitano a cantare, ma meditano sulle parole affinché ci penetrino — così cresceremo con il Signore.|Se non si muore a se stessi, non si può seguire il Signore; è impossibile seguire il Signore senza aver prima crocifisso la carne e le sue passioni. Smettiamo di mentire a noi stessi dicendo 'ho già provato di tutto per separarmi da questo o da quello', perché non abbiamo fatto alcun sacrificio paragonabile a quello di Cristo, che era Dio, il Creatore di tutto: ha abbandonato tutta la sua gloria per prendere forma d'uomo, ha camminato nell'ubbidienza fino alla morte di croce. Come possiamo, davanti a un sacrificio così grande come quello del nostro Signore, essere incapaci di acconsentire ai piccoli sacrifici che il cammino con lui richiede? Nessuno ha mai fatto abbastanza per il Signore; l'unico sacrificio perfetto è stato quello di Cristo per noi — la nostra santificazione dev'essere continua.|Possiamo seguire il Signore non a modo nostro, ma come egli vuole." }
  },
  {
    id:"question-c-est-quoi-la-pluie-du-printemps-dont-il-est-questi", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-09", auteur:"Gaël, le frère",
    titre:{ fr:"Question : c'est quoi la pluie du printemps dont il est question dans zacharie10 :1 ??",
           en:"Question: what is the spring rain spoken of in Zechariah 10:1?",
           it:"Domanda: che cos'è la pioggia di primavera di cui si parla in Zaccaria 10:1?" },
    verset:{ fr:"" },
    extrait:{ fr:"Le Saint-Esprit est très souvent comparé dans les écritures à la pluie, et il y en a plusieurs type Joel2 :23-3, Jeremie5 :9-24",
             en:"The former and the latter rain represent the Holy Spirit: as the early Church received the former rain, so the Church of the end times will receive the latter rain.",
             it:"La prima e l'ultima pioggia rappresentano lo Spirito Santo: come la Chiesa primitiva ha ricevuto la prima pioggia, così la Chiesa della fine dei tempi riceverà l'ultima pioggia." },
    contenu:{ fr:"Le Saint-Esprit est très souvent comparé dans les écritures à la pluie, et il y en a plusieurs type Joel2 :23-3, Jeremie5 :9-24|Par la bouche de Ses prophètes le Seigneur a promis de faire descendre sur Son peuple, et donc les pluies de l'avant et de l'arrière-saison c'est le Saint-Esprit. De même que l'Eglise primitive a reçu le Saint-Esprit(Pluie de l'avant saison) ainsi l'Eglise de la fin des temps recevra le Saint-Esprit qui donc cette pluie de l'arrière-saison elle réalisera aussi des choses extraordinaires et le principal impact de cette pluie de l'arrière-saison sera de ramener au Seigneur la partie du peuple d'Israël qui n'aura pas encore cru au Seigneur c'est pourquoi les prophéties qui sont liées à cette pluie regardent beaucoup plus le peuple d'Israël comme le Seigneur le dit au travers du prophète Zacharie en zacharie12:9-14.",
             en:"The Holy Spirit is very often compared in the Scriptures to rain, and there are several kinds: Joel 2:23 and following; Jeremiah 5:23-24.|Through the mouth of His prophets the Lord promised to send rain down upon His people; the former and the latter rain therefore represent the Holy Spirit. Just as the early Church received the Holy Spirit (the former rain), so the Church of the end times will receive the Holy Spirit — that latter rain — and will likewise accomplish extraordinary things. The main impact of this latter rain will be to bring back to the Lord the part of the people of Israel that will not yet have believed in Him; that is why the prophecies linked to this rain concern the people of Israel above all, as the Lord says through the prophet Zechariah in Zechariah 12:9-14.",
             it:"Lo Spirito Santo è molto spesso paragonato nelle Scritture alla pioggia, e ce ne sono di diversi tipi: Gioele 2:23 e seguenti; Geremia 5:23-24.|Per bocca dei suoi profeti il Signore ha promesso di far scendere la pioggia sul suo popolo; le piogge della prima e dell'ultima stagione rappresentano dunque lo Spirito Santo. Come la Chiesa primitiva ha ricevuto lo Spirito Santo (la prima pioggia), così la Chiesa della fine dei tempi riceverà lo Spirito Santo — quell'ultima pioggia — e realizzerà anch'essa cose straordinarie. Il principale impatto di questa ultima pioggia sarà di ricondurre al Signore la parte del popolo d'Israele che non avrà ancora creduto in lui; per questo le profezie legate a questa pioggia riguardano soprattutto il popolo d'Israele, come il Signore dice attraverso il profeta Zaccaria in Zaccaria 12:9-14." }
  },
  {
    id:"le-salut-la-redemption", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-05-08", auteur:"Gaël, le frère",
    titre:{ fr:"Le salut-la rédemption",
           en:"Salvation — redemption",
           it:"La salvezza — la redenzione" },
    verset:{ fr:"" },
    extrait:{ fr:"Hébreux 9 :1-22",
             en:"Man was incapable of saving himself; God Himself had to intervene. Jesus made the ULTIMATE sacrifice, and FREELY — whoever demands payment for salvation is a THIEF.",
             it:"L'uomo era incapace di salvarsi da solo; Dio stesso ha dovuto intervenire. Gesù ha compiuto il sacrificio ULTIMO, e GRATUITAMENTE — chiunque chiede di pagare per la salvezza è un LADRO." },
    contenu:{ fr:"Hébreux 9 :1-22|Dieu a fixé un temps pour le renouvellement et il n'y a point de salut en dehors de Jésus-Christ car la porte reste fermée. Le souverain sacrificateur accomplissait une œuvre incomplète et imparfaite parce que lui-même était un pécheur et donc il offrait un sacrifice pour lui-même ; l'alliance qu'a faite Moise était une image du sacrifice de Christ, ceci dit si le Sang de Christ n'a pas aspergé qqn il ne peut être sauvé car c'est un sacrifice qui a déjà été fait et donc il ne peut être renouvelé, en d'autres mots Jésus est monté à la croix avec ceux qu'il avait déjà choisi 1 pierre1 :1-2.|Mesurons-nous la profondeur du privilège qui nous a été accordé par le Seigneur ?  l'homme était incapable de se sauver qu'il a fallu que Dieu Lui-même intervienne; une première intervention de Dieu pour le Salut de l'homme dans le jardin d'Eden après le péché: lorsqu'Adam et Eve ont péché ils se sont cachés et ont fui de la présence de Dieu par honte de leur nudité et c'est Dieu qui les a cherchés; Il en est de même pour la condition d'un pécheur il est nu et fuit la présence de Dieu( dangereux est donc celui qui se dit chrétien et qui se plait dans le péché avec l'excuse que Dieu est bon), pour les rhabiller Dieu a dû tuer un animal innocent qui n'avait rien à voir avec leur péché ce fut ainsi le premier sacrifice accompli pour le sauver le pécher. Parce que c'est Dieu qui a fait le premier il fallait que ce soit Lui qui fasse le dernier c’est pourquoi il a dû cacher à plusieurs génération le sacrifice pour le salut, il l'a caché en un Homme attendant le moment qu'il avait fixé pour le faire une fois pour toute, c'est donc Jésus qui a fait l'ULTIME sacrifice et ce GRATUITEMENT c'est pourquoi quiconque demande de payer pour le salut est un VOLEUR car Actes4 :12.|C’est pourquoi il y a lieu de se réjouir si nous avons obtenu le réel salut car ils sont nombreux qui payent chers pour espérer être sauvés. Nous méritions un salaire mes bien-aimés, une rétribution à la hauteur de nos fautes et c'était La MORT mais Dieu nous a fait un don gratuit : La vie Eternelle en Jésus-Christ. Considérons notre vie, méritions-nous ce salut ? Devons-nous prendre cela à la légère ? Sachons mes bien-aimés que si nous avions qch de bien précieux et d'important dans cette vie nous l'avons obtenue le jour où nous sommes entrés dans le Salut de Christ car c'est là la chose la plus importante et indispensable dans cette vie. En mesurons-nous l’immensité ? Le Seigneur a donné ce qu'il avait de plus précieux : son Unique Fils pour que nous ayons la vie ; prenons le temps de réaliser la grandeur de cette œuvre et demandons-nous si nous avons encore à nous plaindre. Chaque jour nous devons nous dire ;\" je ne pouvais être sauvé, je ne méritais pas d'être sauvé mais Dieu m'a quand même sauvé et ce pour rien. Suis-je conscient de cela ? Comment je vis par rapport à cette grâce ?|Il n'y a pas de prix à la vie de Jésus, Dieu sur la croix a porté nos malédictions ; Colossiens 2 :11-15 Jésus savait quelles seraient les étapes de sa vie sur la terre, et il a marché dans l'obéissance veillant à accomplir chacune des prophéties qui avaient été dites sur Lui c'est pourquoi à la croix il pouvait dire \"Tout est accompli\". Ah mes bien-aimés considèrent encore ça et remettons-nous en question. Ce que Dieu veut c'est que nous nous rendions compte de cette grâce sans pareil qui nous a été offerte ; Ce que le Seigneur veut c'est que nous nous sanctifions, que nous nous dépouillions des ténèbres ; cependant qu'en avons-nous fait ? Même en étant chrétien nous avons piétiné cette grande œuvre, nous avons négligé et méprisé le sacrifice de Christ.|Rapprochons-nous de Dieu pour demander pardon pour les fois où nous avons méprisé Sa grâce, pour les fois que nous nous sommes plaints de ce qui allait et même de ce qui n'allait pas, pour les fois où nous nous sommes même plaints de qui Il est. Demandons-lui la grâce de nous rendre compte de l'immense grâce qu'il nous a accordé celle de Le connaitre Lui le seul vrai Dieu.|Shalommmmmmmmmmmmm !!",
             en:"Hebrews 9:1-22.|God has fixed a time for the renewal, and there is no salvation outside Jesus Christ, for the door remains shut. The high priest performed an incomplete and imperfect work, because he himself was a sinner and therefore offered a sacrifice for himself; the covenant Moses made was an image of the sacrifice of Christ. This means that if the blood of Christ has not sprinkled someone, he cannot be saved, for it is a sacrifice already made and cannot be repeated — in other words, Jesus went up to the cross with those He had already chosen (1 Peter 1:1-2).|Do we measure the depth of the privilege the Lord has granted us? Man was so incapable of saving himself that God Himself had to intervene. God's first intervention for man's salvation was in the garden of Eden after the fall: when Adam and Eve sinned, they hid and fled from the presence of God out of shame at their nakedness — and it was God who sought them out. It is the same with the condition of a sinner: he is naked and flees the presence of God (dangerous, therefore, is the one who calls himself a Christian and delights in sin with the excuse that God is good). To clothe them again, God had to kill an innocent animal that had nothing to do with their sin — thus the first sacrifice was made to save the sinner. Because it was God who made the first, it had to be He who made the last; that is why He hid the sacrifice for salvation from many generations — He hid it in a Man, awaiting the moment He had fixed to make it once for all. It is therefore Jesus who made the ULTIMATE sacrifice, and FREELY; that is why whoever demands payment for salvation is a THIEF, for Acts 4:12.|That is why there is cause to rejoice if we have obtained real salvation, for many pay dearly in the hope of being saved. We deserved a wage, my beloved, a recompense in proportion to our faults — and it was DEATH; but God gave us a free gift: eternal life in Jesus Christ. Let us consider our life: did we deserve this salvation? Should we take it lightly? Let us know, my beloved, that if we possess anything truly precious and important in this life, we obtained it the day we entered into the salvation of Christ, for that is the most important and indispensable thing in this life. Do we measure its immensity? The Lord gave what was most precious to Him — His only Son — that we might have life; let us take time to grasp the greatness of this work, and ask ourselves whether we still have anything to complain about. Every day we should say to ourselves: 'I could not be saved, I did not deserve to be saved, and yet God saved me — and for nothing. Am I aware of this? How do I live in relation to this grace?'|There is no price to the life of Jesus; on the cross God bore our curses. Colossians 2:11-15 — Jesus knew what the stages of His life on earth would be, and He walked in obedience, taking care to fulfil each of the prophecies spoken about Him; that is why at the cross He could say, 'It is finished.' Ah, my beloved, let us consider this again and question ourselves. What God wants is that we realise this incomparable grace that has been offered to us; what the Lord wants is that we sanctify ourselves, that we strip off the darkness. Yet what have we done with it? Even as Christians we have trampled on this great work; we have neglected and despised the sacrifice of Christ.|Let us draw near to God to ask forgiveness for the times we despised His grace, for the times we complained about what was going well and even about what was not, for the times we even complained about who He is. Let us ask Him for the grace to realise the immense grace He has granted us: that of knowing Him, the only true God.|Shalom!",
             it:"Ebrei 9:1-22.|Dio ha fissato un tempo per il rinnovamento, e non c'è salvezza fuori di Gesù Cristo, perché la porta resta chiusa. Il sommo sacerdote compiva un'opera incompleta e imperfetta, perché lui stesso era un peccatore e dunque offriva un sacrificio per se stesso; l'alleanza fatta da Mosè era un'immagine del sacrificio di Cristo. Ciò detto, se il sangue di Cristo non ha asperso qualcuno, questi non può essere salvato, perché è un sacrificio già compiuto e non può essere rinnovato — in altre parole, Gesù è salito alla croce con coloro che aveva già scelto (1 Pietro 1:1-2).|Misuriamo la profondità del privilegio che ci è stato accordato dal Signore? L'uomo era talmente incapace di salvarsi che è stato necessario che Dio stesso intervenisse. Un primo intervento di Dio per la salvezza dell'uomo avvenne nel giardino di Eden dopo il peccato: quando Adamo ed Eva peccarono, si nascosero e fuggirono dalla presenza di Dio per la vergogna della loro nudità — e fu Dio a cercarli. Lo stesso vale per la condizione del peccatore: è nudo e fugge la presenza di Dio (pericoloso è dunque colui che si dice cristiano e si compiace nel peccato con la scusa che Dio è buono). Per rivestirli, Dio dovette uccidere un animale innocente che non aveva nulla a che fare con il loro peccato: fu così compiuto il primo sacrificio per salvare il peccatore. Poiché fu Dio a fare il primo, doveva essere lui a fare l'ultimo; per questo ha dovuto nascondere a molte generazioni il sacrificio per la salvezza — l'ha nascosto in un Uomo, attendendo il momento che aveva fissato per compierlo una volta per sempre. È dunque Gesù che ha compiuto il sacrificio ULTIMO, e GRATUITAMENTE; per questo chiunque chiede di pagare per la salvezza è un LADRO, perché Atti 4:12.|Per questo c'è motivo di rallegrarsi se abbiamo ottenuto la vera salvezza, perché sono numerosi coloro che pagano caro sperando di essere salvati. Meritavamo un salario, miei amati, una retribuzione all'altezza delle nostre colpe — ed era la MORTE; ma Dio ci ha fatto un dono gratuito: la vita eterna in Gesù Cristo. Consideriamo la nostra vita: meritavamo questa salvezza? Dobbiamo prenderla alla leggera? Sappiamo, miei amati, che se possediamo qualcosa di veramente prezioso e importante in questa vita, l'abbiamo ottenuto il giorno in cui siamo entrati nella salvezza di Cristo, perché è quella la cosa più importante e indispensabile di questa vita. Ne misuriamo l'immensità? Il Signore ha donato ciò che aveva di più prezioso — il suo unico Figlio — affinché avessimo la vita; prendiamoci il tempo di realizzare la grandezza di quest'opera e chiediamoci se abbiamo ancora di che lamentarci. Ogni giorno dobbiamo dirci: 'Non potevo essere salvato, non meritavo di essere salvato, eppure Dio mi ha salvato — e per niente. Ne sono consapevole? Come vivo rispetto a questa grazia?'|Non c'è prezzo per la vita di Gesù; sulla croce Dio ha portato le nostre maledizioni. Colossesi 2:11-15 — Gesù sapeva quali sarebbero state le tappe della sua vita sulla terra, e ha camminato nell'ubbidienza vegliando a compiere ciascuna delle profezie dette su di lui; per questo alla croce poteva dire: 'Tutto è compiuto.' Ah, miei amati, consideriamo ancora questo e rimettiamoci in discussione. Ciò che Dio vuole è che ci rendiamo conto di questa grazia senza pari che ci è stata offerta; ciò che il Signore vuole è che ci santifichiamo, che ci spogliamo delle tenebre. Eppure, che cosa ne abbiamo fatto? Anche da cristiani abbiamo calpestato questa grande opera, abbiamo trascurato e disprezzato il sacrificio di Cristo.|Avviciniamoci a Dio per chiedere perdono per le volte in cui abbiamo disprezzato la sua grazia, per le volte in cui ci siamo lamentati di ciò che andava bene e perfino di ciò che non andava, per le volte in cui ci siamo lamentati perfino di chi egli è. Chiediamogli la grazia di renderci conto dell'immensa grazia che ci ha accordato: quella di conoscere lui, il solo vero Dio.|Shalom!" }

  {
    id:"les-deviances-dans-le-monde-dans-lequel-nous-vivons", rubrique:"enseignements", sousRubrique:"marche",
    date:"2026-05-07", auteur:"Gaël, le frère",
    titre:{ fr:"Les déviances dans le monde dans lequel nous vivons",
           en:"The deviances of the world we live in",
           it:"Le devianze del mondo in cui viviamo" },
    verset:{ fr:"" },
    extrait:{ fr:"Nous sommes partis de l'observation de la montée de la consommation des drogues de la part des jeunes, de l'alcoolisme et aussi l'absence des parents dans l'éducation des enfants qui sont…",
             en:"Every seduction of the enemy has two faces, and the one it shows is pleasure; the other, invisible, is the price to pay. To avoid the trap, we must find our pleasure in the things of the Lord.",
             it:"Ogni seduzione del nemico ha due facce, e quella che mostra è il piacere; l'altra, invisibile, è il prezzo da pagare. Per non cadere nella trappola, bisogna trovare il proprio piacere nelle cose del Signore." },
    contenu:{ fr:"Nous sommes partis de l'observation de la montée de la consommation des drogues de la part des jeunes, de l'alcoolisme et aussi l'absence des parents dans l'éducation des enfants qui sont abandonnés aux différents gadgets dont la maison est équipée pour parler DES DEVIANCES DANS LE MONDE DANS LEQUEL NOUS VIVONS. Déjà il est important de souligner que chaque séduction de l'ennemi a deux faces et généralement celle qu'il montre c'est le plaisir, la récompense les parents qui abandonnent l'éducation de leurs enfants à internet la télévision voient juste le faut que les enfants seront à l'abri du besoin ave tout ça et eux ils vont pouvoir se reposer au point où on forme des enfants robots qu'on calme quand ils pleurent avec le téléphone ou alors le programme préféré à la télé; celui sui se drogue voit juste le fait qu'il se sent plus joyeux qu'il plane quand il consomme. Or l'autre aspect qu'on ne voit pas, et qui n'est visible que dans deux cas c'est le prix à payer ; il n'est visible que si on a le discernement du Saint-Esprit ou alors carrément quand on est déjà en train de le payer c'est là qu'on s'en rend compte. Si nous lisons dans luc4 : 1-13 dans la tentation si on n'a pas les yeux ouverts on ne verra que le plaisir et on va se retrouver à suivre le courant de ce monde car chaque chose facile cache un piège. Si on n'a pas les pieds sur terre et le cœur dans les mains du Seigneur on sera séduits. Pour ne pas se laisser piéger, pour ne pas tomber dans les travers de la séduction il faut trouver son plaisir dans le chose du Seigneur. On aura toujours les difficultés mais pour qqn qui a placé son cœur dans le Seigneur il ne va pas se compromettre. Colossiens3 : 1-8 c'est l'affection pour les choses d'en bas qui amène les gens à la séduction, le vouloir faire qch parce que les autres ont fait. À quelque position que l'on soit il est important de chercher la pensée de Dieu pour chacun des aspects de notre vie même les plus minimes ainsi on ne se verra pas séduit. Dans tout ce que le monde appelle succès, avancement, découverte cache un piège de l'ennemi. 2Thess2 : 9-12 toutes les inventions et découvertes font partis des miracles et prodiges de l'homme impie. Nous avons véritablement du besoin de la parole qui sort de la bouche de Dieu car sans elle il est impossible de vivre de façon convenable",
             en:"We started from the observation of the rise in drug use among the young, of alcoholism, and also of the absence of parents from the upbringing of children — abandoned to the various gadgets with which the home is equipped — to speak of THE DEVIANCES OF THE WORLD WE LIVE IN. First, it is important to stress that every seduction of the enemy has two faces, and the one it generally shows is pleasure, the reward. Parents who abandon their children's upbringing to the internet and television see only that the children will want for nothing and that they themselves will be able to rest — to the point of raising robot children who are calmed, when they cry, with the telephone or their favourite TV programme; the one who takes drugs sees only that he feels happier, that he floats when he consumes. But the other side, which we do not see, is the price to pay: it is visible only in two cases — if one has the discernment of the Holy Spirit, or when one is already paying it; that is when one realises. If we read Luke 4:1-13, in the temptation, without open eyes we will see only the pleasure, and we will find ourselves following the current of this world — for every easy thing hides a trap. If we do not have our feet on the ground and our heart in the hands of the Lord, we will be seduced. In order not to be trapped, not to fall into the snares of seduction, we must find our pleasure in the things of the Lord. There will always be difficulties, but someone who has placed his heart in the Lord will not compromise himself. Colossians 3:1-8 — it is affection for the things below that leads people into seduction, the desire to do something because others have done it. Whatever our position, it is important to seek God's mind for every aspect of our life, even the smallest, and so we will not be seduced. In everything the world calls success, advancement, discovery, a trap of the enemy lies hidden. 2 Thessalonians 2:9-12 — all the inventions and discoveries are part of the signs and wonders of the lawless one. We truly need the word that proceeds from the mouth of God, for without it it is impossible to live rightly.",
             it:"Siamo partiti dall'osservazione dell'aumento del consumo di droghe da parte dei giovani, dell'alcolismo e anche dell'assenza dei genitori nell'educazione dei figli — abbandonati ai vari dispositivi di cui la casa è attrezzata — per parlare delle DEVIANZE DEL MONDO IN CUI VIVIAMO. Anzitutto è importante sottolineare che ogni seduzione del nemico ha due facce, e quella che generalmente mostra è il piacere, la ricompensa. I genitori che abbandonano l'educazione dei figli a internet e alla televisione vedono solo il fatto che i figli non mancheranno di nulla e che loro potranno riposarsi — al punto che si formano bambini-robot che si calmano, quando piangono, con il telefono o con il programma preferito alla TV; chi si droga vede solo il fatto che si sente più allegro, che 'vola' quando consuma. Ma l'altro aspetto, che non si vede, è il prezzo da pagare: è visibile solo in due casi — se si ha il discernimento dello Spirito Santo, oppure quando lo si sta già pagando; è allora che ci se ne rende conto. Se leggiamo Luca 4:1-13, nella tentazione, senza gli occhi aperti si vedrà solo il piacere e ci si ritroverà a seguire la corrente di questo mondo — perché ogni cosa facile nasconde una trappola. Se non abbiamo i piedi per terra e il cuore nelle mani del Signore, saremo sedotti. Per non lasciarsi intrappolare, per non cadere nelle insidie della seduzione, bisogna trovare il proprio piacere nelle cose del Signore. Ci saranno sempre difficoltà, ma chi ha posto il suo cuore nel Signore non si comprometterà. Colossesi 3:1-8 — è l'affetto per le cose di quaggiù che porta le persone alla seduzione, il voler fare qualcosa perché gli altri l'hanno fatto. In qualunque posizione ci si trovi, è importante cercare il pensiero di Dio per ciascun aspetto della nostra vita, anche il più piccolo: così non ci si vedrà sedotti. In tutto ciò che il mondo chiama successo, avanzamento, scoperta, si nasconde una trappola del nemico. 2 Tessalonicesi 2:9-12 — tutte le invenzioni e le scoperte fanno parte dei segni e dei prodigi dell'empio. Abbiamo veramente bisogno della parola che esce dalla bocca di Dio, perché senza di essa è impossibile vivere in modo conveniente." }

  {
    id:"fondement-saine-doctrine", rubrique:"enseignements", sousRubrique:"doctrine",
    date:"2026-07-01", auteur:"La rédaction",
    titre:{ fr:"Pourquoi la saine doctrine est-elle vitale ?",
            en:"Why is sound doctrine vital?",
            it:"Perché la sana dottrina è vitale?" },
    verset:{ fr:"« Toi, parle selon la saine doctrine. » — Tite 2:1",
             en:"“But speak thou the things which become sound doctrine.” — Titus 2:1",
             it:"« Ma tu, esponi le cose che si convengono alla sana dottrina. » — Tito 2:1" },
    extrait:{ fr:"L'apôtre Paul exhortait Tite à parler selon la saine doctrine. Que signifie cette expression, et pourquoi est-elle si importante pour l'Église aujourd'hui ?",
              en:"The apostle Paul urged Titus to speak according to sound doctrine. What does this mean, and why does it matter so much for the Church today?",
              it:"L'apostolo Paolo esortava Tito a parlare secondo la sana dottrina. Che cosa significa, e perché è così importante per la Chiesa oggi?" },
    contenu:{
      fr:"L'apôtre Paul, écrivant à Tite, lui donne un ordre simple et solennel : parler selon la saine doctrine. Le mot grec traduit par « saine » évoque ce qui est en bonne santé, ce qui n'est pas corrompu. La doctrine saine est donc celle qui garde l'âme en bonne santé spirituelle, parce qu'elle est conforme à la Parole de Dieu, sans en rajouter et sans en retrancher.|Ce blog existe pour cette raison : offrir un espace où la Parole est enseignée avec fidélité, où le Seigneur Jésus-Christ est au centre, et où chacun peut être édifié, averti et encouragé.|Nous vous invitons à lire, à méditer, à vérifier toutes choses dans les Écritures comme les Béréens (Actes 17:11), et à partager ces enseignements autour de vous.",
      en:"The apostle Paul, writing to Titus, gives him a simple and solemn command: speak according to sound doctrine. The Greek word translated as “sound” refers to what is healthy, what is not corrupted. Sound doctrine is therefore the teaching that keeps the soul spiritually healthy, because it conforms to the Word of God, without adding to it or taking away from it.|This blog exists for that very reason: to offer a place where the Word is taught faithfully, where the Lord Jesus Christ is at the centre, and where everyone can be edified, warned and encouraged.|We invite you to read, to meditate, to test all things by the Scriptures like the Bereans (Acts 17:11), and to share these teachings with those around you.",
      it:"L'apostolo Paolo, scrivendo a Tito, gli dà un ordine semplice e solenne: parlare secondo la sana dottrina. La parola greca tradotta con « sana » indica ciò che è in buona salute, ciò che non è corrotto. La sana dottrina è dunque quella che mantiene l'anima in buona salute spirituale, perché è conforme alla Parola di Dio, senza aggiungere e senza togliere nulla.|Questo blog esiste per questa ragione: offrire uno spazio dove la Parola è insegnata con fedeltà, dove il Signore Gesù Cristo è al centro, e dove ognuno può essere edificato, avvertito e incoraggiato.|Vi invitiamo a leggere, a meditare, a esaminare ogni cosa nelle Scritture come i Bereani (Atti 17:11), e a condividere questi insegnamenti intorno a voi." }
  },

/* =====================================================================

   ===================================================================== */
const $ = s => document.querySelector(s);
const app = $("#app");
$("#annee").textContent = new Date().getFullYear();

function t(cle){ return T[LANGUE][cle] !== undefined ? T[LANGUE][cle] : T.fr[cle]; }
function tr(x){ if(x==null) return ""; if(typeof x==="string") return x; return x[LANGUE] || x.fr || ""; }
function nomR(c){ return tr(RUBRIQUES[c]) || c; }
function nomSR(c){ return tr(SOUS_RUBRIQUES[c]) || c; }
function echap(x){ const d=document.createElement("div"); d.textContent=x||""; return d.innerHTML; }
function dateLoc(iso){ return new Date(iso+"T12:00:00").toLocaleDateString(LOCALES[LANGUE],{day:"numeric",month:"long",year:"numeric"}); }

function majTextesStatiques(){
  document.documentElement.lang = LANGUE;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-sr]").forEach(el=>{ el.textContent = nomSR(el.dataset.sr); });
  document.querySelectorAll("#langues button").forEach(b=>b.classList.toggle("actif", b.dataset.lg===LANGUE));
}
function changerLangue(lg){
  LANGUE = lg;
  majTextesStatiques(); majZoneCompte(); majAffichageRadio(); router();
}
document.querySelectorAll("#langues button").forEach(b=>b.onclick=()=>changerLangue(b.dataset.lg));

function afficherAvis(texte){
  const a=$("#avis"); a.textContent=texte; a.style.display="block";
  clearTimeout(a._t); a._t=setTimeout(()=>a.style.display="none",3200);
}

// ---------- Comptes (démonstration en mémoire) ----------
// Pour des comptes permanents, connecter un service d'authentification
// (ex. Firebase) une fois le site en ligne.
const comptes = new Map();
let utilisateur = null;

// ---------- Firebase (activé seulement si la configuration est remplie) ----------
let fb = null, db = null;
let ARTICLES_LIGNE = []; // articles publiés en ligne via l'espace Administration
function tous(){
  const dejaEnLigne = new Set(ARTICLES_LIGNE.map(a=>a.id));
  return ARTICLES_LIGNE.concat(ARTICLES.filter(a=>!dejaEnLigne.has(a.id)));
}
function articlesNonImportes(){
  const dejaEnLigne = new Set(ARTICLES_LIGNE.map(a=>a.id));
  return ARTICLES.filter(a=>!dejaEnLigne.has(a.id));
}
function estAdmin(){
  return !!(utilisateur && ADMINS.map(a=>a.toLowerCase()).includes((utilisateur.email||"").toLowerCase()));
}
function slugJs(t){
  t = (t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  return t.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60);
}
function initFirebase(){
  if(!FIREBASE_CONFIG.apiKey || typeof firebase === "undefined") return;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fb = firebase.auth();
    db = firebase.firestore();
    fb.onAuthStateChanged(u=>{
      utilisateur = u ? { prenom: u.displayName || (u.email||"").split("@")[0], email: u.email } : null;
      majZoneCompte();
      if(location.hash.indexOf("#/article/")===0) router();
    });
    chargerArticlesEnLigne().then(()=>router());
  }catch(e){ console.error("Firebase :", e); }
}
function chargerArticlesEnLigne(){
  if(!db) return Promise.resolve();
  return db.collection("articles").orderBy("date","desc").get()
    .then(snap=>{ ARTICLES_LIGNE = snap.docs.map(d=>Object.assign({_fs:d.id}, d.data())); })
    .catch(e=>console.error("Chargement des articles :", e));
}

function majZoneCompte(){
  const z=$("#zoneCompte");
  if(utilisateur){
    z.innerHTML='<span class="ui" style="font-size:.83rem;color:var(--or-clair)">'+t("au_salut")+'<strong>'+echap(utilisateur.prenom)+'</strong></span>'+
      '<a class="btn btn-contour" href="#/profil">'+t("pf_titre")+'</a>'+
      (estAdmin() ? '<a class="btn btn-or" href="#/admin" style="text-align:center">Administration</a>' : '')+
      '<button class="btn btn-contour" id="btnDeconnexion">'+t("au_deconnexion")+'</button>';
    $("#btnDeconnexion").onclick=()=>{
      if(fb){ fb.signOut(); }
      utilisateur=null; majZoneCompte(); afficherAvis(t("au_deco"));
      if(location.hash.indexOf("admin")!==-1) location.hash="#/";
    };
  }else{
    z.innerHTML='<button class="btn btn-contour" id="btnConnexion">'+t("au_connexion")+'</button>'+
      '<button class="btn btn-or" id="btnInscription">'+t("au_inscription")+'</button>';
    $("#btnConnexion").onclick=()=>ouvrirAuth("connexion");
    $("#btnInscription").onclick=()=>ouvrirAuth("inscription");
  }
}
function ouvrirAuth(mode){
  fermerMenuMobile();
  const c=$("#contenuAuth");
  if(mode==="inscription"){
    c.innerHTML='<h2>'+t("au_inscription")+'</h2><p class="sous-titre">'+t("au_creer_st")+'</p>'+
      '<div class="msg" id="msgAuth"></div>'+
      '<div class="champ"><label for="insPrenom">'+t("au_prenom")+'</label><input id="insPrenom" type="text" autocomplete="given-name"></div>'+
      '<div class="champ"><label for="insEmail">'+t("au_email")+'</label><input id="insEmail" type="email" autocomplete="email"></div>'+
      '<div class="champ"><label for="insMdp">'+t("au_mdp")+'</label><input id="insMdp" type="password" autocomplete="new-password"></div>'+
      '<button class="btn btn-nuit" style="width:100%" id="btnValiderIns">'+t("au_valider_ins")+'</button>'+
      '<p class="bascule-auth">'+t("au_deja")+' <button id="basculeCo">'+t("au_connexion")+'</button></p>';
    $("#btnValiderIns").onclick=()=>{
      const prenom=$("#insPrenom").value.trim(), email=$("#insEmail").value.trim().toLowerCase(), mdp=$("#insMdp").value;
      const m=$("#msgAuth"); m.className="msg";
      if(!prenom||!email||!mdp){m.className="msg err";m.textContent=t("au_err_champs");return;}
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){m.className="msg err";m.textContent=t("au_err_email");return;}
      if(mdp.length<6){m.className="msg err";m.textContent=t("au_err_mdp");return;}
      if(fb){
        fb.createUserWithEmailAndPassword(email,mdp)
          .then(cred=>cred.user.updateProfile({displayName:prenom}))
          .then(()=>{ utilisateur={prenom,email}; majZoneCompte(); fermerAuth();

                          : (e && e.code==="auth/weak-password") ? t("au_err_mdp")
                          : t("au_err_email"); });
        return;
      }
      if(comptes.has(email)){m.className="msg err";m.textContent=t("au_err_existe");return;}
      comptes.set(email,{prenom,email,mdp});
      utilisateur={prenom,email};

function urlPdfValide(u){ return typeof u==="string" && /^https?:\/\//i.test(u.trim()); }
// Mise en forme légère à l'intérieur d'un paragraphe :
//   **gras**   *italique*
function enrichir(texte){
  let s = echap(texte);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  // Liens nommés :   [texte du lien](https://adresse)
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
    '<a class="lien-texte" href="$2" target="_blank" rel="noopener">$1</a>');
  // Adresses écrites en clair, hors de celles déjà transformées ci-dessus
  s = s.replace(/(^|[\s(])((?:https?:\/\/|www\.)[^\s<)]+)/g, (tout, avant, url)=>{
    const propre = url.replace(/[.,;:!?]+$/, "");
    const suite = url.slice(propre.length);
    const cible = propre.indexOf("http")===0 ? propre : "https://"+propre;
    return avant+'<a class="lien-texte" href="'+cible+'" target="_blank" rel="noopener">'+propre+'</a>'+suite;
  });
  // Adresses e-mail cliquables
  s = s.replace(/(^|[\s(])([\w.+-]+@[\w-]+\.[\w.-]+)/g,
    '$1<a class="lien-texte" href="mailto:$2">$2</a>');
  return s;
}
function carteDocument(url, nom){
  return '<a class="doc-joint" href="'+echap(url)+'" target="_blank" rel="noopener">'+
    '<span class="doc-icone">PDF</span>'+

    '<span class="doc-action">'+t("doc_ouvrir")+'</span></a>';
}
function paragrapheHtml(p){
  const l = p.trim();
  // Image :   image: https://…jpg Légende facultative
  const mi = l.match(/^image\s*:\s*(\S+)\s*(.*)$/i);
  if(mi && urlImageValide(mi[1])){
    return '<figure><img src="'+echap(mi[1])+'" alt="'+echap(mi[2]||"")+'" loading="lazy">'+
           (mi[2]?'<figcaption>'+echap(mi[2])+'</figcaption>':'')+'</figure>';
  }
  // Document PDF :   pdf: https://…pdf Nom du document
  const mp = l.match(/^pdf\s*:\s*(\S+)\s*(.*)$/i);
  if(mp && urlPdfValide(mp[1])) return carteDocument(mp[1], mp[2]);
  // Vidéo :   video: https://…  (fichier .mp4/.webm/.mov, YouTube ou Vimeo)
  const mv = l.match(/^video\s*:\s*(\S+)\s*(.*)$/i);
  if(mv){
    const u = mv[1];
    if(/^https?:\/\/.+\.(mp4|webm|mov|m4v)(\?.*)?$/i.test(u)){
      return '<figure class="video-inseree"><video controls preload="metadata" playsinline '+
        'style="width:100%;border-radius:var(--rayon);box-shadow:var(--ombre);display:block">'+
        '<source src="'+echap(u)+'"></video>'+
        (mv[2]?'<figcaption>'+echap(mv[2])+'</figcaption>':'')+'</figure>';
    }
    let src = "";
    let y = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/);
    if(y) src = "https://www.youtube.com/embed/" + y[1];
    let v = u.match(/vimeo\.com\/(\d+)/);
    if(v) src = "https://player.vimeo.com/video/" + v[1];
    if(src) return '<figure class="video-inseree"><div class="cadre-video">'+
      '<iframe src="'+echap(src)+'" title="'+t("md_video")+'" loading="lazy" allowfullscreen '+
      'allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe></div>'+
      (mv[2]?'<figcaption>'+echap(mv[2])+'</figcaption>':'')+'</figure>';
  }
  // Titres :   ## Grand titre   ### Sous-titre
  const mt = l.match(/^(#{2,3})\s+(.*)$/);
  if(mt) return mt[1].length===2
    ? '<h3 class="titre-section">'+enrichir(mt[2])+'</h3>'
    : '<h4 class="sous-titre-section">'+enrichir(mt[2])+'</h4>';
  // Puce :   - élément de liste
  const ml = l.match(/^[-•]\s+(.*)$/);
  if(ml) return '<p class="puce-texte">'+enrichir(ml[1])+'</p>';
  return '<p>'+enrichir(p)+'</p>';
}

const AUDIO_RADIO = {
  fr:{ dossier:7,  version:"Louis Segond 1910",          texte:"ls1910",   tts:"fr" },
  en:{ dossier:1,  version:"King James Version",         texte:"kjv",      tts:"en" },
