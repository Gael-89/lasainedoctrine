<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - La Saine Doctrine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bleu-fonce: #101C33;
            --dore: #B8933F;
            --dore-clair: #D9BC72;
            --parchemin: #FAF6EC;
            --encre: #23252B;
            --gris-clair: #E8E8E8;
            --rouge: #8A3324;
            --vert: #2E7D32;
            --ombre: 0 4px 12px rgba(28, 37, 69, 0.1);
            --ombre-legere: 0 2px 6px rgba(0, 0, 0, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--parchemin);
            color: var(--encre);
            line-height: 1.6;
            font-size: 16px;
        }

        /* ========== LOADING ========== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--parchemin);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(184, 147, 63, 0.2);
            border-top: 4px solid var(--dore);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            position: absolute;
            bottom: 50px;
            font-size: 0.9rem;
            color: var(--dore);
        }

        /* ========== LAYOUT ========== */
        .container-admin {
            display: grid;
            grid-template-columns: 280px 1fr;
            min-height: 100vh;
        }

        aside.sidebar {
            background: var(--bleu-fonce);
            color: var(--parchemin);
            padding: 2rem 1.5rem;
            border-right: 1px solid rgba(217, 188, 114, 0.2);
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-family: 'Spectral', serif;
            font-size: 1.4rem;
            margin-bottom: 0.5rem;
            color: var(--dore-clair);
        }

        .sidebar p {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 2rem;
        }

        .sidebar-nav {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .sidebar-nav button {
            background: rgba(217, 188, 114, 0.1);
            color: var(--parchemin);
            border: 1px solid rgba(217, 188, 114, 0.2);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
            text-align: left;
        }

        .sidebar-nav button:hover,
        .sidebar-nav button.actif {
            background: var(--dore);
            color: var(--bleu-fonce);
            border-color: var(--dore);
        }

        main.contenu {
            padding: 2rem;
            max-width: 1200px;
        }

        /* ========== LOGIN ========== */
        .vue-login {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--bleu-fonce) 0%, #1a2f4a 100%);
        }

        .login-box {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: var(--ombre);
            width: 100%;
            max-width: 420px;
        }

        .login-box h1 {
            font-family: 'Spectral', serif;
            font-size: 1.8rem;
            color: var(--bleu-fonce);
            margin-bottom: 0.5rem;
        }

        .login-box p {
            color: var(--encre);
            opacity: 0.7;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--encre);
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--gris-clair);
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            transition: border-color 0.2s ease;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--dore);
            box-shadow: 0 0 0 3px rgba(184, 147, 63, 0.1);
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: var(--dore);
            color: var(--bleu-fonce);
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--dore-clair);
            transform: translateY(-2px);
            box-shadow: var(--ombre-legere);
        }

        .btn-secondary {
            background: rgba(217, 188, 114, 0.1);
            color: var(--dore);
            border: 1px solid var(--dore);
        }

        .btn-secondary:hover {
            background: rgba(217, 188, 114, 0.2);
        }

        /* ========== ARTICLES LIST ========== */
        .articles-list {
            display: grid;
            gap: 1rem;
        }

        .article-card {
            background: white;
            border: 1px solid var(--gris-clair);
            border-radius: 8px;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 1rem;
            align-items: start;
            transition: all 0.2s ease;
        }

        .article-card:hover {
            border-color: var(--dore);
            box-shadow: var(--ombre-legere);
        }

        .article-info h3 {
            font-family: 'Spectral', serif;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            color: var(--bleu-fonce);
        }

        .article-meta {
            font-size: 0.85rem;
            color: var(--encre);
            opacity: 0.7;
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .btn-icon.edit {
            background: rgba(184, 147, 63, 0.1);
            color: var(--dore);
        }

        .btn-icon.edit:hover {
            background: rgba(184, 147, 63, 0.2);
        }

        .btn-icon.delete {
            background: rgba(138, 51, 36, 0.1);
            color: var(--rouge);
        }

        .btn-icon.delete:hover {
            background: rgba(138, 51, 36, 0.2);
        }

        /* ========== FORMULAIRE ========== */
        .form-container {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            border: 1px solid var(--gris-clair);
            max-width: 900px;
        }

        .form-title {
            font-family: 'Spectral', serif;
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--bleu-fonce);
        }

        .tabs-langues {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--gris-clair);
        }

        .tab-btn {
            padding: 0.75rem 1.25rem;
            background: none;
            border: none;
            border-bottom: 3px solid transparent;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--encre);
            opacity: 0.6;
            transition: all 0.2s ease;
        }

        .tab-btn.actif {
            opacity: 1;
            color: var(--dore);
            border-bottom-color: var(--dore);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
        }

        /* ========== HELPERS ========== */
        .hidden {
            display: none !important;
        }

        .vide {
            text-align: center;
            padding: 2rem;
            color: var(--encre);
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .container-admin {
                grid-template-columns: 1fr;
            }

            main.contenu {
                padding: 1rem;
            }

            .article-card {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div>
            <div class="spinner"></div>
            <div class="loading-text">Chargement...</div>
        </div>
    </div>
    <div id="app"></div>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

    <script>
        // CONFIG FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyDv_CmaZrHLx6-M2akr-2XZqjCYbHO6G5c",
            authDomain: "la-saine-doctrine.firebaseapp.com",
            projectId: "la-saine-doctrine",
            databaseURL: "https://la-saine-doctrine-default-rtdb.europe-west1.firebase.realtime-database.app",
            storageBucket: "la-saine-doctrine.firebasestorage.app",
            messagingSenderId: "4297640674",
            appId: "1:4297640674:web:4b8082ca1985113e6030fe",
            measurementId: "G-FRWSGNZD48"
        };

        const ADMINS = ["temguegael@yahoo.fr", "temgue2404@gmail.com", "christenmoi01@gmail.com"];

        let auth, db, user;
        let articles = [];
        let currentView = 'login';
        let editingId = null;

        // ATTENDRE que Firebase soit disponible
        function waitForFirebase() {
            return new Promise((resolve) => {
                const checkInterval = setInterval(() => {
                    if (typeof firebase !== 'undefined' && firebase.apps.length === 0) {
                        clearInterval(checkInterval);
                        try {
                            firebase.initializeApp(firebaseConfig);
                            auth = firebase.auth();
                            db = firebase.firestore();
                            resolve(true);
                        } catch (e) {
                            console.error("Erreur init Firebase:", e);
                        }
                    }
                }, 100);
                
                // Timeout après 5 secondes
                setTimeout(() => {
                    clearInterval(checkInterval);
                    if (typeof firebase !== 'undefined') {
                        try {
                            if (firebase.apps.length === 0) {
                                firebase.initializeApp(firebaseConfig);
                            }
                            auth = firebase.auth();
                            db = firebase.firestore();
                            resolve(true);
                        } catch (e) {
                            console.error("Erreur timeout Firebase:", e);
                            resolve(false);
                        }
                    } else {
                        resolve(false);
                    }
                }, 5000);
            });
        }

        async function init() {
            const success = await waitForFirebase();
            
            if (!success) {
                document.getElementById('app').innerHTML = '<div style="text-align:center;padding:2rem;color:red;">Erreur de chargement de Firebase</div>';
                document.getElementById('loading').style.display = 'none';
                return;
            }

            // Écouter les changements d'auth
            auth.onAuthStateChanged((u) => {
                user = u;
                if (user && ADMINS.includes(user.email)) {
                    currentView = 'articles';
                    loadArticles();
                } else if (user) {
                    logout();
                    alert("Accès refusé. Vous n'êtes pas administrateur.");
                } else {
                    currentView = 'login';
                }
                render();
                document.getElementById('loading').style.display = 'none';
            });
        }

        async function loadArticles() {
            try {
                const snap = await db.collection('articles').orderBy('datePublication', 'desc').get();
                articles = snap.docs.map(d => ({
                    id: d.id,
                    ...d.data()
                }));
                render();
            } catch (e) {
                console.error("Erreur articles:", e);
            }
        }

        async function saveArticle(data) {
            try {
                const now = new Date().toISOString();
                const articleData = {
                    ...data,
                    dateModification: now,
                    auteur: user.email
                };

                if (editingId) {
                    await db.collection('articles').doc(editingId).update(articleData);
                } else {
                    articleData.datePublication = now;
                    await db.collection('articles').add(articleData);
                }

                editingId = null;
                currentView = 'articles';
                loadArticles();
                alert('Article enregistré !');
            } catch (e) {
                alert("Erreur: " + e.message);
            }
        }

        async function deleteArticle(id) {
            if (!confirm("Supprimer cet article ?")) return;
            try {
                await db.collection('articles').doc(id).delete();
                loadArticles();
            } catch (e) {
                alert("Erreur: " + e.message);
            }
        }

        async function login(email, password) {
            try {
                await auth.signInWithEmailAndPassword(email, password);
            } catch (e) {
                alert("Erreur: " + e.message);
            }
        }

        function logout() {
            auth.signOut();
            currentView = 'login';
            render();
        }

        function render() {
            const appDiv = document.getElementById('app');
            if (currentView === 'login') {
                appDiv.innerHTML = renderLogin();
                setTimeout(attachLoginHandlers, 50);
            } else if (currentView === 'articles') {
                appDiv.innerHTML = renderDashboard();
                setTimeout(attachDashboardHandlers, 50);
            } else if (currentView === 'form') {
                appDiv.innerHTML = renderForm();
                setTimeout(attachFormHandlers, 50);
            }
        }

        function renderLogin() {
            return `
                <div class="vue-login">
                    <div class="login-box">
                        <h1>✚ La Saine Doctrine</h1>
                        <p>Espace Administration</p>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="loginEmail" placeholder="Votre email">
                        </div>
                        <div class="form-group">
                            <label>Mot de passe</label>
                            <input type="password" id="loginPassword" placeholder="Votre mot de passe">
                        </div>
                        <button class="btn btn-primary" id="btnLogin">Se connecter</button>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            return `
                <div class="container-admin">
                    <aside class="sidebar">
                        <h2>Admin</h2>
                        <p>${user.email}</p>
                        <div class="sidebar-nav">
                            <button class="actif">📄 Articles</button>
                            <button id="btnNouveauArticle">➕ Nouvel article</button>
                            <button id="btnLogout" style="margin-top: 2rem; background: rgba(138,51,36,0.1); color: var(--rouge);">🚪 Déconnexion</button>
                        </div>
                    </aside>
                    <main class="contenu">
                        <h1>Articles (${articles.length})</h1>
                        <div class="articles-list" style="margin-top: 1.5rem;">
                            ${articles.length === 0 ? '<p class="vide">Aucun article.</p>' : articles.map(a => `
                                <div class="article-card">
                                    <div class="article-info">
                                        <h3>${escapeHtml(a.titre?.fr || 'Sans titre')}</h3>
                                        <div class="article-meta">
                                            <span>📅 ${new Date(a.datePublication).toLocaleDateString('fr-FR')}</span>
                                            <span>✏️ ${new Date(a.dateModification).toLocaleDateString('fr-FR')}</span>
                                        </div>
                                    </div>
                                    <div class="article-actions">
                                        <button class="btn-icon edit" onclick="window.editArticle('${a.id}')">✏️</button>
                                        <button class="btn-icon delete" onclick="window.deleteArticle('${a.id}')">🗑️</button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </main>
                </div>
            `;
        }

        function renderForm() {
            const a = articles.find(x => x.id === editingId) || {};
            return `
                <div class="container-admin">
                    <aside class="sidebar">
                        <h2>Article</h2>
                        <p>${editingId ? 'Modification' : 'Créer'}</p>
                        <div class="sidebar-nav">
                            <button id="btnRetour">← Retour</button>
                        </div>
                    </aside>
                    <main class="contenu">
                        <div class="form-container">
                            <h2 class="form-title">${editingId ? 'Modifier' : 'Créer un'} article</h2>

                            <div class="tabs-langues">
                                <button class="tab-btn actif" data-lang="fr">🇫🇷 FR</button>
                                <button class="tab-btn" data-lang="en">🇬🇧 EN</button>
                                <button class="tab-btn" data-lang="it">🇮🇹 IT</button>
                            </div>

                            <div class="form-group">
                                <label>Rubrique</label>
                                <select id="rubrique">
                                    <option value="enseignements">Enseignements</option>
                                    <option value="annonces">Annonces</option>
                                    <option value="propheties">Prophéties</option>
                                </select>
                            </div>

                            <div class="form-row">
                                <div class="form-group">
                                    <label>Image (URL)</label>
                                    <input type="text" id="image" value="${a.image || ''}">
                                </div>
                                <div class="form-group">
                                    <label>PDF (URL)</label>
                                    <input type="text" id="pdf" value="${a.pdf || ''}">
                                </div>
                            </div>

                            <div class="form-lang" data-lang="fr">
                                <h3 style="color: var(--dore); margin-bottom: 1rem;">Français</h3>
                                <div class="form-group">
                                    <label>Titre</label>
                                    <input type="text" class="titre" value="${a.titre?.fr || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Verset clé</label>
                                    <input type="text" class="verset" value="${a.verset?.fr || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Résumé</label>
                                    <textarea class="resume" style="height: 80px;">${a.resume?.fr || ''}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Contenu</label>
                                    <textarea class="contenu" style="height: 300px;">${a.contenu?.fr || ''}</textarea>
                                </div>
                            </div>

                            <div class="form-lang hidden" data-lang="en">
                                <h3 style="color: var(--dore); margin-bottom: 1rem;">English</h3>
                                <div class="form-group">
                                    <label>Title</label>
                                    <input type="text" class="titre" value="${a.titre?.en || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Key verse</label>
                                    <input type="text" class="verset" value="${a.verset?.en || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Summary</label>
                                    <textarea class="resume" style="height: 80px;">${a.resume?.en || ''}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Content</label>
                                    <textarea class="contenu" style="height: 300px;">${a.contenu?.en || ''}</textarea>
                                </div>
                            </div>

                            <div class="form-lang hidden" data-lang="it">
                                <h3 style="color: var(--dore); margin-bottom: 1rem;">Italiano</h3>
                                <div class="form-group">
                                    <label>Titolo</label>
                                    <input type="text" class="titre" value="${a.titre?.it || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Versetto</label>
                                    <input type="text" class="verset" value="${a.verset?.it || ''}">
                                </div>
                                <div class="form-group">
                                    <label>Riassunto</label>
                                    <textarea class="resume" style="height: 80px;">${a.resume?.it || ''}</textarea>
                                </div>
                                <div class="form-group">
                                    <label>Contenuto</label>
                                    <textarea class="contenu" style="height: 300px;">${a.contenu?.it || ''}</textarea>
                                </div>
                            </div>

                            <div class="form-actions">
                                <button class="btn btn-primary" id="btnSauvegarder">💾 Enregistrer</button>
                                <button class="btn btn-secondary" id="btnAnnuler">Annuler</button>
                            </div>
                        </div>
                    </main>
                </div>
            `;
        }

        function attachLoginHandlers() {
            const btn = document.getElementById('btnLogin');
            const pwd = document.getElementById('loginPassword');
            if (btn) btn.onclick = () => login(document.getElementById('loginEmail').value, pwd.value);
            if (pwd) pwd.onkeypress = (e) => { if (e.key === 'Enter') login(document.getElementById('loginEmail').value, pwd.value); };
        }

        function attachDashboardHandlers() {
            const newBtn = document.getElementById('btnNouveauArticle');
            const logout = document.getElementById('btnLogout');
            if (newBtn) newBtn.onclick = () => { editingId = null; currentView = 'form'; render(); };
            if (logout) logout.onclick = () => window.logout();
        }

        function attachFormHandlers() {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('actif'));
                    document.querySelectorAll('.form-lang').forEach(f => f.classList.add('hidden'));
                    btn.classList.add('actif');
                    document.querySelector(`.form-lang[data-lang="${btn.dataset.lang}"]`).classList.remove('hidden');
                };
            });

            document.getElementById('btnSauvegarder').onclick = () => {
                saveArticle({
                    titre: { fr: document.querySelector('.form-lang[data-lang="fr"] .titre').value, en: document.querySelector('.form-lang[data-lang="en"] .titre').value, it: document.querySelector('.form-lang[data-lang="it"] .titre').value },
                    verset: { fr: document.querySelector('.form-lang[data-lang="fr"] .verset').value, en: document.querySelector('.form-lang[data-lang="en"] .verset').value, it: document.querySelector('.form-lang[data-lang="it"] .verset').value },
                    resume: { fr: document.querySelector('.form-lang[data-lang="fr"] .resume').value, en: document.querySelector('.form-lang[data-lang="en"] .resume').value, it: document.querySelector('.form-lang[data-lang="it"] .resume').value },
                    contenu: { fr: document.querySelector('.form-lang[data-lang="fr"] .contenu').value, en: document.querySelector('.form-lang[data-lang="en"] .contenu').value, it: document.querySelector('.form-lang[data-lang="it"] .contenu').value },
                    rubrique: document.getElementById('rubrique').value,
                    image: document.getElementById('image').value,
                    pdf: document.getElementById('pdf').value
                });
            };

            document.getElementById('btnAnnuler').onclick = () => { currentView = 'articles'; editingId = null; render(); };
            document.getElementById('btnRetour').onclick = () => { currentView = 'articles'; editingId = null; render(); };
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        window.editArticle = (id) => { editingId = id; currentView = 'form'; render(); };
        window.deleteArticle = deleteArticle;
        window.logout = logout;

        // Lancer l'initialisation
        init();
    </script>
</body>
</html>
